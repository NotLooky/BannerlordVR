# =============================================================================
#
# Reported: "first movement there is very intense smearing; while still moving my
# head for ~3 sec it gets much less smearing, it tries to stabilise; then after
# maybe 2 sec it gets very intense again, like a loop."
#
# That is the three-second A/B, seen from the inside. One phase smears intensely
# and the other settles - so mode 2 is doing something large and one of the two
# states is clearly better than the other.
#
# BUT THE A/B CANNOT SAY WHICH, AND THE REASON IS A FLAW IN THE EXPERIMENT.
#
# Switching the correction on or off changes the CONVENTION of every motion
# vector from one frame to the next. DLSS's history was accumulated under the old
# convention and is suddenly reprojected under the new one, so each switch throws
# a burst of smearing by itself - independent of which phase is better. "It gets
# very intense, then settles, then very intense" is exactly what a history being
# invalidated every three seconds looks like: the intensity is the TRANSITION,
# and the settling is whichever phase is running converging afterwards.
#
# So the loud part of the signal is an artefact of the measurement. The A/B was
# the right idea for a static difference and the wrong one for a TEMPORAL
# accumulator, which is the whole thing being measured.
#
#     ngx_mv_ab = 0
#
# Mode 2 now runs continuously. No switching, no invalidated history, no
# transition bursts - just one convention, steady, with DLSS's accumulator
# allowed to converge and stay converged.
#
# AND THE COMPARISON IS NOW EASY, because both states were just seen back to back
# and they are dramatically different rather than subtle. The question is only:
#
#   does it now look like the SETTLED phase, or the INTENSE one?
#
#   settled       mode 2 is the right pairing. The smear should be gone or much
#                 reduced while moving, and vp_latch can go back up towards 1.0 -
#                 the error it was halving is now being cancelled instead.
#   intense       mode 2 is wrong too, and mode 4 (prev = here - mv, inverted) is
#                 the last of the four combinations.
#
# No memory of an older build is needed for that, which is what made every
# previous comparison in this sequence unreliable.
#
# RESULT: pending.
ngx_mv_ab = 0

# =============================================================================
# TEST 114 RESULT / TEST 115 - all four modes shared one error, and it was in
#                              the FORM, not the sign
# =============================================================================
#
# Mode 2 continuous: "intense smearing on everything". Three of the four sign and
# direction pairings have now been run and all three failed, in three different
# ways. That is not four wrong guesses; it is one wrong assumption underneath all
# four.
#
# WHAT THEY ALL DID
#
#     prev = here +/- mv
#
# with `here` the pixel's RASTER position - which is a position in the LATCHED
# image, because the latched matrices are what drew it. But `mv` was computed by
# the engine in ENGINE space. Adding an engine-space displacement to a
# latched-space position is a category error, and flipping the vector's sign or
# inverting the homography cannot repair it: all four inherit it equally. Mode 4
# would have failed too, and running it would have proved nothing.
#
# THE FORM THAT IS ACTUALLY RIGHT needs BOTH frames' homographies, because the
# pixel and the vector live in different spaces and the previous frame is a third:
#
#     here_eng = here through inverse(H_cur)     latched -> engine, THIS frame
#     prev_eng = here_eng + mv                   the engine's own displacement,
#                                                applied where it is valid
#     prev_lat = prev_eng through H_prev         engine -> latched, LAST frame
#     mv_fixed = prev_lat - here
#
# Three transforms, not one, and the middle step is the only place the engine's
# vector is meaningful. vp_patch now exports the current frame's homography and
# its inverse alongside the previous frame's, which it was already computing.
#
#     ngx_mv_mode = 5     the form above, prev = here_eng + mv
#     ngx_mv_mode = 6     the same with - mv, if the sign is still wrong
#
# Mode 5 first. If the form is right the sign question becomes a single further
# run rather than another four.
#
# ALSO FIXED, AND IT WOULD HAVE WASTED THE RUN: the new block used `here` before
# it was declared - the declaration sat inside the mode 1-4 branch below it. This
# shader is compiled at RUNTIME by D3DCompile, so that is not a build error; it
# would have appeared as "shader compile failed" in the log and the correction
# would have silently never armed, looking exactly like "no change". Declared
# once at the top now.
#
# WHAT TO LOOK FOR: the ground, while moving the head steadily. It is stable at
# rest in every mode, so rest says nothing. Better than the baseline means the
# form is right; unchanged means the correction is not arming and the log should
# be read for a compile failure; worse means the sign, and mode 6.
#
# RESULT: pending.
ngx_mv_mode = 5

# =============================================================================
# TEST 115 RESULT / TEST 116 - the motion vectors were never the fault
# =============================================================================
#
# Mode 5: "not better, feels the same". The log shows it armed - "NGX MV fix:
# LIVE", no compile failure - so it ran and changed nothing visible. That is not
# a null result, it is a proof.
#
#     mv_fixed = H_prev( H_cur^-1(here) + mv ) - here
#
# D is 0.2-0.9 degrees and varies smoothly, so H_cur ~= H_prev and the two
# transforms CANCEL: mv_fixed ~= mv. Mode 5 is required to be a no-op, and it
# was. Which means the only forms that do anything are the single-homography
# ones - modes 1 to 4, each applying a bare half-degree screen rotation to the
# previous position - and all of those made the image WORSE.
#
# TAKEN TOGETHER THAT IS A REFUTATION OF THE PREMISE. If the motion vectors were
# missing the latch rotation, adding it would help in one of the four pairings
# and the consistent form would be a no-op. What happened is the exact opposite:
# the consistent form does nothing and every rotation makes it worse. The
# vectors are not missing the latch.
#
# AND THERE IS A GOOD REASON THEY WOULD NOT BE. The engine's "previous view"
# is last frame's current view - and last frame we PATCHED that, at offset 240.
# So the engine's previous matrix is already the latched one. Both ends of its
# motion vectors are in the latched frame, they were correct all along, and
# TESTs 109-115 were correcting something that was not broken.
#
#     ngx_mv_fix = 0
#
# The hook stays (ngx_hook = 1) because the reconnaissance it prints is worth
# having, and it writes nothing with the fix off.
#
# WHAT THE SMEAR ACTUALLY IS, and it is the thing this file identified at TEST 79
# and then spent thirty tests walking away from: DLSS keeps ONE history, and AFR
# alternates the eye every frame. The history for this frame is the OTHER EYE's
# image, 65 mm across. No motion vector can fix that, because the vectors are not
# wrong - the CONTENT of the history is. That is why every correction here either
# did nothing or made it worse, and why the artefact is motion-dependent: at rest
# the two eyes' images differ by a fixed disparity the accumulator settles into,
# and in motion that disparity keeps changing.
#
# THE FIX THAT MATCHES THE DIAGNOSIS: give each eye its own DLSS history. NGX
# feature handles own their history, so two features, alternating with the eye,
# means each accumulates only its own viewpoint. The hook already sees the handle
# on every evaluation; what it needs is to intercept CreateFeature, build a
# second feature with the same parameters, and swap between them per frame.
#
# That is a real piece of work and it is the last idea in this file that is not a
# preference. Everything else - vp_latch, the AA mode, AFW - is choosing where to
# put an error that stays.
#
# RESTING STATE, and it is the best measured one: vp_patch = 1, vp_latch = 0.5,
# both temporal slots unwritten, DLAA, no NGX correction. Characters stable, head
# crisp, ground smears in motion.
#
# RESULT: TESTs 109-115 refuted as a class. The motion vectors were correct.
ngx_mv_fix = 0

# =============================================================================
# TEST 117 - PER-EYE DLSS HISTORY. Start over, at the actual cause.
# =============================================================================
#
# Asked to start over and fix the ghostly smearing on everything. Right call: the
# last thirty tests were patching symptoms, and the config had become a pile of
# overrides where several settings existed only to work around problems caused by
# the others.
#
# TEST 116 established what the smear IS, and it is what TEST 79 said before any
# of the matrix work began:
#
#   DLSS keeps ONE history. AFR alternates the eye every frame. So the history
#   this frame is resolved against is the OTHER EYE'S IMAGE, 65 mm across.
#
# The motion vectors were never wrong - TEST 116 proved that, twice over: the
# self-consistent correction is a provable no-op, and every rotation applied to
# them made the image worse. Nothing written into a matrix or a vector can fix a
# history whose CONTENT is from the wrong viewpoint. That is why thirty tests of
# both did not.
#
# WHAT OWNS THE HISTORY IS THE NGX FEATURE. So: two features.
#
# CreateFeature is hooked. When the game creates its DLSS feature, the driver's
# own CreateFeature is called a SECOND time with the parameters the game just
# used - identical in every respect the game chose, because they are the game's
# parameters. EvaluateFeature then hands eye 0 the game's handle and eye 1 the
# twin. Each accumulates only its own viewpoint and never blends across the
# baseline.
#
# The game never learns about it: it is given its own handle back from
# CreateFeature and the substitution happens inside the evaluation. ReleaseFeature
# is hooked so the twin is destroyed with it rather than leaked, and a new
# feature - a resize, a new mission - retires the old twin first.
#
#     ngx_per_eye = 1     two features, one per eye (default)
#                 = 0     one shared history, the old behaviour
#
# COSTS, stated plainly: a second DLSS feature is a second set of history
# buffers, so VRAM roughly doubles for the upscaler. At 3040x3100 on a 4080 SUPER
# that is affordable. Feature creation happens at mission load, not per frame.
#
# WATCH FOR, in order:
#   "NGX: CreateFeature and ReleaseFeature hooked too"
#   "NGX per-eye: created a SECOND DLSS feature (... beside the game's ...)"
#   "NGX per-eye: LIVE. Eye 1 is being resolved against its own history now"
#
# If the second creation FAILS the log says so and one shared history stays - the
# smear would be unchanged and that is a real answer, not a silent no-op.
#
# WHAT SUCCESS LOOKS LIKE: the ghosting and smearing go, on everything, in
# motion - because the accumulator stops mixing two viewpoints. Characters should
# stay stable. If it works, the settings that exist only to spread that error
# around become unnecessary and can go back to their defaults, starting with
# vp_latch, which can return to 1.0 for the crispest head.
#
# THE ONE THING THAT WOULD REFUTE IT: no change at all, with the LIVE line
# present. That would mean the feature does not own the history the way this
# assumes, and there is nothing left in NGX to try.
#
# RESULT: pending.
ngx_per_eye = 1

# =============================================================================
# TEST 117 RESULT / TEST 118 - per-eye history traded the eye for the cadence
# =============================================================================
#
# Reported: worse smearing, present even STANDING STILL, and the two eyes feel
# out of sync. Both are the same cause and it is one this file has already
# written down.
#
#   ONE shared history   history is 1 frame old, WRONG EYE, right cadence
#   PER-EYE history      history is 2 frames old, RIGHT EYE, WRONG CADENCE
#
# The engine draws each eye every OTHER frame, so a per-eye history is two frames
# old - while the engine's motion vectors always describe ONE frame of motion.
# Every pixel is therefore reprojected only halfway to where it belongs. That
# needs no head movement to show, which is the "even standing still", and the two
# eyes converge differently because they are on opposite phases, which is the
# "not synced".
#
# TEST 80 HIT THIS EXACT TRAP FROM THE OTHER SIDE and its conclusion is the
# heading of that entry: "the eye was negotiable, the CADENCE was not". Making
# the eye right by taking the cadence wrong is TEST 80 run backwards, and it was
# recorded here forty tests ago. Reading this file before adding to it would have
# cost five minutes.
#
# THE TWO HALVES TOGETHER ARE RIGHT IN BOTH
#
#     ngx_per_eye  = 1     each eye accumulates its own viewpoint  (right eye)
#     ngx_mv_fix   = 1
#     ngx_mv_mode  = 7     motion vectors scaled x2                (right cadence)
#
# Doubling pays back exactly what per-eye history borrowed. Exact for constant
# velocity across the two frames, which at 90 Hz is 22 ms - short enough that the
# linear term dominates and the residual is second-order.
#
# This is the first configuration in the whole NGX sequence that is right about
# BOTH properties at once. Every earlier one fixed one and broke the other:
#
#   TESTs 109-115   corrected vectors that were never wrong
#   TEST 117        right eye, wrong cadence
#   before all of it  right cadence, wrong eye
#
# WHAT SUCCESS LOOKS LIKE: the ghosting goes on everything, standing still AND
# moving, and the eyes agree again. Then vp_latch goes back to 1.0 and the
# settings that only spread the error around come off.
#
# IF IT IS STILL WRONG: the informative part is WHICH symptom survives. Smearing
# only when moving means the scale is not exactly 2 and the cadence is not a clean
# doubling - a dropped frame would do that. Smearing at rest means per-eye history
# is not doing what it claims and ngx_per_eye = 0 is the honest place to stop.
#
# RESULT: pending.
ngx_mv_fix = 1
ngx_mv_mode = 7

# =============================================================================
# TEST 118 RESULT / TEST 119 - per-eye history is STRUCTURALLY wrong. Stop.
# =============================================================================
#
# Reported: standing still now has intense smearing, sand blends into itself, the
# ground is very blurry, and MOVING THE HEAD DOES NOT IMPROVE IT.
#
# That last clause is the decisive one and it is not a matter of tuning. Every
# artefact in this file so far has been motion-dependent, because every one of
# them came from a reprojection error and a reprojection error needs motion to
# show. An artefact that is present at rest and INDIFFERENT to movement is not a
# reprojection error at all. It is a reconstruction failure.
#
# WHY PER-EYE HISTORY CANNOT WORK HERE, and this should have been foreseen:
#
# DLAA and DLSS reconstruct detail by moving the projection a sub-pixel step each
# frame - a jitter sequence - and accumulating the results. The sequence is
# designed so that CONSECUTIVE frames land on complementary sub-pixel positions
# and together sample the pixel properly. It belongs to the FEATURE.
#
# Split the frames between two features and each one receives every OTHER sample
# of that sequence. Neither gets a well-conditioned set; each reconstructs from a
# decimated, aliased subset, forever. That is precisely "the sand blends together
# and the ground is blurry", and precisely why moving the head cannot help - the
# sampling pattern is broken regardless of what the camera does.
#
# The x2 cadence scale was right about the cadence and could not have rescued
# this, because the fault is not in the reprojection at all.
#
# SO THE NGX LINE IS EXHAUSTED, and both halves of it are now understood:
#
#   correcting the motion vectors   they were never wrong (TEST 116)
#   per-eye history                 breaks the jitter reconstruction (here)
#
# There is no third thing in NGX to reach for. Reverted:
#
#     ngx_per_eye = 0
#     ngx_mv_fix  = 0
#
# The hook stays installed and writes nothing; its reconnaissance is worth having
# and it costs a pointer comparison.
#
# WHERE THIS LEAVES THE PROBLEM, stated plainly rather than dressed up as a next
# step: the smear is DLSS resolving each frame against an image taken 65 mm away,
# it is inherent to AFR plus a temporal upscaler, and the three exits are all
# preferences that have each been measured and each cost something:
#
#   keep it            ground smears in motion; everything else is good
#   AFW                no alternation, but doubling and bad performance (T87)
#   no temporal AA     no smear, but dynamic shadows and effects follow the head
#                      worse than the characters ever did (T53, user-confirmed)
#
# RESTING STATE, and it is the best of the three: vp_patch = 1, vp_latch = 0.5,
# both temporal slots unwritten, DLAA, no NGX intervention.
#
# RESULT: refuted. Per-eye history breaks upscaler reconstruction; NGX exhausted.
ngx_per_eye = 0
ngx_mv_fix = 0

# TEST 120 - vp_latch = 0.35, one dial, nothing else changed.
