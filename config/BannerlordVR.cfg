# =============================================================================
# TEST 70 - vp_patch IS A LATE-LATCH, AND THAT IS THE MECHANISM
# =============================================================================
#
# It rewrites the view matrices to the current head pose moments before the GPU
# sees them. That is exactly why it kills the floating - and exactly why it
# slides the shadows. The shadow map for the frame has already been rendered and
# its cascades already fitted from the PRE-latch camera. We move the scene and
# leave the shadow map behind, and the two disagree by one frame of head motion:
# proportional to head speed, settling when the head stops.
#
# This finally explains the negative that has held since TEST 62: no cascade
# constant follows the head because the cascades are consistent. It is the SCENE
# we are moving out from under them. Seven instruments looked for movement in the
# wrong half of the mismatch.
#
# THE TWO HALVES OF 135b928, WHICH WENT IN TOGETHER
#
#     depth_layer = 0     the compositor's positional reprojection, OFF
#     vp_patch    = 1     a late rewrite of the view matrices, ON
#
# One trade: stop letting the compositor correct head TRANSLATION, and correct it
# ourselves at upload time instead. The first half is why the floating appears
# without vp_patch - with no depth layer the compositor can only correct
# ROTATION, so a translating head is uncorrected. The second half fixes that and
# desynchronises the shadow map as its price.
#
# THE COMBINATION NEVER TRIED: correct at COMPOSITE time instead.
#
#     vp_patch = 0        nothing inside the frame is rewritten
#     depth_layer = 1     the compositor reprojects for translation
#
# The compositor works on the FINISHED frame, so it cannot desynchronise anything
# inside it. Scene and shadow map move together or not at all - which is the one
# property every approach so far has lacked.
#
# The stated reason for depth_layer = 0 was DLSS Performance's half-resolution
# jittered depth giving wrong parallax. THAT OBJECTION DOES NOT APPLY WITH DLSS
# OFF. Every previous run had either vp_patch on, or depth_layer off, or DLSS on;
# this combination has never been in a headset. Keep DLSS OFF.

# --- TEST 70 RESULT: the depth layer works and does not fix the floating -----
# Confirmed live, not assumed: "Depth layer up: 3072x3264, format 20, from the
# game's own depth buffer" and "90 eye(s) submitted with depth this second" for
# the whole mission. Shadows STABLE, floating still there.
#
# So the floating is not an uncorrected head TRANSLATION. The compositor was
# given the depth it needed to correct one and the feel did not change.
#
# =============================================================================
# TEST 71 - THE TWO STATES ARE TWO PIPELINES, AND THE FORK IS IN MANAGED CODE
# =============================================================================
#
# VrAfrRenderer.ResolveMode:
#
#     string fallback = VrVpPatch.Substituting ? "off" : "engine";
#
# vp_patch = 1 does not merely add matrix rewriting. It also takes managed's
# hands OFF the engine camera, on the reasoning that applying the head pose in
# both places would apply it twice. So:
#
#   vp_patch = 1   engine camera = the FLAT game camera. Head pose injected into
#                  the matrices at upload. The shadow map is fitted to the flat
#                  camera and the scene is drawn from the head camera, and they
#                  disagree BY THE WHOLE HEAD POSE. That is why the shadows slide
#                  exactly as the head moves - not by a frame of drift, by
#                  everything.
#
#   vp_patch = 0   camera driven by the head, shadow map fitted to the same
#                  camera the scene uses. Consistent - shadows stable - and no
#                  correction for the residual, so it floats.
#
# Every test from 53 to 70 was run inside one or the other of these and never
# across both. The cascades were never "following the head"; under vp_patch = 1
# they were the only thing NOT following it.
#
# THE COMBINATION: afr_camera_mode = engine WITH vp_patch = 1.
#
# "off" is a FALLBACK, not a requirement - the key has always existed. Driving
# the camera puts the shadow map on the head camera; substituting still corrects
# the residual. The "twice" objection should not hold, because build_replacement
# forms D = inverse(our eye) * (the engine camera RECOVERED FROM THE MATRIX) - so
# with the camera already at the head, D collapses to the leftover (the eye
# offset and a frame of drift) instead of a second copy of the head pose.
#
# TWO FAILURE MODES, both unmistakable in seconds:
#   world moves at DOUBLE head speed        - the pose really does land twice.
#   view drifts or oscillates while still   - VrCameraDriver's anchor is being
#                                             fed its own output.
# afr_camera_mode = off reverts either.

# --- TEST 71 RESULT: camera mode Engine, and the shadows still slide ---------
# "AFR camera mode: Engine" in the managed log, so both halves ran: the camera
# WAS driven by the head and the matrices WERE still substituted. Shadows
# unchanged.
#
# That kills the assumption the whole test rested on. If driving the camera put
# the engine camera at the head, then D = inverse(our eye) * (engine camera)
# would collapse to near identity, the substitution would be a near no-op, and
# the shadows would look like they do at vp_patch = 0. They do not. So D is NOT
# small, and it has never once been measured - eight tests have argued about its
# size without a number.
#
# --- TEST 72: measure D ------------------------------------------------------
# D is the rigid move from the camera the engine DREW with to the eye the scene
# ends up drawn from. The shadow map is rendered before the substitution runs and
# knows nothing about it, so D is EXACTLY the displacement between the scene and
# its own shadow map. D is the slide, in metres and degrees.
#
#   "VP substitution size: moves the scene X m / Y deg mean, ... WORST ..."
#
#   centimetres and a fraction of a degree   the residual it was designed to be,
#                                            and then the shadows cannot be
#                                            sliding because of it - something
#                                            else is, and this whole line of
#                                            attack is wrong.
#   tens of cm, or tens of degrees           a whole head pose. The substitution
#                                            is displacing the scene against the
#                                            shadow map by that much every frame,
#                                            and the fix is to make D small
#                                            rather than to choose where to apply
#                                            it.
#
# Either way the answer is a number this time, and it is the number that decides
# whether to keep going down this road at all.

# =============================================================================
# TEST 72 RESULT - D IS 26 METRES, AND THAT ENDS THE WHOLE LINE OF ATTACK
# =============================================================================
#
#   VP substitution size: moves the scene 26.183 m / 1.48 deg mean,
#                         258.692 m / 14.28 deg WORST, over 25454 replacements
#
# Repeated across the window: 14 m, 21 m, 33 m, 54 m mean; worst up to 292 m.
#
# D was assumed to be an IPD offset plus a frame of drift - "near identity", in
# the words of the note on vp_patch above - through nine tests, and never once
# measured. It is the move from the GAME's camera to the HEAD. The head is at the
# player; the game's camera is a third-person or command camera tens of metres
# away, and in the tactical view hundreds. D is not a residual that has gone
# wrong. It is the mod's whole job under vp_patch, and it is supposed to be that
# size.
#
# THE CONSEQUENCE, WHICH IS STRUCTURAL AND NOT A BUG TO BE FOUND
#
# The engine fits its shadow cascades, its culling and its LOD to ITS camera,
# before any of our writes happen. We then draw the scene from a viewpoint 26 m
# away. The shadow map is therefore fitted for the wrong viewpoint by 26 m, every
# frame, and a small head movement changes that relationship out of all
# proportion - which is precisely the report: "the effects and dynamic shadows
# move FASTER than my head movement".
#
# No choice of buffer, offset, pass or render target can fix this. That is why
# TESTs 63-71 all failed the same way while each one correctly eliminated its own
# suspect. The approach cannot work; the shadow map is committed before we write.
#
# ALSO RETIRED: every theory that required something in the engine to be
# following the head. Nothing was. Under vp_patch the cascades were fitted to a
# camera 26 m from the one we rendered from, and sat still while we moved the
# scene around them.
#
# =============================================================================
# WHERE THIS LEAVES THE MOD
# =============================================================================
#
# The camera has to be at the head BEFORE the engine fits its shadows. That is
# afr_camera_mode = engine with vp_patch = 0 - measured stable shadows, TEST 70 -
# and the remaining fault there is FLOATING, which is the camera drive landing a
# frame late: the engine renders from where the head WAS.
#
# That is a timing problem, and timing levers cannot desync anything, because
# none of them displace one part of the frame relative to another:
#
#   pose_lead_frames   predict further ahead to cover the drive's latency. 1 was
#                      tuned for the substitution pipeline, where the matrices
#                      were re-latched at upload and the drive's own lag did not
#                      matter. It matters now. Trying 2.
#   frame_latency      queued GPU frames, already 1.
#   depth_layer = 1    confirmed working (90 eyes/s submitted with depth) and
#                      confirmed NOT to fix the floating, so the residual is not
#                      an uncorrected translation.
#
# This is a dial now rather than a theory. It is the first lever in this entire
# investigation that cannot break the shadows.

# =============================================================================
# TEST 73 - SHADOWS FIXED. The remaining fault is the lead amplifying tremor.
# =============================================================================
#
# vp_patch = 0 with afr_camera_mode = engine: SHADOWS AND SKY STABLE, confirmed
# in the headset. The camera is at the head before the engine fits its cascades,
# so the shadow map and the scene share a viewpoint and there is nothing left to
# desynchronise. That closes the fault this investigation opened with.
#
# What remains: slight floatiness, and "very sensitive to any noise or vibration
# from talking or moving my mouth".
#
# THE SECOND HALF OF THAT IS THE LEAD, WORKING AS DESIGNED
#
# Extrapolation multiplies whatever it extrapolates. Real head motion is low
# frequency and survives it correctly. The millimetre tremor of speech, a jaw
# moving, a floor vibration, is high frequency - and predicting it forward one
# and a half frames makes it BIGGER. pose_lead_frames = 2 removes lag and
# amplifies tremor with the same arithmetic, so trading them on that one dial can
# only find a compromise.
#
# They are separable because they differ in FREQUENCY, not in size:
#
#   locate the unled pose as well
#   difference it against the led one   <- this IS the lead's whole contribution
#   low-pass the difference
#   publish unled + smoothed difference
#
# Sustained motion keeps a consistent difference and passes the filter, so the
# lag reduction survives intact. Tremor reverses sign every frame or two and
# averages toward zero. Filtering the DIFFERENCE and not the pose is the whole
# trick - a filter on the pose adds latency, which is what is being removed.
#
#   pose_lead_smooth = 0.25   default
#                      0.10   heavier, if talking still moves the world
#                      0      off, raw extrapolation as before
#
# Costs one extra xrLocateViews per frame.
#
# NOTE FOR WHATEVER COMES NEXT: neither of these levers displaces any part of the
# frame relative to any other, so neither can bring the shadows back. That is now
# the test for any future change - if it moves the scene relative to what the
# engine already committed, it will desync, and if it does not, it cannot.

# --- TEST 74: the tremor is in the POSE, not only in the lead ----------------
# "A bit better" is the shape of the answer. pose_lead_smooth removes the part of
# the shake the LEAD added by extrapolating it, and that was a real part - but
# speech and jaw movement genuinely shake the headset and the tracker genuinely
# reports it. That part is in the pose before any lead touches it, and no value
# of pose_lead_smooth can reach it.
#
# head_filter is the other half: a filter on the pose itself, whose strength
# depends on SPEED.
#
#   alpha = head_filter + (1 - head_filter) * clamp(speed / head_filter_ms)
#
# Hold hard while the head is essentially still, let go completely once it is
# actually moving. A plain low-pass would take the shake out and put the latency
# back, which is exactly what this session has spent its time removing; making it
# speed-dependent is what avoids paying that. Tremor is small in net displacement
# even when it is fast in reversals; a head turn is not, and passes untouched.
#
# Placed in publish_views, which is the single funnel feeding BOTH the engine
# camera and - through bvr_set_used_views - the pose the frame is submitted with.
# Filtering there keeps those two agreeing. Filtering in only one of them would
# have recreated the render-versus-submit mismatch this project has already hit
# three separate times.
#
# It also displaces nothing WITHIN a frame, so by the test set out above it
# cannot bring the shadows back.
#
#   head_filter    1.0 off | 0.25 moderate | 0.15 default | 0.08 very steady
#   head_filter_ms release speed in mm/s; raise to filter over a wider range of
#                  speeds, lower if slow deliberate movement feels sticky
#
# Both eyes take the same alpha, so eye separation is never filtered - only where
# the pair as a whole sits.

