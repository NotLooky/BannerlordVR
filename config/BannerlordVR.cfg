# k = 2 figure was SUPPRESSED by the 3.0 deg bound clipping its peaks, so the
# line was drawn through a clipped point. Raising the bound and the dial in the
# same test is the error - one variable, and this file has said so repeatedly.
#
# TEST 141: k = 2.0 at the 5.0 deg bound, which scales to ~1.0x - the midpoint
# of the bracket and the first value that has never been tried.
#
#     head_overdrive = 2.0     ~1.0x, applied == measured lag
#     head_overdrive_max_deg = 5.0   unchanged, so ONE variable moves
#
# At 1.0x the extra rotation equals the head movement the render missed. Peaks
# should reach about 3 deg and stop hitting the bound, which is its own check:
# a largest-max at 4.99 again would mean the bound is still shaping the result.
#
# IF 1.0x IS STILL TOO SENSITIVE the answer is between 0.64 and 1.0 - k = 1.5 -
# and the bracket keeps halving. If it is resistant again, k = 2.6. Either way
