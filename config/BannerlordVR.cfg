# RESULT: pending.
head_overdrive = 2.0
# =============================================================================
# TEST 141 RESULT / TEST 142 - one gain cannot serve two opposite errors.
#                              Direction coherence, which TEST 78 named.
# =============================================================================
#
# TEST 141 RESULT: the world STILL shakes on a head shake or vibration, AND the
# resistance is still there on a sudden first fast movement.
#
# THOSE TWO CONTRADICT EACH OTHER FOR A SCALAR DIAL, and that is the finding.
# "The world shakes with my head" is TOO MUCH correction; "resistance on the
# first sudden movement" is TOO LITTLE. Both were reported at the same setting,
# so no value of head_overdrive can satisfy both and the search along that line
# was always going to end here. The dial is the wrong SHAPE, not the wrong size.
#
# WHY, MECHANICALLY:
#
#   A SHAKE reverses direction between the render and the display. The delta
#   measured across that interval therefore points BACKWARDS a good fraction of
#   the time, and over-rotating by it injects motion that never happened. That
#   is the world riding the head, and it gets worse as the dial goes up.
#
#   A SUDDEN START has no delta yet - the head has not moved during the
#   pipeline, because the pipeline predates the movement. The same dial
#   contributes nothing exactly when it is wanted most.
#
# Measured, at k = 2.0 with the 5.0 deg bound: applied/needed 0.60, largest max
# 4.99 - so the bound is STILL clipping peaks and the ratio is not a clean read
# of the dial. That is a second reason the scalar search was going nowhere.
#
# --- THE FIX, AND THIS FILE WROTE IT DOWN AT TEST 78 -----------------------
#
#   "filter on DIRECTION COHERENCE, not speed. Tremor reverses direction every
#    frame or two; deliberate movement holds its direction. Track a smoothed
#    velocity vector and compare its magnitude against the smoothed magnitude of
#    the instantaneous velocity - the ratio is near 1 for coherent motion and
#    near 0 for oscillation."
#
# That was written for a pose filter and abandoned. It is exactly what this
# needs, and it is now built:
#
#   the delta is taken as an axis-angle VECTOR, which can be averaged with sign
#   a smoothed vector and a smoothed magnitude are kept, ~5 frames at 90 Hz
#   coherence = |smoothed vector| / smoothed magnitude
#   the overdrive is SCALED by it
#
# For a steady turn the vectors agree, coherence approaches 1, and the dial is
# at full strength. For a shake the vectors cancel while the magnitudes do not,
# coherence collapses towards 0, and the dial withdraws. No threshold, no speed
# gate, and a slow deliberate lean is untouched - which is what speed gating
# could never manage.
#
#   head_overdrive_coherence = 1.0        full gating (default)
#                            = 0.0        off, the plain dial - THE CONTROL
#   head_overdrive_coherence_alpha = 0.2  ~5 frames; lower is slower to trust a
#                                         turn, higher is more easily fooled by
#                                         a shake
#
# WATCH: "coherence" is now on the overdrive line. Expect ~1.00 on a steady
# turn and a visible collapse while shaking your head. If it does NOT fall
# during a shake the gate is not seeing the reversal and alpha is wrong.
#
# WHAT THIS STILL DOES NOT FIX, and it has been said every round: the sudden
# first movement. The overdrive is proportional to motion that has already
# happened and is zero at onset, gate or no gate. That needs PREDICTION, which
# is a different mechanism and not a setting.
#
# RESULT: pending.
head_overdrive = 2.0
head_overdrive_coherence = 1.0
# =============================================================================
# TEST 142 RESULT / TEST 143 - the coherence metric conflated direction with
#                              SPEED, and shaved the dial on every real turn
# =============================================================================
#
# TEST 142 ran and the gate is live. Measured across a battle, 118 windows:
#
#     coherence   min 0.35   mean 0.74   max 0.92
#     18 of 118 seconds below 0.6           <- shakes, correctly caught
#     largest overdrive max 4.99 deg        <- the bound is STILL clipping
#
# The gate moves the right way: coherence collapses to 0.39-0.43 exactly on the
# seconds where the overdrive mean is 0.00-0.01, which is a head sitting still or
# vibrating. So the idea holds.
#
# BUT IT NEVER ONCE REACHED 1.00, and that is a fault rather than a detail. On a
# steady turn the dial should be at full strength; instead it was being shaved by
# 8 to 25 per cent, which ADDS resistance - the exact symptom being chased.
#
# THE METRIC WAS WRONG. It smoothed the raw delta vector and divided by the
# smoothed MAGNITUDE:
#
#     c = |EMA(v)| / EMA(|v|)
#
# That measures two things at once. Head speed varies through any real turn, and
# by Jensen's inequality the length of a mean is below the mean of the lengths
# whenever the magnitudes differ - so a perfectly straight turn at varying speed
# reads well under 1.00 with no change of direction at all.
#
# UNIT DIRECTIONS REMOVE SPEED FROM THE QUESTION:
#
#     c = |EMA(v / |v|)|
#
# A constant direction at any varying speed gives 1.00. A reversal cancels
# whatever the speed. The magnitude EMA is kept, but only as the noise gate -
# below the tracker's floor a "direction" is a random unit vector and must not
# be averaged into anything.
#
# EXPECT: coherence at or very near 1.00 on a steady turn, and the same collapse
# towards 0 on a shake. If the maximum still sits at 0.92 the metric is still
# measuring something other than direction and this is refuted.
#
# THE BOUND IS STILL SHAPING THE PEAKS - largest max 4.99 against a 5.0 cap, in
# every run since it was raised. Whatever the ratio reads, it is not a clean
# measure of the dial while that is true. Left alone deliberately: one variable.
#
# RESULT: pending.
head_overdrive = 2.0
head_overdrive_coherence = 1.0
# =============================================================================
# TEST 143 RESULT / TEST 144 - THE PREDICTOR. The half no dial could reach.
# =============================================================================
#
# TEST 143 RESULT: a bit better with the unit-direction coherence, but the world
# still resists a SUDDEN FAST head movement - not like vp_patch = 1. A predictor
# was asked for, and it is the right thing to ask for.
#
# WHY NO SETTING COULD HAVE DONE IT, stated once more because it is the whole
# justification: head_overdrive is REACTIVE. It measures the rotation between
# the render and now, and at the instant a movement begins that rotation is
# ZERO - the pipeline predates the movement. Multiplying zero by any k is zero.
# Every value tried from 1.0 to 3.2 was blind at exactly the moment being
# complained about.
#
# --- WHAT WAS BUILT --------------------------------------------------------
#
# Angular velocity and acceleration are estimated from the live locate, frame to
# frame, as rotation VECTORS - which can be differenced and extrapolated with a
# sign, unlike quaternions:
#
#     predicted rotation over horizon T  =  w * T  +  0.5 * a * T^2
#
# AND THE ACCELERATION TERM IS THE ENTIRE POINT. At the onset of a fast movement
# w is still near zero and a is large - that is what an onset IS - so this term
# is awake on the first frame where the head starts to move, which is where the
# reactive dial is blind. Steady-state, w dominates and a falls away.
#
# The prediction carries the "NOW" end of the delta forward. Everything
# downstream is unchanged: the rigid pair rotation, the coherence gate, the
# bound. One endpoint moves; no second mechanism is added beside the first.
#
#     head_predict_ms = 20       horizon. 0 = off, and the build is TEST 143
#                                exactly. ~2 frames at 90 Hz.
#     head_predict_accel = 1.0   weight on the acceleration term. 0 makes it a
#                                plain velocity predictor, which is the control
#                                that says whether acceleration is doing the work.
#     head_predict_alpha = 0.45  light smoothing only - velocity has to be
#                                trusted almost immediately or the predictor is
#                                late for the very movement it exists for.
#     head_predict_max_deg = 6.0 bound.
#
# GUARDS, because extrapolation is the most dangerous thing in this file: a
# first frame, a hitch or any gap outside 0.1 ms - 100 ms reseeds instead of
# differentiating across it. A velocity computed over a 500 ms stall would fling
# the world across the room, and this file has a whole test about pose age
# spiking to 1157 ms at mission teardown.
#
# THE COHERENCE GATE STILL APPLIES ON TOP, and it matters more here than before:
# extrapolating a REVERSING velocity is worse than doing nothing, so a shake
# withdraws the predictor along with the dial.
#
# WATCH FOR: "Head predictor: N frame(s), mean X deg carried forward over a
# 20 ms horizon". Expect a mean well under a degree, spiking on sudden starts.
#
# OVER-PREDICTION OVERSHOOTS - this file has said so since pose_lead_frames.
# If the world now lurches past and settles back when you STOP, the horizon is
# too long: head_predict_ms = 12, then 8. If nothing changes at all at the onset,
# then onset resistance is not the prediction horizon and the predictor is
# refuted rather than mistuned.
#
# RESULT: pending.
head_predict_ms = 20
head_predict_accel = 1.0
# =============================================================================
# TEST 144 RESULT / TEST 145 - do not predict past a stop
# =============================================================================
#
# TEST 144 RESULT: the world LURCHES PAST AND SETTLES BACK WHEN THE HEAD STOPS.
#
# Predicted in writing before the run, and the numbers had already said it:
# "Head predictor: mean 1.14 deg carried forward, max 4.58, 8 windows clamped"
# against a measured pose lag of 0.4-1.2 deg. The predictor was running hot.
#
# ALSO CONFIRMED THIS RUN - the unit-direction coherence fix worked:
#
#     before   min 0.35   mean 0.74   max 0.92    <- never full strength
#     after    min 0.33   mean 0.82   max 0.99
#
# It reaches full strength on a steady turn now and still collapses to 0.33 on a
# shake, so the dial is no longer being shaved during real movement.
#
# --- WHY NOT SIMPLY SHORTEN THE HORIZON ------------------------------------
#
# Because that trades away the onset response the predictor was built for. The
# overshoot is not uniform: it is ASYMMETRIC.
#
#     at an ONSET   velocity and acceleration point the SAME way
#     at a STOP     they OPPOSE
#
# Shortening the horizon cuts both equally and gives back the thing that was
# asked for. So the horizon is cut only where it would overshoot.
#
# --- THE DECELERATION GUARD ------------------------------------------------
#
# When w . a < 0 the head is slowing, and the time until the motion ceases is
# |w| / |a|. Predicting beyond that is predicting movement that will not happen,
# and that is exactly the lurch. So:
#
#     decelerating   horizon = min(T, |w| / |a|)
#     accelerating   horizon = T, untouched
#
# head_predict_ms STAYS AT 20. One variable moves - the guard - so a result can
# be attributed. If the lurch survives it, the horizon is the next lever and 12
# then 8 are the values.
#
#     head_predict_decel_guard = 1   on (default)
#                              = 0   off, the TEST 144 behaviour exactly
#
# WATCH FOR: "the deceleration guard shortened the horizon on N frame(s) this
# second". N should be a real fraction of the frames whenever the head is
# slowing. If it reads 0 while the world still lurches, the guard is not seeing
# the deceleration and the acceleration estimate is too smoothed to catch it -
# head_predict_alpha is then the lever, not the horizon.
#
# RESULT: pending.
head_predict_ms = 20
head_predict_decel_guard = 1
# =============================================================================
# TEST 145 RESULT / TEST 146 - "short and sudden", and an acceleration bug
# =============================================================================
#
# TEST 145 RESULT: reported as "the predictor is fast and too long - it should be
# very short and sudden".
#
# Measured alongside it, and it is a real defect rather than a tuning miss:
#
#     deceleration guard fired on 1-9 frames a second, mean 3 of 90
#     predictor mean 1.14 -> 1.04 deg, max 4.58 -> 3.47
#
# The guard barely moved anything, and the reason was in the acceleration.
#
# --- THE BUG ---------------------------------------------------------------
#
#     wSmoothed = prevW + alpha * (wNow - prevW);
#     aNow      = (wSmoothed - prevW) / dt;
#
# wSmoothed - prevW IS alpha * (wNow - prevW) by definition, so the acceleration
# came out scaled by alpha - UNDER-READ BY 55 PER CENT at the default 0.45. It
# starved both things that depend on it: the onset term, which is the whole
# reason the predictor exists, and the deceleration guard, which could rarely
# see w . a go negative enough to notice a stop.
#
# Fixed: the derivative is the NEW velocity against the SMOOTHED previous one,
# taken before prevW is advanced. Acceleration is now roughly 2.2x what it was.
#
# --- "SHORT AND SUDDEN" IS A STATEMENT ABOUT WHICH TERM ---------------------
#
# The two terms do different jobs and it took the report to see it:
#
#   w * T           a SUSTAINED lead. It holds for as long as the turn lasts, so
#                   the world runs ahead through the whole movement rather than
#                   helping it start. That is "too long", exactly.
#
#   0.5 * a * T^2   a TRANSIENT. Acceleration is non-zero only while the head is
#                   speeding up or slowing down, so it kicks at the onset and
#                   then vanishes by itself once the turn is steady. Short and
#                   sudden by construction.
#
# So they are weighted separately now, and the requested shape is the
# acceleration term alone:
#
#     head_predict_vel   = 0.15   nearly no sustained lead
#     head_predict_accel = 1.0    the onset kick, unchanged
#     head_predict_ms    = 20     unchanged - T^2 needs the horizon to have any
#                                 acceleration authority at all, and shortening
#                                 it would weaken the very term being kept
#
# NOT ONE VARIABLE, and worth saying so: the acceleration fix is a BUG FIX and
# was not optional - the previous run measured something that was wrong by
# construction. The velocity weight is the tuning change. If the result is
# confusing, head_predict_vel = 1.0 restores the old shape ON TOP of the fixed
# acceleration, which separates them.
#
# WATCH: the predictor mean should now be LOWER in steady turning - most of the
# 1.04 deg was the sustained velocity lead - while the peaks at movement onset
# stay or grow, because acceleration is 2.2x better read.
#
# RESULT: pending.
head_predict_vel = 0.15
head_predict_accel = 1.0
head_predict_ms = 20
# =============================================================================
# TEST 146 RESULT / TEST 147 - DRAWN beats WARPED. The image-space line is dead.
# =============================================================================
#
# TEST 146 RESULT: the predictor does not make it better. It still feels FAKE.
# Asked for 1:1 vp_patch = 1 behaviour, which is the only thing that has ever
# felt like native head movement and rotation.
#
# THE MEASUREMENTS WERE ALL GOOD AND THE FEEL WAS STILL WRONG, which is the
# result. TEST 146 did exactly what it was designed to do:
#
#     predictor mean 1.04 -> 0.20 deg   the sustained lead gone
#     predictor max  3.47 -> 0.50 deg
#     decel guard    3 -> 8 frames/sec  acceleration finally readable
#
# Every one of those moved the right way and none of them mattered.
#
# --- WHY NOTHING IN THIS LINE COULD EVER HAVE MATCHED vp_patch --------------
#
# vp_patch rotates the GEOMETRY, before rasterisation. The frame is DRAWN from
# the rotated pose: sharp edges, correct occlusion, correct silhouettes, and
# anything the rotation brings into view is RENDERED because the frustum is
# still open when it happens.
#
# image_latch, head_overdrive and head_predict all rotate a FINISHED IMAGE - by
# our own shader or by the compositor, it makes no difference which. That is a
# resample: one bilinear tap softer, nothing available outside the frustum that
# was already rasterised, and every pixel computed for an orientation the frame
# is no longer being shown at.
#
# DRAWN and WARPED are not the same operation and no dial converts one into the
# other. "Fake" is the right word for the second, and it is the correct report.
#
# TESTs 130 through 146 are therefore all one refutation. Kept in full, because
# the alternative is someone rebuilding this in six months.
#
# --- WHAT ACTUALLY COMES BACK, AND ONE THING THAT DOES NOT ------------------
#
#   vp_patch = 1, vp_latch = 1.0, both temporal slots written, pass three on.
#
# THAT IS TEST 121'S STATE, and with DLSS OFF the reason it was ever contentious
# is gone. TEST 121's cost was CHARACTER SHAKE, and TEST 88 established why:
#
#   "Only a temporal upscaler reads motion vectors. With DLSS and DLAA off,
#    nothing consumes them and a wrong one costs nothing - so characters are
#    STABLE."
#
# The whole TEST 121 vs TEST 124 trade was a choice about where to put an error
# that only DLSS could see. With DLSS off there is no consumer, so the slots can
# be written - which is the configuration with the SHARPEST world and the
# MINIMUM ground smear - and the shake cannot happen.
#
# WHAT COMES BACK WITH IT: set A. The sky, sun, cloud, particles and dynamic
# shadows slide by D again, because they are rendered before the substitution
# and know nothing about it. That is the known price and it is why this was ever
# turned off.
#
# depth_layer STAYS AT 1. It is the one change this whole session that fixed a
# reported fault outright - TEST 132, "stable" - and it is independent of the
# substitution.
#
# EVERYTHING I ADDED IS OFF, and off by one key each rather than deleted: the
# code is harmless when disabled and the next person should be able to read what
# was tried without digging through git.
#
#     image_latch = 0
#     head_overdrive = 0
#     head_predict_ms = 0
#
# --- THE ONLY REMAINING ROUTE TO BOTH, STATED HONESTLY ----------------------
#
# Keep the drawn rotation and stop set A sliding, by applying THE SAME D to the
# passes that currently miss it - the sky, and the shadow-receive pass that
# reconstructs world position from depth with an inverse camera matrix vp_patch
# is not reaching.
#
# With DLSS off this is a BOUNDED problem for the first time: set B needs nothing
# at all, so only set A's camera matrices have to be found. And this file already
# knows how, from TEST 66ca7d4:
#
#   "The next attempt needs a frame capture naming the constants the shadow pass
#    binds, not a seventh inference."
#
# That is a RenderDoc capture of one battle frame, reading which buffer and
# offset the sky and lighting passes bind - not another theory. Until that is
# done, this state is the honest best: native-feeling head, sliding shadows.
#
# RESULT: restoring a known state.
vp_patch = 1
vp_latch = 1.0
vp_write_prev_slot = 1
vp_reproj_patch = 1
vp_prev_same_eye = 1
depth_layer = 1
image_latch = 0
head_overdrive = 0
head_predict_ms = 0
stereo_mode = afr
afw = 0

# =============================================================================
# TEST 148 - THE DIRECTION LANES. Measuring what the sky actually reads.
# =============================================================================
#
# TEST 147 ended by sending the next attempt to RenderDoc. It does not need to
# go there, and the reason is written in this file already - twice.
#
# WHY THE SKY HAS NEVER BEEN FOUND
#
# vp_sky was investigated to a conclusion and correctly LEFT OFF. The re-armed
# origin survey found only cube faces - axis-aligned forwards, square 90-degree
# frusta - and offset 688, the one candidate that looked like a real skybox,
# has never reappeared in any run since the session that produced it.
#
# That was read as "the scanner cannot find the sky's matrix". It is worse and
# better than that: THE SKY HAS NO MATRIX. A modern sky is a full-screen pass
# whose view ray is interpolated between FOUR CORNER DIRECTIONS, and a deferred
# lighting pass reconstructs world position from depth exactly the same way -
# position = camera + ray * depth. Neither one is a 4x4, so no signature built
# out of rows, forwards and frusta can ever match it, and six increasingly
# careful matrix scans were always going to come back empty.
#
# This file made this argument once already, about the cascade origin:
#
#     "It is not the boundary. It is the boundary of looking for MATRICES. A
#      float3 that tracks the camera is just as measurable as a matrix that
#      does."
#
# The same sentence applies to a corner ray. This is that measurement pointed
# at ROTATION instead of translation, and it needs no external capture: every
# constant buffer upload already passes through our own Map hook.
#
# THE TEST IS PREDICTIVE, WHICH THE LANE CENSUS IS NOT
#
# The lane census scores after the fact - how far did it move, was it the way
# the head moved. That is enough for a translation, where there is one direction
# to be right about. It is not enough for a direction lane, because ANY lane
# holding a unit vector wanders by roughly the right amount when the camera
# turns. Getting the amount right is not evidence.
#
# So this predicts. A world direction bolted to the camera satisfies
#
#     w_now == w_prev * R_delta,    R_delta = R_prev^T * R_now
#
# exactly, for the whole 3-vector, whatever the lane means and whatever it is
# scaled by. Two residuals are measured against each other -
#
#     CAMERA-LOCKED    |w_now - w_prev * R_delta|
#     WORLD-ANCHORED   |w_now - w_prev|
#
# - and the statistic is how much of the second the first explains away:
#
#     explained = 1 - residualCam / residualWorld
#
#     1.0  the lane rotates with the camera and does nothing else
#     0.0  anchored to the world, or moving for its own reasons
#     neg  moving AGAINST the camera - what a compensating term looks like
#
# Scale-free, no guess at the convention, and it handles ROLL, which a
# forward-vector-only test cannot.
#
# WHAT TO LOOK FOR IN THE LOG
#
#     VP ray census: ...
#       cb   1760: camera turned 41.3 deg over 210 frame sample(s), ...
#           offset  1104  explained 0.998  |w|   1.000  moved  0.7213  n 210
#           offset  1120  explained 0.997  |w|   1.000  moved  0.7204  n 210
#           offset  1136  explained 0.998  |w|   1.000  moved  0.7218  n 210
#           offset  1152  explained 0.997  |w|   1.000  moved  0.7211  n 210
#
# FOUR CONSECUTIVE LANES near 1.0 in one buffer is the signature - that is a
# frustum corner ray set. Three consecutive is a camera basis (right, up,
# forward) and is just as usable. One alone is more likely a light direction
# that happens to be animated, and wants a second run before it is believed.
#
# THIS RUN WRITES NOTHING. vp_ray_patch = 0. The census measures and reports;
# the substitution is a separate key aimed by hand afterwards, which is the same
# order the reprojection matrix went in and the same order cascade_snap went in.
# TESTs 130-146 are one long lesson in what happens when the dial and the thing
# it acts on move in the same test.
#
# EVERYTHING ELSE IS TEST 121 UNTOUCHED, so the headset should feel exactly as
# it did in TEST 147 - native head movement, sliding sky and shadows. If it
# feels different, the census is costing frame time and that is itself the
# result.
#
# RESULT:
vp_ray_census = 1
vp_ray_patch = 0

# =============================================================================
# TEST 149 - DECODING THE LANES. What offset 688 has been all along.
# =============================================================================
#
# TEST 148 ran and found them on the first attempt. cb 1760, and the engine's
# own frustum is on the record from the same log:
#
#     VP site: cb 1760 offset 240 | tan L-1.842 R1.842 U1.329 D-1.329
#                                 = 123.0 x 106.1 deg
#
# and the ray census, over 360 frame samples with the camera turning 318 deg:
#
#       offset   960  explained 0.846  |w|   1.000
#       offset   928  explained 0.845  |w|   1.000
#       offset   688  explained 0.845  |w|   1.842
#       offset   736  explained 0.792  |w|   1.072
#       offset   704  explained 0.666  |w|   1.329
#       offset   944  explained 0.666  |w|   1.000
#
# |w| 1.842 AND |w| 1.329, AGAINST tan 1.842 AND 1.329. Four significant
# figures, both axes, from a statistic that knows nothing about the frustum -
# the census measures rotation residuals and never reads a tangent. Those two
# lanes are the frustum EXTENT VECTORS: right * tanX and up * tanY. That is a
# ray basis, and a ray basis is what a sky pass and a depth-reconstruction pass
# consume. 928/944/960 are three consecutive UNIT lanes: a plain camera basis.
#
# OFFSET 688 IS THE ONE THIS FILE ALREADY MET AND DISMISSED
#
# The origin survey found it once - "pos (0,0,0), fwd tracks the reference
# camera to within 0.5 degrees" - and vp_sky was then turned back OFF on the
# grounds that it never reappeared:
#
#     "Offset 688 has not appeared ONCE since - zero occurrences across 15
#      anatomy dumps in one run and the whole of the next, at any camera."
#
# It reappears in every single ray census, n = 360. Both readings are correct.
# The anatomy dump asks "does this 4x4 decode as a VIEW", and a clip->world
# matrix with the camera translation factored out decodes as a view exactly
# once, by luck, and then stops matching. The lane census asks "is this lane a
# direction bolted to the camera", which is a question the block can answer
# every frame. The block was never absent. The question was wrong.
#
# WHY explained IS 0.85 AND NOT 0.99, WHICH IS NOT A WEAK RESULT
#
# The residual is measured against R_delta from the EYE camera, and the lanes
# are built by the engine from the ENGINE camera. The two differ by D - which is
# the entire subject of this file. Over ONE FRAME at 90 Hz a fast turn is about
# 0.9 deg and D is the same order, so the noise floor is comparable to the
# signal by construction. That is exactly what the numbers do: explained rises
# with turn speed - 0.52 at 115 deg, 0.685 at 37 deg, 0.845 at 318 deg - a fixed
# floor under a growing signal. The identification does not rest on it anyway:
# 1.842 and 1.329 do.
#
# WHAT THIS RUN ADDS, AND IT STILL WRITES NOTHING
#
# A length names a scale but cannot name an AXIS, and "it is probably the right
# vector" is precisely the class of inference that cost TESTs 84-97 and 130-146.
# So the report now resolves each lane against the engine's own recovered basis
# and prints R/U/F dots. A lane that is k * right prints R +1.000 U 0.000
# F 0.000 and there is nothing left to guess.
#
# It also prints a WINDOW: every lane in a named range, ranked or not. The
# ranking stops at eight lanes and at 0.5, so the rows of a block that DO NOT
# ride the camera never printed - and those are the rows that say where the
# block ends and what the rest of it is for. A depth row scores near zero by its
# nature and is still part of the matrix we would be writing into.
#
# The window is 24 lanes from 688, which spans 688-1071. That covers the block
# at 688, the block at 928, and offset 752 in between - which is the already
# identified reprojection matrix and therefore a CONTROL: it is known, so if the
# window decodes it as something else the decoder is wrong.
#
# WHAT TO LOOK FOR
#
#     window at offset 688, 24 lane(s) - every lane, ranked or not:
#       offset   688  explained  0.845  |w|    1.842  raw (...)  R +1.000 U ...
#       offset   704  explained  0.666  |w|    1.329  raw (...)  R -0.000 U +1.000
#       offset   720  explained  ...
#       offset   736  explained  0.792  |w|    1.072  ...
#
# If 688 is R +-1.000 and 704 is U +-1.000 then the block at 688 is the ray
# basis outright, the lanes to write are named, and TEST 150 aims vp_ray_patch
# at them - one dial, one sign, nothing else moved.
#
# RESULT:
vp_ray_census = 1
vp_ray_patch = 0
vp_ray_cb = 1760
vp_ray_window = 688
vp_ray_window_lanes = 24

# =============================================================================
# TEST 150 - WRITING THE RAY BASIS. The first thing set A has ever been offered.
# =============================================================================
#
# TEST 149 decoded them, and there is nothing left to infer:
#
#   offset  688  |w| 1.842  raw (1.0932,1.4655,0.2222)  R +1.000 U +0.000 F +0.000
#   offset  704  |w| 1.329  raw (-0.1200,-0.1105,1.3189) R +0.000 U +1.000 F +0.000
#   offset  720  (no vector - never had a direction to judge)
#   offset  736  |w| 0.976  raw (-0.7419,0.6427,-0.0213) R +0.070 U -0.008 F +0.998
#   offset  928  |w| 1.000  raw (0.5936,0.7957,0.1206)   R +1.000 U +0.000 F -0.000
#   offset  944  |w| 1.000  raw (-0.0903,-0.0831,0.9924) R -0.000 U +1.000 F +0.000
#   offset  960  |w| 1.000  raw (0.7997,-0.6000,0.0225)  R +0.000 U +0.000 F -1.000
#
# Read against the engine's own recovered basis, and against its own measured
# frustum, tan R1.842 U1.329:
#
#   cb 1760 + 688 = right * tanX,  up * tanY,  (nothing),  forward * 0.98
#   cb 1760 + 928 = right,         up,         -forward
#
# The first is a RAY BASIS already scaled by the engine's tangents - the thing a
# sky pass and a depth-reconstruction pass interpolate between. The second is
# the same basis unscaled. Neither is a matrix any predicate in this file could
# ever have matched, and neither has been patched in the whole history of it.
#
# THE CONTROL PASSED, which is why this is being believed and acted on:
#
#   offset  752  raw (1.0000,-0.0000,0.0000)
#   offset  768  raw (-0.0000,1.0000,0.0000)
#   offset  784  raw (0.0000,0.0001,1.0000)
#
# Identity rows, at the offset already independently identified as the
# reprojection matrix inv(VPcur)*VPprev - which sits near identity by
# definition. The decoder was aimed at a block whose answer was known in advance
# and returned the known answer.
#
# TWO CORRECTIONS TO TEST 149, BOTH MINE
#
# 1. The window ran AFTER the ranking, and the ranking claims each lane it
#    prints by zeroing its sample count. So the window walked a table whose
#    eight most interesting lanes had just been emptied, and printed "no vector
#    - never had a direction to judge" for precisely the lanes the ranking had
#    named four lines above. Fixed: the window reads first.
#
# 2. The last two reports of the run show every lane frozen and explained 0.000,
#    at raw values bit-identical five seconds apart while the head turned 134
#    and then 49 degrees. That is not a contradiction and not a bug - it is the
#    battle having ENDED. theta is measured from the EYE camera, which is the
#    headset and still turning in a menu; the lanes are built from the ENGINE
#    camera, which is parked. Stationary lanes under a turning head is the
#    correct reading of a menu, and it is also a clean negative control for the
#    census: it says zero when the thing it looks for is absent.
#
#    The gameplay reports are the data: explained 0.62 to 0.84 across ten
#    consecutive five-second windows, n around 400 each, |w| 1.842 to four
#    figures every single time.
#
# WHAT IS BEING WRITTEN
#
# Both blocks, because both are world directions built from the engine camera
# and both therefore want the same rotation. Writing one and not the other would
# leave whichever pass reads the other still pointing at the flat camera, and
# the result would be unreadable - a partial fix looks like a failed one.
#
# The rotation is w * D3^T, not w * D3. A world POINT wants D; a camera-derived
# DIRECTION wants its transpose, because the lane is stored as l * R_eng and the
# value wanted is l * R_eye = w * R_eng^T * R_eye. The two differ by a transpose,
# which is the smallest possible gap between right and backwards, so it is a
# three-way dial and NOT a decision - vp_ray_patch = -1 tries the other order.
#
# HOW TO READ THE RESULT, and a wrong sign is not subtle:
#
#   RIGHT  the sky, sun, clouds and dynamic shadows stop sliding when the head
#          turns, and head movement stays exactly as native as vp_patch = 1
#          already feels, because pass one is untouched.
#   WRONG  they slide TWICE as far in the same direction. Unmistakable. Set
#          vp_ray_patch = -1 and run it again.
#   NEITHER  they slide exactly as before, which means these lanes are read by
#          something other than the passes in question and the search moves to
#          cb 528 or cb 6656, both of which also have camera-locked lanes.
#
# Nothing else moves. vp_patch stays 1, the latch stays 1.0, the census stays on
# so the same numbers keep printing beside the change.
#
# RESULT:
vp_ray_census = 1
vp_ray_cb = 1760
vp_ray_window = 688
vp_ray_window_lanes = 24
vp_ray_patch = 1
vp_ray_offset = 688
vp_ray_count = 4
vp_ray_offset_b = 928
vp_ray_count_b = 3

# =============================================================================
# TEST 151 - THE SAME WRITE, WITH THE RIGHT D.
# =============================================================================
#
# TEST 150 reported: "dynamic shadows on object flicker and move faster. sky and
# effect i dont think they changed."
#
# Half of that is the result and half of it is a bug of mine.
#
# THE RESULT: THE SHADOWS RESPONDED AT ALL.
#
# Offsets 688 and 928 in cb 1760 are read by the pass that puts dynamic shadows
# on objects. That is the first time in this file's history that anything aimed
# at set A has moved set A. The census found the lanes, the decoder named them,
# and the headset confirms something downstream consumes them. The sky did not
# move, so the sky reads something else - which is now a separate and much
# narrower question than "where does set A come from".
#
# THE BUG: PASS FOUR WAS USING THE PREVIOUS FRAME'S D.
#
# build_replacement was handed &cacheD on EVERY main-view match in the buffer.
# cb 1760 carries two - offset 240, the current frame, and offset 304, which is
# built DIFFERENTLY because it is passed usePrev. The loop therefore left cacheD
# holding whichever matched last, which is 304: a D that is a frame stale and a
# different size from the one pass one just used on the geometry.
#
# So the rays were rotated by the wrong amount, and with cb 1760 uploaded about
# nine times a frame there was no guarantee of the same wrong amount twice
# running. In the headset that is exactly, and only, "flicker and move faster":
# over-rotation from the wrong D, flicker from it not being consistent.
#
# It is the identical mistake pass three already made and already documented -
# "treating 304 as a one-frame-old view was feeding pass three its own current
# matrix twice" - and the fix is the identical line. D is now taken once, from
# mainViewSeen == 1, beside engCur and ourCur, chosen the same way for the same
# reason. The ray basis is the current frame's, so it wants the current frame's
# D.
#
# THE SIGN IS UNCHANGED AT +1 AND THAT IS DELIBERATE.
#
# "Moves faster" is the signature of a wrong sign AND the signature of a wrong
# D, and TEST 150 had a wrong D for certain. Flipping the sign in the same
# breath as fixing the D would leave two candidate explanations for whatever
# comes back and no way to tell them apart - which is the rule TESTs 130-146
# exist to enforce. The derivation still says +1: a lane stored as l * R_eng
# wants l * R_eye, which is w * D3^T, which is what sign +1 applies.
#
# If the shadows still slide FURTHER than before with the D corrected, the sign
# is wrong and vp_ray_patch = -1 is a config edit with no rebuild.
#
# ALSO IN THIS BUILD, AND IT CHANGES NOTHING THAT RENDERS
#
# The census had FOUR buffer slots and the game has at least five buffer widths.
# Run one filled them with cb 800, 40960, 1760, 528; run two with 528 and 6656.
# The set changed between runs because a slot is claimed first-come and never
# released - so whichever buffer lost the race was not reported empty, it was
# not reported at all, and that is indistinguishable from having nothing in it.
#
# The lane census wrote this same lesson down from the other direction: "two
# buffers it never looked at were right there in the same log". With the sky
# still unaccounted for, the one thing worse than not finding it is deciding it
# is absent from a buffer nothing ever watched.
#
# Eight slots now, and the floor drops from 256 to 64 bytes so cb 128 is
# admitted - it carries a view matrix and is patched 23,436 times in five
# seconds, which is a per-pass view buffer, which is the shape a sky pass would
# be handed.
#
# WHAT TO LOOK FOR
#
#   SHADOWS  do they stop sliding, or do they slide further? Either answer
#            settles the sign. Flicker should be gone regardless - it was the
#            inconsistency, and there is only one D now.
#   SKY      expected unchanged. The census output for the newly admitted
#            buffers is what this run is really collecting.
#
# RESULT:
vp_ray_patch = 1
vp_ray_offset = 688
vp_ray_count = 4
vp_ray_offset_b = 928
vp_ray_count_b = 3
vp_ray_census = 1
vp_ray_cb = 1760
vp_ray_window = 688
vp_ray_window_lanes = 24

# =============================================================================
# TEST 152 - THE OTHER SIGN. And the sky, found in cb 224.
# =============================================================================
#
# TEST 151 reported: "dynamic shadows slides very fast with my head."
#
# THE FLICKER IS GONE. That was the whole of the previous-frame D bug and it is
# closed: one D per frame, taken from mainViewSeen == 1, and the shadows now
# move smoothly instead of stuttering between two different wrong rotations.
#
# WHAT IS LEFT IS THE SIGN, and it is now the only thing it can be.
#
# The baseline complaint under vp_patch = 1 has always been that set A slides
# WITH the head. Applying w * D3^T made it slide with the head FURTHER. A
# correction that increases the error it was meant to remove is a correction
# applied in the wrong direction, so the answer is w * D3, which is
# vp_ray_patch = -1.
#
# The derivation that said +1 was internally sound - mat_mul is standard
# row-major A*B, D = inverse(eye) * eng really is R_eye^T * R_eng, and a lane
# holding l * R_eng really does want w * R_eng^T * R_eye = w * D3^T. The premise
# that failed is the storage: these rows are the camera axes as a WORLD->CAMERA
# matrix uses them, not as a CAMERA->WORLD matrix does, and those two differ by
# exactly the transpose the dial selects.
#
# This is the third time in this file a sign reasoned about has lost to a sign
# run - TESTs 101, 102 and 104 were the others - and it is the reason the dial
# exists rather than a constant. Nothing else changes: same offsets, same D,
# same everything, one character.
#
# THE SKY IS IN cb 224, AND THE PROOF IS THAT IT MOVED THE SAME DISTANCE
#
# Widening the census to eight slots admitted cb 112, 128, 224 and 32768, which
# four slots had been silently losing. cb 224 carries a clean camera basis:
#
#   offset  128  explained 0.733  |w| 1.000  R +1.000 U -0.000 F +0.000
#   offset  144  explained 0.718  |w| 1.000  R +0.000 U +1.000 F +0.000
#   offset  160  explained 0.814  |w| 1.000  R +0.000 U -0.000 F -1.000
#
# right, up, -forward. Beside cb 1760's second block in the same report:
#
#   cb  224 offset 128  moved 4.0163      cb 1760 offset 928  moved 4.0165
#   cb  224 offset 144  moved 1.6293      cb 1760 offset 944  moved 1.6295
#
# Four significant figures on both axes. That is not a similar basis, it is the
# SAME BASIS COPIED into a second, smaller, per-pass buffer - and cb 224 is not
# being written, because vp_ray_cb names 1760 alone. So every pass bound to
# cb 224 has been reading the flat camera all along while the shadows moved.
#
# That is very likely the sky and the effects, and it is why they did not budge
# in TESTs 150 and 151 while the shadows did. It is NOT being tested in this
# run: one variable. If -1 locks the shadows, TEST 153 points a second range at
# cb 224 with the sign already known.
#
# The game must be RESTARTED for this to take: every one of these keys is read
# once and cached.
#
# RESULT:
vp_ray_patch = -1
vp_ray_offset = 688
vp_ray_count = 4
vp_ray_offset_b = 928
vp_ray_count_b = 3
vp_ray_cb = 1760
vp_ray_census = 1
vp_ray_window = 688
vp_ray_window_lanes = 24

# =============================================================================
# TEST 153 - ONE D PER FRAME, NOT NINE. The compounding guard.
# =============================================================================
#
# TEST 152 reported: "still dynamic shadows move fast with every tiny movement
# or fast movement" - with the sign FLIPPED. So both signs make it fast.
#
# THAT IS THE MOST USEFUL THING EITHER RUN PRODUCED, because it rules out the
# explanation both runs were built on. A sign error changes WHICH WAY set A
# slides. It cannot make both ways slide faster. Something sign-independent is
# scaling the rotation up, and there is exactly one candidate in the numbers:
#
#     VP ray patch: 28350 direction lane(s) rotated ... in ~5 s
#
# 28350 / 7 lanes = 4050 uploads, over 450 frames = NINE uploads of cb 1760 per
# frame, and pass four fired on every one of them. That is only correct if the
# engine rewrites these lanes on every upload. If it rewrites the view matrix
# for each pass and leaves the ray basis standing from the first write, then
# uploads two through nine rotate a value WE ALREADY ROTATED, and one frame of D
# is applied nine times.
#
# Nine times a fraction of a degree is several degrees a frame. It scales with
# the smallest head movement, because it scales with D. And it is fast in BOTH
# directions, because compounding does not care about the sign - it just makes
# whatever we did bigger. That is the reported symptom in one sentence, and no
# sign, offset or D can produce it.
#
# THE GUARD, AND WHY IT NEEDS NO ANSWER IN ADVANCE
#
# The value written into each lane is now remembered. If the lane comes back
# bit-identical, the engine did not touch it, it is already what we want, and it
# is left alone. If it differs by one bit it is fresh engine data and gets the
# rotation. Exact comparison rather than an epsilon: those are bits we wrote
# ourselves and nothing else in the frame has any business writing them.
#
# This is correct whichever hypothesis is true, which is the point of doing it
# this way instead of testing the hypothesis first - and THE SKIP COUNT IN THE
# LOG IS THE ANSWER:
#
#   skipped ~ 8x rotated   the engine re-uploads without rewriting. Compounding
#                          was the whole fault, and it is now gone.
#   skipped ~ 0            the engine rewrites every upload, there was never any
#                          compounding, and the fault is somewhere else entirely
#                          - in which case this guard costs nothing and the
#                          search moves on with one more thing ruled out.
#
# Either way the log answers it without needing the headset to.
#
# THE SIGN GOES BACK TO +1, AND THIS IS NOT INDECISION
#
# Neither sign has ever been tested on a correct build. +1 ran with a stale
# previous-frame D and ninefold compounding; -1 ran with the D fixed and the
# compounding still there. Both readings are void. The derivation says +1 - a
# lane holding l * R_eng wants l * R_eye, which is w * D3^T - so the derived
# value is what gets the first clean run, and if it is wrong, -1 is one
# character with no rebuild.
#
# WHAT TO LOOK FOR
#
#   The magnitude should drop by roughly the skip ratio. If the shadows now move
#   LESS than the head instead of more, the sign is right and the remaining
#   error is scale. If they still track the head but the other way round, -1.
#   If they are unchanged from TEST 152, compounding was not it and the skip
#   count will already have said so.
#
# Restart the game; these keys are read once and cached.
#
# RESULT:
vp_ray_patch = 1
vp_ray_offset = 688
vp_ray_count = 4
vp_ray_offset_b = 928
vp_ray_count_b = 3
vp_ray_cb = 1760
vp_ray_census = 1
vp_ray_window = 688
vp_ray_window_lanes = 24

# =============================================================================
# TEST 154 - BLOCK B ALONE. Isolating a basis that is actually complete.
# =============================================================================
#
# TEST 153 answered its own question in the log before the headset did:
#
#     VP ray patch: 25074 ... sign +1. 0 upload(s) skipped
#
# ZERO. The engine rewrites those lanes on every one of the nine uploads, so
# every rotation was applied to fresh engine data exactly once. COMPOUNDING WAS
# NOT THE FAULT, and the guard that proved it stays in because it costs nothing
# and closes the question permanently.
#
# So: nine fresh uploads, one correct current-frame D each, and set A still
# moves fast under both signs. The plumbing is right. The CORRECTION MODEL is
# wrong, and there is a lane in the write that the census warned about and I
# used anyway.
#
#     offset  736  explained -0.797  |w| 0.996  R -0.070 U +0.003 F +0.998
#     offset  736  explained -0.826  |w| 0.996
#
# NEGATIVE, repeatedly. This file's own report legend says what that means:
# "negative = it moved AGAINST the camera - which is what a compensating term
# looks like". Offset 736 points along forward but does not BEHAVE like a fixed
# camera-space direction, and it has been rotated like one nine times a frame
# since TEST 150. Offset 720, also in the write, has no vector at all.
#
# Two of the four lanes in block A are solid and two are not, and a ray basis
# cannot be half-corrected: reconstruction is fwd + x*right*tanX + y*up*tanY, so
# rotating right and up while leaving forward alone SKEWS the rays rather than
# aiming them. Block A is unusable until 736 is understood.
#
# BLOCK B IS COMPLETE, and that is the whole reason to test it alone:
#
#     offset  928  explained 0.755  |w| 1.000  R +1.000 U -0.000 F -0.000
#     offset  944  explained 0.743  |w| 1.000  R +0.000 U +1.000 F +0.000
#     offset  960  explained 0.814  |w| 1.000  R +0.000 U -0.000 F -1.000
#
# right, up, -forward. Unit length, clean axes, positive explained, three
# consecutive lanes and nothing ambiguous among them. Rotating all three is a
# rigid change of basis - coherent whether or not the guess about what reads it
# is right.
#
# So block A is switched OFF and block B is written alone. If the shadows settle,
# the model is correct and block A was poisoning it. If they still move fast,
# then rotating a camera basis in cb 1760 is simply not the correction set A
# needs, the finding that these lanes ARE consumed still stands, and the model
# gets rebuilt rather than the dial turned again.
#
# TO STOP AND GO BACK to the TEST 151 feel at any point: vp_ray_patch = 0. That
# is the only key that matters; everything else here is measurement.
#
# RESULT:
vp_ray_patch = 1
vp_ray_offset = -1
vp_ray_offset_b = 928
vp_ray_count_b = 3
vp_ray_cb = 1760
vp_ray_census = 1
# =============================================================================
# TEST 155 - BLOCK A WITHOUT LANE 720. The ray basis, complete, minus the
#            one lane that is not a direction.
# =============================================================================
#
# TEST 154 reported: "now dynamic shadows move slower, same speed as sky and
# other effects."
#
# That is two findings, and the second is the important one.
#
# 1. Block A was the damage. Switching it off dropped the shadows from violent
#    to baseline, in one step, with nothing else changed.
#
# 2. Block B does NOTHING VISIBLE. Set A now moves together at one rate - sky,
#    effects and shadows - which is the vp_patch = 1 baseline. So 928/944/960 is
#    a camera basis that whatever reads it does not use for this, and cb 1760 at
#    688 is the block the dynamic-shadow path actually consumes. It is the only
#    thing so far that has moved set A at all.
#
# WHICH MEANS THE TARGET IS RIGHT AND THE WRITE IS WRONG, and there are exactly
# two lanes in it that were never understood.
#
# OFFSET 736 IS PROBABLY FINE, and the earlier reading of it was mine being
# careless with my own statistic. Its length wanders - 0.976, 0.982, 0.996 - and
# a 2% length change across a frame in which the camera turned half a degree
# puts far more into the RADIAL residual than the tangential one. explained goes
# negative because the length moved, not because the direction fought the
# camera. It is forward times a varying scale, and rotation preserves scale, so
# rotating it is correct. "Compensating term" was the wrong reading.
#
# OFFSET 720 IS THE SUSPECT, and the census could not have told me:
#
#     offset  720  (no vector - never had a direction to judge)
#
# "No vector" means the length fell outside 1e-3 to 1e4. That covers a lane of
# ZEROES, which costs nothing to rotate, and a lane holding a PACKED SCALAR of
# 1e6, which must never be touched - opposite problems behind one message. And
# pass four never applied that test at all: it checks finite3, which rejects
# NaN and nothing else. So whatever 720 is, it has been rotated nine times a
# frame since TEST 150.
#
# A ray basis is fwd + x*right*tanX + y*up*tanY, and rows 0, 1 and 3 of the
# block are exactly right*tanX, up*tanY and forward. Row 2 - lane 720 - is the
# depth row, which such a matrix does not need and typically leaves at zero or
# packs. It is not part of the direction under any reading.
#
# So block A is written COMPLETE and lane 720 is stepped over, using the two
# ranges that already exist: 688 x2 covers right and up, 736 x1 covers forward.
# No rebuild was needed for that; the build carries only a diagnostic.
#
# THE DIAGNOSTIC, which changes nothing that renders: the window now keeps the
# raw float4 of every lane in range BEFORE any filter, w included, and prints it
# for the lanes the accumulators reject. Next run says outright whether 720 is
# zeroes or a scalar, and the report labels it "harmless to rotate" or "NOT a
# direction - do not rotate this" rather than leaving it to be inferred a second
# time.
#
# If the shadows lock with 720 stepped over, that lane was the whole fault from
# TEST 150 onward and the sign question was never even reached. If they go
# violent again, 720 is innocent, block A is genuinely not rotatable as a unit,
# and the raw dump will say what it is instead.
#
# vp_ray_patch = 0 returns to the TEST 151 feel at any time.
#
# RESULT:
vp_ray_patch = 1
vp_ray_offset = 688
vp_ray_count = 2
vp_ray_offset_b = 736
vp_ray_count_b = 1
vp_ray_cb = 1760
vp_ray_census = 1
