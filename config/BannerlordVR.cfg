#
# That is the whole diagnosis, and it inverts what this file has assumed for
# forty tests. vp_patch = 1 does not feel better because it removes a latency.
# It feels better because it OVER-ROTATES:
#
#   The geometry is drawn from the head pose at DRAW time - the camera-build
#   pose plus D. The pose SUBMITTED is still the camera-build pose, because
#   managed publishes what it built the cameras from and D is computed natively,
#   later, at constant-buffer upload. Nothing ever tells the runtime about D.
#
#   TEST 131 established that the compositor reprojects. So it applies its whole
#   correction on top of an image that has already been corrected once, and the
#   world turns by MORE than the head did, settling back when the head stops.
#
# ONE MECHANISM, BOTH EFFECTS. The over-rotation is the liked half; set A
# sliding is the hated half. The sky and the shadows are rendered WITHOUT D, so
# they land correctly while the geometry lands over-rotated - and the difference
# between them is exactly D. Every symptom from TEST 70 onward is that one fact
# seen from two ends.
#
# It also explains why TESTs 131-133 measured perfectly and still felt wrong.
# They were converging on the TRUTH, and the truth is the thing that was being
# rejected in the headset.
#
# --- TEST 134: MAKE THE OVER-ROTATION A DIAL --------------------------------
#
#   head_overdrive = 1.0
#
# The submitted pose is rotated BACKWARDS by the head's own movement since the
# render. The compositor then rotates the whole frame FORWARDS by that much
# extra - the same over-rotation vp_patch produced, applied to every pixel at
# once instead of to the geometry alone.
#
# Sky, shadows, effects and geometry are all over-rotated TOGETHER, because by
# then they are one image and nothing inside it can disagree. That is the whole
# argument: the liked half without the hated half.
#
# Cost: one quaternion multiply on the submitted pose. No shader, no engine
# matrix, no second render, and nothing the upscaler can see.
#
#   head_overdrive = 0     truth - the state TESTs 131-133 measured clean
#                  = 1.0   the vp_patch = 1 amount
#                  = 0.5   half
#                  = -1.0  the other composition order, if 1.0 makes it worse
#                          rather than snappier
#
# THE SIGN IS THE ONE THING LIKELY TO BE BACKWARDS, as it has been three times
# in this file. If 1.0 feels like MORE resistance rather than less, the answer
# is -1.0 and not a smaller number.
#
# WHAT TO EXPECT IF IT IS RIGHT: sudden head movements feel decoupled and
# resistance-free, exactly as vp_patch = 1 - and the shadows, sky and effects
# stay put, because vp_patch is still 0 and nothing in the frame disagrees.
#
# WHAT IT IS NOT: correct. Truth is 0. This makes the deviation a number that
# can be tuned instead of a side effect of a matrix patch that also breaks the
# shadows.
#
# RESULT: pending.
pose_lead_frames = 1
head_overdrive = 1.0
# =============================================================================
# TEST 134 RESULT / TEST 135 - the overdrive doubled, for the reason TEST 131
#                              had already written down
# =============================================================================
#
# TEST 134 RESULT: DOUBLING.
#
# And the cause was already in this file, one test earlier, explaining the same
# symptom under image_latch = -1:
#
#   "under AFR the two eyes hold DIFFERENT render poses - one is a frame older -
#    so a wrong-signed rotation moves each eye by a different wrong amount. The
#    pair stops being a stereo pair."
#
# head_overdrive_orientation took afrPose PER EYE. The render-to-now rotation is
# therefore LARGER for the stale eye than for the fresh one, so the two eyes were
# biased by different amounts, the pair stopped differing by the IPD alone, and
# the eyes were asked to fuse two views that disagree in yaw. Doubling, only while
# the head moves. The mechanism was known and the code was written anyway.
#
# --- THE FIX: A HEAD ROTATION IS RIGID -------------------------------------
#
# One rotation, both eyes, identically. The delta is now measured ONCE per frame,
# against whichever eye was captured most recently, and applied unchanged to
# both - which leaves the baseline exactly as it was rendered.
#
# It is also computed in WORLD space now (now * conj(render)) rather than in the
# eye's own frame, and PRE-multiplied onto the submitted orientation. An
# eye-local delta would have to be conjugated into each eye's frame to mean the
# same thing in both, and with canted displays those frames differ. World space
# has no such trap: the same quaternion means the same rotation for every eye.
#
# WATCH FOR, once a second:
#
#   "Head overdrive: N frame(s) biased this second, mean X deg, max Y deg,
#    applied identically to BOTH eyes"
#
# N is frames, not eyes, because there is now one delta per frame rather than one
# per eye - and that difference is the fix. Mean should look like the image latch
# numbers did, 0.1-0.5 deg with peaks around 2.
#
# IF IT STILL DOUBLES after this, the doubling is not the bias at all and the
# next suspect is the depth layer submitting a depth that does not match the
# colour under a rotated pose - depth_layer = 0 tests that in one line.
#
# IF IT FEELS LIKE MORE RESISTANCE rather than less, the composition order is
# backwards: head_overdrive = -1.0, not a smaller number.
#
# RESULT: pending.
head_overdrive = 1.0
# =============================================================================
# TEST 135 RESULT / TEST 136 - the pair has to turn as a HEAD, not as two eyes
# =============================================================================
#
# TEST 135 RESULT: less doubling, but still doubling. Head movement cannot be
# judged until it is gone.
#
# "Less" is the useful half: the per-eye delta WAS one cause and making the
# rotation rigid removed that share of it. What was left is the other half of
# the same mistake.
#
# ORIENTATION WAS BIASED, POSITION WAS NOT. That is not a head rotation - it is
# two eyes swivelling where they stand. A real head turn ORBITS both eyes about
# the head centre, and the difference is invisible until a depth layer is
# submitted:
#
#   depth_layer = 1 means the compositor reconstructs world points from the pose
#   it is handed and reprojects them. Hand it a pose whose orientation and
#   positions disagree and the error it makes depends on DEPTH and differs
#   between the two eyes - which is a disparity the eyes are asked to fuse and
#   cannot. Doubling, again, and worst on near geometry.
#
# So the bias now moves the pair as ONE RIGID HEAD, after the eye loop rather
# than inside it, because it needs both poses to exist before it can find the
# midpoint between them:
#
#   orientation   pre-multiplied by conj(delta), both eyes, identically
#   position      orbited about the midpoint of the two eye positions
#
# The IPD is preserved EXACTLY - a rigid rotation of two endpoints about their
# own midpoint cannot change the distance between them - so whatever else this
# does, it can no longer change the stereo baseline.
#
# IF IT STILL DOUBLES, the bias is not the cause and the discriminator is one
# line: depth_layer = 0. With no depth layer the compositor cannot make a
# depth-dependent error at all, so doubling that survives THAT is neither the
# bias nor the depth, and the next suspect is the AFR pair itself.
#
# RESULT: pending.
head_overdrive = 1.0
# =============================================================================
# TEST 136 RESULT / TEST 137 - depth_layer = 0, to find out whose doubling it is
# =============================================================================
#
# TEST 136 RESULT: still doubles. Head rotation still has resistance on the
# FIRST movement out of a stall.
