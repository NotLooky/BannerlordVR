# =============================================================================
# TEST 126 - AFW: the edge trails are afw_taa, and the cost is NOT frames
# =============================================================================
#
# MEASURED, from the AFW run, and it settles the performance question that has
# been assumed since TEST 87:
#
#   frames/s   90 89 90 90 90 90 90 88 90 90 90 90 58 67
#   AFW synth  90 90 89 90 90 90 90 90 88 90 90 90 90 56   (0 failed, every one)
#
# TWELVE consecutive windows at a solid 90 with every eye synthesised and none
# failed. The 58/67 at the end is the mission tearing down - the same shape every
# log in this file ends with. So AFW does NOT cost frames, TEST 87's "very bad
# performance" was the doubling being read as stutter, and the report this time
# says so directly: "stutter not only from fps".
#
# THE TRAILS ARE afw_taa AND THE NOTE ABOVE IT SAYS SO
#
#   "higher holds harder, AT THE RISK OF TRAILS WHERE THE CLAMP MISSES"
#
# The clamp confines the held value to the range the source holds around the
# pixel's own source position - FOUR TAPS. On a smooth surface that range is
# tight and the history is honest. On an EDGE it is not: four taps across a
# silhouette span both sides, so the clamp accepts almost anything and the
# previous frame survives where it should have been discarded. Trails, on edges,
# specifically - which is the report.
#
#   afw_taa = 0
#
# What it costs is what it was added for: the shadow-edge crawl it was holding
# steady comes back. That is a fair trade against trails on every silhouette, and
# it is one line to put back at 0.25 if the crawl is worse than the trails.
#
# WHAT REMAINS IF THE STUTTER SURVIVES afw_taa = 0: it is not frame rate (90,
# measured) and not the pairing (held-image age 0-16 ms, healthy). The next
# suspect is the synthesised eye's own timing - one eye is rendered and the other
# computed from it, so any jitter in the warp's source pose shows in one eye only,
# and one eye stuttering against a steady one reads as stutter in both.
#
# RESULT: pending.
afw_taa = 0

