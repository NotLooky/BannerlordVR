# is being turned as one head and the IPD is arithmetically untouched. The
# doubling survived that, so it is not the baseline being changed.
#
# TWO THINGS LEARNED, ONE OF THEM ABOUT THE INSTRUMENT
#
# THE MIRROR CANNOT SEE THIS BUG. A moving frame from the capture shows clean
# single spear shafts in one eye - no ghosting - but the SteamVR VR View shows
# the image we SUBMIT, not what the compositor makes of it. Doubling produced by
# reprojecting a lied-about pose happens downstream of everything vrshot can
# photograph. Frames settle spatial questions about our own output and nothing
# about the runtime's.
#
# THE OVERDRIVE CANNOT FIX ONSET RESISTANCE, BY CONSTRUCTION. It is proportional
# to how far the head moved DURING the pipeline, and at the instant movement
# starts that is zero - which the log shows directly, 0.05 deg while still
# against 0.34 deg once moving. "Resistance in the first movement from a stall
