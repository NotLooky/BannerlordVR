# =============================================================================
# TEST 130 - the latch, moved out of the matrices and onto the finished image
# =============================================================================
#
# Reported, with DLSS OFF: the dynamic shadows, the sun, the sky and the effects
# move with the head. Asked for a real fix - AFR, DLSS off, instant head.
#
# WHY NO SETTING IN THIS FILE COULD HAVE GIVEN THAT
#
# vp_patch.cpp has said it plainly for forty tests:
#
#   "D is the rigid move from the camera the engine drew with to the eye we
#    want, and it is EXACTLY the amount by which the scene ends up displaced
#    relative to the shadow map - because the shadow map was rendered before
#    this ran and knows nothing about it."
#
# vp_patch is a late latch in MATRIX space. It rotates the main view at
# constant-buffer upload - AFTER the sky pass, the shadow-receive pass and every
# screen-space effect have already consumed the camera. Those stay in the
# unrotated frame while the geometry moves, so they slide by exactly D, which is
# the head's own rotation. That is "they move with my head", and with DLSS off
# it is not a temporal artefact at all: no history is being reprojected, there
# are simply TWO CAMERAS IN ONE FRAME.
#
# So the four corners of TESTs 121-124 were never four options. They are four
# places to put one rotation, and every one of them puts it where some pass
# disagrees. vp_latch scales how far set A slides; vp_patch = 0 stops the slide
# and takes the crisp head with it (TEST 127).
#
# THE SAME LATCH, ONE STAGE LATER
#
# image_latch = 1. The engine renders the whole frame from ONE camera - nothing
# substituted, every pass agreeing with every other - and the FINISHED eye is
# rotated to the live head pose on the way to the compositor. Sky, shadows,
# effects and geometry move together, because by then they are the same pixels.
#
# WHY THIS IS CHEAP, AND NOT A SECOND AFW
#
# D's translation is measured at 0.0 mm over 450 of 450 publishes: D is a PURE
# ROTATION, and a rotation about the eye is a homography - every point on a ray
# maps to one output pixel whatever its depth. No depth buffer, no disocclusion,
# no hole that can ever open. One full-screen pass with a 3x3 matrix. TEST 109
# wrote this down for the NGX correction and it carries over unchanged.
#
# The only thing it can run out of is IMAGE, at the leading edge, and the eye is
# already rendered through a widened symmetric containing frustum while
# symmetric_fov = 1 - so there is margin there to spend.
#
# WHAT IS SUBMITTED. The compositor is told the LIVE orientation rather than the
# render one, because the pixels have already been carried there; telling it the
# render pose would ask it to apply the same rotation a second time. Position is
# untouched - the latch turns, it does not move.
#
# THE SIGN IS SELECTABLE AND THE RUN DECIDES. TESTs 101, 102 and 104 each
# shipped a rotation whose direction had been reasoned about instead of tested -
# three in four tests, all in the same handful of lines.
#
#     image_latch =  1    R_render^-1 * R_now
#     image_latch = -1    the inverse
#     image_latch =  0    off, and the build is TEST 127 exactly
#
# If 1 is backwards it will not be subtle: the world will lag the head by TWICE
# what it used to instead of not at all, and it will get worse the faster you
# turn. That is the whole test and it takes one battle.
#
# WATCH FOR, once a second, beside the held-image age:
#
#   "Image latch: N eye(s) rotated to the live head pose this second,
#    mean X deg, max Y deg"
#
# N should be about the frame rate. The mean is the head rotation over one
# pipeline depth - a fraction of a degree standing still, a degree or two while
# turning. N = 0 means it never armed. A mean near zero WHILE MOVING means the
# live locate is not live, and the fault is there rather than in the maths.
#
# image_latch_max_deg = 8.0 declines anything larger, so a hitch or a recentre
# cannot fling the image sideways for a frame.
#
# TEST 129'S KEYS ARE LEFT WHERE THEY ARE AND ARE INERT. vp_write_prev_slot,
# vp_reproj_patch, vp_prev_same_eye and vp_latch all gate on the substitution,
# and with vp_patch = 0 there is no substitution to gate. Saying so beats
# deleting them and losing the record of what TEST 129 was.
#
# WHAT IT DOES NOT DO, so a partial result is readable: it corrects the
# VIEWPOINT, not the CONTENT. The soldiers are still where the engine last put
# them, and a held AFR eye still depicts a moment one frame old. What should go
# is the world rotating under the head with the sky and the shadows left behind.
#
# RESULT: pending.
vp_patch = 0
image_latch = 1
stereo_mode = afr
afw = 0
# =============================================================================
# TEST 130 RESULT / TEST 131 - the latch ran, and it cannot have helped
# =============================================================================
#
# MEASURED, first battle on the image latch:
#
#   Image latch: 156-166 eye(s)/s, mean 0.11-0.47 deg, max 2.14 deg
#   Gain/600f  transfer x1.00 on all 8 windows
#   Pose age   0.0 ms mean, 0.0 ms worst
#   Present    90 fps sustained
#
# Reported: head movement is still not instant.
#
# THE GAIN IS 1.00 AND THAT IS NEW. It was 0.617 in TEST 78 and 0.869 in TEST
# 89, and this file has said all along that a gain error is what "resistance"
# means and that no latency work can touch it. It is clean now. Together with a
# pose age of zero and a locked 90, every standing explanation for "not instant"
# is excluded by measurement.
#
# AND THE LATCH IS REDUNDANT IF THE RUNTIME REPROJECTS. Submitting the RENDER
# pose already had the compositor rotate render -> photon. The latch rotates
# render -> now and hands it now -> photon. The total applied to the pixels is
# the same rotation either way, so if the runtime honours the layer pose this
# change could never have altered the feel - it only moves where the resample
# happens and costs one bilinear tap of softness.
#
# THAT QUESTION HAS NEVER BEEN TESTED. It has been assumed since TEST 70, and
# every argument in this file about the compositor "carrying the difference"
# rests on it.
#
# TEST 131 ASKS IT WITH ONE LINE. image_latch = -1 applies the inverse rotation,
# and the three outcomes cannot be confused with each other:
#
#   MUCH BETTER          the sign was backwards AND the runtime is not
#                        reprojecting - the latch is the only correction in the
#                        chain and it was pointing the wrong way. Pin -1.
#
#   MUCH WORSE           the runtime IS reprojecting. The latch is redundant,
#   (lags ~twice as far)  goes back to 0, and rotation was never the problem.
#
#   IDENTICAL            the latch is not reaching the displayed image at all.
#                        Plumbing, not maths.
#
# IF IT IS "MUCH WORSE", THE TWO CANDIDATES LEFT are both one-liners and neither
# is a rotation:
#
#   AFR holds one eye. Each eye's CONTENT refreshes at 45 Hz while 90 frames go
#   up. The compositor world-locks the rotation of a picture that is still 22 ms
#   old. Full AFR renders both eyes for real every period.
#
#   depth_layer = 0, so the reprojection is rotation-only. A head TURN swings the
#   eyes ~10 cm around the neck, and that parallax is precisely what a rotation
#   about the eye cannot produce. submit_depth is wired and the depth is already
#   promoted beside the colour.
#
# RESULT: pending.
image_latch = -1
# =============================================================================
# TEST 131 RESULT / TEST 132 - the compositor DOES reproject. Rotation is not
#                              the problem, and never was.
# =============================================================================
#
# TEST 131 RESULT: MUCH WORSE. Doubling while moving the head, still not
# instant, still floaty.
#
# THAT IS THE ANSWER TO A QUESTION THIS FILE HAS ASSUMED SINCE TEST 70 AND NEVER
# ASKED. The runtime honours the layer pose and reprojects the submitted image
# to photon time. Everything written here about "the compositor carries the
# difference" is now measured rather than believed.
#
# It follows immediately that the image latch was redundant: submitting the
# RENDER pose already had the runtime rotate render -> photon, and the latch
# only split that same rotation into render -> now plus now -> photon. At +1 it
# could change nothing; at -1 it subtracted where the compositor added, so the
# pixels carried twice the error.
#
# AND THE DOUBLING IS THE CONFIRMING DETAIL, not a separate fault. Under AFR the
# two eyes hold DIFFERENT render poses - one is a frame older - so a wrong-signed
# rotation moves each eye by a different wrong amount. The pair stops being a
# stereo pair and the eyes are asked to fuse two views that disagree in yaw.
# That is doubling, it appears only while the head moves, and it is precisely
# what the mechanism predicts.
#
#   image_latch = 0     off. The build is TEST 127 again in every respect.
#
# WHAT "FLOATY" ACTUALLY IS, now that rotation is excluded by measurement
#
# Gain 1.00, pose age 0.0 ms, 90 fps, rotation world-locked by the runtime - and
# it still floats. This file already wrote down what is left, at frame_latency:
#
#   "right shape, wrong place, moved there by a reprojection instead of being
#    drawn there"
#
# A compositor reprojection is a ROTATION ABOUT THE EYE. It is exact at infinity
# and wrong everywhere else, by an amount proportional to how close a thing is.
# Two sources feed it here and both are depth-dependent, which is why no amount
# of rotation work has ever touched them:
#
#   THE HELD EYE. AFR refreshes each eye's CONTENT every other frame. The
#   compositor world-locks the rotation of a picture that is still 22 ms old, so
#   the near field is in the wrong place by whatever moved in 22 ms.
#
#   NO DEPTH LAYER. depth_layer = 0, so the correction is rotation-only. A head
#   TURN swings the eyes about 10 cm around the neck, and the parallax that
#   produces is exactly what a rotation about the eye cannot represent.
#
# TEST 132 TAKES THE SECOND ONE, AND THE REASON IT WAS OFF NO LONGER HOLDS.
#
# depth_layer was disabled because of DLSS: "under DLSS Performance the game's
# depth is half the eye in each axis and offset from the colour by a jitter we
# established we cannot see ... a z that is wrong moves the world by the wrong
# amount on EVERY head translation."
#
# DLSS IS OFF NOW. That is the whole point of the configuration being judged.
# The depth is native resolution and unjittered, so the specific defect that
# disabled this key is absent. submit_depth is already wired and afrDepthResult
# is already promoted beside the colour, so this is a key and not a code change.
#
#   depth_layer = 1     the compositor may correct head TRANSLATION, not just
#                       rotation
#
# WATCH FOR: the depth swapchain being created, and submit_depth running. If the
# depth cannot be matched the layer simply is not attached and the eye goes up
# as it always did - the failure mode is "no change", not a broken image.
#
# PREDICTION, stated so a null result is readable: floatiness should fall most
# where depth changes fastest per pixel - the ground under you, and anything
# within a couple of metres. The distant field should be unchanged, because a
# rotation-only warp was already correct there. If NOTHING changes, then the
# layer never attached, and the log says so.
#
# ONE VARIABLE. image_latch going to 0 is a revert to a known state, not a
# second change.
#
# RESULT: pending.
image_latch = 0
depth_layer = 1
# =============================================================================
# TEST 132 RESULT / TEST 133 - the depth layer worked. What is left is the cost
#                              of displaying a reprojection.
# =============================================================================
#
# TEST 132 RESULT: STABLE. Only head ROTATION remains floaty, with resistance.
#
# The depth layer is doing exactly what it was predicted to do. Measured:
#
#   "Depth layer up: 3040x3100, format 20, from the game's own depth buffer"
#   "Depth layer: 176 eye(s) submitted with depth this second (reversed-Z)"
#
# So the parallax half of the float is CLOSED, and the reason it could be closed
# is that DLSS is off: the depth is native resolution and unjittered, which is
# the exact defect that had disabled the key.
#
# --- WHAT IS NOW EXCLUDED BY MEASUREMENT, not by argument -------------------
#
#   gain              transfer x1.00 on every Gain/600f window; the FOV-hold
#                     line agrees at 1.000 once the projection settles
#   pose age          0.0 ms mean, 0.0 ms worst
#   frame rate        90 sustained
#   frustum           123.0 x 106.1, measured every window, so submitted_fov is
#                     right and the TEST 78 fallback is not in play
#   camera placement  Publish D check 0.0 mm mean and worst over 450 publishes
#   head aim          0.0 deg drift from what we wrote
#   turn correction   0.00 deg on almost every second
#   compositor        REPROJECTS - established by TEST 131
#
# ONE THING THE FOV LINE DID CATCH: gain reads 0.869 for the first seconds of a
# mission - "have 2.260/1.778, want 2.147/1.386" - and only then settles to
# 1.000 with the corrections falling to zero. Real resistance, but transient and
# confined to mission start. Worth remembering before it is mistaken for the
# steady-state complaint.
#
# --- WHAT THE REMAINING FLOAT IS -------------------------------------------
#
# The image latch instrument measured it before it was switched off, and the
# number is the whole answer:
#
#   Image latch: mean 0.11-0.47 deg, max 2.14 deg
#
# That is the angle between the pose the frame was rendered from and a locate
# taken at submit for the SAME display time. With pose age at zero it is not
# pipeline lag at all - it is the tracker's own prediction being refined over
# one frame. The compositor rotates the image by about that much every frame
# while the head turns, and this file already named the result:
#
#   "right shape, wrong place, moved there by a reprojection instead of being
#    drawn there"
#
# So the residue is the cost of DISPLAYING A REPROJECTION rather than a frame
# drawn where it is shown. That is not a bug with a sign in it.
#
# --- TEST 133 --------------------------------------------------------------
#
# pose_lead_frames = 2. TEST 127 nominated this itself as the one untried lever
# for the float, noting TEST 83's negative was taken while the float was
# believed to be a gain error - a premise TEST 102 later withdrew.
#
# Why it can still bite with pose age reading zero: pose age is measured against
# predictedDisplayTime, but a frame submitted late scans out a period later than
# that. Leading by two covers the difference.
#
# THE FAILURE SIGNAL IS OVERSHOOT. If the world lurches past and settles back
# when you STOP turning, the lead is too long; 1.5 is the middle and 1 is where
# this came from. Overshoot is worse than the lag it removes - this file has
# said so since pose_lead_frames was added.
#
# WHAT IS NOT BEING TRIED, AND WHY:
#
#   Full AFR      both eyes real every period, nothing held or warped - which is
#                 the right shape of fix. It needs TWO engine renders per display
#                 period and the engine is doing one at 90. Pairs would land at
#                 45 Hz and be reprojected further, which is the wrong direction
#                 for this particular complaint.
#
#   afr_move_reprojection = 1   written for the case where a depth layer exists
#                 and disabled because none did. That prerequisite is met now,
#                 so it is newly valid - but it corrects the GAME camera's
#                 translation, not head rotation, and this report is about
#                 rotation. Kept for its own test rather than folded into this one.
#
# RESULT: pending.
pose_lead_frames = 2
# =============================================================================
# TEST 133 RESULT / TEST 134 - what vp_patch = 1 was really doing to the feel
# =============================================================================
#
# TEST 133 RESULT: still bad. Resistance on small movements, and SHAKE on a
# sudden fast head movement out of stillness. pose_lead_frames back to 1 - the
# shake is what over-prediction does, this file predicted it in writing when the
# key was added ("over-prediction overshoots, and an overshoot is worse than the
# lag it removes"), and lead = 2 is the only thing that changed to produce it.
#
# --- THE REPORT THAT EXPLAINS EVERYTHING -----------------------------------
#
# "when vp_patch is on the world seems to be separated from head movements so
