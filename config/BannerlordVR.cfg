# THE SUSPECT IS THE TREMOR FILTER ADDED IN TEST 74, and the flaw is in its
# discriminator rather than its strength. head_filter holds the pose while the
# head moves SLOWLY. Slow small movement is what 6DOF fidelity IS - leaning to
# see round something, shifting weight, the parallax that makes a world feel
# solid - and all of it sits well under a 250 mm/s release speed. Gating on speed
# cannot separate deliberate slow movement from tremor, so it damped both.
#
# All three pose keys back to their pre-session values (head_filter = 1.0,
# pose_lead_smooth = 0, pose_lead_frames = 1) so the pose path is exactly what it
# was this morning, when 6DOF was not a complaint. The shadow fix is untouched -
# it lives in vp_patch and afr_camera_mode and shares nothing with these.
#
# THE RIGHT FIX, when it is worth building: filter on DIRECTION COHERENCE, not
# speed. Tremor reverses direction every frame or two; deliberate movement holds
# its direction. Track a smoothed velocity vector and compare its magnitude
# against the smoothed magnitude of the instantaneous velocity - the ratio is
# near 1 for coherent motion and near 0 for oscillation. That leaves a slow lean
# completely untouched while still killing a vibration, which is what speed
# gating could never do.
