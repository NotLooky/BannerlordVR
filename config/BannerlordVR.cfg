# =============================================================================
# TEST 108 RESULT / TEST 109 - the motion-vector correction, live
# =============================================================================
#
# The in-mission report arrived and it answers the one question that could have
# sunk this:
#
#   NGX Color         : 3040x3100  R11G11B10_FLOAT      bind=SRV RTV
#   NGX Output        : 3040x3100  R16G16B16A16_FLOAT   bind=SRV UAV RTV
#   NGX MotionVectors : 3040x3100  R16G16_FLOAT         bind=SRV RTV
#   NGX MV.Scale      : 1.0000, 1.0000     Reset 0
#
# 3040x3100 IS THE EYE, not the 2560x1440 monitor, and Reset = 0 is steady-state
# gameplay. DLSS runs on the VR eye and the hook is on the right pass. Colour
# equals Output, so this evaluation is DLAA - no upscale - which is what has been
# in use.
#
# Everything the correction needed is now measured rather than assumed:
#   vectors in PIXELS (scale 1,1), R16G16_FLOAT, no UAV on the engine's texture,
#   MVJittered clear, one grid throughout.
#
# --- WHAT IT DOES -----------------------------------------------------------
#
# A motion vector says where a surface was in the previous frame's image. The
# previous frame's image was LATCHED by that frame's D and the engine's vector
# does not know it. So each vector's endpoint is pushed through last frame's
# latch and the vector rebuilt:
#
#   prev_px      = here + mv
#   prev_latched = prev_px through M_prev
#   mv_corrected = prev_latched - here
#
# M_prev = inverse(VP_eng) * D * VP_eng, exported from vp_patch and rolled one
# frame. It is depth-INDEPENDENT because D is a rotation about the camera - all
# points on a ray map to one output pixel - which is why this is a matrix over a
# texture and not a reprojection needing depth.
#
# The engine's texture has no UAV so it is never written: a compute pass reads it
# and writes a copy of ours, and the NGX "MotionVectors" parameter is pointed at
# the copy for the duration of the call and put back immediately after. Any
# failure - shader, texture, missing homography, unexpected format - returns
# early and DLSS gets exactly what it would have got.
#
# --- WHAT SHOULD HAPPEN, stated before the run ------------------------------
#
#   the smear goes          this is the whole point. The ground especially, which
#                           is where the uncorrected vectors showed worst.
#   characters stay stable  they carry the same error and get the same fix.
#   head stays crisp        D is untouched; only the vectors handed to DLSS
#                           change.
#
# And if it works, vp_latch can go back up towards 1.0, because the reason to
# hold it at 0.5 was to halve an error that is now being corrected instead of
# divided.
#
# WATCH FOR, once: "NGX MV fix: ready at 3040x3100" then "NGX MV fix: LIVE".
# If neither appears the correction never armed and the run says nothing.
#
# TO TURN IT OFF, one line at the bottom of this file:  ngx_mv_fix = 0
#
# RESULT: pending.
ngx_mv_fix = 1

# =============================================================================
# TEST 109 RESULT / TEST 110 - the correction is live and WRONG-SIGNED
# =============================================================================
#
# TEST 109 armed and ran:
#
#   NGX MV fix: ready at 3040x3100 R16G16_FLOAT
#   NGX MV fix: LIVE
#
# So DLSS is reading our vectors - the plumbing works, the texture swap works,
# the homography reaches the shader. And the smear went from "the ground" at
# vp_latch = 0.5 to EVERYWHERE, with characters still stable.
#
# WORSE, NOT ABSENT, IS THE DIAGNOSIS. A correction that is right removes an
# error; one that is right in magnitude and wrong in sign DOUBLES it. Going from
# a ground-sized artefact to a frame-wide one is what doubling looks like, and it
# says the maths is the right size and pointing the wrong way.
#
# TWO BINARY UNKNOWNS, AND I HAVE BEEN GUESSING THEM
#
#   1. WHICH WAY A MOTION VECTOR POINTS. prev = here + mv is the usual DLSS
#      convention and is what TEST 109 assumed. Forward vectors are not rare.
#   2. WHICH WAY THE HOMOGRAPHY RUNS. M maps the engine's screen to the latched
#      one, which is right only if the previous position in the buffer is in
#      ENGINE space. If the engine's motion-vector pass already works in the
#      latched frame, the inverse is wanted.
#
# Four combinations. This session has already shipped three sign errors in four
# tests by reasoning about conventions instead of testing them - TESTs 101, 102
# and 104, all in the same handful of lines - so they are now SELECTABLE and the
# run decides:
#
#     ngx_mv_mode = 0    passthrough. Copies the vectors unchanged into our
#                        texture and hands that to DLSS. Should look EXACTLY like
#                        ngx_mv_fix = 0. If it does not, the fault is in the
#                        plumbing - format, grid, sampling - and no arrangement
#                        of the maths will help.
#     ngx_mv_mode = 1    prev = here + mv, M          (what TEST 109 ran)
#     ngx_mv_mode = 2    prev = here + mv, M inverse
#     ngx_mv_mode = 3    prev = here - mv, M
#     ngx_mv_mode = 4    prev = here - mv, M inverse
#
# The inverse is exact rather than numerical: M = inv(VP)*D*VP, so M^-1 =
# inv(VP)*inverse(D)*VP and D is rigid, so it is built from the rigid inverse
# alongside M and costs one extra product a frame.
#
# HOW TO RUN IT, and it is quick because the failure is loud: set the mode at the
# BOTTOM of this file, launch, look around for five seconds. One of the four will
# make the smear smaller instead of larger. Try 3 first - flipping the vector
# sign is the single most likely of the two unknowns, and mode 1 doubling the
# error is exactly what a flipped vector sign produces.
#
#     ngx_mv_mode = 3     <- try this first
#     ngx_mv_mode = 2     then this
#     ngx_mv_mode = 4     then this
#     ngx_mv_mode = 0     and this if all three are bad, to test the plumbing
#
# WHAT SUCCESS LOOKS LIKE: the ground stops smearing, characters stay stable, the
# head stays crisp - and vp_latch can then go back towards 1.0, because the error
# it was halving is being cancelled instead of divided.
#
# RESULT: pending.
ngx_mv_mode = 3

