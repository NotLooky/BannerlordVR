# =============================================================================
# TEST 197 - take the diagnostics off the render thread, and stop paying for
#            per-op work nobody reads
# =============================================================================
#
# Everything here is invisible in the headset: no pixel changes, no rule
# changes, no quality trade, no frame pacer. The frame is GPU-bound, so none of
# it raises the average frame rate. It is aimed at the VARIANCE - the once-a-
# second hitch, the repeated capture stalls, and the several-hundred-a-second
# thread suspensions that were all being paid during normal play.
#
# WHAT CHANGED (native DLL only)
#
#   - THE LOG IS BUFFERED. logf flushed every line so a crash kept its last
#     one. Native stereo made that expensive: 23.4 lines a second measured, 119
#     in the worst second, every one a synchronous disk write from inside the
#     Present hook. Now WARN and ERROR still flush immediately, the crash
#     handler flushes before it returns, and routine INFO lines flush on a
#     250 ms timer so tools\vrwatch.ps1 still tails it live.
#   - ONE FRAME MAP PER PROCESS, not per activation. g_active drops on every
#     scene teardown, so re-entering a mission re-armed the automatic capture:
#     this run fired it at 20:08:11, 20:08:42 AND 20:14:28, a stall of a few
#     frames each. A second capture on demand is what the trigger file
#     Logs\BannerlordVR.FrameMap.trigger is for.
#   - THE PROFILER SAMPLES IN WINDOWS. It suspends the Present thread, reads
#     8 KB of its stack and resumes it - 3186 times per 5 s report, continuously,
#     by default. It now samples for stereo_profile_duty of each period (0.1 =
#     the first ~500 ms, ~600 samples) and idles for the rest. Every line of the
#     report is unchanged, and the window always extends until the existing
#     50-sample floor is cleared. stereo_profile_duty = 1.0 restores continuous
#     sampling for a measurement session.
#   - THE PER-OP TIMERS SAMPLE ONE FRAME IN 23. stereo_begin called qpc_now() on
#     entry and at each of its four exits - 2 QueryPerformanceCounter per op, 4
#     per duplicated op, ~4.5-9k a frame - and none of it was gated. The divisor
#     now counts timed frames, so "stereo deciding / issuing" reports the same
#     ms per frame. 23 is the cadence the GPU-by-pass instrument already uses.
#   - SHADER RESOURCES ARE FETCHED IN RUNS. The declared-slot scan asked for
#     everything between the lowest and highest declared slot: the shadow
#     casters declare t0 alongside the terrain virtual texture's t44 and t47, so
#     that was 48 views AddRef'd and Released to look at three, per stage, per
#     draw. Runs are merged across gaps of up to 8 so scattered slots do not
#     turn into one call each - the merge distance was costed against the 187
#     shaders with texture declarations in the 20260917_201428 capture, and
#     splitting on every gap is +69.6%, WORSE than fetching the whole range.
#     8 is in the flat optimum for every plausible cost ratio; the table is in
#     the comment above kSrvGap. Equivalence to the old slot-by-slot walk was
#     checked over 20005 masks including the real ones: zero differences.
#   - THE SECOND EYE'S BINDS ARE COALESCED. stereo_bind and stereo_end set one
#     slot at a time, 2 x (1 + nSwap) calls per duplicated op. The swaps are
#     already in stage/kind/slot order, so one pass groups them into ranges.
#     Correctness does not depend on that order - bad order only costs more,
#     smaller ranges.
#   - Two per-op arrays are no longer zeroed (Read reads[96] = 1536 bytes per
#     duplicated op, Out outs[17]); their counters bound every read of them.
#     rtvInfo/uavInfo/dsvInfo ARE still zeroed and must stay so - the branch not
#     taken never fills its array and the loop that builds outs reads both.
#
# CONSIDERED AND DELIBERATELY NOT DONE
#
#   - Caching SurfState. It is the hottest uncached lookup in stereo_dup.cpp, a
#     GetPrivateData per target and per texture of every draw. A frame-scoped
#     table was written and taken back out: state_put is reachable from the
#     CopyResource / OMSetRenderTargets detours, which are not guaranteed to be
#     the Present thread, and a stale hit there does not lose time - it makes
#     the wrong duplication decision, which is visible. It also buys CPU on a
#     thread that is parked in a kernel wait 67-79% of every frame. The reason
#     is written above state_get. Revisit only if this ever becomes CPU-bound.
#   - Budgeting the twin re-sync burst. The replay shows re-syncs are a
#     transient (57 on frame 0, then 11, 1, 0), not a steady cost, though one
#     live 10 s window copied 1673 MB at a scene change. A twin must be in step
#     before eye 1 reads it or TEST 181's missing right-eye shadows come back,
#     so deferring fills is not worth it for a transient.
#
# WHAT THIS WILL AND WILL NOT DO
#
# It will not clear the late frames. 21.0 ms against an 11.1 ms period is 1.89
# periods; about a third of frames miss, and that only resolves if the frame
# drops under 11.1 ms (unreachable from 29.86 ms of GPU work without a quality
# trade) or if frames are held to a period boundary. Expect the SPIKES to
# shrink, not the baseline.
#
# HOW TO TEST - one battle, ~4 minutes:
#   1. AFR ~20 s, AFW ~20 s. Both must feel exactly as before. If not, stop.
#   2. Native stereo ~2 minutes. Close one eye then the other: shadows in both,
#      no flat or flickering right eye, no black hair flicker (TESTs 193/194).
#
# THE LOG LINES:
#   "Stereo:"       view-dependent % and refused must MATCH the pre-change run.
#                   Anything else means a rule change slipped in.
#   "Stereo cost:"  deciding should fall from 2.15 ms; constant-buffer table
#                   full must stay 0.
#   "GPU by pass"   the ranking must be unchanged - this test touches no GPU
#                   work, so if it moved, something is broken.
#   "Display pacing" judge the MAXIMUM late count, not the mean.
#   "Frame map: capture requested"   exactly once.
#
# Roll back: stereo_profile_duty = 1.0 restores continuous profiling and
# stereo_perf = 0 turns the instrumentation off wholesale; the rest has no key
# and reverts with the binary. Previous build in
# E:\BL2VR\stable\pre-test197-20260917.
#
# RESULT: pending.
stereo_profile_duty = 0.1

# --- arm IK: shoulder, elbow, wrist ----------------------------------------
#
# Solves the ARM, not just the hand. Until now only the hand bones were posed,
# so the forearm and upper arm stayed wherever the animation left them and the
# arm ran from a shoulder doing one thing to a hand doing another. hide_body
# existed to delete that question rather than answer it.
#
# THE BONE CHAIN WAS NEVER THE PROBLEM IT LOOKED LIKE. Read as names this
# skeleton appears to have no elbow -- l_clavicle, l_upperarm_twist,
# l_upperarm_twist1, l_foretwist, l_foretwist1, l_hand, four of six reading as
# "twist" -- and the notes above concluded a two-bone solve had nowhere to put
# one. TaleWorlds.Core.HumanBone names the same bones by ROLE and
# MBAgentVisuals.GetRealBoneIndex maps role to index:
#
#   ShoulderL       = l_clavicle          clavicle, rotated only
#   UpperarmL       = l_upperarm_twist    the humerus     <- solved
#   UpperarmTwist1L = l_upperarm_twist1   skinning helper
#   ForearmL        = l_foretwist         THE ELBOW       <- solved
#   Forearm1L       = l_foretwist1        skinning helper
#   HandL           = l_hand              the wrist       <- pinned
#   ItemL           = l_finger0           weapon attach
#
# monsters.xml declaring off_hand_item_bone = l_finger0 is what pins the last
# row, and the six above follow by parent order. So it is an ordinary two-bone
# chain, and the bone orientation conventions are READ from the rest pose
# rather than guessed -- the other stated reason for deferring this.
#
# The solve runs in entitial space (the agent's own frame), where the body axes
# are constants rather than something derived from the camera. That is why the
# elbow cannot drift as you look around: its frame of reference never touches
# the view.
#
# WHAT IS AND IS NOT DONE. The geometry, the anatomical rules and the time
# smoothing are in. Not yet: the swivel fitted to your own arm, the forearm
# twist distribution, and the clavicle. Expect the elbow to be in a defensible
# place everywhere and a natural one in the poses the rules happen to cover.
arm_ik = 1

# Your shoulder-to-wrist length in metres. 0 uses the avatar's own rest lengths,
# which is right unless your arms differ a lot from the character's. Values
# outside 0.45..0.85 are ignored rather than obeyed -- a typo must not shrink
# the arm. Getting this right mostly stops the hand pin having to stretch the
# forearm at full reach.
arm_length_m = 0

# Manual elbow swivel trim, degrees, on top of the rules. This is also the
# measuring tool for the next stage: set it by hand at each of six poses -- arm
# down, forward at chest, forward at face, out to the side, across the body,
# overhead -- write down the value that looks right at each, and those six
# numbers are the fit. Not yet applied; the key exists so the sweep can be done
# in one session.
arm_ik_pole = 0

# How hard the elbow swings outward when your hand crosses your own midline.
# 0 disables that one rule and leaves the rest.
arm_ik_swing_gain = 1.0

# How quickly the elbow re-poses. The direction is already continuous, so this
# is not covering a jump -- it is for the speed of an honest one: moving a hand
# across your body swings the elbow through a large arc correctly, and doing it
# in one frame reads as a snap.
arm_ik_smooth_ms = 80
arm_ik_rate_cap = 500

# Logs shoulder, elbow, target and reach per side, a few times a second.
arm_ik_debug = 0

# THE SEAM PROBE. Measures whether our bone writes survive, and reports once.
# It writes nothing of its own -- it watches the writes the hand posing already
# makes -- so it cannot disturb what it measures.
#
# It asks two questions, because the obvious one is not useful. "Write a pose,
# read it back next frame, report the difference" answers nothing here: the
# animation is SUPPOSED to repose every bone every frame, so a large difference
# is the system working. Instead:
#
#   1. Did the write land? Same frame, after the entitial frames are recomputed,
#      does the bone hold what we asked for? Near zero means this seam is sound.
#      Large means the parent-space walk or a scaled bone frame is wrong -- not a
#      race, and not fixed by moving the seam.
#   2. Is the bone reposed between frames? If it still holds our value at the top
#      of the next frame, writes ACCUMULATE, and anything written incrementally
#      winds up over minutes. That decides how the twist helpers must be written.
#
# Needs motion_hands = 1 to run at all, since it watches the hand posing.
arm_seam_probe = 1
arm_seam_probe_frames = 360

# --- mounted ---------------------------------------------------------------
# Whether hands and arms are posed while you are on a horse. OFF.
#
# A mounted rider sits at GROUND level as far as the agent is concerned; the
# riding animation is what lifts the body into the saddle. That is the same fact
# the log reports as the old eye point sitting "1.01 m inside the horse".
#
# Posing bones runs UpdateEntitialFramesFromLocalFrames, which rebuilds every
# entitial frame from the local ones - and throws that lift away. The body then
# collapses onto the ground inside the horse while the camera, which comes from
# a different path entirely, stays correctly on the saddle.
#
# Mounted is its own phase and none of the hand work is validated against it.
# Set to 1 to pose anyway and see the collapse for yourself.
motion_hands_mounted = 0

# --- TEST 206: is the mounted collapse real, and which of two causes is it? ---
#
# The block above states the collapse as fact. It is not one. Grepping both
# journals for a TEST or a RESULT against motion_hands_mounted returns nothing:
# the guard in VrWeaponHands was written from reasoning about
# UpdateEntitialFramesFromLocalFrames, has been in place since before the arm IK
# existed, and nobody ever set the key to 1 and looked.
#
# It also has a rival with the opposite fix. The hands convert their world-space
# target into the skeleton's space through entity.GetGlobalFrame(). The engine's
# own first-person camera - the one that is already mount-correct, and the reason
# the head sits on the saddle while the body may not - composes the head bone
# through AgentVisuals.GetFrame() instead:
#
#     head   = agent.GetBoneEntitialFrame(HeadLookDirectionBoneIndex, true)
#     origin = AgentVisuals.GetFrame().TransformToParentDouble(head.origin)
#
# Two different calls on two different objects. Nothing says they agree for a
# rider. If they differ by the saddle height then every mounted hand target is
# wrong by exactly that, the rebuild is innocent, and the fix is one line.
#
# So: measure first. mounted_probe prints one line a second while you are on a
# horse and writes no bone. It reports
#
#   - the gap between entity.GetGlobalFrame() and visuals.GetFrame()   <- cause 1
#   - the root and head bone entitial z BEFORE and AFTER calling
#     UpdateEntitialFramesFromLocalFrames with nothing written          <- cause 2
#   - the anchor and a controller in world z, to confirm the hand's world pose
#     is already saddle-correct and the fault is below it
#
# The second one is the experiment the guard was built on and never ran. It does
# call the rebuild for real, which is why this is off by default.
#
# HOW TO READ IT
#   frames differ by ~the saddle height   -> cause 1, fix agentGlobal in Drive
#   root/head z drops across the rebuild  -> cause 2, put the lift back by hand
#   neither, and the body still collapses -> both theories dead, look upstream
#   neither, and nothing collapses        -> the guard was free to remove
#
# Run with arm_ik_debug = 1 as well, so the arm-align trace is in the same log.
#
# RESULT: cause 2, and cause 1 is dead. Twenty samples on a horse, all agreeing.
#
#   entity.GetGlobalFrame (613.60,882.54,15.48)
#   visuals.GetFrame      (613.60,882.54,15.48)   differ by 0.000 m
#
# So the two routes into the skeleton's space are the SAME frame. The conversion
# the hands do was never the problem, and swapping it would have been a fix to
# nothing. Both sit at the horse's ground height (agent z 15.213 = mount z).
#
# The rebuild, with nothing written at all:
#
#   root z 1.800 -> 0.915     head bone z 2.449 -> 1.564
#
# The body really does drop, and it drops by 0.885 m of pure height. Two things
# in those numbers say what kind of drop it is:
#
#   - root and head fall by the IDENTICAL amount in every one of the twenty
#     samples (0.885/0.885, 0.879/0.879, 1.128/1.128 ...). A pose being mangled
#     would not do that. One rigid translation of the whole skeleton would.
#   - the AFTER value is 0.915 every single frame while the BEFORE value breathes
#     between 1.78 and 2.04 with the animation. 0.915 is the root's static local
#     frame; the breathing number is the engine placing the rider per frame.
#
# So the engine seats a rider by moving the ROOT bone, and that placement is not
# in a local frame. UpdateEntitialFramesFromLocalFrames rebuilds the root from
# its rest height and the rider drops onto the horse's ground position - which is
# exactly "the body is stuck on the ground inside the horse while the camera is
# on the saddle", because the camera comes from the engine's own first-person
# point and never touches the skeleton.
#
# THE FIX. Because the lift is rigid and lives on the root, putting the root back
# puts everything back: every other bone composes down from it. The root is
# parentless, so its local frame IS its entitial frame, and the restore is one
# write before the rebuild rather than a second rebuild after it. See
# root_lift_restore below. Not gated on being mounted - it is a no-op on foot,
# where the two values already agree.
#
# WORTH A LOOK LATER, NOT ACTED ON HERE: the anchor sat at z 16.75 while the head
# bone before the rebuild was at 15.21 + 2.449 = 17.66. The engine's own
# first-person camera therefore matches the COLLAPSED head height, not the placed
# one, about 0.9 m low. The head reads correct in the headset, so this is not
# being touched on the strength of a log line - but if the view looks low once
# the body is visibly in the saddle, that number is where to start.
mounted_probe = 0

# CONFIRMED IN GAME, 2026-09-19. With root_lift_restore = 1 and
# motion_hands_mounted = 1: mounted is stable, the body and hands both sit in the
# saddle, and the hands move with the controllers. No mounted special case is
# needed any more. The recentre-on-mount that was sketched for this was NOT
# added - nothing asked for it once the rider was in the right place.
# Whether to put the engine's own root-bone placement back before rebuilding the
# entitial frames. This is the TEST 206 fix. Set to 0 to reproduce the collapse.
root_lift_restore = 1

# TEST 206 found the real cause and root_lift_restore fixes it, so the rider is
# posed like anyone else now.
motion_hands_mounted = 1
