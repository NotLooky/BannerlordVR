#
# The in-game VR panel writes this file as well, so a mode picked in the panel
# can silently become the last word over anything written here. That is the most
# likely cause. Check "Render mode X -> Y" in the log when in doubt.

# =============================================================================
# TEST 78 - THE LATENCY IS THE PERFORMANCE, AND THE SCAN WAS BURNING BOTH
# =============================================================================
#
# Reported: "the 6dof problem is the same problem as head movement camera
# latency - the worse the fps, the worse the latency or resistance."
#
# That is correct and it reframes the last several tests. The head-to-photon path
# runs at the FRAME RATE. Anything eating CPU comes back as lag and as
# resistance, so a performance problem and a tracking-feel problem are the same
# problem seen from two ends - and every millisecond returned is returned to
# both. It also explains why the pose filters and lead values only ever moved the
# feel a little: they were tuning the correction while the thing being corrected
# for got worse.
#
# MEASURED: 60 fps against a 90 Hz headset, and
#
#     381,308 constant buffer uploads scanned per 5 s  ->  0.0 view/frame
#
# ~76,000 buffer scans a second, each walked at 16-byte granularity doing matrix
# tests, patching NOTHING - because vp_patch = 0 since TEST 70. The scan has been
# pure overhead for every test since, and the lane census added to it differenced
# up to six 64 KB buffers per frame on top.
#
# WHY IT COULD NOT SIMPLY BE SWITCHED OFF, which is the trap this file already
# documented once: submitted_fov reads the frustum this scan measures, and the
# fallback is the COMPUTED frustum, which is not what rgl rendered. That is the
# original "the view resists my head" at a measured gain of 0.617. Turning the
# scan off to gain frames would have paid for them in exactly the symptom being
# chased.
#
# SO IT MEASURES ONCE AND STANDS DOWN. The frustum is a constant - 123.0 x 106.1
# on every report of every run. After vp_measure_settle consecutive agreements
# the per-upload scan stops and the stored tangents go on serving xrEndFrame
# unchanged. Writes are unaffected: with vp_patch = 1 the scan keeps running,
# because then it has a job beyond measuring.
#
#     vp_measure_settle = 2000    agreements before standing down; 0 disables
#     vp_census = 0               the lane census, off - it answered its question
#
# Watch for "VP scan STOOD DOWN". If it never appears, nothing was saved.
#
# THE REMAINING LEVERS, in order of size: render_scale (1.00 now; 0.85 is ~72% of
# the pixels), then shadow quality - currently max, and the cascades are drawn
# every frame at 1536x1536 each, which the pass census measured directly.

# =============================================================================
# TEST 79 - AFR + DLSS: shimmer and ghosting on characters
# =============================================================================
#
# Reported: with AFR the shadows are stable, but characters and the army shimmer
# and ghost intensely - and ONLY with DLSS.
#
# The "only with DLSS" is the whole diagnosis, and VrAfrRenderer already carries
# it in full. AFR alternates the engine's camera 65 mm sideways EVERY FRAME.
# DLSS accumulates a history and reprojects it with motion vectors that describe
# object and camera motion within ONE eye; nothing in them says the previous
# image was taken from a viewpoint 65 mm to the side. So the accumulator blends
# two viewpoints, and it does it worst where the mismatch is largest - near,
# thin, high-contrast geometry against a distant background. Characters, weapons
# and reins are exactly that.
#
# It also explains the per-eye asymmetry noted there: the alternation has a
# period of two frames, so each eye's history is always built on the OTHER eye's
# frame - a systematic left/right difference rather than a wash.
#
# THE FIX IS THE ONE THE REFERENCE MOD USES, and it was already written down in
# that note. REFramework's m_fix_upscalers_wobbling:
#
#     oldViewMatrix[eye] = is_fix_dlss() ? d.old_view_matrix[eye]
#                                        : d.old_view_matrix[other_eye];
#
# Feed the upscaler the SAME eye's previous view matrix. vp_publish now keeps a
# PER-EYE history, so the motion-vector slot gets a matrix two frames old from
# this side instead of one frame old from the other. The upscaler is then
# blending two images of one viewpoint, which is the case its history was
# designed for.
#
#   vp_prev_same_eye = 1    per-eye history (default)
#                      0    the old immediate-previous behaviour
#
# Requires vp_match_prev = 1, which is what writes the slot at all. A no-op under
# AFW and drawstereo, which pin the eye and never alternate - which is precisely
# why AFW never showed this.
#
# AND THE MODE PAIR CAME APART A SECOND TIME: stereo_mode = afr was in force with
# afw = 1 left over. The VR panel writes this file too, so a mode picked there
# silently becomes the last word. Pinned to afr/0. Twice in one session is enough
# to say the two keys should not be independent at all.

# =============================================================================
# TEST 80 - the shimmer that survived TEST 79, and why it kept only the
#           characters
# =============================================================================
#
# Reported, with TEST 79's fix live and the DLL built from it: "AFR with DLSS has
# very annoying shimmering around only characters, not objects."
#
# That is not the same report as TEST 79. TEST 79 was "characters AND the army
# shimmer and ghost intensely". The world has gone quiet and the characters have
# not, and the narrowing is the diagnosis - a fix that reached one consumer and
# not the other, rather than a fix that did not work.
#
# WHAT TEST 79 ACTUALLY CHANGED, AND WHAT IT DID NOT REACH
#
# vp_prev_same_eye governs Published::prev, which feeds the main-view previous
# slot at offsets 240/304. It does not feed pass three.
#
# The precomposed reprojection matrix at cb 1760 offset 752 - the one this file
# already describes as "the one the sky, sun, cloud, hair, particles and
# screen-space shadows carry their history with, and the one DLSS leans on" - is
# built from a SEPARATE history: g_reproj, staged per FRAME. And the note over
# ReprojPair argues for per-frame in as many words:
#
#     "Under AFR consecutive frames are different EYES, and that is correct
#      rather than a complication: the engine's history buffer holds whatever was
#      drawn last, so the matrix that reprojects it has to be built from whatever
#      was drawn last."
#
# Both notes are reasonable. On their own terms both are right - the engine's own
# history buffer really does hold the other eye, and an upscaler really does want
# one viewpoint. But they are in the same file, describing the same frame, to the
# same consumer, and they disagree. Since TEST 79 the engine has been handed two
# accounts of where the previous image was taken:
#
#     main-view slot (240/304)    "this eye, two frames ago"     no lateral offset
#     reprojection matrix (752)   "the other eye, one frame ago"  full 65 mm
#
# Nobody noticed because the two live 4,000 lines and one pass apart.
#
# WHY THAT SORTS GEOMETRY BY DISTANCE, WHICH IS THE WHOLE REPORT
#
# The disagreement is 65 mm in metres, and metres is the wrong unit - on screen
# it is a disparity, and disparity is not uniform:
#
#     disparity = b * f / z      b = 0.065 m,  f = (W/2) / tan(hfov/2)
#
# At the measured 3400 px eye and 123 deg frustum, f ~= 923 px, so the two
# accounts differ by about 60/z pixels:
#
#     hillside     200 m    0.3 px      invisible
#     terrain       50 m    1.2 px      invisible
#     building      20 m    3 px        barely
#     CHARACTER      3 m    20 px
#     reins/mount  1.5 m    40 px
#     weapon       0.6 m    100 px
#
# That is the reported split, quantitatively: the world is far enough away that
# the contradiction is sub-pixel and the upscaler cannot tell; characters are
# near enough that it is tens of pixels, and it lands exactly on their
# silhouettes - which is why the word in the report is "around". TEST 79 cleaned
# up everything whose disparity was already sub-pixel, which is everything the
# player calls an object, and left everything whose disparity is large, which is
# everything the player calls a character.
#
# THE FIX: THE TWO ARE NO LONGER ALLOWED TO DISAGREE
#
# g_reproj now also keeps a per-eye copy, filed at the frame boundary by the eye
# that drew it, and pass three takes the same eye's pair when vp_reproj_same_eye
# is on. The same eye's pair is two frames back rather than one, so the age gate
# opens by one generation - and when it is stale the per-frame pair is used and
# COUNTED, so a fallback cannot hide as a fix.
#
#     vp_reproj_same_eye = 1   pass three uses this eye's previous pair
#                        = 0   the previous frame's pair (the other eye)
#
# Its default is vp_prev_same_eye, so the two keys cannot silently come apart
# again. That is the same failure this file has now recorded three times -
# stereo_mode/afw twice, and this - and the answer is the same each time: keys
# that describe one decision should not be independent.
#
# WHICH WAY THEY SHOULD AGREE IS A MEASUREMENT, NOT AN ARGUMENT
#
# Setting both to "same eye" is the REFramework convention and the one to try
# first. But the ReprojPair note is not wrong about the engine's own history
# buffer, and if the sky, hair and screen-space shadows get worse while the
# characters get better, that is the trade appearing - then run
# vp_reproj_same_eye = 0 AND vp_prev_same_eye = 0, which is consistency the other
# way, and compare. Do not run them split; split is what this test was.
#
# WHAT TO READ, every ~5 s:
#
#     "VP reproj history: SAME eye, previous-camera accounts differed by X ..."
#
#   X near 0        nothing alternates - not AFR, or the engine is paused, and
#                   this whole test is a no-op. Check stereo_mode/afw first.
#   X grows with head speed
#                   that is the 65 mm baseline plus a frame of motion. It is the
#                   quantity that was being described two different ways.
#   "fell back ... N time(s)"
#                   should be a trickle. If it is most of the frames the per-eye
#                   pair is aging out and pass three is running on the per-frame
#                   pair regardless of the setting - the fix is not in force and
#                   the age gate is the thing to look at, not the convention.
#
# ONE LEVER THAT NEEDS NO BUILD, AND IT IS THE BIGGEST ONE LEFT
#
# engine_config.txt currently reads antialiasing_technique = 0 - DLSS was OFF
# when the last session exited - with dlss_technique = 3. When it goes back on,
# note that the amount of shimmer a temporal upscaler produces at a disocclusion
# is set by how much of the frame it has to invent. DLSS Performance renders a
# quarter of the pixels and leans hardest on the history that AFR is poisoning;
# Quality renders 44%, DLAA renders all of them and leans on it least. This file
# already said "Quality, not Performance" once (TEST 76) and it is worth saying
# again: if the shimmer is still there after this build, raising the preset is
# the cheapest remaining move and it attacks the same mechanism from the other
# end. It costs frames, and frames are head-to-photon latency here (TEST 78), so
# it is a trade rather than a free win.
#
# RESULT: REFUTED - see TEST 81. Universal ghosting; the cadence, not the eye.
vp_reproj_same_eye = 1

# =============================================================================
# TEST 81 - TEST 80 refuted: the eye was negotiable, the CADENCE was not
# =============================================================================
#
# Reported: "now everything has trails or ghosting" - not characters, everything -
# and "quality is less than performance dlss".
#
# TEST 80 is refuted, and the way it failed says exactly what was wrong with it.
#
# WHAT WENT WRONG, AND IT IS VISIBLE IN THE WORD "EVERYTHING"
#
# Under AFR the same eye only comes round every OTHER frame. So "the same eye's
# previous pair" is not one change, it is two, welded together:
#
#     the eye      other -> same        (what TEST 80 wanted)
#     the cadence  1 frame -> 2 frames  (what it did not notice it was buying)
#
# The reprojection matrix at offset 752 reprojects the engine's OWN history
# buffer. That buffer is one frame old - always, whatever eye drew it. Handing it
# a matrix built across two frames told it the camera had moved twice as far as it
# actually had since the image it was about to reproject, so every pixel was
# warped to roughly double its true displacement. That is a uniform error over the
# whole frame, it does not care how far away anything is, and it lands on
# everything the history buffer touches: sky, sun, cloud, hair, particles,
# screen-space shadows, and the upscaler.
#
# Hence "everything", where TEST 79's artefact was "only characters". The two
# reports have different shapes because they have different causes, and TEST 80
# added a second, larger one on top of the first instead of removing it.
#
# THE ReprojPair NOTE WAS RIGHT AND TEST 80 READ IT TOO QUICKLY
#
#     "the engine's history buffer holds whatever was drawn last, so the matrix
#      that reprojects it has to be built from whatever was drawn last."
#
# TEST 80 treated that as one of two reasonable-but-contradictory conventions.
# It is not a convention. The cadence of that matrix is FIXED by the age of the
# buffer it reprojects, and the buffer is one frame old. Only the eye was ever
# negotiable. Reverted:
#
#     vp_reproj_same_eye = 0
#
# The main-view slot keeps vp_prev_same_eye = 1, which is TEST 79 and which is
# still the state where the world is quiet. Back to characters-only shimmer,
# which is worse than nothing and better than this.
#
# WHAT TEST 80 GOT RIGHT AND IS WORTH KEEPING
#
# The disparity arithmetic still stands and still explains why TEST 79's fix
# sorted geometry by distance: 60/z px, sub-pixel on terrain, tens of pixels on a
# character. Nothing measured here contradicts it. What TEST 80 got wrong was the
# remedy, not the diagnosis - it could not remove the 65 mm without also doubling
# the cadence, and the cadence cost more.
#
# WHICH NAMES THE NEXT ATTEMPT - AND IT IS NOT A NEW MECHANISM, IT IS THE OTHER
# HALF OF THE PAIR.
#
# Work out what each matrix is actually pointing AT, and both answers come out
# the same way:
#
#   The reprojection matrix at 752 reprojects the ENGINE's history buffer. That
#   buffer holds the frame drawn at t-1, from the other eye, at the other eye's
#   position. So the previous camera that correctly locates its contents is the
#   OTHER eye at t-1 - which is vp_reproj_same_eye = 0, what it has always done
#   and what it is reverted to above. It was already right, and TEST 80's whole
#   premise - that the two slots contradicted each other and one had to give -
#   had the sign backwards: they contradicted because the OTHER one is wrong.
#
#   The main-view slot at 240/304 feeds the per-pixel motion vectors, and those
#   are consumed by an upscaler whose history is ALSO the frame drawn at t-1
#   from the other eye. By the identical argument the correct previous camera is
#   the other eye at t-1 - vp_prev_same_eye = 0.
#
# Which is the one combination nobody has run. TEST 79 changed the main-view slot
# to same-eye and reported an improvement, but it was never A/B'd against a clean
# baseline in one sitting, and TEST 80 shows how easily a change that sounds
# right buys something invisible alongside it. So the next test is ONE line and
# no build:
#
#     vp_prev_same_eye = 0        (with vp_reproj_same_eye = 0, already set)
#
# Both slots then describe the same transition - the other eye, one frame ago -
# which is where the history genuinely came from. If TEST 79's improvement was
# real this will be worse and the question is settled; if it is better, TEST 79
# was reading an improvement that was not there and the near-field artefact was
# the uncorrected 65 mm all along.
#
# WHAT REMAINS IF BOTH ARE THE SAME: with the warp correct, what is left at a
# character's silhouette is DISOCCLUSION - pixels visible from this eye that do
# not exist anywhere in an image taken from 65 mm away. No previous-view matrix
# can conjure them, because the information is genuinely absent. An upscaler
# meets that by rejecting history and rebuilding from the current frame, and the
# rebuild flickering frame to frame IS the shimmer.
#
# MEASURED, AND IT REINSTATES THE ADVICE AT THE END OF TEST 80: DLSS Quality
# ghosts LESS than DLSS Performance here.
#
# (Recorded wrong once - read as "Quality is worse" - and a whole mechanism was
# built on the inversion before the user corrected it. The reading was ambiguous
# and was not checked. Ask.)
#
# That is the ordinary direction and it says the mechanism is the sampling rate
# after all. Performance renders a quarter of the output pixels, so each one
# carries about a quarter of a real sample and the rest of its value comes from
# the history - which under AFR is the other eye. Quality renders 44% and leans
# on that history correspondingly less. The wrong-eye contribution is weighted by
# how much the upscaler has to invent, so it falls monotonically as the preset
# rises:
#
#     Ultra Performance  >  Performance  >  Balanced  >  Quality  >  DLAA
#     (most ghosting)                                              (least)
#
# DLAA is the end of that ladder - native resolution, no upscaling at all, so
# nothing is invented and the history's weight is at its floor. It still
# accumulates temporally, so it cannot reach zero, but it is the cheapest single
# move left and it keeps everything else working. It costs frames, and frames are
# head-to-photon latency here (TEST 78), so it is a trade rather than a free win -
# but it is a trade the run has already measured the direction of.
#
# TRY IN THIS ORDER, and one per run:
#
#   1. vp_prev_same_eye = 0     one line, no build, no frame cost. Settles
#                               whether TEST 79's improvement was ever real.
#   2. DLSS Quality -> DLAA     no build. Costs frames, reduces every symptom
#                               here by the same mechanism.
#   3. A SPATIAL antialiaser    FXAA/SMAA/MSAA have no history at all and cannot
#                               show this artefact in any mode. Every temporal
#                               one can - DLSS, DLAA, TAA, FSR2, XeSS.
#
# The old objection to step 3 was TEST 53: shadows crawl without DLSS. That
# objection is retired - the crawl was traced to vp_patch displacing the scene
# tens of metres from the camera the engine had already fitted its cascades to,
# and afr_camera_mode = engine with vp_patch = 0 measured them stable. Both are
# reachable from here: afr_camera_mode already defaults to engine, vp_measure = 1
# is already set so the frustum stays measured with the writes off, and vp_patch
# = 0 is one line. That combination has never been run WITH a spatial
# antialiaser, and it is the one configuration in which neither fault has a
# mechanism left.
#
# And if the ladder runs out, the cause is not reachable by describing the camera
# differently: stop the camera alternating at all (afw = 1), which VrAfrRenderer
# has argued from the beginning and which is the only thing that makes the
# upscaler's history the RIGHT EYE by construction.
#
# RESULT: TEST 80 refuted - universal ghosting, worse than the artefact it
#         targeted. Reverted here. The Quality/Performance reading that first
#         appeared here was inverted; corrected above, and it reinstates the
#         preset as a real lever rather than killing it.
vp_reproj_same_eye = 0

# =============================================================================
# TEST 82 - the mode was half-engaged: engine-camera AND vp_patch at once
# =============================================================================
#
# Reported, and it separates two symptoms that had been collapsed into one:
#
#   "characters are not stable, they shake and move with the SLIGHTEST head
#    movement, but when moving my head normally they only ghost and trail and
#    shimmer. With DLAA the ghosting, trailing and shimmer are minimal."
#
# So DLAA settled the upscaler half - which confirms TEST 81's corrected reading,
# the artefact scales with how much the upscaler has to invent. What is left is
# NOT an upscaler artefact at all. A thing that jumps at small head movement and
# smears at large is geometric, and it was being hidden under the ghosting.
#
# MEASURED, from the buffer anatomy, and it is the number this file keeps failing
# to print before theorising:
#
#     offset 240  d(ref) 0.00 m  PATCH  moved 13.876 m vs eye 0.396 m
#     offset 304  d(ref) 0.00 m  PATCH  moved 13.876 m vs eye 0.396 m
#
# Both are WORLD space and both are over the same interval - VrVpPatch publishes
# Data[12..14] as EyeFrame(eye).origin, which is anchor.TransformToParent(...),
# and Data[16..18] as combat.Frame.origin. So over one interval the engine's
# camera travelled 13.876 m while the eye we render from travelled 0.396 m. A
# 35:1 divergence between two cameras that are supposed to be the same camera.
#
# THE CAUSE IS A MODE THAT IS ONLY HALF ON
#
#     mode = engine-camera            (line 1173, and it IS in force)
#
# VrConfig's EngineCameraMode bundle supplies:
#
#     afr_camera_mode = engine    move CombatCamera itself
#     afr_engine_fov  = 1
#     vp_patch        = 0         "nothing left downstream to fix"
#     engine_aim      = 0
#     symmetric_fov   = 1
#
# but Lookup checks the FILE before the mode, and the file says
#
#     vp_patch = 0     (line 1334, TEST 70)
#     vp_patch = 1     (line 4085, "to reach pass three")  <- last one wins
#
# so the mode's own vp_patch = 0 is overridden while everything else in the
# bundle stays on. The head pose is therefore applied TWICE - once by moving
# CombatCamera onto the eye, and again by substituting the eye into the matrices
# downstream. VrAfrRenderer says so in as many words at the top of CameraMode:
#
#     "With the view-projection patcher running, the head pose is applied
#      downstream of the camera entirely, and moving the camera as well would
#      apply it twice - once here and once in the matrix - while also feeding
#      VrCameraDriver's anchor its own output. Hands off is the correct mode."
#
# And the guard that exists to prevent exactly this is bypassed: the fallback is
#
#     string fallback = VrVpPatch.Substituting ? "off" : "engine";
#
# which would have returned "off" while substituting - but it is only reached
# when Lookup FAILS, and Lookup succeeds out of the mode bundle. A safety default
# cannot fire when a mode has already answered the question.
#
# WHY IT LANDS ON CHARACTERS AND NOT THE WORLD - stated as inference, not as
# measurement, because it has not been instrumented:
#
# The RENDER comes out of the patched matrix, so the world is drawn from the eye
# and looks stable. What is NOT patched is everything the engine decides with its
# own camera BEFORE any buffer is uploaded: culling, LOD selection, animation
# LOD, impostor swaps, and the agent enqueue this file has already studied
# ("the visibility pass does not GATE the drawing of agents, it ENQUEUES them").
# Those are per-object step functions keyed on distance to the engine camera, and
# characters are the objects with the most aggressive ones. Terrain and buildings
# have coarse LOD and do not visibly step. So a camera that jumps with the head
# makes CHARACTERS flip state while the world holds still - which is the report.
#
# This is the same structural point the mode's own header already makes:
# "Culling, sky, shadows and LOD stop being separate problems because none of
# them was ever a separate problem - they were all the same camera being wrong."
#
# THE CHANGE, AND IT IS ONE LINE: stop overriding the mode.
#
# vp_patch = 0 lets the bundle stand as designed. vp_measure = 1 is already set,
# so TEST 78's stand-down still measures the true frustum for submitted_fov and
# nothing is lost there - "vp_patch = 0 with vp_measure = 1 turns off EVERY write
# while keeping every measurement" (TEST 70). afr_camera_mode resolves to engine
# from both the bundle and the fallback, so the camera is still driven to the
# head and stereo is unaffected.
#
# ALREADY MEASURED ONCE, which is why this is not a guess:
#
#     "vp_patch = 0 with afr_camera_mode = engine: SHADOWS AND SKY STABLE,
#      confirmed"                                                    (TEST 70)
#
# WHAT IT COSTS, recorded honestly: TEST 70 also logged "sky and shadows STABLE,
# floating BACK - both halves in one run". The floating is the camera drive
# landing a frame late, which is a TIMING problem (pose_lead_frames,
# frame_latency) and not a displacement - timing levers cannot desync anything,
# because they move nothing relative to anything else. That is the next thing to
# tune if it returns, and it is tuned AFTER this is confirmed, not at the same
# time.
#
# Pass three stops running, so the reprojection matrix is no longer substituted
# and vp_prev_same_eye / vp_reproj_same_eye become inert. TEST 81's proposed
# vp_prev_same_eye = 0 run is therefore SUPERSEDED - do not run it from here; it
# would be testing a write that no longer happens.
#
# FOURTH TIME two settings describing one decision have been left free to
# disagree - stereo_mode/afw twice, the two prev-matrix slots in TEST 80, and now
# a mode bundle against an explicit override. The pattern is worth naming: this
# file is append-only and the LAST assignment wins, so any key a mode also sets
# is one careless append away from silently leaving that mode half on.
#
# RESULT: CONFIRMED - characters stable. Floating returned; see TEST 83.
vp_patch = 0

# =============================================================================
# TEST 83 - TEST 82 confirmed; the floating is the other half of the same trade
# =============================================================================
#
# RESULT OF TEST 82: "the characters are stable" - confirmed. vp_patch = 0 with
# mode = engine-camera fixes the character instability. That half stands.
#
# AND THE FLOATING CAME BACK WITH IT, exactly as TEST 70 recorded it would:
# "vp_patch = 0: sky and shadows STABLE, floating BACK. Both halves in one run."
# Reported now as "camera head movement is not playable, it's floaty".
#
# --- A CORRECTION TO TEST 82, because it got the mechanism partly wrong -------
#
# TEST 82 said the mode had been left "half on" by accident and that the head
# pose was therefore being applied TWICE. The first half is literally true -
# vp_patch = 1 did override the bundle's vp_patch = 0 - but the conclusion was
# wrong on two counts, and both were checkable before it was written:
#
#   1. It was not an accident. TEST 71 deliberately chose "afr_camera_mode =
#      engine WITH vp_patch = 1" and argued the twice objection does not hold,
#      because build_replacement forms D from the engine camera RECOVERED FROM
#      THE MATRIX, so with the camera already at the head D collapses to the
#      residual rather than to a second copy of the head pose.
#
#   2. Both runs logged "AFR camera mode: Engine" - the vp_patch = 1 run at
#      00:19:23 and the vp_patch = 0 run at 00:30:47. The camera was driven in
#      BOTH. So the difference between them was never the camera mode, and TEST
#      82's story about a bypassed fallback, while true of the code, was not the
#      thing that changed.
#
# What is measured and still unexplained: the anatomy line read
# "moved 13.876 m vs eye 0.396 m" WHILE the camera mode was Engine. If the drive
# were putting CombatCamera on the eye, those two world-space positions could not
# diverge 35:1. So either the engine overwrites the camera after the drive
# writes it, or the anchor that builds EyeWorld is not following the player.
# That is a real open question and it is the thing to instrument if the
# character instability ever returns. It does not need answering to proceed,
# because vp_patch = 0 works regardless of why.
#
# --- THE FLOATING, AND THE MOD ALREADY NAMES THIS EXACT SYMPTOM --------------
#
# From the note over locate_views_ahead in xr_context.cpp:
#
#     "The compositor carries the difference by warping, which is why it reads
#      as FLOATY rather than as judder: right shape, wrong place, moved there by
#      a reprojection instead of being drawn there."
#
# The quantity is pose_lead_frames, and the mechanism is a pipeline offset:
#
#     SUBMISSION wants the pose for THIS frame's display time. It gets it.
#     THE ENGINE  wants the pose for the display time of the frame it is ABOUT
#                 to render, which is later. It is served by publishing the
#                 located pose one period ahead.
#
# WHY IT WAS HIDDEN UNTIL NOW, which is the part worth writing down: with
# vp_patch = 1 the engine's matrices were re-latched at constant-buffer upload,
# moments before the GPU read them. That late latch supplied a FRESH pose no
# matter how stale the published one was, so pose_lead_frames was only ever
# serving the fallback. Turning the patch off removes the late latch, and the
# published pose becomes the only pose there is - so a lead that was always
# slightly short is now the whole story. The two settings are coupled, and this
# is the fifth time in this file that two settings turned out to describe one
# decision.
#
# Bannerlord's thread split makes it one period short. xrLocateViews runs in
# Present on the RENDER thread; the camera is built in OnFrameTick on the GAME
# thread, which consumes that pose on the following tick. So the pose reaches
# the engine one period later than the lead assumes.
#
#     pose_lead_frames = 2
#
# 2 is the clamp ceiling in pose_lead_frames() - the code refuses more, on the
# grounds that runtimes predict comfortably over one frame and unreliably over
# several. So this is the last notch available on this lever, not a first guess.
#
# WHAT TO WATCH, and the two failure modes are opposite and unmistakable:
#
#   still floaty / lagging      the lead is not the whole offset. Do NOT reach
#                               for more; 2 is the ceiling. Look at
#                               frame_latency (already 1) and at the AFR held
#                               eye, which is a frame old by construction -
#                               "AFR held-image age: L max 16 ms, R max 16 ms".
#   overshoots and snaps back   over-prediction: the world leads the head and is
#                               corrected. That is worse than floating and the
#                               answer is pose_lead_frames = 1.5, then 1.
#
# NOT THE CAUSE, ruled out from this run's log rather than assumed:
#
#   pose age        0.0 ms mean, 0.0-11.1 ms worst through gameplay, in BOTH
#                   runs. The instrument does not separate them, so it is not
#                   the discriminator - the offset is in which moment the pose
#                   was located FOR, not in how old it is when submitted.
#   frame rate      90 frames/s dead steady on the Present heartbeat. Not the
#                   60-into-90 throttle TEST 78 measured.
#   submitted FOV   "Engine frustum 123.0 x 106.1 deg" still reported with
#                   vp_patch = 0, so vp_measure = 1 is keeping the measured
#                   frustum alive and this is NOT the computed-frustum fallback
#                   that reads as "the view resists my head" at gain 0.617.
#   pre_render_frame  already refuted at line 4222: RESULT 18 fps, a thread-split
#                   throttle. Leave it at 0. The equivalent for this engine is
#                   exactly what this test tunes.
#
# RESULT: REFUTED - see TEST 84. Still floaty at the clamp ceiling.
pose_lead_frames = 2

# TEST 83 RESULT: REFUTED - still floaty at the clamp ceiling. The lead is not
#         the offset, so the pipeline position of the pose is not what makes
#         vp_patch = 0 float. Reverted with it.
pose_lead_frames = 1

# =============================================================================
# TEST 84 - back to vp_patch = 1, and STOP GUESSING: measure D
# =============================================================================
#
# TEST 83 RESULT: REFUTED. pose_lead_frames = 2 is the clamp ceiling and the
# floating was unchanged, so the pose's pipeline position is not what makes
# vp_patch = 0 float. Reverted to 1.
#
# Requested: go back to the build with crisp head movement and shaking
# characters, and fix the shake without giving the head movement up. So:
#
#     vp_patch = 1        the late latch, and with it the crisp head
#     pose_lead_frames = 1
#
# --- TEST 82's HEADLINE NUMBER WAS A MISREAD, AND IT HAS TO COME OUT ---------
#
# TEST 82 built its whole mechanism on one anatomy line:
#
#     offset 240 ... PATCH | moved 13.876 m vs eye 0.396 m
#
# and called it a 35:1 divergence between the engine camera and the eye. It is
# not. Reading the same site across a whole mission:
#
#   00:30:47  d(ref) 12.10 m  97.1 x 65.0 deg  SKIP   moved -1.000 vs eye -1.000
#   00:30:49  d(ref)  0.00 m  123.0 x 106.1    PATCH  moved 12.441 vs eye  0.447
#   00:30:54  d(ref)  0.00 m  123.0 x 106.1    PATCH  moved  0.191 vs eye  0.189
#   00:30:59  d(ref)  0.02 m  123.0 x 106.1    PATCH  moved  0.151 vs eye  0.167
#   (next mission)              "                     moved  0.157 vs eye  0.159
#
# The first PATCH sample differences the VR camera against the FLAT camera the
# previous sample caught - 97.1 x 65.0 deg, 12.10 m away, mission start. That
# one-off transition is the 12-13 m. Every steady-state sample after it tracks
# the eye to within about a tenth of a metre: 0.191 vs 0.189, 0.157 vs 0.159.
#
# So the camera drive WORKS and D collapses, exactly as TEST 71 predicted. TEST
# 82's "the pose is applied twice" and "the mode is half on" are both withdrawn.
# The change it made was real and the characters did stabilise; the reason given
# for it was wrong.
#
# TWO MECHANISMS PROPOSED THIS SESSION, TWO WRONG, BOTH FROM UNCHECKED NUMBERS -
# TEST 80's cadence error and TEST 82's phantom divergence. The rule this file
# already wrote down after the shadow hunt was not followed:
#
#     measure the magnitude of a delta before theorising about which component
#     consumes it.
#
# The instrument for THIS delta exists, has existed for the whole investigation,
# and has never once been switched on. It even makes the distinction that was
# missed above - "a mean near zero with a large max is a transient and a large
# mean is the steady state":
#
#     VP substitution size: moves the scene X m / Y deg mean,
#                           X m / Y deg WORST, over N replacements.
#
# It is gated behind vp_census, which TEST 78 turned off for CPU. Turned back on
# for this run and this run only. The lane census that made it expensive is
# watching 0 buffers ("VP cascade lanes: watching 0 of 6 buffer slot(s)"), so the
# cost now is the per-replacement accumulator - about 65 a frame of float
# arithmetic, which is nothing.
#
#     vp_census = 1
#
# NO THIRD GUESSED FIX THIS RUN. The build is the one that was asked for; the
# only addition is the number that decides what the shake actually is.
#
# HOW TO READ IT, decided in advance so the answer cannot be fitted afterwards:
#
#   mean under ~2 cm / ~0.5 deg
#       D is the residual it was designed to be. The scene is NOT being
#       displaced meaningfully, so displacement cannot be flipping agent LOD or
#       culling, and the shake is not a geometry-placement problem at all. Next
#       suspect is the deferred lighting path: vp_patch_inverse = 1 replaces
#       ~3600 inverse matrices a frame, and inv(VP) is what a deferred pass uses
#       to rebuild world position from a depth buffer the engine rendered with
#       its OWN camera. Characters are lit in that pass - this log names it,
#       "duplicating it is what lights the second eye's characters". Test
#       vp_patch_inverse = 0 next, alone.
#
#   mean tens of cm or tens of deg
#       D is a whole head pose after all and TEST 82 was right for the wrong
#       reason. Then the fix is to shrink it rather than to switch the patch
#       off: the drift half of D is head motion between the camera being set and
#       the latch firing, and pose_lead_frames trades directly against it.
#
#   mean small, WORST large
#       a transient - most likely the mission-start jump above. Not the shake.
#       Look at what else fires at that cadence.
#
# RESULT: D IS METRES. See TEST 85 - it is a motion-vector fault, not placement.
vp_patch = 1
vp_census = 1

# =============================================================================
# TEST 85 - D MEASURED AT LAST, and the shake is a MOTION VECTOR fault
# =============================================================================
#
# TEST 84 RESULT: the census ran and printed the number this investigation has
# been arguing about since TEST 53. It is not the residual.
#
#   00:58:19  0.005 m / 0.01 deg mean | worst 0.081 m / 0.18 deg
#   00:58:33  1.322 m / 3.61 deg mean | worst 4.103 m /  9.28 deg
#   00:58:38  3.803 m / 8.09 deg mean | worst 4.150 m /  8.81 deg
#   00:58:43  2.199 m / 5.29 deg mean | worst 4.843 m / 12.07 deg
#   00:58:48  0.001 m / 0.00 deg mean | worst 0.174 m /  0.36 deg
#   ... and single windows as high as 42.066 m / 7.96 deg mean
#
# Continuous gameplay, not load or teardown. The mean is usually small and the
# WORST is metres and degrees in almost every window - which by this
# instrument's own reading guide is a TRANSIENT: D spikes to metres many times a
# second while sitting near zero in between.
#
# AND A SECOND CORRECTION TO TEST 82/84, which had this backwards twice:
#
# TEST 84 concluded "D collapses" from the anatomy line tracking - moved 0.191 m
# vs eye 0.189 m. That line compares HOW FAR EACH TRAVELLED over an interval,
# not how far apart they are. Two cameras metres apart travel identically while
# moving together, so the anatomy never contradicted a large D and was never
# evidence about D at all. Only the substitution-size line measures the
# separation, and it says metres.
#
# --- THE REPORT THAT NAMES THE MECHANISM ------------------------------------
#
#   "the shaking characters only happens with DLSS or DLAA ... only characters
#    and everything characters interact with, like chairs I can interact with"
#
# Two facts, and together they are decisive:
#
#   ONLY WITH A TEMPORAL UPSCALER. A thing that is invisible without DLSS/DLAA
#   and visible with it is not a geometry-placement fault. Placement errors show
#   up in every antialiasing mode. What only a temporal upscaler consumes is
#   MOTION VECTORS.
#
#   ONLY DYNAMIC ENTITIES. Characters and interactable props are the engine's
#   dynamic entities; terrain, buildings and scenery are not. That is exactly
#   the line between an object with a PER-OBJECT previous transform and an
#   object without one.
#
# So: static geometry's motion vectors are built from the per-view buffer's two
# main-view matrices, offsets 240 and 304 - and vp_patch rewrites BOTH, mapped
# to the right eye by vp_match_prev. Both ends move together, the difference is
# self-consistent, and static geometry reprojects correctly. That is why the
# world is stable and, with TESTs 79/81 in place, why it is now clean.
#
# A dynamic entity's previous clip position comes from its OWN cached previous
# transform, which this mod never sees and cannot patch. Its current position is
# built through the PATCHED camera and its previous position through the
# UNPATCHED one, so the difference - which IS its motion vector - carries D.
# D spikes to metres. Metre-scale errors in a motion vector tell the upscaler a
# character moved metres between frames, and it reprojects the history to match.
# That is the shake, it lands only on things with per-object history, and it
# cannot appear without an upscaler to consume the vectors.
#
# Every observation fits without remainder: temporal-AA-only, dynamic-only,
# proportional to head movement (D's drift term is head motion), absent at
# vp_patch = 0 (D is then identically zero), and unaffected by DLAA (DLAA still
# consumes motion vectors - it only stops upscaling, which is why it cut the
# ghosting and left this alone).
#
# --- THE THREE EXITS, AND ONLY ONE MEETS BOTH CONSTRAINTS -------------------
#
#   1. vp_patch = 0        D becomes zero, characters stable - MEASURED, TEST
#                          82. But it removes the late latch and the head
#                          movement floats. Rejected by the user, and
#                          pose_lead_frames could not recover it (TEST 83).
#
#   2. No temporal AA      Nothing consumes the poisoned vectors. Keeps
#                          vp_patch = 1 and the crisp head. Costs DLSS's
#                          upscaling and its antialiasing quality.
#
#   3. Shrink D            Partial at best. D is already near zero on average;
#                          it is the SPIKES that do the damage, and nothing here
#                          yet explains what makes it jump metres several times
#                          a second. Worth chasing later - it is also the shadow
#                          slide - but it is not a fix available today.
#
# Exit 2 is the only one that satisfies "stable characters AND crisp head", and
# it is the user's own observation turned into a setting. So:
#
#     engine_config.txt: antialiasing_technique = 5  ->  0
#
# 5 is DLSS/DLAA. 0 is what the file held before DLSS was turned on, so it is a
# known-good value. Any SPATIAL antialiaser is equally valid here - FXAA, SMAA,
# MSAA - and is the better choice if the aliasing is bad, because none of them
# reads a motion vector. Pick it in the video menu; the menu writes this file.
# Anything TEMPORAL - DLSS, DLAA, TAA, FSR2, XeSS - will bring the shake back,
# and that is now a prediction rather than a guess.
#
# vp_census back to 0: it answered its question, and TEST 78 measured that
# leaving instruments on the patch path costs frames, which here is latency.
#
# WHAT THIS COSTS AND WHAT TO WATCH: no upscaling means the full eye is
# rendered, so frames will drop; render_scale is the lever if they drop too far.
# TEST 53 says shadows crawl without DLSS - if they do, that is D's spikes
# showing through without temporal smearing to hide them, which is exit 3 and is
# the next thing to instrument.
#
# RESULT: WITHDRAWN before running - see TEST 86. Shadows follow the head worse without DLSS.
vp_census = 0

# =============================================================================
# TEST 86 - cb 128: a per-draw buffer, patched on a coin flip
# =============================================================================
#
# TEST 85 is WITHDRAWN BEFORE RUNNING. Turning the temporal antialiaser off
# trades the character shake for dynamic shadows and effects following the head,
# "but worse" - which is TEST 53's table exactly ("dynamic shadows are stable in
# AFR WITH DLSS and crawl in every other combination"). DLSS is load-bearing
# here and exit 2 is closed. antialiasing_technique restored to 5.
#
# That leaves exit 3 - shrink D - which was always the right one anyway, because
# D is the common cause of all three symptoms: the character shake (it poisons
# per-object motion vectors), the shadow slide, and the effects following the
# head. Fix D and all three go, with the late latch and the crisp head kept.
#
# --- WHAT THE PATCH IS ACTUALLY WRITING, which nobody had listed -------------
#
#     VP patch sites (3 distinct):
#         cb   1760  offset 240   hits  42   (previous-frame 0)
#         cb   1760  offset 304   hits  42   (previous-frame 42)
#         cb    128  offset   0   hits 210   (previous-frame 0)
#
# The main view is written 42 times a window. A 128-BYTE BUFFER IS WRITTEN 210
# TIMES - five times as often, and it is 71% of every replacement the census
# averaged D over. It has never been identified anywhere in this file.
#
# 128 bytes is two matrices. A buffer that small, uploaded that often, is a
# PER-DRAW buffer, not a per-view one.
#
# And it is not carrying one camera. The rejection table catches the same site
# failing the test in the same run, with two different cameras:
#
#     cb 128 offset 0   hits  80   best dot 0.9708   nearest camera 13.55 m
#     cb 128 offset 0   hits 122   best dot 0.9837   nearest camera  0.06 m
#
# So across ~412 uploads a window, 210 pass the tolerance and get our eye
# written into them, and 202 fail and keep the engine's. Which side an upload
# lands on is decided by dirTol = 0.990 - about 8 degrees - against a camera
# that sits 10 degrees off. That is a THRESHOLD the head is sitting on top of.
#
# THIS IS A STEP FUNCTION DRIVEN BY HEAD ANGLE, and it is the shape of the
# reported symptom rather than a size argument about D. A slight head movement
# rotates the eye a fraction of a degree, uploads cross the 0.990 line, and the
# pass they belong to flips between drawn-from-the-head and drawn-from-the-
# engine-camera between one frame and the next. Whatever cb 128 serves therefore
# jumps back and forth by the whole camera difference at frame rate, on the
# slightest movement, while everything drawn from cb 1760 stays put.
#
# It also explains D's shape without any further theory. cb 128 is 71% of the
# replacements; the ones that pass at 13.55 m contribute metres each. That is
# the "mean near zero, worst metres, spiking many times a second" the census
# printed - not one camera drifting, but two populations being averaged.
#
# --- THE CHANGE, and the filter already exists ------------------------------
#
#     vp_patch_only_bytes = 1760
#
# patch_only_bytes() gates every write on byteWidth, and it is currently 0,
# which means EVERY buffer is eligible. Setting it to 1760 writes the per-view
# buffer and nothing else: the main view and its previous-frame slot keep being
# substituted, so the late latch and the crisp head are untouched, and cb 128,
# cb 6656, cb 112 and cb 224 all stop being written.
#
# PREDICTIONS, so this cannot be fitted afterwards:
#
#   character shake gone or much reduced   the flip is what was shaking them.
#   head movement unchanged                offsets 240/304 still written.
#   D's mean and worst fall a long way     71% of the sample removed, and the
#                                          metre-scale contributions with it.
#
# If the shake survives this, cb 128 was not it, and the next question is what
# that buffer actually serves - the target-set census (g_tgtCtx, "which pass
# each patch landed in") is already built to answer it and needs vp_census = 1.
#
# THE KNOWN RISK, recorded before the run: the note over g_tgtCtx says
# restricting to cb 1760 "fixed the floating and brought the shadows straight
# back", because cb 1760 is itself uploaded about five times a frame and all
# five are still written - one is the main view, the rest are other passes,
# including a depth-only shadow pass. So the shadow slide may get worse here.
# With DLSS on it has been smearing that out of sight all along; if shadows
# start crawling, that is the same D and the next lever is the target-set split,
# not this one.
#
# RESULT: REFUTED - cb 128 was not it; see TEST 87.
vp_patch_only_bytes = 1760

# =============================================================================
# TEST 87 - stop the camera alternating, because the motion vectors are rgl's
# =============================================================================
#
# TEST 86 RESULT: REFUTED. vp_patch_only_bytes = 1760 changed nothing - cb 128
# was not it. Reverted to 0 so this run changes exactly one thing.
#
# Reported: "the problem I think is with motion vectors, and characters and
# every object player or other NPC characters can interact with."
#
# That is the correct diagnosis and it matches TEST 85's reasoning from the
# other end. The affected set is precisely the engine's DYNAMIC entities - the
# things with a per-object previous transform - and the only consumer that cares
# is a temporal upscaler. Everything drawn from the per-view buffer is fine
# because vp_patch rewrites both of its main-view matrices together.
#
# WHY NO SETTING TOUCHED IN TESTS 79-86 COULD HAVE FIXED IT
#
# Every one of them changed a matrix in a constant buffer we can see. A dynamic
# entity's previous clip position is composed from its OWN cached transform,
# which never passes through a buffer we scan. VrAfrRenderer wrote this down
# before any of those tests were run, and it is the sentence the whole sequence
# should have started from:
#
#     "We cannot tell rgl anything of the kind; its motion vectors and its
#      previous-view matrix are its own. What we can do is REMOVE THE CAUSE,
#      which is available to AFW and to nothing else."
#
# THE CAUSE IS THE ALTERNATION. Under AFR the engine's camera swaps eyes every
# frame, so for every dynamic entity the previous frame's camera was 65 mm to
# the side - and that offset lands in its motion vector, because the engine
# composed it and we cannot reach it. At a character 2 m away, 65 mm is on the
# order of 30 px, alternating sign every frame. Static geometry never shows it
# because its vectors come from the two matrices we DO patch, mapped to the
# right eye by vp_match_prev and vp_prev_same_eye.
#
# So: temporal-AA-only, dynamic-entities-only, unfixable by any matrix we can
# write. All three follow from one fact.
#
# THE CHANGE - the mode, and BOTH keys of it:
#
#     stereo_mode = afw
#     afw = 1
#
# stereo_mode selects VrRenderMode.Parse; afw gates VrAfw.Available AND is read
# separately by the native side (xr_context reads config "afw" itself). They
# have come apart FOUR times in this file - twice on their own, once as the
# prev-matrix pair in TEST 80, once as the mode bundle in TEST 82 - so they are
# written together here, adjacent, with this note between them and nothing else.
#
# WHAT AFW DOES TO THE PROBLEM: the engine is pinned to ONE eye and never
# alternates, so a dynamic entity's engine-composed previous camera is the same
# eye it is being drawn from. Its motion vector becomes pure head-and-object
# motion, which is what the upscaler was built for. The second eye is
# synthesised from the first's depth rather than rendered.
#
# AND IT FIXES THE OTHER HALF FOR FREE: with the engine pinned, DLSS's history
# is the same eye every frame, so the cross-eye ghosting of TESTs 79-81 has no
# mechanism left either. DLSS still runs normally on the rendered eye, so the
# shadow stabilisation TEST 53 measured - the reason DLSS cannot be turned off -
# is kept.
#
# WHAT IT COSTS: the synthesised eye never gets a real render, so disocclusions
# fall back to stretched background instead of a real sample. Those slivers are
# narrow at a 65 mm baseline. Watch for them at the edges of near objects in one
# eye only - that is the trade, and it is a different artefact from the shake,
# so it should not be confused with a failure.
#
# vp_patch stays 1: the late latch is what keeps the head crisp, and AFW does
# not need it removed. vp_prev_same_eye and vp_reproj_same_eye become no-ops
# under AFW, which pins the eye and never alternates - they are left as they
# are rather than churned.
#
# IF THE SHAKE SURVIVES A PINNED CAMERA, the alternation was not the cause and
# the remaining suspect is D itself reaching the per-object path some other way -
# then vp_patch = 0 is the only knob left that zeroes D, and the floating comes
# back with it. That is the wall, and it is worth knowing where it is.
#
# RESULT: pending.
vp_patch_only_bytes = 0
stereo_mode = afw
afw = 1

# =============================================================================
# TEST 88 - the DLSS trade is TWO faults, not one
# =============================================================================
#
# Asked, and it is the sharpest framing of the problem anyone has put here:
#
#   "why without dlss/dlaa: effects, sky and dynamic shadows move with head and
#    characters are stable - but enabling dlss/dlaa: effects, sky and dynamic
#    shadows all get fixed and characters break, shaky and smearing?"
#
# Because they are two independent faults on two different temporal systems, and
# DLSS hides one while revealing the other. It is not one artefact trading
# places.
#
# SET A - sky, sun, cloud, particles, dynamic shadows. NO PER-PIXEL VELOCITY.
#
# These reproject their history with a single camera-only matrix, and the shadow
# map in particular is FITTED to the engine's camera before anything is written.
# vp_patch is a late latch: it moves the scene to the head after that fitting has
# happened, so the content and the scene disagree by D - measured in TEST 84 at
# metres and up to 12 degrees, spiking many times a second. They therefore track
# the ENGINE camera while the scene tracks the head, which on screen is "they
# move with my head". TESTs 70 and 71 established this and it has nothing to do
# with DLSS.
#
# DLSS DOES NOT FIX SET A. IT SMEARS IT. TEST 53 measured dynamic shadows stable
# in AFR with DLSS and crawling in every other combination, and TEST 71's
# conclusion was exactly this: "DLSS's temporal accumulation was only ever
# smearing it out of sight." An accumulator blending several frames turns a
# per-frame slide into a soft stable-looking image. The fault is still there;
# it is being averaged.
#
# SET B - characters, and every object a player or NPC can interact with. THESE
# HAVE PER-OBJECT MOTION VECTORS.
#
# Only a temporal upscaler reads motion vectors. With DLSS and DLAA off, nothing
# consumes them and a wrong one costs nothing - so characters are STABLE. Turn
# either on and every frame those vectors are used to reproject the history.
#
# Under AFR the engine's previous camera is the OTHER EYE, 65 mm away, and the
# engine composes these vectors itself from each entity's own cached previous
# transform - which never passes through a constant buffer this mod can scan. So
# the vectors carry the eye swap: about 30 px at a character 2 m away,
# alternating sign every frame. That is the shake, and the smearing is the
# upscaler dragging history along a vector that never described real motion.
#
# WHICH IS WHY THE TRADE LOOKS SO CLEAN. DLSS on: set A hidden, set B exposed.
# DLSS off: set A exposed, set B harmless. One switch, two faults, opposite
# signs. Nothing about it is a single mechanism moving between object types, and
# every attempt to find one - TESTs 79 through 86 - was looking for something
# that does not exist.
#
# WHAT FOLLOWS, and it is the whole plan in two lines:
#
#   Keep DLSS. It is the only thing hiding set A, and set A's real fix means
#   un-desynchronising a shadow map that is fitted before we are allowed to
#   write - structural, and not available today.
#
#   Remove set B's CAUSE rather than its symptom. The cause is the alternation.
#   Pin the engine to one eye and the previous camera is the same eye, the 65 mm
#   is gone from every per-object vector, and no matrix needs to be reachable.
#   That is AFW, and it is TEST 87.
#
# AFW therefore aims at set B while leaving DLSS in place to keep hiding set A,
# which is the only combination that has both halves covered at once.
#
# --- AND THE PAIR CAME APART A FIFTH TIME, THROUGH THE MENU -----------------
#
# TEST 87 wrote stereo_mode = afw and afw = 1 adjacent, with a note between them
# saying they must move together. The log then shows the render mode toggled
# from the VR panel four times, and the file now reads:
#
#     5428: stereo_mode = afr      <- written by the menu
#     5429: afw = 1                <- TEST 87's, untouched
#
# VrMenu.Save writes stereo_mode ONLY, and VrConfig.Save replaces every
# uncommented assignment of that key - so a menu toggle silently rewrites the
# mode half of the pair and leaves the other half standing. AFW was never
# actually run; the session ended in AFR with afw = 1, which is the same
# mismatch TEST 79 recorded.
#
# This is not a config discipline problem any more, it is a code one: the menu
# writes one key of a two-key mode. Selecting AFW from the panel happens to work
# while afw = 1 is pinned in the file, but selecting AFR leaves the mismatch.
# Worth fixing in VrMenu rather than being caught a sixth time.
#
# Restored, and pinned last so a stale menu write cannot win:
#
#     stereo_mode = afw
#     afw = 1
#
# RESULT: pending - TEST 87 has still not actually been run.
stereo_mode = afw
afw = 1

# TEST 87/88 RESULT: REFUTED on every axis - very bad doubling, very bad
#         performance, and set A (effects/sky/shadows following the head)
#         UNCHANGED. That last part is the informative half: pinning the eye
#         does nothing for set A, which confirms set A is D and not the
#         alternation. Back to AFR.
stereo_mode = afr
afw = 0

# =============================================================================
# TEST 89 - the floating is a GAIN error, and it is measured at 0.869
# =============================================================================
#
# TEST 87/88 REFUTED: AFW gave very bad doubling, very bad performance, and left
# set A (effects, sky, dynamic shadows following the head) UNCHANGED. Reverted
# to AFR. The last part is the useful half - pinning the eye did nothing for set
# A, which confirms set A is D and not the alternation, exactly as TEST 88 said.
#
# WHAT THE AFW LOG HANDED OVER ON THE WAY PAST, running continuously:
#
#   Engine FOV hold: 225 correction(s) in the last ~5 s
#       (have 2.260/1.778, want 2.147/1.386)
#       Head-to-world gain 0.869 - 1.000 is 1:1; 0.869 means 40 deg of head
#       reads as 34.8 deg of world.
#       Of those writes 225 read back correct and 0 did not.
#
# HEAD-TO-WORLD GAIN 0.869. The world turns 13% less than the head does. That is
# not a latency and no amount of pose timing can touch it - it is the same
# quantity this file already named "the view RESISTS my head" when it measured
# 0.617, and it is the exact sensation reported as floaty. TEST 83 was tuning
# pose_lead_frames against a problem that was never about time.
#
# THE NUMBERS SAY WHAT IS WRONG. have 2.260 rad is 129.5 deg at aspect 1.778 -
# and 1.778 is 16:9, the DESKTOP aspect. want is 123.0 deg at 1.386. The engine
# camera is rendering wider than we submit, so the submitted image is sampled
# from a wider render and every degree of head buys less than a degree of world.
#
# AND IT WILL NOT STAY SET. 225 corrections in ~450 frames, every one of them
# reading back CORRECT. So the write is accepted and the engine overwrites it
# again before the next one - the "stuck" case the line itself names, not the
# "refused" case. HoldEngineFov is losing a fight it re-enters every other frame.
#
# WHY THIS HAS BEEN INVISIBLE UNDER vp_patch = 1: the substitution replaces the
# whole view-projection at upload, OUR frustum included, so whatever the camera
# object's FOV says never reaches the GPU. The patch has been masking the gain
# error the entire time. Turn it off and the engine's own 129.5 deg is what
# renders - which is why vp_patch = 0 floats while its pose age measures 0.0 ms.
#
# THIS REFRAMES THE WHOLE PROBLEM, and it is the first good news in a while:
#
#   vp_patch = 0 already fixes BOTH fault sets. D becomes zero, so set A stops
#   following the head (TEST 70 measured "SHADOWS AND SKY STABLE"), and the
#   characters were reported stable in TEST 82. Its ONLY defect is the floating.
#
#   The floating is now measured, and it is a projection that will not stick -
#   not a timing problem, not a reprojection problem, and nothing to do with
#   motion vectors or DLSS.
#
# So the target is no longer "fix the characters". It is: make the engine camera
# hold the headset projection, get the gain to 1.000, and vp_patch = 0 becomes
# the configuration where nothing is broken and DLSS is no longer load-bearing.
#
# NEXT, and it is a code question rather than a config one: find what overwrites
# the projection between our write and the render. HoldEngineFov currently
# corrects and verifies by read-back, which proves the write lands but not that
# it survives. The read-back has to happen at the LAST moment before the draw -
# the same argument that made AimAtEye run in the OnFrameTick postfix - or the
# projection has to be re-asserted from somewhere the engine cannot follow.
# Note aspect 1.778 as the clue: something is deriving the projection from the
# 16:9 desktop backbuffer rather than from the eye target.
#
# RESULT: pending - not yet attempted.
stereo_mode = afr
afw = 0

# =============================================================================
# TEST 90 - "only when I stand still" says the two halves DISAGREE
# =============================================================================
#
# Reported: characters and the army shake, and it only happens STANDING STILL.
#
# Standing still is the cleanest possible test condition, because it removes
# every source of frame-to-frame change except one: the AFR eye alternation.
# With the player, the camera and the head all stationary, the ONLY thing that
# differs between frame N and frame N+1 is that the engine drew from the other
# eye, 65 mm across. So whatever is shaking is being driven by the alternation
# and by nothing else, and real motion was masking it before - which is why the
# earlier report was "worse with the slightest head movement" and this one is
# "only when I stand still". Same term, seen with and without something louder
# on top of it.
#
# NOW PUT THAT BESIDE THE TWO THINGS ALREADY MEASURED:
#
#   vp_patch = 0  ->  characters STABLE (TEST 82), with DLSS on.
#   vp_patch = 1  ->  characters shake.
#
# At vp_patch = 0 nothing is rewritten, so the engine's own motion vectors
# describe the true camera transition - eye swap included - for EVERYTHING,
# static and dynamic alike. One consistent account, and DLSS reprojects it
# correctly. That is why the characters were stable there.
#
# At vp_patch = 1 with vp_prev_same_eye = 1 we rewrite the main-view previous
# slot to say "same eye, no lateral move". That governs STATIC geometry. It does
# NOT reach a dynamic entity, whose previous clip position the engine composes
# from its own cached transform against its own alternating camera.
#
# SO THE TWO HALVES OF THE FRAME ARE HANDED CONTRADICTORY ACCOUNTS:
#
#     static geometry   "the camera did not move sideways"   (ours)
#     characters        "the camera moved 65 mm sideways"    (the engine's)
#
# Both are then resolved into ONE image by one upscaler. The world is told to
# hold still and does; the characters are told they swung 65 mm and are
# reprojected by about 20 px at 3 m, alternating sign every frame. That is the
# shake, it is strongest when nothing else is moving, and it is measured against
# a world that is deliberately holding still - which is exactly what makes it so
# visible.
#
# It also dates the symptom precisely: TEST 79 introduced vp_prev_same_eye = 1,
# and "characters shimmer" has been the complaint from that point onward.
#
# THE FIX IS TO STOP CONTRADICTING THE ENGINE. One line, no build:
#
#     vp_prev_same_eye = 0
#
# Both halves then describe the same transition - the other eye, one frame ago -
# which is what the engine believes, what the image actually did, and what the
# upscaler's history genuinely contains. Consistency, rather than each half
# being individually defensible.
#
# TEST 81 named this exact run and TEST 82 superseded it on the strength of a
# misread anatomy line. It was the right test then.
#
# PREDICTION, so it cannot be fitted afterwards: the standing-still shake goes.
# What may come back is TEST 79's original complaint - cross-eye ghosting on
# near, thin, high-contrast geometry - because the 65 mm is now described rather
# than suppressed. If it does, that is a REAL trade between two artefacts and
# the question becomes which is less bad, not which is correct. Ghosting that
# sits still is a great deal easier to look at than geometry that shakes.
#
# vp_reproj_same_eye is already 0 and stays 0, so after this every part of the
# frame agrees.
#
# RESULT: pending.
vp_prev_same_eye = 0

# =============================================================================
# TEST 91 - a deadzone on D, because standing still is not standing still
# =============================================================================
#
# TEST 90 REFUTED: vp_prev_same_eye = 0 made no difference, so the static/dynamic
# contradiction was not the driver. Left at 0 anyway - with vp_reproj_same_eye
# also 0 the whole frame now describes one transition, which is the more
# defensible resting state and costs nothing.
#
# Asked: "it is the same when TRYING not to move my head. Will filtering these
# very very small head movements fix it?"
#
# Very likely yes, and the reasoning says where to put the filter.
#
# WHAT ACTUALLY VARIES WHEN THE HEAD IS HELD STILL
#
# Work out what D is made of. build_replacement places the eye by its OFFSET
# from the engine camera, so D's translation reduces to exactly
#
#     D_translation = eyeCamera - refPos
#
# - our latched eye pose minus the engine camera at publish time. With
# afr_camera_mode = engine those are the same camera set at two different
# MOMENTS: refPos from the OnFrameTick write, eyeCamera from the later latch. So
# D is the head's movement across that interval, and nothing else.
#
# Hold the head still and that interval contains no real movement - only tracker
# noise and micro-tremor. Millimetres, present every frame, alternating in sign.
#
# WHY MILLIMETRES SHAKE A CHARACTER AND NOT A WALL
#
# The image is displaced by D. A dynamic entity's motion vectors are composed by
# the engine from ITS camera and know nothing about D. So the upscaler
# reprojects those entities wrong by exactly the FRAME-TO-FRAME CHANGE in D -
# and a term that alternates sign every frame is, on screen, a shake. Static
# geometry escapes because its vectors come from the two matrices we patch, so
# the D of the moment is in both ends and cancels.
#
# That is the whole mechanism, and it explains the condition precisely: the
# quieter you hold your head, the smaller the real motion that could mask a
# few millimetres of tremor, and the more clearly it reads as shaking.
#
# THE FILTER GOES ON D, NOT ON THE HEAD POSE
#
# Filtering the pose would work and would be the wrong place - it adds latency
# to real movement, and the late latch exists to remove latency. The deadzone
# belongs on the CORRECTION:
#
#     vp_dead_m   = 0.004    4 mm
#     vp_dead_deg = 0.04     0.04 degrees
#
# Below both thresholds the substitution is SKIPPED - the engine's own matrix is
# left standing. Its camera is already at the head to within those few
# millimetres, so nothing visibly moves, D stops changing frame to frame, and
# the entities the upscaler was mis-reprojecting stop being mis-reprojected.
# Above either threshold the latch applies in full, so a real head movement is
# corrected exactly as before and nothing is taken from head tracking.
#
# The discontinuity at the threshold is itself only the size of the threshold -
# 4 mm and 0.04 deg, under what the headset can resolve - which is what makes a
# hard gate acceptable instead of needing a ramp.
#
# WATCH: "VP deadzone: N substitution(s) refused in ~5 s". Held still, N should
# be most of them - that is the tremor being kept out of D. While the head MOVES
# it should collapse to near zero. If it stays high while moving, vp_dead_m is
# eating head tracking and should come down; 0 disables it entirely.
#
# IF THE SHAKE SURVIVES A DEADZONE THAT IS DEMONSTRABLY FIRING, then D's change
# is not tremor-sized and the cause is upstream of this - the next question is
# why refPos and eyeCamera disagree by more than a few millimetres with the
# camera driven, which is the same unexplained gap TEST 84 left open.
#
# RESULT: pending.
vp_dead_m = 0.004
vp_dead_deg = 0.04

