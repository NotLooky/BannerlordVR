#
# AND IT NOW REPORTS THE MINIMUM, which nothing ever did:
#
#     VP D: min X mm, mean Y mm, max Z mm over N substitution(s) in ~5 s;
#           deadzone (4.0 mm / 0.04 deg) refused K.
#
# Mean and max cannot answer the question a deadzone asks. MIN can: it is the
# floor the camera drive actually achieves, and with the head still it is the
# whole diagnosis in one number.
#
#   min a few mm        the drive works and tremor is the residual. TEST 91 was
#                       right in kind and the threshold merely needs to be wider.
#   min tens of cm      the engine camera is NOT where we put it, ever. No
#                       deadzone can fire, and the fix is upstream in the camera
#                       drive - which is then the single remaining bug.
#
# The old "VP substitution size" line is removed rather than left beside this
# one; both drained the same counters and whichever ran first would have emptied
