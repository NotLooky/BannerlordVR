# =============================================================================
# TEST 157 - THE RAY BASIS IS NOT THE SLIDE. A refutation, instrumented.
# =============================================================================
#
# Final numbers, with every known fault in pass four fixed:
#
#     23958 lane(s) rotated,  0 skipped as already ours,  4392 REFUSED
#
# 4392 over five seconds is 9.8 per frame against 9 uploads - which is lane 720
# and almost nothing else. So the predicate is working and the "cascades share
# offset 688 on most uploads" reading was wrong: those table entries come from
# rare uploads, not the common case. One more theory of mine, measured and
# dropped.
#
# And 23958 lanes a five seconds were rotated correctly - right, up and forward,
# verified as camera axes at the moment of writing, by the current frame's D,
# exactly once each - AND SET A SLIDES EXACTLY AS IT DID WITH THE FEATURE OFF.
#
# WHAT IS NOW RULED OUT, each by its own instrument rather than by argument:
#
#   stale D            fixed at TEST 151; flicker went away and nothing else did
#   compounding        0 skipped, every upload fresh. Never happening.
#   wrong content      4392 refused, and refusing them changed nothing
#   the sign           both tried; neither is the difference
#   lane 720           named as (10255,8916,295, w 20) and excluded; it was the
#                      violence in TESTs 150-153 and none of the slide
#
# THE CONCLUSION, AND IT IS THE ONE THIS FILE'S OWN HEADER ALREADY STATES
#
# "the upload happens AFTER the passes that already consumed the camera."
#
# Rotating the camera basis in the main view's constant buffer cannot reach a
# pass that already ran. The sky is drawn with its own view, the shadow map is
# rendered from the light into its own target, and both are finished before the
# main-view upload that pass four rides on. The lanes at 688 and 928 are real,
# they are the camera basis, they are consumed by something - patching them
# badly moved the shadows violently, which is proof of consumption - but what
# consumes them is not what makes set A slide.
#
# So set A does not slide because a constant is stale. It slides because those
# passes RAN EARLIER, in the engine's frame, and no correction applied at
# main-view upload time is early enough to matter. That is a render-order
# problem, and TESTs 148-157 are the measurement that finally distinguishes the
# two - which is worth more than the seven runs it cost, because every previous
# attempt at set A assumed the opposite without testing it.
#
# WHAT SURVIVES, and it is not nothing:
#
#   - the ray census, which found in one run what six matrix scans could not,
#     and which is now the tool for any "what reads the camera" question
#   - the predicate, the compounding guard and the raw window dump, all of which
#     would be needed by any future write and none of which existed before
#   - cb 224 at offset 128, carrying a byte-identical copy of the same basis in
#     a small PER-PASS buffer. Untested, because vp_ray_cb names 1760 alone. It
#     is the one lead left that the data actually points at, and unlike the main
#     buffer a per-pass buffer is uploaded BY the pass that reads it - which is
#     the one place a late write could still be early enough.
#
# TURNED OFF. This restores TEST 151 exactly: native head movement, set A
# sliding, nothing being written by pass four. Everything above stays in the
# build, off by one key, and stays measurable by another.
#
# RESULT: no change to the headset, and one large question answered in the
#         negative with numbers instead of a seventh inference.
vp_ray_patch = 0
vp_ray_census = 1
# =============================================================================
# TEST 158 - cb 224. The per-pass copy, and the only timing window left.
# =============================================================================
#
# TEST 157 closed cb 1760: the basis at 688 and 928 was rotated correctly, by
# the current frame's D, exactly once per upload, verified as a camera axis at
# the moment of writing - and set A slid exactly as it does with the feature
# off. Constants in the main-view buffer cannot reach a pass that already ran.
#
# WHAT MAKES cb 224 DIFFERENT, and it is not a hunch:
#
#   cb  224 offset 128  moved 4.0163      cb 1760 offset 928  moved 4.0165
#   cb  224 offset 144  moved 1.6293      cb 1760 offset 944  moved 1.6295
#
# Four significant figures on both axes, in the same report. It is the SAME
# BASIS, copied. But cb 1760 is the big per-frame buffer uploaded nine times a
# frame for nine different passes, while cb 224 is 224 bytes - a per-pass
# buffer, and a per-pass buffer is uploaded BY THE PASS THAT READS IT, moments
# before it draws. That is the one place a write at upload time is still early
# enough to change what that pass does.
#
# TWO BLOCKERS HAD TO GO FIRST, and both would have produced a NULL result
# wearing a negative result's clothes - which is the failure mode this whole
# sequence has been fighting.
#
# 1. NO D. Pass four required haveD, set only when a main-view matrix is found
#    in the SAME upload. cb 224 is not a patch site and carries no main view, so
#    haveD would have been false on every upload and pass four would have
#    written nothing while reporting nothing wrong. D is now also kept globally,
#    stamped with the frame it was built for, and borrowed by buffers that have
#    none of their own. The AGE IS COUNTED: if cb 224 uploads before the frame's
#    first cb 1760, the borrowed D is a frame stale, which is precisely the bug
#    that made TEST 150 flicker. The log will say so rather than me guessing.
#
# 2. THE WRITE-OFF. A buffer with no view matrix scores no hits, retires after
#    600 uploads and is then scanned once in every 256. Correct for the matrix
#    passes, ruinous here: cb 224 would have been written on one upload in 256
#    behind a healthy-looking rotate count, and the run would have read as "cb
#    224 changes nothing" when it actually showed "cb 224 was barely written".
#    Buffers pass four is aimed at are now exempt from retirement. 14 lanes,
#    scanned every upload, costs nothing.
#
# The census already sidestepped the write-off by running ahead of it, which is
# why cb 224 was visible to measure all along and would not have been visible to
# write. Two different paths, one of which had the guard and one of which did
# not.
#
# RANGE A IS OFF. cb 1760 is already refuted and leaving it on would put two
# buffers in one test. cb 224 alone, offsets 128/144/160 - right, up, -forward,
# the three lanes the census scored 0.733, 0.718 and 0.814 with unit length and
# clean axes.
#
# The window moves to cb 224 so the raw float4s of that block, w included, are
# on the record whatever the headset says.
#
# WHAT TO LOOK FOR
#
#   SKY AND EFFECTS  these are what a per-pass buffer most likely feeds, and
#                    they have not moved once in nine tests. Any change at all
#                    is the first time set A has responded to a correct write.
#   THE BORROW LINE  nonzero stale means cb 224 uploads before the main view and
#                    the D is a frame old - fixable, but it has to be known.
#   VIOLENCE         would mean cb 224's lanes are read by something that must
#                    not be rotated, the way cb 1760's 720 was.
#
# vp_ray_patch = 0 returns to the TEST 151 baseline at any time.
#
# RESULT:
vp_ray_patch = 1
vp_ray_offset = -1
vp_ray_offset_b = 128
vp_ray_count_b = 3
vp_ray_cb_b = 224
vp_ray_cb = 224
vp_ray_census = 1
vp_ray_window = 112
vp_ray_window_lanes = 8
# =============================================================================
# TEST 159 - cb 224 REFUTED. And the reason none of this could ever have worked.
# =============================================================================
#
# TEST 158 was the first clean write in the whole sequence, and the log says so:
#
#     1350 lane(s) rotated   0 REFUSED   30-42 stale of ~33600 borrows
#
# 1350 / 3 lanes / 450 frames = exactly ONE cb 224 upload per frame, every
# frame. The predicate passed 100% - those lanes held the camera basis on every
# single upload, no cascades, no skybox rows. The borrowed D was current-frame
# 99.9% of the time. No stale D, no compounding, no wrong content, no starved
# buffer. Every fault found in TESTs 150-156 was absent.
#
# And the headset: "it looked the same broken dynamic shadows and other effect."
#
# SO THE CAMERA BASIS IS NOT THE SLIDE, in either buffer that carries it, and
# that is now measured twice rather than argued once.
#
# THE REASON, AND IT IS STRUCTURAL RATHER THAN A BUG
#
# A frame under vp_patch = 1 contains TWO VIEWPOINTS. The geometry is drawn from
# camera + D, because pass one substituted the matrix at upload time. Set A -
# sky, sun, cloud, particles, the shadow cascades - was drawn from camera, plain,
# because those passes consumed the camera before pass one ever ran.
#
# One pose is submitted to the compositor for the whole image. A single pose can
# only be correct for one viewpoint. Submit the camera pose and set A is right
# while the geometry over-rotates - which is the "native, instant head" feel the
# whole project is built on. Submit camera + D and the geometry is right while
# set A slides by D instead. THE ERROR MOVES; IT DOES NOT LEAVE.
#
# That is why no dial ever touched it. Not the sign, not the offsets, not the
# buffer, not D's age, not the predicate. Correcting a constant that some pass
# reads cannot merge two viewpoints into one, because the two viewpoints are
# already baked into different pixels of a finished frame by the time any pose
# is chosen. The feel and the slide are the SAME MECHANISM seen from two ends -
# this file said so at TEST 147 and TESTs 148-159 are the measurement that makes
# it a fact instead of a reading.
#
# WHAT IS ACTUALLY LEFT, and it is one thing, not a family
#
# Stop trying to correct what set A READS and correct what set A IS DRAWN INTO.
# The shadow cascades are orthographic matrices this file has identified for
# months and has never once written to:
#
#     "Orthographic blocks - the shadow cascades - and how far each one's
#      translation travels between sightings. Identified only, never patched."
#
# A cascade fitted to the unrotated camera, lighting geometry drawn from
# camera + D, is a shadow displaced by exactly D. Rotating the cascade to match
# is a different operation from anything tried in TESTs 148-159: it corrects the
# LIGHT's projection so it agrees with where the world was actually drawn,
# rather than correcting a camera vector and hoping a pass downstream uses it.
# The ortho table already names the buffers and offsets. It would only address
# dynamic shadows - the sky is a separate mechanism - but dynamic shadows are
# the complaint that has come back nine times.
#
# TURNED OFF. Back to TEST 151 exactly. Everything built across 148-159 stays in
# the source, disarmed by one key, and the census stays on because it is the only
# tool this project has ever had for "what reads the camera".
#
# RESULT: the last lead the data pointed at, closed with numbers. Nine runs, no
#         improvement to set A, and one structural fact established that every
#         previous attempt had assumed away.
vp_ray_patch = 0
vp_ray_census = 1
# =============================================================================
# TEST 160 - THE POINT LANE. A fix for dynamic shadows, with the number that
#            says why every previous attempt was violent.
# =============================================================================
#
# "in this session we did touch the dynamic shadows but it was very fast."
#
# That is the correct reading of TESTs 150-153 and I had the wrong one. I treated
# the violence as damage to be eliminated and eliminated it, which threw away the
# only handle on set A this project has ever had. The shadows moved because
# something in cb 1760 at 688-736 drives them. The task was never to stop
# touching that block. It was to touch it correctly.
#
# WHAT WAS WRONG, QUANTITATIVELY
#
#     offset 720  raw (10255.86, 8916.65, 295.00, w 19.999920)  |xyz| 13593.24
#
# That is a POSITION, 13593 units from the world origin. It was being passed to
# rot3, which applies D's 3x3 and nothing else - a rotation about the ORIGIN.
#
#     displacement = 13593 * sin(0.5 deg) = 118 units, per frame
#
# One hundred and eighteen units of displacement for half a degree of head
# movement, scaling linearly with D, in whichever direction the sign happened to
# select. That is "moves very fast with every tiny movement" exactly, and it is
# why BOTH SIGNS looked equally wrong: 118 units does not care which way it
# points. The sign investigation of TESTs 152-153 was chasing a rounding error
# next to this.
#
# D ALREADY CARRIED THE FIX, and it has since the file was written:
#
#     d.m[12] = cx - (cx*d.m[0] + cy*d.m[4] + cz*d.m[8])   about f.position
#
# The translation row makes D a rotation ABOUT THE CAMERA. Applied as a full 4x4
# to a world point it moves that point the same way pass one moves the world -
# same D, same fixed point, same magnitude. A cascade origin 20 m from the
# camera then moves 17 cm instead of 118 units.
#
# I was applying one third of a matrix to a lane that needed all of it.
#
# THE FIX
#
# A lane now declares what it HOLDS, not just where it is. vp_ray_kind = 0 is a
# direction and takes the 3x3 with the camera-axis predicate. vp_ray_kind = 1 is
# a point and takes all four rows with a magnitude-band predicate instead -
# because a position is not near any camera axis and never will be, so the old
# guard would have refused every point lane forever.
#
# This run aims one lane only: cb 1760 offset 720, as a point. Nothing else is
# written. If that lane is the cascade origin - and a float3 beside an
# orthographic block, tracking the camera, texel-snapped, is exactly what TEST 62
# predicted and what the lane census was built to find - then moving it by the
# same D that moved the world is the correction the shadows have been missing.
#
# THE REPORT IS THE PROOF, not the feel:
#
#     VP ray points: N position lane(s) moved about the CAMERA by the full D,
#                    mean X mm each
#
#   mean in CENTIMETRES  the transform is finally right. Compare 118000 mm.
#   mean in METRES+      still rotating about something far away; wrong anchor.
#   N = 0                the magnitude guard refused it, and the band is wrong.
#
# So the log grades the mathematics before the headset grades the result, which
# is the one discipline that has actually paid off across 148-159.
#
# vp_ray_patch = 0 returns to the TEST 151 baseline at any time.
#
# RESULT:
vp_ray_patch = 1
vp_ray_cb = 1760
vp_ray_offset = 720
vp_ray_count = 1
vp_ray_kind = 1
vp_ray_offset_b = -1
vp_ray_cb_b = 0
vp_ray_census = 1
vp_ray_window = 688
vp_ray_window_lanes = 24
# =============================================================================
# TEST 161 - LANE 720 IS THE CAMERA. The w was not decoration.
# =============================================================================
#
# "even lightning or reflection on character armor and horse metal armor are
#  moving very fast same as dynamic shadows."
#
# That observation is worth more than the nine runs before it, and it is dealt
# with below. First the thing the log settled outright.
#
# LANE 720 IDENTIFIED, EXACTLY
#
#     lane 720   (13586.70, 18021.99, 466.43)   w 19.999920
#     camera     (   679.4,    901.1,    23.4)
#
#     13586.70 / 19.99992 = 679.34
#     18021.99 / 19.99992 = 901.10
#       466.43 / 19.99992 =  23.32
#
# Three axes, exact. Lane 720 is THE CAMERA POSITION, stored homogeneous and
# pre-multiplied by its own w. Positions in these buffers carry their w, and
# that is a fact about the format that nothing in this file knew until now.
#
# TWO CONSEQUENCES, and the report measured the first before I could argue it:
#
# 1. TEST 160's transform was wrong. It added dPt.m[12..14] as though w were 1,
#    so the translation row was under-applied twentyfold and what was left was a
#    rotation about nearly the world origin with a 22000-unit lever arm:
#
#        VP ray points: mean 1669292.8 mm each
#
#    1.7 KILOMETRES of displacement per write, against the centimetres a
#    camera-anchored rotation gives. The instrument caught my own arithmetic in
#    one run, which is the entire reason it prints a mean.
#
#    The row-vector form is out.xyz = xyz * D3 + w * D.translation, and it
#    reduces to the familiar one only when w is 1. Fixed.
#
# 2. AND CORRECTLY TRANSFORMED, THIS LANE DOES NOT MOVE. D is a rotation about
#    the camera - the camera is its fixed point - and managed measures the eye
#    and engine positions as identical to 0.0 mm, 450 of 450 publishes. The
#    camera position was never wrong. Writing lane 720 could only ever have been
#    damage, and TESTs 150-153's violence was 118 units of it per frame.
#
#    So the mean should now read ~0 mm. That is the self-check: a correct
#    transform of a correct value changes nothing, and if the number is not
#    small the transform is still wrong.
#
# WHAT THE ARMOUR REFLECTIONS TELL US, WHICH IS THE REAL PROGRESS
#
# Specular needs V = camPos - worldPos. Shadows need worldPos. They move
# TOGETHER, at the same rate, so their shared input is one they both consume.
# camPos is now proven correct. That leaves the RECONSTRUCTED WORLD POSITION,
# and since rotating every ray basis we could find - cb 1760 at 688 and 928,
# cb 224 at 128 - changed nothing at all, the lighting pass does not reconstruct
# from those lanes.
#
# THE GAP THAT HID IT: a camera-derived POSITION is invisible to every tool here.
# The lane census differences raw xyz, so a position stored as pos*20 scores a
# ratio of 20, which its own min(ratio,1/ratio) shaping buries at 0.05. The ray
# census rejects it for not being a unit vector. And vp_census has been 0 all
# session, so the one tool built to find a cascade origin never ran.
#
# So there is now a POSITION CENSUS: divide every lane by its w, difference it
# against the camera's own step, and rank by ratio and alignment the way the lane
# census ranks translations. Scale drops out, so pos*20 and pos*1 both read as
# pos. A lane at ratio ~1, align ~1 is bolted to the camera, and a cascade origin
# is exactly that.
#
# It runs BEFORE the rotation gate on purpose: a camera that translates without
# turning is the case that answers this, and the rotation gate would have
# discarded it.
#
# WHAT TO LOOK FOR
#
#   VP ray points: mean ~0 mm        the transform is right and 720 needs nothing
#   positions in cb N: offset X ...  the next real target, named from data
#   the headset                      expected UNCHANGED from TEST 159 baseline,
#                                    because a no-op write is a no-op
#
# Ride around during the battle, not just turn the head - the position census
# needs the camera to TRANSLATE and gates at 4 mm of movement.
#
# RESULT:
vp_ray_patch = 1
vp_ray_cb = 1760
vp_ray_offset = 720
vp_ray_count = 1
vp_ray_kind = 1
vp_ray_offset_b = -1
vp_ray_census = 1
vp_ray_window = 688
vp_ray_window_lanes = 24
# =============================================================================
# TEST 162 - THE PIVOT, AND THE CASCADE CANDIDATES.
# =============================================================================
#
# TWO FINDINGS FROM TEST 161, one a bug of mine and one the target.
#
# 1. THE POINT TRANSFORM WAS PIVOTING ON NOTHING IN PARTICULAR.
#
# build_replacement anchors D's rotation on the camera only inside
#
#     const float latch = latch_gain();
#     if (latch < 0.999f)   { ... d.m[12] = cx - (...) ... }
#
# and vp_latch is 1.0. THAT BLOCK NEVER RUNS in the shipping configuration, so D
# arrives with its raw translation row - the one this file has warned about since
# TEST 84:
#
#   "THE TRANSLATION ROW OF D IS NOT A DISPLACEMENT, AND READING IT AS ONE COST
#    TESTS 84 THROUGH 97 ... It is the WORLD POSITION multiplied by the rotation
#    mismatch ... one degree prints as 19 m."
#
# Harmless to pass one, which multiplies whole matrices and never reads that row
# as a distance. Fatal to a point transform - and the instrument said so without
# being asked, because lane 720 is the camera position and therefore has a known
# correct answer of "does not move":
#
#     VP ray points: mean 264718.3 mm each
#
# I fixed the w and inherited a second error underneath it. The pivot is now
# rebuilt from the recovered camera unconditionally, t = c - c*R, which is a
# rotation about c by construction for any R and any c and cannot inherit
# whatever vp_latch did or did not do.
#
# And there is now a D PROBE that grades the matrix independently of any lane: a
# point 20 m in front of the camera, carried through the same dPt, printed beside
# D's own angle. 20 m at 0.5 deg is 175 mm. Two numbers that must agree, every
# second, with no lane configured at all. Every mistake in TESTs 150-161 was
# visible in a number nobody had printed yet; this is the last such number I can
# think of.
#
# 2. THE POSITION CENSUS WORKED, and the camera is in this buffer FOUR TIMES.
#
#     positions in cb 1760 - camera moved 29.916 m over 446 sample(s)
#       offset    16  score 0.923  ratio 0.950  align 0.972  step 0.0811
#       offset   976  score 0.923  ratio 0.950  align 0.972  step 0.0811
#       offset   720  score 0.922  ratio 0.950  align 0.971  step 0.0812
#       offset   336  score 0.347  ratio 1.700  align 0.591  step 1.0592
#       offset   272  score 0.345  ratio 1.700  align 0.587  step 1.0589
#     positions in cb 224
#       offset   176  score 0.922  ratio 0.949  align 0.972  step 0.0811
#     positions in cb 128
#       offset    32  score 0.337  ratio 1.728  align 0.583  step 1.7229
#
# 16, 720, 976 and cb 224+176 are the SAME NUMBER four times over - identical
# ratio, align and step to three figures. The camera position, duplicated. None
# of them needs correcting: the camera is D's fixed point.
#
# 272 AND 336 ARE SOMETHING ELSE ENTIRELY. ratio 1.700, align 0.59, and a step of
# 1.0592 m - motion that OVERSHOOTS the camera, is only partly aligned with it,
# and arrives in one-metre JUMPS. That is the signature TEST 62 wrote down and
# then could not chase:
#
#   "a texel-snapped cascade origin does not move smoothly - it jumps - and this
#    is the size of the jump, which is the world-space size of a shadow texel.
#    That number is the whole diagnosis: a jump you can see is a shadow edge you
#    can see move."
#
# A one-metre shadow texel at battle scale is entirely plausible, the overshoot
# is what snapping to a grid does to a ratio, and the partial alignment is what
# quantising a direction does to a cosine. Two independent lanes, 64 bytes apart,
# with the same numbers - which is what a cascade SET looks like.
#
# SO THIS RUN WRITES THE CASCADE CANDIDATES AND NOTHING ELSE. cb 1760 offset 272
# and offset 336, as points, on the rebuilt camera pivot. They are written as two
# single-lane ranges rather than one span because 288, 304 and 320 sit between
# them and 304 is a main-view slot pass one already owns.
#
# Lane 720 is dropped from the write: it is the camera, it is already correct,
# and writing it was the violence of TESTs 150-153.
#
# WHAT TO LOOK FOR
#
#   VP ray D probe   must read ~0.1-1 deg and ~35-350 mm. If the mm are huge the
#                    pivot is still wrong and the rest of the run means nothing.
#   DYNAMIC SHADOWS  a cascade origin moved by D is the shadow map agreeing with
#                    where the world was actually drawn. This is the first write
#                    in the whole sequence aimed at the light rather than the
#                    camera.
#   ARMOUR SPECULAR  should NOT change - it does not read a cascade. If it moves
#                    too, these lanes are not cascades and the census ranking
#                    needs re-reading.
#
# vp_ray_patch = 0 returns to the TEST 151 baseline at any time.
#
# RESULT:
vp_ray_patch = 1
vp_ray_cb = 1760
vp_ray_offset = 272
vp_ray_count = 1
vp_ray_kind = 1
vp_ray_offset_b = 336
vp_ray_count_b = 1
vp_ray_kind_b = 1
vp_ray_cb_b = 1760
vp_ray_census = 1
vp_ray_window = 256
vp_ray_window_lanes = 8
# =============================================================================
# TEST 163 - FRAME MAP. Stop measuring the renderer one census at a time; write
#            one battle frame down completely and read it.
# =============================================================================
#
# THE GOAL THIS SERVES: real native stereo - both eyes rendered every frame
# from ONE engine frame, so there is no AFR alternation, no held eye, no warp,
# and each eye has its own temporal history at the right cadence.
#
# The draw-duplication mode (drawstereo) proved the geometry half: ~500 scene
# draws a frame re-issued with the other eye's matrices, correct separation,
# correct occlusion. What it never had is everything DOWNSTREAM of the G-buffer
# - lighting, sky, fog, shadows applied, post, DLSS - because each of those is
# its own pass, reading surfaces and constants the second eye never got. Its
# second eye was a raw G-buffer channel for that reason.
#
# Finishing it means running EVERY view-dependent operation of the frame twice,
# with the second eye's constants and its own copy of every surface those
# operations write. To do that without guessing, three things have to be KNOWN:
#
#   1. The pass structure: which passes read what, which surfaces are history
#      (read before written - must exist per eye), which are transient.
#   2. Every constant-buffer lane that carries the camera. The latch work of
#      TESTs 150-162 hunted these one lane at a time and never found where the
#      lighting pass reconstructs world position. A second eye needs all of them.
#   3. Which shaders actually READ those lanes.
#
# THE KEY SIMPLIFICATION, and why stereo is easier than the latch was: with
# parallel eyes (measured: identical orientations) and one shared projection,
# the second eye differs from the first ONLY BY A TRANSLATION of the camera.
# Rays, frustum bases, rotations - everything TESTs 150-162 struggled to rotate
# - are unchanged between the eyes. Only positional terms move, by exactly the
# IPD, in a known way.
#
# WHAT THIS BUILD DOES: frame_map = 1 records one frame completely, into
# Logs\BannerlordVR.FrameMap\<time>\ :
#
#   ops.txt        every draw/dispatch/clear/copy/resolve/indirect/query/map/
#                  DLSS-evaluate in order, with every binding live at the time
#   resources.txt  views.txt   what every id is
#   shaders\*.asm  DISASSEMBLY of every shader used - which cb lanes each reads
#   cb.bin         the ORIGINAL bytes of every constant-buffer upload
#
# AND IT USES AFR ITSELF AS THE ORACLE. Under AFR consecutive frames are the two
# eyes, rendered by the engine with its OWN constants. Four frames (L R L R)
# separate "differs between the eyes" (L vs R) from "drifts with time" (L vs L).
# The engine is telling us, lane by lane, what the second eye's constants are.
# tools\framemap_analyze.py reads the folder and reports all of it.
#
# Nothing about rendering changes in this build. The capture costs a stall of a
# few frames about 20 s into the battle; the files are written on a worker
# thread. It can also be triggered at any moment by creating an empty file
# Logs\BannerlordVR.FrameMap.trigger.
#
# WHAT TO DO: play one battle as normal for ~40 s (AFR, whatever AA setting is
# normally used). Look around a little. That is all.
#
# RESULT: pending.
frame_map = 1
frame_map_frames = 4
frame_map_delay = 20

# =============================================================================
# TEST 164 - NATIVE STEREO. One engine frame, both eyes real and complete.
# =============================================================================
#
# WHAT THE FRAME MAP SETTLED (TEST 163, capture 20260913_174929)
#
# The frame is: skinning -> depth prepass -> a six-target G-buffer -> four shadow
# cascades -> light culling -> lighting into an HDR target -> HiZ/SSAO -> the post
# chain -> a final composite into the eye texture. 3862 operations, ALL ON ONE
# THREAD. No indirect draws, no resolves, no pixel-shader UAVs, no command lists
# - measured, not assumed, and that is what makes re-issuing them safe.
#
# THREE constant buffers carry the camera, at sites recovered from the engine's
# own bytes and verified against the live camera on every upload:
#
#   1760 B  position +0 +16 | view +112 | view-projection +240 | previous +304
#           | ray basis +688 (position at +720) | camera-to-world +928 (+976)
#    128 B  view-projection +0            (re-uploaded per pass)
#    224 B  view +64 | inverse +128 (+176)  (the compute passes)
#
# Everything else is WORLD space - object matrices, bones, instances, lights.
# Proven, not assumed: the camera position maps to w = 0 through the projection,
# so the matrices consume world positions. Moving the eye moves only the camera.
#
# AND THE EYE OFFSET IS A PURE TRANSLATION. The runtime's two eye poses have
# IDENTICAL orientation and one shared symmetric frustum; measured 65 mm apart
# along the camera's right axis. So:
#
#   world->clip, world->view    M' = T(-d) * M     (row 3 only)
#   clip->world, camera->world  M' = M * T(+d)
#   camera position             v' = v + d
#
# No rotation anywhere. Every latch failure of TESTs 150-162 was a rotation
# applied to something that should not have had one; this mode cannot make that
# mistake because it never rotates anything.
#
# HOW IT DECIDES WHAT TO RUN TWICE - a rule, not a list of passes. An operation
# is view-dependent when it binds constants carrying the MAIN camera, or reads a
# surface an earlier view-dependent operation wrote; anything it writes then gets
# a twin of its own. The shadow cascades upload the SAME 1760-byte buffer with
# LIGHT matrices, fail the camera test, and are therefore rendered once and
# shared - both eyes see the same sun, which is correct and also free.
#
#   stereo_mode = nativestereo     select it (the VR panel has it too, as
#                                  "Native stereo - the whole pipeline, twice")
#   stereo_dup = 1                 built and allowed; 0 removes it entirely
#
# WHAT TO LOOK FOR, IN ORDER
#
#   1. STEREO AT ALL. Close one eye, then the other: two complete, lit,
#      post-processed images taken 65 mm apart. Not one raw and one finished -
#      that was the old single-frame mode, and this is what replaces it.
#   2. DEPTH. Something near - a horse's head, a weapon - should sit in front of
#      the field convincingly, with no doubling when you hold still.
#   3. SHADOWS AND EFFECTS should now hold still relative to the world when you
#      move your head. Both eyes are drawn this frame, from this head pose;
#      nothing is held from a frame ago and nothing is warped.
#   4. FRAME RATE. The GPU now shades two eyes, which is what stereo costs. The
#      CPU pays one culling pass and one animation update, unlike Full AFR which
#      pays both twice. Watch for the line reporting operations re-issued.
#
# THE LOG LINE THAT MATTERS, every 5 s:
#
#   "Stereo: N op(s) examined, M view-dependent, M re-issued for the second eye;
#    K of L camera constant upload(s) rewritten; T twin surface(s) holding ~X MB"
#
#   M near zero        nothing is being duplicated - the camera sites did not
#                      verify, and the second eye will be missing or stale
#   T zero             no twins, so nothing was written for the second eye
#   X very large       VRAM: every duplicated surface is held twice
#
# IF IT MISBEHAVES: pick any other mode in the VR panel - it switches instantly,
# mid-battle, because these modes share every view and render target. If the game
# will not run at all, put stereo_mode = afr at the end of this file.
#
# RESULT: "Shadows and effects move with my head movement. performance is
# very bad. depth is not good." The right eye was never displayed (a brace
# bug in the hand-off), 98.6% of the frame ran twice at 27 fps, and twins
# were synced after the draw instead of before. See TEST 165.
stereo_mode = nativestereo
stereo_dup = 1

# =============================================================================
# TEST 165 - NATIVE STEREO, AS THE FIRST RUN CORRECTED IT.
# =============================================================================
#
# TEST 164 reported: "Shadows and effects move with my head movement.
# performance is very bad. depth is not good." The log explained all three,
# and none of them was the camera maths:
#
#   1. THE RIGHT EYE WAS NEVER SHOWN. "Eye 1 had no image of its own on 28
#      frame(s)" every second: the hand-off that stages the duplicated eye sat
#      inside the braces of the OLD draw-duplication branch, which had already
#      marked the stage full - so it could only run when it would skip itself.
#      Both eyes showed eye 0: flat, no stereo, no right-eye depth. A flat image
#      reprojected for head movement is also what makes near surfaces - shadows
#      on the ground, effects - appear to slide with the head.
#
#   2. 98.6% OF THE FRAME RAN TWICE (298,855 of 302,962 ops; 27 fps against
#      AFR's 120). Replaying the capture offline (scratchpad taint_sim.py, which
#      reproduces the log's 98.6% exactly) named two causes:
#        - the shadow cascades upload the 1760-byte buffer with the LIGHT's
#          view-projection but the PLAYER's position still in it. The position
#          verified, so all 877 cascade draws of a frame counted as the main view.
#          Now only a world->clip or world->view site makes an upload the main
#          view - replayed: 56-59% of draws duplicated instead of 97-99%, the
#          shadow atlas single and shared again.
#        - every BOUND slot counted, including textures left bound that the
#          shader never reads, and a surface once twinned tainted every reader
#          forever. Now only the slots the shader's bytecode DECLARES count
#          (parsed at creation and cross-checked against reflection), and each
#          surface carries a state - none / in sync / stale / diverged - that a
#          full clear resets.
#      The shaders also bind textures up to t102; the old code only looked at
#      slots 0-47, so anything above was read from the wrong eye.
#
#   3. A twin was brought up to date AFTER the original operation had already
#      drawn into it, so the second eye started from the first eye's result of
#      that very draw. It is now synced BEFORE.
#
# ALSO NEW: the right eye's own scene depth goes to the compositor with it
# (none was sent before), and the log reports what the stereo code itself costs
# in milliseconds per frame, so "performance" becomes a number:
#
#   "Stereo: N op(s) examined, M view-dependent (P%) ..."    P near 55-60 is
#                                                            the replay's figure
#   "Stereo cost: X ms/frame deciding, Y ms/frame issuing"   CPU spent by us
#   "... cross-check A agree / D differ"                     D must be 0
#
# WHAT TO LOOK FOR
#   1. Close one eye, then the other: two different, complete, lit images.
#   2. Depth: near things - a horse's head, your weapon - in front of the field.
#   3. Shadows and effects fixed to the world as you move your head.
#   4. Frame rate: the heartbeat fps in BannerlordVR.log. Both eyes are now
#      rendered every frame, so half of AFR's 120 is the honest ceiling for the
#      duplicated part; TEST 164 managed 27.
#
# IF IT MISBEHAVES: any other mode in the VR panel switches instantly. If the
# game will not run, put stereo_mode = afr at the end of this file.
#
# RESULT: pending.
stereo_mode = nativestereo
stereo_dup = 1

# =============================================================================
# TEST 166 - WHO FILLS per_framef. Phase 0 of the engine late latch.
# =============================================================================
#
# WHAT THE REVERSE ENGINEERING SETTLED (2026-09-14, capture 20260913_174929 and
# the 19:09 native log). The shader .asm files in every frame map carry full HLSL
# reflection, so the 1760 B buffer has NAMES:
#
#   cbuffer per_framef:  0 g_camera_position | 112 g_view | 240 g_view_proj
#     304 g_viewproj_unjittered | 368 g_dynamic_sun_view_proj_arr[4]
#     624 g_sun_view_proj | 688 g_view_proj_inverse
#     752 g_curr_to_prev_frame_ss_matrix | 928 g_inverse_view
#
# DYNAMIC SHADOWS, TRACED: pass S84 reconstructs world position from depth R70
# (rasterised through g_view_proj by every G-buffer VS, characters included) with
# g_view_proj_inverse, projects it into the 4 cascades at 368 and writes a mask,
# R97 = postfx_shadowmap_texture. EVERY sun lighting pass (diffuse AND specular)
# and the hair/forward passes read that mask. That is why shadows, armour and
# horse-metal reflections and hair move together, and why turning dynamic
# shadows off fixes "90%".
#
# THE ENGINE IS CONSISTENT: in its own bytes the cascades are identical in all 33
# uploads and equal each caster VP times an atlas bias; 688 is the exact inverse
# of 240; 304 equals 240. So the break is what vp_patch WRITES:
#   - D is 2-6 deg while moving (D probe: 1.2-1.7 m at 20 m), zero when still;
#   - the 0.990 direction test REJECTS main views when turning fast
#     (cb 1760 @240/304 rejected 9871x at dot 0.9898) - some passes patched,
#     some not, in the same frame;
#   - read_published() is re-read per upload, so D is not pinned per frame;
#   - vp_match_prev = 1 writes a FRAME-OLD pose into 304, which the reflection
#     proves is the CURRENT unjittered VP, read by every G-buffer PS for velocity.
# A frame with two viewpoints, apart by head speed x latency. The statement at
# TEST 157/159 that "those passes ran earlier" is wrong: S84 and the lighting run
# after the G-buffer and read the same lanes.
#
# THE FIX CHOSEN: an ENGINE-SIDE LATE LATCH. Put the freshest head pose into
# rgl's own camera on the render thread BEFORE it derives per_framef, the
# cascade fit and the reprojection matrices - then vp_patch = 0 and nothing is
# rewritten after the fact, so a frame cannot hold two viewpoints.
#
# THIS RUN FINDS THE HOOK POINT. The static route is closed: the only reference
# to the string "per_framef" in TaleWorlds.Native.dll is the shader-header
