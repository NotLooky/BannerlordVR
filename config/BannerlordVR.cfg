#   NGX: hooked NVSDK_NGX_D3D11_EvaluateFeature at 00007FFA345440A0
#   NGX Color         : 2560x1440  R11G11B10_FLOAT      bind=SRV RTV
#   NGX Output        : 2560x1440  R16G16B16A16_FLOAT   bind=SRV UAV RTV
#   NGX Depth         : 2560x1440  (typeless)           bind=SRV DSV
#   NGX MotionVectors : 2560x1440  R16G16_FLOAT         bind=SRV RTV
#   NGX MV.Scale      : 1.0000, 1.0000
#   NGX Jitter        : 0.2500, -0.3889
#   NGX CreateFlags   : 0x0000003B
#   NGX Sharpness 1.000, Reset 1
#
# THE HOOK IS GOOD. Every unknown TEST 107 listed is answered, and two of the
# answers change what the correction has to be.
#
#   MV.Scale = 1, 1        the vectors are in PIXELS, not NDC and not UV. So the
#                          correction is a pixel offset and needs no render-size
