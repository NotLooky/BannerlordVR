# RESULT: TEST 105 refuted; dynamic velocities read the per-view buffer;
#         static and dynamic are not separable there.

# =============================================================================
# TEST 107 - the NGX hook, step one: find out what DLSS is actually handed
# =============================================================================
#
# TEST 106 closed the constant-buffer route for good: static and dynamic motion
# vectors share the per-view matrices, so anything written there lands on both
# and every setting is a choice about where to put the same half degree. The
# only exit left is to correct the motion vectors themselves - and they are not
# in a constant buffer. They are a texture handed straight to DLSS.
#
# So NVSDK_NGX_D3D11_EvaluateFeature is hooked. That one call carries DLSS's
# entire input set: colour, depth, motion vectors, jitter, scales and flags.
#
# WHY THIS BUILD ONLY READS
#
# The correction is a compute pass over the motion-vector texture, and it needs
# four things that are currently guesses:
#
#   FORMAT          R16G16_FLOAT and R16G16_SNORM want different maths.
#   RESOLUTION      MVLowRes decides whether the vectors are at render or output
#                   resolution, which changes the pixel-to-NDC conversion.
#   MV.Scale        DLSS multiplies by this before use. +/-render-size means the
#                   buffer holds NDC or UV motion; +/-1 means pixels. THE SIGN is
#                   the direction convention.
#   BIND FLAGS      no UNORDERED_ACCESS means the texture cannot be written in
#                   place at all, and the correction has to go through a copy of
#                   ours with the NGX parameter re-pointed at it.
#
# Guessing any one of them produces a shader that runs, writes plausible numbers
# and is wrong - which is precisely how TESTs 101, 102 and 104 each shipped a
# rotation with the sign backwards. Three sign errors in four tests is enough to
# stop guessing conventions and read them instead.
#
# WHAT TO WATCH FOR, once, on the first DLSS evaluation of a mission:
#
#   "NGX: hooked NVSDK_NGX_D3D11_EvaluateFeature at ..."
#   "NGX EvaluateFeature intercepted ..."
#     NGX Color / Output / Depth / MotionVectors : sizes, formats, bind flags
#     NGX MV.Scale / Jitter / CreateFlags
#
# THE THREE OUTCOMES, decided now:
#
#   the lines appear
#       every unknown is answered and the correction shader can be written
#       against measured facts. Colour vs Output sizes give the upscale ratio;
#       MotionVectors against Colour gives MVLowRes directly, without trusting
#       the flag bit.
#
#   "loaded but does not export NVSDK_NGX_D3D11_EvaluateFeature"
#       the title drives DLSS through D3D12, or the driver routes evaluation
#       elsewhere. The hook moves to the D3D12 entry point.
#
#   nothing at all
#       _nvngx.dll never loads into the process, which would mean this DLSS is
#       not going through NGX in the way assumed - and that is worth knowing
#       before another line of shader is written.
#
# The hook is read-only. It cannot change a pixel, and ngx_hook = 0 disables it.
#
# RESULT: pending.
ngx_hook = 1

