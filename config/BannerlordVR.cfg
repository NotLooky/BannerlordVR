# =============================================================================
# TEST 128 - the pose lead was measured in DISPLAY periods, not real frames
# =============================================================================
#
# Reported: "when fps and frametime get worse the head resistance and delay get
# stronger". TEST 78 recorded the same relationship and read it as a cost problem
# - spend less CPU, get frames back, get responsiveness back. That is true but it
# is not the whole of it, and the other half is a bug.
#
#   locate_views_ahead(displayTime, period, ...)
#       ahead = displayTime + period * pose_lead_frames
#
# `period` is frameState.predictedDisplayPeriod - the HEADSET's period. 11.1 ms at
# 90 Hz, and it does not change when the game slows down.
#
# But the head-to-photon path runs at the GAME's frame rate. At 45 fps the pose
# the engine renders with is a full 22 ms stale, while the prediction still
# covers 11.1. The correction is HALF what is needed - and the shortfall grows
# exactly as the frame time grows. That is the reported behaviour word for word:
# the resistance is not the frame rate being felt directly, it is the prediction
# silently under-covering it.
#
# At a locked 90 the two are identical and nothing was ever wrong, which is why
# this never showed up in a good run and only appears when the frame rate dips.
#
# THE FIX: lead by the MEASURED frame interval, with the display period as a
# floor.
#
#     step = max(predictedDisplayPeriod, measured Present-to-Present interval)
#     ahead = displayTime + step * pose_lead_frames
#
# The interval is an exponential average (7:1), because a prediction that jitters
# is worse than one that is slightly short - a single long frame nudges the lead
# instead of jerking it. Hitches over 200 ms are ignored outright, and the whole
# thing is clamped to four display periods so a stall cannot fling the pose into
# next week.
#
# At 90 fps: step == period, behaviour unchanged, byte for byte.
# At 45 fps: step doubles, and the prediction covers the latency it is there to
#            hide instead of half of it.
#
#     pose_lead_adaptive = 1    (default; 0 restores the fixed display period)
#
# THIS IS NOT A SMOOTHING FILTER and does not add latency - it does the opposite.
# It predicts further ahead only when the frame took longer, which is precisely
# when more prediction is needed.
#
# WHAT TO EXPECT: at a steady 90 nothing should change at all - if it feels
# different there, something is wrong with the measurement rather than the idea.
# The gain is in the dips: a frame-rate drop should stop dragging the head with
# it. The remaining floor is the compositor's own reprojection, and depth_layer
# is 0 so that is rotation-only - which covers head TURNS but not head
# TRANSLATION, and turns are the larger part of the feel.
#
# RESULT: pending.
pose_lead_adaptive = 1

