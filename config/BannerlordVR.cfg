# TEST 105 RESULT: REFUTED. Characters shook again and head resistance returned.
# Reverted to the TEST 104 state, which is where this now rests.
#
# TEST 105 predicted, in writing and in advance, that carrying D onto the
# previous slot could not touch the characters, "by construction rather than by
