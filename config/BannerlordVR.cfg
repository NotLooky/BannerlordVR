#
#   MotionVectors bind     SRV + RTV, and NO UNORDERED_ACCESS. It cannot be
#                          written by a compute shader in place. It CAN be
#                          rendered into, which is the way in: draw a full-screen
#                          pass that reads a copy and writes the corrected vectors
#                          back through the RTV, or correct into a texture of ours
#                          and re-point the NGX parameter at it.
#
#   0x3B decoded          IsHDR | MVLowRes | DepthInverted | DoSharpening |
#                         AutoExposure. MVJittered is CLEAR - the vectors do not
#                         carry the sub-pixel jitter, so the correction must not
#                         add it either.
#
# BUT THE SIZES ARE THE DESKTOP WINDOW, NOT THE EYE. 2560x1440 is the monitor;
# the headset eye is 3400x3468. And Reset = 1 is a history reset, which is what a
