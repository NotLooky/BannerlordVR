vp_latch = 0.5

# =============================================================================
# TEST 104 - the "fix" in TEST 102 negated the axis; scaling is now axis-free
# =============================================================================
#
# TEST 103 RESULT: "head movement is delayed and has resistance" at
# vp_latch = 0.5. Resistance is this file's word for a gain error, and at half
# latch there should be no gain error at all - only a smaller lag. So the value
# was not doing what it says.
#
# IT WAS NOT. TEST 102 "corrected" the axis extraction and the correction was
# itself wrong. Checked against the rebuild's own storage this time, with a
# rotation about z, for which the Rodrigues code writes m[1] = +s and m[4] = -s:
#
#     (m6-m9, m8-m2, m1-m4)  ->  (0, 0, +2s)  ->  axis (0,0,+1)   CORRECT
#     (m9-m6, m2-m8, m4-m1)  ->  (0, 0, -2s)  ->  axis (0,0,-1)   NEGATED
#
# The first is TEST 101's original and it was right. TEST 102 replaced it with
# the second, so vp_latch = 0.5 applied HALF THE ROTATION BACKWARDS: the view
# both lagged the head and under-rotated, which is precisely "delayed and has
# resistance". TEST 101's only genuine bug was the translation, and that fix was
# correct and is kept.
#
# THREE SIGN/CONVENTION ERRORS IN FOUR TESTS, all in the same handful of lines.
# So the axis is gone entirely rather than corrected a third time:
#
#     R(a) = orthonormalise( I + a * (R - I) )
#
# a = 1 returns R exactly. a = 0 returns I exactly. There is no axis, no
# handedness and no storage convention to get backwards - the only way to be
# wrong is to be wrong about linear algebra that has no sign in it. The
# first-order error is O(theta^2) and theta is under a degree, which is about
# three parts in a hundred thousand of a radian: far below anything a headset
# resolves. The rows are re-orthonormalised afterwards, because a linear blend
# of two rotations is very nearly but not exactly a rotation and a non-orthonormal
# matrix would shear every view in the frame.
#
# The translation is still rebuilt as c*(I - R(a)), which is what keeps the
# rotation pivoting on the camera and what stopped the sky tearing.
#
# vp_latch = 0.5 stands, and it should now mean what it says: half the latch,
# half the smear, half the crispness, and NO resistance - because a partial
# rotation applied in the correct direction is a smaller correction, not a
# backwards one.
#
# IF RESISTANCE IS STILL THERE at 0.5, then it is not the scaling, and the thing
# to conclude is that partial latching is not a usable middle at all - in which
# case the honest options are the two endpoints, 1.0 (crisp, smeary) and 0
# (soft, clean), and the choice is a preference rather than a bug.
#
# RESULT: pending.

# =============================================================================
# TEST 105 - carry the same D onto the engine's OWN previous matrix
# =============================================================================
#
# TEST 104 RESULT: better and stable at vp_latch = 0.5, with the axis-free
# scaling. Remaining: ground textures - sand especially - smear and ghost.
#
# WHY THE GROUND AND NOT EVERYTHING
#
# Static motion vectors are built from this buffer's two main-view matrices, and
# only ONE of them is in the latched frame: we rewrite the current view with D
# and leave the previous view as the engine wrote it. Every static pixel
# therefore gets a motion vector carrying a head turn that never happened.
#
# It shows on the ground first because that is where depth changes fastest per
# pixel and where the detail is finest - a grazing surface turns a small screen
# error into a large step along the texture, and sand has no low frequencies to
# hide it in. This file's own depth-layer note picks out the same surface for
# the same reason: "the error is largest exactly where depth changes fastest per
# pixel - ground seen at a grazing angle, which is most of the lower field of
# view".
#
# THE REPAIR, AND WHY IT IS NOT WHAT TEST 99 TRIED
#
# Writing the previous slot is what TEST 99 did, and it shook the characters -
# but not for the reason it appeared to. That code built the slot from
# published.prev, which is a DIFFERENT POSE: a frame older and, under AFR, the
# other eye. It did not move the previous view into the latched frame, it
# substituted something else for it.
#
# This takes the engine's OWN previous matrix, exactly as the engine wrote it,
# and applies the SAME D the live view just got:
#
#     MV = D*VPcur_eng - D*VPprev_eng = D*(VPcur_eng - VPprev_eng)
#
# Both ends in one frame. That is the engine's true camera motion expressed in
# the frame the image was actually rendered in, so static geometry cancels
# exactly and the ground stops smearing.
#
# AND IT SHOULD NOT TOUCH THE CHARACTERS. Dynamic velocities never come from this
# buffer - they are composed per object against the engine's camera - so they
# mismatch the latched image by D whether or not this slot is written. Unchanged
# from the state that made them stable, by construction rather than by hope.
#
#     vp_prev_apply_d = 1     carry D onto the engine's previous matrix (new)
#                     = 0     leave it alone (TEST 100-104 behaviour)
#
# The live view is always scanned before the previous one, so the D carried is
# this frame's, from this buffer.
#
# WATCH: "VP prev slot: N matrix(es) CARRIED in ~5 s". Expect ~3600, the same
# count that used to read as SKIPPED. If it reads 0, the live view was not seen
# first and the carry never armed.
#
# PREDICTIONS, so a partial result is readable:
#   ground/static   smearing and ghosting go - this is the whole point.
#   characters      unchanged and stable. If they shake again, then dynamic
#                   velocities DO read this buffer after all, which would be a
#                   real discovery and would mean the two cannot be separated.
#   head feel       unchanged. D is untouched; only the previous view moves.
#
# RESULT: pending.
vp_prev_apply_d = 1

# TEST 105 RESULT: REFUTED - see TEST 106. Characters shook again AND head
#         resistance returned. Reverted to the TEST 104 state.
vp_prev_apply_d = 0

# =============================================================================
# TEST 106 - the prediction was falsified, and the falsification is the answer
# =============================================================================
