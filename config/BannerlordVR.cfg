# ===========================================================================
#  BannerlordVR settings
#
#  Read by BOTH the managed mod and the native DLL at startup. Edit, save, and
#  restart the game - launch it however you normally do, Steam included.
#
#  Every line is key = value. '#' or ';' starts a comment.
# ===========================================================================

# --- Phase 4 crash isolation -----------------------------------------------
# Change ONE of these at a time. Each run's log states which setting was used,
# so a result can always be tied back to a configuration.
#
#   stereo = 0     TEST 1. No eye targets, no SceneViews, nothing touching the
#                  engine's D3D context. This is the Phase 3 configuration,
#                  which ran for many minutes without crashing. If this still
#                  crashes, the stereo path is not the cause.
#
#   copy = 0       TEST 2. SceneViews render, but nothing is copied into the
#                  OpenXR swapchain, so the headset shows flat blue/red. If
#                  this is stable, the eye copy is what breaks it.
#
#   eye_order = 5  TEST 3. Eye views render AFTER the game's own view rather
#                  than before it. If this is stable, rgl needs its own view
#                  to go first.

# TEST 1 RESULT: no crash. 27 seconds, clean exit, steady 90 fps.
#                The crash lives in the stereo path, not in the camera driver
#                or the Present hook.
#
# TEST 2 RESULT: still crashed, with the copy disabled. So the eye copy is
#                innocent; the two extra SceneViews are what break it.
#
# TEST 3 RESULT: still crashed at order 5. Render order is not the cause
#                either. So: building and enabling two SceneViews is what
#                breaks it, regardless of order and regardless of the copy.
#
# TEST 4 RESULT: stable ~55s at 90 fps with the views built but not enabled.
#                Crashed only on quit to main menu, which is a teardown bug.
#                So CONSTRUCTION is fine; RENDERING through them is the fault.
#
# TEST 5 RESULT: one enabled view crashed too, in about a second. So it is not
#                about having two renders - enabling ANY extra SceneView is
#                fatal. Building them is not.
#
# TEST 6 RESULT: WORKS. No crash, 22 s at 90 fps with both views enabled, and
#                the headset showed the real game for the first time. Enabling a
#                SceneView mid-frame was the crash; building one mid-frame is
#                fine. Native stereo rendering is running.
#
# TEST 7 RESULT: head tracking WORKS. Re-pushing the cameras each frame is safe;
#                the crash it was blamed for earlier was the mid-frame enable.
#
# Native stereo with head tracking now runs. What is left:
#   - world scale felt wrong  -> world_scale below
#   - crash on pressing Ready -> the eye views outlived their scene; they are
#                                now dropped as soon as the scene changes
#   - headset froze after a while while the monitor stayed fine -> not yet
#                                explained; see the note on that below
# stereo = 0
# copy = 0
# eye_order = 5
# eye_enable = 0
# TEST 16: eyes = 1 - ONE extra view instead of two, so the frame contains two
#          scene renders (engine + ours) rather than three.
#
#          If rgl draws each dynamic mesh once per frame and the first view to
#          ask claims it, then dropping from three renders to two should show a
#          clear difference. This decides the architecture:
#
#            LEFT eye correct (and monitor stops flickering) => two renders are
#              survivable, and the way forward is to retarget the ENGINE own view
#              to one eye and add a single view for the other. Two renders total,
#              full rate, real stereo.
#            Still corrupt => even two simultaneous renders conflict, and no
#              arrangement of SceneViews will give native stereo on 1.4.8.
#
#          Judge with ONE EYE CLOSED - only eye 0 is being rendered, so the other
#          eye will show a stale image. That is expected.
# ===========================================================================
#  AFR MODE - alternate-frame rendering
# ===========================================================================
# rgl cannot render one scene into two views in the same frame: with two views
# live, skinned meshes come out in pieces on the monitor as well as in the
# headset, and removing the engine own view crashes it. AFR does not add a view
# at all - it retargets the ENGINE own view into our eye texture and swings its
# camera between the eyes on alternate frames. One render, one claimant.
#
# Each eye updates at 45 Hz, but both are submitted every frame from held
# copies, each carrying the pose it was really rendered with, so the compositor
# reprojects the older eye rather than smearing it.
afr = 1

# Native stereo needs BOTH. This read "eyes = 1" for the whole of the AFR era -
# a leftover from bisecting the old stereo crash, harmless while nothing read it,
# and the entire reason native stereo showed a left eye and nothing else (TEST 40).
eyes = 2
eye_init = scenestart
eye_pushcam = 1

# TEST 8: anchor = camera. Pressing Ready spawns your character, which is the
#         moment MainAgent first exists and the anchor switches from the engine
#         camera to agent.GetEyeGlobalPosition() on an agent that is mid-spawn.
#         That code path switches on exactly when the game crashes.
#         Stable on Ready => the agent anchor is the cause.
#         Still crashes    => it is not, and the transition itself is.
# TEST 8 RESULT: still crashed with anchor = camera, so the agent anchor is
#                innocent. Windows Application Error log, every crash:
#                  faulting module  TaleWorlds.Native.dll  (rgl, not our DLL)
#                  exception        0xC0000005 access violation
#                  fault offset     0x323c14, IDENTICAL across runs
#                Deterministic, inside the engine. With the flickering agents,
#                this looks like per-agent per-view state: rgl sizing arrays for
#                its own view count while our extra views run past the end.
#
# TEST 9 is now active: agent contour (the outline/highlight pass) off for the
#                eye views. It is per-agent per-view state, so it is the single
#                best candidate for both the flicker and the fault.
anchor = agent
# Where the eyes sit on that agent - and the fix for "stuck inside the horse".
#
# The anchor used Agent.GetEyeGlobalPosition(), which sounds like the right
# function and is not one the game ever uses as a camera. MissionScreen calls it
# in exactly one place, to place the AUDIO LISTENER. It is the agent's GROUND
# position plus an eye height, and a rider's ground position is the HORSE's - so
# mounted it put the camera a standing man's height above the ground the horse
# stood on, which is roughly the animal's shoulder. That is the whole of "my
# character is stuck inside the horse": not a stuck camera, a camera placed as
# though you were standing where the horse is.
#
# THE FIRST ATTEMPT AT FIXING IT, AND WHY IT IS NOT THE DEFAULT
#
# The obvious replacement was the head bone, since that is where a head is. It
# was wrong in a way that only showed up because the log was made to print both
# answers and the gap between them:
#
#   the old Agent.GetEyeGlobalPosition said (423.81,765.31,16.44),
#   the one now in use says (434.23,759.62,17.67). Difference 11.93 m
#
# Nearly twelve metres, of which only 1.23 m was height. An eye point cannot be
# twelve metres from the agent it belongs to, so the bone was being read in one
# space and composed in another. The visible result was an anchor beside the
# horse rather than on it - which is also why the hands were nowhere near the
# player, since the hands are placed relative to the same anchor.
#
# WHAT IT USES NOW
#
# The formula MissionScreen itself uses, which needs no skeleton at all. It
# appears twice in UpdateCamera - once for the third-person follow target and
# once for vertical aim correction - and both copies agree:
#
#   mounted:  (mount.RiderCameraHeightAdder + mount.BodyCapsulePoint1.z
#              + mount.BodyCapsuleRadius) * mountScale
#             + rider.CrouchEyeHeight * riderScale
#   on foot:  (crouching ? CrouchEyeHeight : StandingEyeHeight) * riderScale
#
# added to Agent.Position. The mounted line is written to be added to exactly
# the ground position that made GetEyeGlobalPosition wrong, so the thing that
# broke the old answer is what makes this one right.
#
# It is also STEADIER than a bone: a head bone bobs with the walk cycle and
# swings with every animation, while this is a function of the mount and the
# rider and nothing else. The horizon does not lurch each time the horse takes
# a stride.
#
#   head    the game's own first-person camera height. The default.
#   bone    the head bone's entitial frame - the first attempt above. Kept so
#           the comparison can be made from the config rather than a rebuild.
#   stable  MBAgentVisuals.GetGlobalStableEyePoint - taken from the visuals, so
#           also mount-correct. Try this if you prefer it.
#   eye     the old Agent.GetEyeGlobalPosition, kept so the fault can be
#           reproduced rather than taken on trust.
#
# The first time you mount, the log prints both answers and the gap between
# them. That height is how far inside the horse the old anchor was.
anchor_eye = head
# TEST 9 RESULT: contour off, SAME fault offset 0x323c14. Not contour.
#                Four crashes now at one identical rgl instruction, across
#                anchor=agent, anchor=camera and contour on/off.
#
# TEST 10 needs no config change at all: start a custom battle with ARMY SIZE
#                set to the MINIMUM on both sides. If the per-agent per-view
#                theory is right, few agents should survive far longer, or not
#                crash at all, where 100-a-side dies in about 15 seconds.
eye_contour = 0

# TEST 13: scene_occlusion = 0.
#
# rgl computes occlusion culling once per frame from the PRIMARY view. Our eye
# views inherit that result, so anything the engine own flat camera cannot see
# is thrown away as occluded before we draw - which is exactly why characters
# render near the middle of the map and vanish when you leave it.
#
# Turning occlusion off makes every view cull for itself. It costs draw calls,
# so watch the frame rate as well as whether characters appear everywhere.
scene_occlusion = 0

# TEST 15: engine_view = 0 - switch OFF the engine own scene view.
#
# The MONITOR shows the same broken agents as the headset: floating heads and
# hands, bodies gone, flickering frame to frame. So our extra views are not just
# failing to see things, they are corrupting the engine own render. That is the
# signature of a "draw each mesh once per frame" optimisation - with three views
# competing, each entity is claimed by whichever view asks first.
#
# With this off, only our two eye views remain. THE MONITOR WILL FREEZE OR GO
# BLACK - that is expected and is the whole point. Judge the HEADSET only.
#
#   Agents whole in the headset => theory confirmed. The fix is to stop asking
#     the engine to render the scene more than once per frame.
#   Still broken                => the conflict is not between views, and two
#     simultaneous scene renders are unsupported outright.
# TEST 15 RESULT: crashed 0.15 s in, at a THIRD fault site (+0x5B392F), same
#                 rgl worker thread. The engine own view is required - removing
#                 it is worse than the corruption it causes. Reverted to 1.
engine_view = 1

# TEST 14: eye_order = 5 - render the eye views AFTER the engine own view.
#
# Geometry appears only within ~15 m of the SPAWN POINT and keeps rendering
# there after you ride away, so the visible set is anchored where the views
# were created rather than following the camera. At order -10 our views draw
# FIRST, before the engine has updated scene visibility for this frame.
# Drawing after it means the scene state is already current for the player
# position when our eyes read it.
#
# Order 5 crashed back in TEST 3 - but that was under the old mid-frame enable,
# which crashed at every order. Worth retrying now that the views are built
# correctly.
eye_order = 5

# --- world scale -----------------------------------------------------------
# Multiplies eye separation AND head movement together, so the world changes
# size without leaning stopping matching.
#
# LARGER makes the world look SMALLER. Try 1.1 if everything feels oversized,
# 0.9 if it feels like a doll's house. Judge against something you know the size
# of - a horse, a doorway - and expect the right answer within 10-20% of 1.0.
# TEST 17: symmetric_fov = 1.
#
# The missing geometry survived EVERY change to view count - three views, two,
# one, and finally AFR with a single render per frame. So competing views were
# never the cause. The one thing constant across all of them is that we hand the
# engine an off-axis (asymmetric) view volume via SetViewVolume.
#
# If rgl culls against a symmetric cone derived from the camera rather than
# reading the volume, everything outside that cone is thrown away - present near
# the centre, missing toward the edges and at range, which is what you describe.
#
# This substitutes a symmetric frustum that CONTAINS the real one, so it cannot
# cull less than the truth. Each eye image will be slightly off-centre - that is
# a diagnosis, not a shipping setting. If the geometry comes back, we have the
# mechanism and can fix it properly.
# (TEST 34: superseded by mode = engine-camera) symmetric_fov = 0

world_scale = 1.10

# How far the HANDS move for a given movement of your real ones. 1.0 is
# one-to-one, and is what you want unless you have a reason.
#
# This used to be world_scale, because world scale multiplies every stage-space
# translation and the controllers are one of them. At world_scale 1.10 a hand
# moved ten centimetres moved eleven - which reads exactly as reported: the
# virtual hand runs ahead of the real one.
#
# They are not the same question. World scale is about how big the world is
# around you, and it is judged by looking at a building. This is about whether
# your hand is where your hand is, and it is judged by proprioception, which has
# no opinion about the first and a very firm one about the second. A hand that
# consistently overshoots is more disorienting than a world that is slightly the
# wrong size, so the hands get their own number and it defaults to honest.
#
# Raise it above 1 only if you want to reach further than your arm - which is a
# real thing some VR games do deliberately, and is not the default here.
hand_scale = 1.0

# --- render settings -------------------------------------------------------
# Fraction of the runtime's recommended eye size. 0.25 to 1.0.
# Full size on a Quest 3 is 2764x2940 per eye, which is 16 MP a frame for the
# pair before the game's own view is counted.
# AFR halves the scene-render cost, so spend it on resolution: undersampling is
# the main source of shimmer, and this fights it directly. Drop to 0.7 if the
# frame rate cannot hold 90.
render_scale = 1.00

# Eye view features. Both start off while the crash is being isolated; turn
# them back on one at a time once it is stable.
# TEST 11: make the eye views match the engine own view instead of a
#          stripped-down one. The crash stack shows rgl reading a NULL pointer
#          at +0x50 on its own worker thread, five frames deep, with our code
#          nowhere in the call path - a structure it expects our view to have.
#          postfx and shadows have been OFF for every crash so far, which is a
#          configuration the engine itself never runs. Missing characters and
#          textures point the same way: an under-configured view.
eye_shadows = 1
eye_postfx = 1

# Let the engine allocate the eye depth buffers. Setting this to 0 uses our own
# Texture.CreateDepthTarget, which produces a 16-bit buffer with no stencil and
# crashed the renderer within seconds.
eye_autodepth = 1

# Take over the monitor's camera too, so the desktop follows your head.
# Off by default. The engine stops maintaining CombatCamera once CustomCamera is
# set - its HorizontalFov stays 0.000 - so any camera handed to it renders
# through a broken frustum with no terrain and no agents. The headset does not
# need this: the eye SceneViews render on their own.
# TEST 12: mirror_camera = 1.
#
# Characters and textures render near the middle of the map and vanish away
# from it. That is the engine culling for ITS OWN primary camera once per frame
# and our eye views inheriting the result - anything outside the flat camera's
# frustum is gone before our eyes are drawn.
#
# Handing the engine our head-tracked camera makes its visible set follow the
# head. The monitor will look stretched again (it borrows the eye frustum,
# because the engine stops maintaining CombatCamera once CustomCamera is set)
# - that is a known, accepted cost of this test, not a new bug.
# TEST 12 RESULT: CRASHED 15 ms after the views were built, at a NEW offset
#                 TaleWorlds.Native.dll+0x81D5E reading 0x30C00, on two threads.
#                 Handing the engine our camera is not viable - it is what made
#                 earlier runs die in about a second too. Reverted to 0, which is
#                 the configuration that ran eight minutes clean.
mirror_camera = 0

# --- diagnostics -----------------------------------------------------------
# Reads back one pixel of the left eye texture each second to check whether
# anything is actually drawing into it. Stalls the GPU once a second; leave off
# unless you are chasing a black or frozen headset image.
pixel_probe = 0

# TEST 18: afr_camera = 0 - retarget ONLY, do not touch the camera.
#
# Every test so far varied the VIEW COUNT: three views, two, one, AFR. None
# varied this. The engine renders its OWN ordinary view - its own frustum, its
# own near plane, its own position - into our eye texture, and nothing else
# changes.
#
#   characters still missing => the eye RENDER TARGET is the cause: its size,
#     its format, or its depth buffer. The camera cannot be blamed; we did not
#     touch it.
#   characters come back     => the CAMERA is the cause: the 0.05 m near plane,
#     the view volume, or where we put it.
#
# The headset will be flat, monoscopic and NOT head-tracked for this run. That
# is intended. Judge only whether the world DRAWS, not where it is.
afr_camera = 1

# TEST 19: eye_projection = engine - our POSE, the engine's FRUSTUM.
#
# TEST 18 settled it: with afr_camera = 0 the world drew perfectly into the SAME
# eye texture with the SAME depth buffer. The render target is innocent. The
# camera is the fault.
#
# But "the camera" is still two things: where we put it, and what frustum we give
# it. This gives the eye cameras the engine's own horizontal FOV and aspect while
# head tracking still moves them.
#
#   geometry draws => the PROJECTION was the fault. Narrow it with eye_near
#                     below: 0.05 is 2-5x closer than the engine's own.
#   still missing  => the POSE was the fault - where we put the camera.
#
# The image WILL be stretched: the engine's 1.778 aspect rendered into a 0.964
# target. Ignore it. Judge only what DRAWS.
eye_projection = runtime

# Near plane for the eye cameras. 0.05 m was chosen so you can put your face
# through a wall; the engine's own is several times further out. Only consulted
# once eye_projection has been narrowed down.
eye_near = 0.05

# TEST 20: camera probe. No behaviour change at all - one log line a second.
#
# TEST 19 (eye_projection = engine) was a BAD TEST and its result must be
# discarded. It read combat.HorizontalFov and wrote that back onto the eye
# camera, but during AFR the engine copies our eye camera INTO CombatCamera - so
# it was a read-modify-write loop feeding on itself. The engine FOV climbing
# 1.695 -> 1.885 -> 2.260 rad in one mission is that loop, and a runaway frustum
# is why everything vanished. It says nothing about pose vs projection.
#
# What the loop DOES reveal is structural, and this mod already wrote it down
# once, next to MirrorCam: handing a camera to CustomCamera / SceneLayer.SetCamera
# makes the engine reconfigure that camera every frame. AFR hands it an EYE
# camera. So the frustum the scene is rendered and culled with may never be the
# one we set.
#
# The probe reads the eye camera back at the top of the frame, before we write to
# it, and prints it beside what we last set. If they disagree, that is the bug,
# and it has been in every single test since AFR was introduced.
camera_probe = 0

# =============================================================================
#  FIX: afr_shared_camera - ONE camera, bound once, moved in place.
# =============================================================================
# The camera probe settled the last open question: READBACK matched WE SET
# exactly, every second, so the engine never overwrote our frustum. What it did
# do was far simpler and had been in front of us the whole time.
#
# AFR was handing the engine a DIFFERENT camera object every frame -
# EyeCameras[0], then [1], then [0] - through CustomCamera and
# SceneLayer.SetCamera, at 90 Hz.
#
# This mod already knew that was fatal. VrStereoRenderer.PushCameras says so in
# its own comment: "Calling SetCamera every frame took the crash from 55 seconds
# down to under one: rgl does real work per call and does not expect to be
# re-pointed at 90 Hz." That path defaults eye_pushcam = 0 and moves its cameras
# IN PLACE. AFR did the opposite, and worse: alternating objects means no
# same-camera fast path can absorb it, so a full rebind ran on every frame.
#
# Whatever rgl accumulates per camera - visible sets, occlusion, streaming, the
# per-agent bookkeeping skinned meshes need - never got a chance to converge.
# Cheap always-visible geometry survived. Everything resolved per frame did not.
# That is exactly "the enemy army is visible far away and disappears as it gets
# close, and my own army was never there at all".
#
# Now: one camera object, bound once in OnSceneRenderingStarted, and per frame
# nothing but a LookAt. Both eyes already share a frustum under symmetric_fov
# (the log shows eye 0 and eye 1 at the identical vfov 1.920 / aspect 0.964), so
# the only thing that differs between them is 6.5 cm of position.
#
# Set to 0 to get the old every-frame rebind back, for comparison.
afr_shared_camera = 1   # superseded by afr_camera_mode below

# =============================================================================
#  afr_camera_mode - how the head pose reaches the engine's render camera
# =============================================================================
# afr_shared_camera = 1 made it WORSE: nothing but sky. That is the real clue.
# Binding our camera more stably did not help, it helped the failure - one bound
# camera left the visible set frozen and the world collapsed entirely.
#
# The answer was already written in this mod, in CameraPatch, explaining why the
# mirror path is off by default:
#
#     "the engine stops maintaining CombatCamera once CustomCamera is set, so its
#      HorizontalFov sits at 0.000 forever and ANY CAMERA WE HAND IT RENDERS
#      THROUGH A BROKEN FRUSTUM - NO TERRAIN, NO AGENTS"
#
# No terrain, no agents. That is the symptom, documented in this codebase as a
# known consequence of setting CustomCamera. AFR sets CustomCamera.
#
#   engine  DEFAULT. Never sets CustomCamera. Moves the ENGINE'S OWN CombatCamera
#           in place, in the OnFrameTick postfix, so the engine has already done
#           its own update and ours is the last write before the scene renders.
#           The engine keeps every piece of state it maintains, because as far as
#           it knows nothing was replaced.
#   shared  one camera of ours, bound once via CustomCamera  (sky only)
#   eye     the original: a new camera object every frame     (partial geometry)
#   off     do not touch the camera at all                    (renders perfectly)
# (TEST 33: superseded by mode = engine-camera) afr_camera_mode = off

# Apply the HEADSET frustum to the engine's own camera. Off on purpose for this
# run: the engine's own FOV draws the world correctly, and a wrong FOV is a much
# smaller problem than an empty world. Turn on once geometry is proven.
# (TEST 33: superseded by mode = engine-camera) afr_engine_fov = 0

# TEST 22 note: afr_engine_fov is now 1.
#
# afr_camera_mode = engine WORKS - terrain and characters are back. The engine's
# own camera, moved in place, never handed over. That was the whole bug.
#
# What is still wrong is the FRUSTUM: the world is being drawn with the engine's
# 97 degree flat FOV while the headset needs 108, so scale and stereo will feel
# wrong even though everything is present.
#
# This applies the headset frustum to the engine's own camera - but compares
# before writing, because blindly rewriting a camera at 90 Hz is the call this
# repo has twice recorded as fatal. Watch for:
#
#   "Engine FOV hold: N correction(s) in the last ~5 s"
#
#   N stays 0 after the first  => setting it once holds. Done.
#   N climbs by ~450 every 5 s => the engine overwrites us every frame, and the
#                                 projection cannot live on its camera at all. It
#                                 then has to move to the native side, patched
#                                 into the view-projection constant buffer - which
#                                 is how VR injectors normally do this anyway.

# TEST 22 RESULT: the engine OWNS CombatCamera outright.
#
#   Engine FOV hold: 450 correction(s) in the last ~5 s
#                    (have 2.260/1.778, want 1.885/0.964)
#
# 450 corrections in 5 s at 90 fps is EVERY FRAME. We write the headset frustum;
# the engine writes its own back before the next frame. Head tracking not working
# says the same thing about the POSE: our LookAt is overwritten too.
#
# So all four managed routes are now exhausted:
#
#   CustomCamera, new camera per frame   geometry broken
#   CustomCamera, one camera bound once  sky only
#   move CombatCamera in place           geometry perfect, camera not ours
#   do not touch the camera              geometry perfect, camera not ours
#
# Every route that renders correctly renders from the ENGINE'S camera, and every
# route that injects ours breaks the scene. There is no managed seam left.
#
# afr_engine_fov back to 0: it was making 90 expensive SetFovVertical calls a
# second - the call this repo twice recorded as fatal - and achieving nothing.
# (TEST 33: superseded by mode = engine-camera) afr_engine_fov = 0

# =============================================================================
# TEST 23 - view-projection patching (the rebuild)
#
# TEST 22 closed out the managed approach for good:
#
#   Engine FOV hold: 450 correction(s) in the last ~5 s
#
# 450 corrections in five seconds at 90 fps is every single frame. The engine
# rewrites CombatCamera's frustum, and head tracking not working says it
# rewrites the pose too. All four managed routes are exhausted, and every one
# that renders the world correctly is a route where the camera is entirely the
# engine's.
#
# So the camera is left alone - afr_camera_mode = off, the mode that rendered
# terrain and characters perfectly - and the head pose is applied downstream
# instead, by substituting the view-projection matrix in the constant buffer on
# its way to the GPU. The engine never sees it and has nothing to overwrite.
#
# What to look for in BannerlordVR.Native.log:
#
#   "ID3D11DeviceContext::Map hooked at ..."   the hooks went in
#   "VP site: cb ... bytes, offset ..."        the matrix was found, and the
#                                              line reports the engine's real
#                                              frustum in degrees
#   "VP patch: N view + M inverse matrices..." every ~5 s, the running rate
#
# If instead you see "matched no main view matrix", the matrices are not
# arriving through Map/Unmap and the "VP near miss" lines say what was close.
# =============================================================================
# (TEST 33: superseded by mode = engine-camera) vp_patch = 1

# Log the first 16 matrices matched, with the camera and frustum recovered from
# each. Cheap, and the only way to know the predicate is right.
vp_scan = 1

# Submit the frustum the engine is MEASURED to be rendering with, rather than
# the runtime's. The compositor undistorts using the fov we submit, so these two
# disagreeing is exactly what made the world the wrong size and the eyes fight.
vp_fov = 1

# 0 = keep the engine's frustum and submit it (correct scale, unrendered space
#     at the edges of the headset's wider view, nothing culled that would
#     otherwise be drawn)
# 1 = reshape clip space so the engine renders the headset's full frustum
#     (full field of view, but objects just outside the engine's own narrower
#     frustum are culled before they reach the GPU and will pop at the edges)
# Start at 0. It cannot introduce a new artifact; 1 can.
vp_fov_expand = 0

# Also replace the clip->world matrices, so deferred lighting, fog and
# screen-space effects reconstruct positions in the same world the geometry was
# drawn in. Turning this off is the first thing to try if the lighting looks
# detached from the scene.
vp_patch_inverse = 1

# Cosine of the largest angle between a candidate matrix's forward axis and the
# engine camera's, for it to count as the main view. 0.990 is about 8 degrees,
# which covers a frame of fast mouse turning without letting a reflection or
# shadow camera through.
vp_dir_tol = 0.990

# =============================================================================
# TEST 24 - finding the door the view constants come through
#
# TEST 23's build hooked Map, Unmap and UpdateSubresource successfully, and then
# reported, every five seconds for the whole run:
#
#   VP patch: 0 view + 0 inverse matrices replaced over 0 constant buffer
#             uploads in ~5 s; no main view frustum measured yet.
#
# ZERO uploads scanned - not "scanned and did not match". Nothing reached the
# scanner at all. That is not a matrix-recognition problem, it is an
# interception problem, and the old log could not say which link in the chain
# broke. This build makes it say so, and fixes the three plausible causes at
# the same time so a single launch can settle it:
#
#   1. rgl records draws on DEFERRED contexts. Immediate and deferred contexts
#      are different classes in the D3D11 runtime with different vtables, so
#      hooking one does not catch the other. The deferred vtable is now hooked
#      too, via a throwaway context - the same probe trick already used for the
#      swapchain.
#   2. The view constants live in a buffer larger than the old 8192-byte cap.
#      The cap is now 65536, which is the D3D11 limit for a constant buffer, so
#      it can no longer exclude anything legal.
#   3. The engine uses UpdateSubresource1 (11.1) rather than UpdateSubresource.
#      Now hooked as well.
#
# The 5-second line now reads like this when nothing is being patched:
#
#   VP patch idle. Map N (buffer N, constant N, recorded N) | Unmap N (matched
#   N) | UpdateSubresource N (constant N) | scanned N, no publication N, ...
#
# How to read it:
#   Map 0                     -> the hooks are on a vtable nothing calls
#   Map big, buffer 0         -> only textures come through Map
#   buffer big, constant 0    -> the view constants are not in a constant buffer
#   constant big, scanned 0   -> the size cap or the publication is at fault
#   scanned big, 0 patched    -> the matrices ARE there and the predicate is
#                                wrong; the "VP near miss" lines say by how much
#
# There is also a one-time "Constant buffer census" listing every distinct kind
# of constant buffer the engine maps - size, bind flags, usage, map type. That
# is the shape of what rgl actually uploads, which until now was guesswork.
# =============================================================================

# Largest constant buffer to scan. 65536 is the D3D11 maximum for a single
# constant buffer, so this excludes nothing legal. Lower it only if the scan
# ever shows up as frame time.
vp_max_cb_bytes = 65536

# =============================================================================
# TEST 25 - it works. Now the second-order problems.
#
# TEST 24's hypothesis was right. The D3D11 runtime re-points its context method
# implementations after startup, and every hook was sitting on a dead function:
#
#   Slot 14 (Map) moved: ...B74A35B0 -> ...B74C2CD0. Re-hooking.
#   Slot 15 (Unmap) moved: ...B74F9460 -> ...B74CB380. Re-hooking.
#   Slot 7 (VSSetConstantBuffers) moved: ...B7513D20 -> ...B74CAEE0. Re-hooking.
#
# Once re-hooked, Map went from 0 to 25518 in five seconds and the matrices
# appeared immediately:
#
#   VP patch: 27000 view + 4500 inverse matrices replaced over 48502 constant
#             buffer uploads in ~5 s (60.0 view/frame).
#             Engine frustum 97.1 x 65.0 deg.
#
# Head tracking and stereo now work. What is left:
#
#   1. SHAKING characters. rgl's per-view buffer holds TWO main-view matrices,
#      64 bytes apart (offsets 240 and 304). The second is the PREVIOUS frame's
#      view-projection - what a temporal renderer uses for motion vectors.
#      Rewriting both with the current eye's matrix says "nothing moved", which
#      is false every frame and doubly false under AFR where consecutive frames
#      are different EYES. Each matrix is now matched against the current AND
#      previous camera and mapped to the eye it actually belongs to.
#
#   2. BLACK SKY. The position predicate is now strict. The first working run
#      recovered camera positions matching the engine's exactly - "d(ref) 0.00"
#      on every site - so position is a free, exact discriminator. The old
#      lenient form also accepted matrices whose camera sits at the ORIGIN,
#      which is exactly what a translation-stripped skybox matrix looks like.
#
#   3. GEOMETRY POPPING as the head and mouse move. Not a patch bug - the engine
#      still culls against ITS camera while we render from the eye, so anything
#      outside the engine's frustum but inside ours is dropped before it ever
#      reaches the GPU. No amount of matrix work can fix that; the engine's
#      culling has to be made to follow the head. That is the next build.
#
# New line to watch:
#   VP patch sites (N distinct):
#       cb   1760 bytes  offset  240  row-vector  hits 12000 (previous-frame 0)
#       cb   1760 bytes  offset  304  row-vector  hits 12000 (previous-frame 11998)
# A site that is ALWAYS previous-frame is the motion-vector matrix. One that
# never is, is the live view.
# =============================================================================

# Require the recovered camera position to match the engine's to within this
# many metres. Was off; the evidence says it is exact, so it is now on and it
# keeps origin-centred matrices (sky, and anything else drawn camera-relative)
# out of the patch.
vp_require_pos = 1
vp_pos_tol = 10.0

# =============================================================================
# TEST 26 - making the engine's CULLING follow the head
#
# The VP patch renders from the eye. The engine still culls against its own
# camera and throws away anything outside that frustum before it reaches the
# GPU - which is why ground and characters appear and disappear as you move.
# Measured, the engine renders 97.1 x 65.0 deg while the headset wants 94 x 99,
# so the vertical is short by more than a third before the head even turns.
#
# So the engine's camera is now STEERED at the head. It is not used to render -
# the VP patch still does that, exactly, from the live pose - it decides what is
# worth drawing.
#
# The trap, and the one line the whole design turns on: the eye pose is body-yaw
# composed with the head pose. If body yaw were read back from the engine camera
# or the agent's look direction, then pushing head yaw into the camera would
# feed straight back into the body and the world would turn TWICE as far as your
# head. So body yaw is integrated from _cameraBearingDelta - the mouse, and only
# the mouse - and never from an observation of where the camera ended up.
#
# Which way a positive bearing delta turns the world is a convention nobody
# documented, so it is MEASURED at runtime: correlate the camera's real
# world-space direction change against the input that caused it. Nothing is
# steered until the sign is known. Watch for:
#
#   Engine aim calibrated after N frames: bearing sign 1, elevation sign 1.
#
# If the world spins or turns the wrong way, set head_drive_yaw = 0 and the mod
# falls back to exactly TEST 25's behaviour.
# =============================================================================
# (TEST 33: superseded by mode = engine-camera) engine_aim = 1

# Steer the engine camera's bearing from head yaw. This is the one with the
# feedback hazard above; it is also the one that fixes horizontal popping.
head_drive_yaw = 0   # TEST 37: it cancels free head-look; see the block at the end

# Steer elevation from head pitch. No feedback risk at all - the anchor is
# yaw-only by construction, so pitch can never loop back into the view.
head_drive_pitch = 1

# Widen the engine's culling volume. CameraViewAngle is a float whose units are
# undocumented, so this SCALES it rather than setting it - scaling an angle
# works whichever unit it is in. 65 deg vertical x 1.55 lands near the headset's
# 99, which is what we need.
#
# Check it took: the native log's "Engine frustum X x Y deg" line should grow
# from 97.1 x 65.0. If it does not move, the engine recomputes the value after
# our prefix and this knob is the wrong one - but nothing is worse than before.
# (TEST 35: the engine camera gets the headset frustum directly now) engine_view_angle_scale = 1.55

# Deliberately still 0. Expanding clip space to the headset's full frustum is
# only safe once the engine is CULLING a volume that contains it; turning it on
# before engine_view_angle_scale is confirmed working would render 99 degrees of
# view out of 65 degrees of surviving geometry. Turn it on after the frustum
# line above proves the widening stuck.
vp_fov_expand = 0

# =============================================================================
# TEST 27 - undoing two of my own mistakes
#
# TEST 26 went backwards: everything flickering black. Two separate faults, both
# mine, both now visible in the log rather than guessed at.
#
# 1. THE EYE SWAP. The previous-frame matcher broke ties on which reference
#    camera was nearer, on the reasoning that when both fit "the two frames are
#    the same pose and it does not matter". Under AFR consecutive frames are
#    different EYES, so they are never the same pose, and with a still camera
#    both distances are ~0 and float noise decides. The site census caught it:
#
#      cb 1760 offset 240  hits 2756 (previous-frame 1440)   <- 52%
#      cb 1760 offset 304  hits 2756 (previous-frame 1440)   <- 52%
#
#    A real motion-vector matrix would be ~100% at one offset and ~0% at the
#    other. 52/52 is a coin flip: half of every frame's geometry was drawn from
#    the other eye. That is the black flicker. The rule is now simply "use the
#    previous frame only when the current one does not fit at all".
#
# 2. THE RUNAWAY. Steering the engine camera never converged -
#
#      Engine aim: body yaw 180.0, head yaw -17.5, camera at 66.4 (error 96.15)
#      Gain/600f: headset 158.0 view 875.4 (x5.54) | engine yaw 754.1
#
#    - a hundred degrees of error every frame and the camera spinning 754
#    degrees while the head moved 158. Writing CameraBearing does not move the
#    camera the way that loop assumed, and the sign was latched off a score of
#    exactly 8 from a handful of probe frames. Now: corrections are capped at a
#    nudge per frame, calibration needs a score of 20, and the loop shuts itself
#    off after two seconds of not converging. Off by default until it is shown
#    to converge on a run with nothing else in flight.
#
# 3. THE BLACK SKY IS THE LETTERBOX. CameraViewAngle reads 65.000 - vertical
#    degrees. Sixty-five degrees of image inside a ninety-nine degree display
#    has hard black above and below it, which is exactly what the headset photo
#    shows. Writing the backing field did nothing (the frustum never moved off
#    97.1 x 65.0), so the engine recomputes it later. It is now applied on the
#    property GETTER, which every internal read goes through.
#
#    THIS is the line that says whether it worked:
#      VP patch: ... Engine frustum 97.1 x 65.0 deg      <- did not take
#      VP patch: ... Engine frustum 97.1 x 100.8 deg     <- took; sky should be back
# =============================================================================

# Was 1 in TEST 26 and cost about half the patch coverage (60 view/frame ->
# 20-32) while doing nothing for the sky: the sky matrix is rejected on
# DIRECTION (dot 0.5001), not position, so the position gate never touched it.
vp_require_pos = 1

# Emergency switch for fault 1 above. 0 makes every matched matrix use the
# current eye, which is TEST 25's behaviour.
vp_match_prev = 0

# =============================================================================
# TEST 28 - MinHook ran out of memory, and I drained it
#
# TEST 27 produced no image at all - blue and red only. Cause, straight off the
# log: EVERY MinHook call in the process failed.
#
#   Failed to hook ID3D11DeviceContext(immediate)::Map (MinHook status 9)
#   ... every context slot, CreateBuffer, and CreateTexture2D too
#   bvr_begin_texture_capture returned -1; no stereo targets
#   Heartbeat: ... | stereo off
#
# Status 9 is MH_ERROR_MEMORY_ALLOC. No eye textures means nothing was ever
# rendered for the headset, which is the blue and red.
#
# Two independent faults, both mine:
#
# 1. THE LEAK. Two slots (DrawIndexed, UpdateSubresource) do not move once and
#    settle - they alternate between the SAME PAIR of addresses on essentially
#    every frame, which is D3D11 switching between its amortized and
#    non-amortized implementations. My verify pass called MH_CreateHook on each
#    flip: "slot moves re-hooked: 693" in twenty seconds. MinHook never releases
#    a trampoline, so that is an unbounded drain on its allocation pool - and an
#    empty pool is exactly status 9. Both ends of the oscillation are now hooked
#    ONCE and a flip back to a known address is not an event at all.
#
# 2. THE RACE. The Present detour goes live the moment MH_EnableHook succeeds,
#    several statements before install_present_hook returns. In this run the
#    render thread got into that window - its "Present hooked" line printed
#    AFTER the context hooks, which it never had before - so we were calling
#    MH_CreateHook from one thread while the main thread was still inside
#    MinHook finishing the Present hook. Hook installation now waits for
#    install_present_hook to RETURN, not just for its detour to go live.
#
# What to check first in the native log:
#   "Failed to hook ... (MinHook status 9)"   -> still broken, stop and report
#   "Map hooked at ..." with no status 9      -> the pool is healthy
#   "slot moves re-hooked: N" should now sit at a small number and STAY there,
#   instead of climbing by hundreds every five seconds.
#
# The engine aim stays off (head_drive_yaw/pitch = 0). The view-angle widening
# is on and confirmed reaching the getter - TEST 27 logged
# "CameraViewAngle reads 65.0 deg vertical; returning 100.8" - but the run died
# before any frustum could be measured, so whether it takes is still unknown.
# The line that answers it:
#   VP patch: ... Engine frustum 97.1 x 100.8 deg
# =============================================================================

# =============================================================================
# TEST 29 - MinHook was the wrong tool; the vtable is the right one
#
# TEST 28's two fixes both worked and neither was the cause:
#   "IDXGISwapChain::Present hooked" now prints FIRST  -> the race is gone
#   "slot moves re-hooked: 0"                          -> the leak is gone
# And it still failed, on the very FIRST hook, with MinHook status 9.
#
# The addresses say why. Compare the same slot across runs:
#
#   00:46  Map at 00007FF8B74A35B0   <- inside d3d11.dll   -> hooked fine
#   19:10  Map at 000001DC5E182CD0   <- HEAP               -> status 9
#
# The D3D11 runtime does not always dispatch through module code; sometimes
# these methods are heap-allocated thunks. MinHook patches the FUNCTION, which
# needs a trampoline allocated within reach of the target, and near those heap
# addresses there is no room - MH_ERROR_MEMORY_ALLOC. It failed for every hook
# in the process, including ID3D11Device::CreateTexture2D, which is what the eye
# textures depend on. No eye textures, nothing rendered, blue and red.
#
# So the mechanism changed. Every device and context hook is now a VTABLE hook:
# overwrite the entry, keep the old pointer as the original. It allocates
# nothing, so it cannot fail that way - and it matches what we are actually
# fighting. The runtime reclaims these slots constantly as it swaps between its
# amortized and non-amortized implementations; putting a pointer back costs one
# store and can be repeated every frame forever, which is precisely what
# re-creating a MinHook trampoline could not.
#
# Present stays on MinHook. It lives at a normal module address in dxgi.dll and
# has hooked cleanly in every run so far.
#
# What to look for, in order:
#   1. "vtable-hooked at slot 14"        - no more "MinHook status 9"
#   2. "CreateTexture2D vtable-hooked"   - and NOT "returned -1; no stereo targets"
#   3. "stereo on" in the managed log    - there is an image at all
#   4. "VP patch: N view ... Engine frustum X x Y deg"
#      65.0  -> the view-angle widening does not reach the projection
#      100.8 -> it does, and the black letterbox bands should be gone
# =============================================================================

# =============================================================================
# TEST 30 - the vtable hooks work; now the culling cone
#
# TEST 29 landed everything mechanical:
#   ID3D11DeviceContext(immediate)::Map vtable-hooked at slot 14
#   Hook self-test PASSED          - no MinHook status 9 anywhere
#   CreateTexture2D vtable-hooked  - eye textures back, "stereo on"
#   VP patch: 31500 view ... (70.0 view/frame)
#   VP patch sites: previous-frame 0 at every offset   - the eye swap is gone
#   Engine frustum 130.1 x 100.7 deg                   - the widening TOOK
#
# Two things left, and they are the same thing: the engine culls against ITS
# camera. Quoting the report exactly - "when I move the camera by my mouse
# textures render normal but when I move my head without moving the mouse it
# disappears" - which is a perfect description of direction-based culling.
#
# THE BLACK SKY IS THE SAME BUG, and the arithmetic settles it. The engine
# camera looks DOWN thirty degrees: "looking (-0.484,-0.718,-0.500)", and
# asin(-0.5) = -30. With a 100.7 degree vertical cone it culls everything
# outside -80.4 .. +20.4 degrees. A head looking level sees -49.5 .. +49.5.
# Everything above +20 - the top third of the view, where the sky is - is never
# submitted to the GPU at all.
#
# Three changes, and none of them touch the yaw loop that ran away:
#
# 1. head_drive_pitch = 1. Aims the engine camera's pitch at the head's, which
#    re-centres that cone on where you are looking. Safe in a way yaw is not:
#    the VR anchor is yaw-only by construction, so camera pitch has no path back
#    into the view. No integrator and no calibration phase either - head pitch
#    and camera pitch are both referenced to gravity, so an absolute loop between
#    them cannot drift, and the sign corrects itself from what the camera does.
#
# 2. engine_view_angle_scale 1.55 -> 2.0. Vertical 130, horizontal ~156. That
#    buys roughly +/-31 degrees of free head yaw before anything can be culled,
#    up from +/-18.
#
# 3. vp_fov_expand = 1, which is now SAFE and was not before. The rule was
#    always "only expand once the engine culls a volume containing the headset
#    frustum" - at 97.1 x 65.0 it did not, at 156 x 130 it comfortably does.
#    Without this, a 156 degree image gets cropped to the headset's 94 and
#    around 40% of the texture width is thrown away; with it, clip space is
#    reshaped so the render is exactly 94 x 99 at full resolution.
#
# Net: the engine CULLS a very wide cone aimed at your head, and we RENDER
# exactly the headset's frustum inside it. Over-cull, render exact.
#
# If it goes wrong, in order of suspicion:
#   vp_fov_expand = 0        - back to submitting the engine's own frustum
#   head_drive_pitch = 0     - stop touching the camera entirely
#   engine_view_angle_scale = 1.55
# =============================================================================

# =============================================================================
# TEST 31 - a real world, in a bubble
#
# TEST 30 put an actual scene in the headset for the first time: terrain, army,
# mountains, a sunset. It also put it inside a curved bubble with black around
# it and washed everything out. Three faults, and the log named all three.
#
# 1. A FOREIGN MATRIX DEFINED THE SUBMITTED FOV.
#
#      VP site: cb 1760 bytes, offset 688, transposed
#               pos (-0.00,0.00,-0.00) d(ref) 878.12 | tan ... = 29.4 x 50.1 deg
#      VP patch: ... Engine frustum 29.4 x 50.1 deg
#
#    A transposed matrix sitting at the WORLD ORIGIN, 878 metres from the
#    engine camera, with a 29 degree frustum - some sub-view - matched on
#    direction alone and, being scanned last, became the frustum reported to the
#    compositor. It also got patched with the eye transform, which it had no
#    business receiving. vp_require_pos is back on (tolerance 10 m, generous
#    enough for a stale reference), and the fov publication now has its OWN
#    hard-coded position guard that no config can switch off.
#
# 2. symmetric_fov = 1 CONTRADICTED vp_fov_expand = 1.
#    Expand mode reshapes clip space to render EXACTLY the runtime's canted
#    -54/+40 frustum. symmetric_fov then told the compositor it was a symmetric
#    -54/+54. That is the identical render-versus-submit mismatch this whole
#    project opened with, reintroduced by two settings that were each reasonable
#    on their own. Expand mode now ignores symmetric_fov outright, and the
#    switch itself is off - it was a Phase 3 debug flag and has no job left.
#
# 3. 130 DEGREES OF VERTICAL WAS TOO MUCH. At scale 2.0 the engine's frustum
#    reached 150.6 x 130.0, and everything it picks off the fov - level of
#    detail, shadow resolution, fog - was chosen for a 150 degree view. That is
#    the washed-out, low-detail look. Back to 1.55, which measured 130.1 x 100.7
#    and still contains the headset's 94 x 99 with room to spare.
#
# So: back to TEST 29's frustum settings, which produced a full-screen image,
# plus the pitch aiming that should fix the black sky, plus the two matrix fixes.
# vp_fov_expand is OFF again until the image is confirmed good; it is a sharpness
# optimisation, not a correctness one, and it can go back on next.
#
# The new line that settles what the compositor is actually told:
#   Submitting fov L-54.0 R40.0 U44.0 D-55.0 deg (94.0 x 99.0)
# The submitted fov has been wrong three separate times in this project and every
# time it was inferred from config instead of read. Now it is printed.
# =============================================================================

# =============================================================================
# TEST 32 - the shaking is a residual eye swap; yaw steering, done safely
#
# 1. THE SHAKING. The site census names it exactly:
#
#      cb 1760 offset 240   hits  812 (previous-frame 0)
#      cb 1760 offset 304   hits  812 (previous-frame 0)
#      cb  128 offset   0   hits 5158 (previous-frame 186)
#
#    The 1760-byte pair - the ONLY place a genuine motion-vector matrix could
#    live - was never once classified as previous. The only matrix the rule ever
#    fired on is the 128-byte per-draw view matrix, which is a single matrix and
#    always the live one. Those 186 hits are 3.6% of every draw in the frame
#    rendered from the OTHER EYE, because under AFR the previous frame is the
#    other eye. It only fires while the camera turns - which is when a live
#    matrix can briefly fail the direction test and pass against the previous
#    camera instead. 3.6% of a battle drawn from the wrong eye is the shaking.
#
#    So previous-frame matching costs a partial eye swap and buys nothing
#    measurable. Off.
#
# 2. HEAD-DRIVEN CAMERA YAW - what was asked for. The gain log shows why:
#
#      Gain/600f: headset 127.1 view 127.1 (x1.00) | engine yaw 0.0
#
#    The head turned 127 degrees, the view followed perfectly, and the engine
#    camera did not move AT ALL - so it kept culling a cone aimed 127 degrees
#    away from where you were looking.
#
#    The camera is now nudged by however much the head turned since the last
#    frame. No target, no error term, no body-yaw integrator: those three are
#    what made the earlier version whip the camera through 754 degrees while the
#    head moved 158. An incremental nudge has nothing to diverge from.
#
#    The one real hazard is feedback: the agent turns to follow the camera, the
#    VR anchor reads the agent's heading, and our own head yaw gets applied a
#    second time so the world turns twice as far as the head. The guard measures
#    that ratio DIRECTLY - it is the gain number above - and two windows over
#    1.4x switches yaw steering off by itself, with a log line saying so.
#
#    If the world doubles anyway, set head_drive_yaw = 0.
#
# 3. THE SKY. Still guessed at, so this run stops guessing. A skybox is drawn
#    with the camera translation STRIPPED - the matrix puts the camera at the
#    world ORIGIN, since only its orientation matters. Nothing in any log has
#    ever reported such a matrix, so there is now a line that reports those and
#    only those:
#
#      VP ORIGIN-CENTRED candidate (skybox suspect): cb N offset N ...
#        fwd (x,y,z) dot(ref) N | tan ... | ref dir (x,y,z)
#
#    That says what the sky matrix looks like and how far its orientation sits
#    from the camera's - which is what is needed to patch it correctly rather
#    than by trial.
# =============================================================================
vp_match_prev = 0
head_drive_yaw = 0   # TEST 37: it cancels free head-look; see the block at the end

# =============================================================================
# TEST 33 - the architecture changes, on the evidence of another mod's notes
# =============================================================================
#
# The BioShock Trilogy VR mod (VR-Stereo-Hub/bioshock-trilogy-vr) solves the
# same problem for a different engine, and its ARCHITECTURE.md describes a
# ladder of stereo strategies with a reason recorded for each rung. Two of its
# findings apply to us directly, and one of them says this mod has been standing
# on the wrong rung since the view-projection patcher was written.
#
# 1. THE CAMERA, NOT THE MATRIX.
#
# Their rung 2 is "MonoTracked - camera driven by HMD 6DOF via CalcView, FOV
# forced to headset FOV", and the notes say plainly why the higher rungs pay:
# with the engine's own camera telling the truth, "the engine computes every
# view-dependent effect natively per eye, so the per-shader fix long tail mostly
# evaporates". Constant-buffer patching appears in their plan exactly once, as
# "phase 2 - patches the projection constant buffer for exact frusta", a
# refinement ON TOP of a correct engine camera, never a substitute for one.
#
# We have been running the substitute. The engine's camera never learned about
# the head, so it culled, picked LODs and drew its sky for wherever the MOUSE
# was pointing - which is the "textures disappear when I move my head" report,
# the black sky, and half of the shaking, all from one cause.
#
# And we are better placed than they were. They had to pattern-scan an
# executable for the FOV fields. TaleWorlds.Engine.Camera is a public API:
#
#     Camera.LookAt(position, target, up)
#     Camera.SetViewVolume(perspective, left, right, bottom, top, near, far)
#
# SetViewVolume takes an ASYMMETRIC frustum - exactly what OpenXR reports per
# eye. So their phase 1 (a symmetric frustum that circumscribes the real one,
# accepting the wasted pixels) and their phase 2 (patch the constant buffer to
# get the real one back) collapse into a single supported call.
#
#   mode = engine-camera
#
# is that rung, and it is one line because getting three of its four keys right
# produces something worse than either architecture. It supplies:
#
#     afr_camera_mode = engine    move CombatCamera itself, in place
#     afr_engine_fov  = 1         and give it the headset's frustum
#     vp_patch        = 0         nothing left downstream to correct
#     engine_aim      = 0         nothing left to steer by proxy
#
# Every one of those is a DEFAULT. A key written by hand still wins, so any
# single line can be pulled back out for a comparison run. Both halves of the
# mod read this rule - the managed side from VrConfig, the native side from
# bvr_config - because vp_patch has a reader on each side of the boundary.
#
# The five lines this supersedes are commented above rather than deleted, each
# marked "TEST 33". Restoring them restores TEST 32 exactly.
#
# What this predicts, and therefore what refutes it:
#   * culling follows the head           (the whole point)
#   * the sky comes back                 (the engine draws it from the eye now)
#   * VrEngineAim's calibration, sign scoring and gain guard never run at all
#   * the native log stops reporting patched matrices entirely
# If the world instead goes empty, this is the rung their notes warn about and
# the five lines above come back.
#
# 2. THE POSE AN IMAGE WAS DRAWN FROM IS NOT THE POSE JUST LOCATED.
#
# Independent of the above, and a real bug either way. Their Present-tail
# comment:
#
#     "Captured content is attributed to the locate generation it was RENDERED
#      from (g_viewsContent), never the fresh one - the compositor reprojects
#      from there to display time."
#
# xr_context.cpp said the right thing in a comment - "the pose each eye was
# actually rendered with" - and then did the other thing: render_frame locates a
# fresh pose, publishes it for the NEXT frame to render with, and tags the frame
# the engine has just finished drawing with that same fresh pose. The image is
# therefore handed to the compositor labelled with a camera it was never drawn
# from, and the reprojection error is proportional to head speed: the world
# swims while the head turns and sits still when it stops. That is the second
# half of the shaking, and it is present in every mode, this one included.
#
# Fixed by keeping the previous generations and attributing the capture to the
# one the content came from. How deep the engine's pipeline actually is is not
# derivable from our side, so it is a knob rather than a constant:
#
afr_pose_lag = 1
#
#   0 = the fresh locate (the old behaviour, for an A/B)
#   1 = one generation back - what this ordering implies, and the default
#   2 = two, if the engine buffers a frame more deeply than assumed
#
# The native log now prints, once a second:
#
#   AFR held-image age this second: L max N ms, R max N ms (pose lag 1 ...)
#
# Under healthy alternate-frame rendering both eyes refresh every other frame,
# so both maxima should sit near two frame times - about 22 ms at 90 Hz. A
# number far above that means one eye is being submitted stale for many frames
# running, which is what gets reported as flicker rather than as judder, and it
# is worth being able to tell those two apart without putting the headset on.

mode = engine-camera

# =============================================================================
# TEST 34 - the eyes did not line up, and the log said why before the headset did
# =============================================================================
#
# TEST 33 worked. mode = engine-camera engaged, the world drew, 72 fps flat, gain
# x1.00, and the new held-image line read a steady "L max 16 ms, R max 16 ms" -
# one frame at 72 Hz, which is exactly what healthy alternate-frame rendering is
# supposed to look like. What was left was that the two eyes did not agree.
#
# THE BUG
#
# HoldEngineFov held EYE 0's frustum on the engine camera. Not the current eye's -
# eye 0's, hardcoded, every frame, for both eyes. Meanwhile the native side
# submitted each eye with its own.
#
# A headset's frusta are MIRRORED, not equal. From this run's own first-pose line:
#
#     eye0  fov L -54.0  R 40.0      eye1  fov L -40.0  R 54.0
#
# Their centre axes are about seven degrees apart. So the right eye's image was
# drawn through the LEFT eye's off-axis projection and then handed to the
# compositor labelled as the right eye's - placed seven degrees from where it was
# actually drawn. That is the misalignment, and seven degrees is far too much to
# miss.
#
# The rule this broke is one this file has already recorded being broken three
# times: THE FOV SUBMITTED MUST EQUAL THE FOV RENDERED.
#
# THE FIX, IN TWO PARTS
#
# 1. HoldEngineFov now takes the eye it is holding for. That alone makes the
#    asymmetric path obey the rule - each eye rendered through its own frustum
#    and submitted with it.
#
# 2. mode = engine-camera now also supplies:
#
symmetric_fov = -1
#
# -1 (the default) FOLLOWS THE RENDER MODE, which is the only setting that is
# right for all four of them:
#
#   AFR, native stereo   Each eye is really rendered, so each may have its own
#                        true asymmetric frustum. Measured on this headset that
#                        is 91.2 x 93.1 degrees against a containing 105.2 x
#                        104.2 - a third of every rendered pixel no longer drawn
#                        and then cropped away by the compositor, worth about
#                        1.22x of linear sharpness on what reaches the eye.
#
#   AFW, AFW+AFR hybrid  The second eye is BUILT from the first, so it can only
#                        be shown what the first eye saw. The runtime hands out
#                        MIRRORED canted fovs - left eye L-52.6 R38.6, right eye
#                        L-38.6 R52.6, identical orientations - which leaves each
#                        eye about 709 pixels of its own outer field, a quarter
#                        of the width, that the other eye has never seen. Both
#                        eyes must render one shared symmetric frustum, which is
#                        the rectified stereo case the warp is built on.
#
# Turning this to 0 globally for the AFR sharpness is what broke AFW: the two
# eyes stopped sharing a frustum and the warp had no way to say so.
#
# 0 pins the true asymmetric frustum and 1 pins the containing symmetric one,
# in every mode. Pinning 0 while AFW or the hybrid is selected breaks the warp.

#
#    which obeys the rule a different and stronger way: a symmetric frustum that
#    CONTAINS the headset's asymmetric one is the SAME frustum for both eyes, so
#    there is nothing left for them to disagree about. Both eyes then differ only
#    by where the camera is, which is what stereo is supposed to be.
#
# WHY SYMMETRIC IS THE DEFAULT HERE AND NOT JUST THE SAFE OPTION
#
# Alternate-frame rendering draws one eye per frame through the engine's single
# camera. Under an asymmetric per-eye frustum that camera's projection flips
# between left-biased and right-biased EVERY FRAME, and everything the engine
# carries across frames that depends on the projection - occlusion history,
# temporal filtering, streaming - is fed an alternating answer. That is the shape
# of the thing this file has spent several runs chasing under the name "shaking".
# A constant projection removes the possibility outright.
#
# It is the same call the BioShock mod ships as its phase 1: "renders a symmetric
# FOV circumscribing the per-eye asymmetric frustum and submits matching
# symmetric XrFovf (slight pixel waste, correct output)".
#
# The waste here is real but small: 108 x 110 degrees rendered where the headset
# asks for 94 x 99.
#
# WHAT THIS PREDICTS
#
#   * the eyes line up
#   * "Engine FOV hold: N correction(s)" COLLAPSES TOWARD ZERO. It has been
#     reading 450 in 5 s - every single frame - because it compared against
#     HorizontalFov while applying SetViewVolume, which does not update it. The
#     symmetric path goes through SetFovVertical, which does. If that counter
#     stays at 450, our projection is genuinely being overwritten by the engine
#     every frame and that is a different problem worth knowing about.
#
# The explicit symmetric_fov = 0 above is commented rather than deleted and marked
# TEST 34. With part 1 of the fix in, symmetric_fov = 0 is now a CORRECT
# configuration rather than a broken one - per-eye exact, no wasted pixels, the
# sharper setting. Worth trying once the image is trusted.

# =============================================================================
# TEST 35 - the head as a second mouse
# =============================================================================
#
# TEST 34 landed: "Eye 0/1 SYMMETRIC projection: vfov 1.920 rad, aspect 0.964",
# one frustum for both eyes, and the native side agreeing with it -
# "Submitting fov L-54.0 R54.0 U55.0 D-55.0 deg (108.0 x 110.0)". Held-image age
# stayed at 16 ms, one frame at 72 Hz, for the whole run.
#
# WHAT IS BEING ADDED
#
# The engine's camera follows the head, so the PICTURE is right. What still does
# not follow the head is the game's own notion of where the player is looking -
# CameraBearing and CameraElevation - which is what aim, interaction and the
# agent's facing all read.
#
#   engine_aim = 1
#
# turns that on, and the implementation is the literal reading of the request.
# The head's movement since the last frame is ADDED TO _cameraBearingDelta and
# _cameraElevationDelta: the exact fields the mouse writes, read by the engine on
# the same frame. The head becomes a second producer of look input, merged by the
# engine's own code, and the engine consumes and zeroes the delta exactly as it
# does the mouse's.
#
# This is a different thing from what carried this key before. The old code WROTE
# CameraBearing through a closed loop that watched where the camera ended up -
# that is what produced "engine yaw 754.1" while the headset moved 158 degrees.
# There is no target and no error term here, so there is nothing to diverge from.
#
# THE DOUBLING, AND WHY IT CANNOT HAPPEN
#
# The rendered view is body-heading composed with the head pose. Push head yaw
# into the game's look, read the body heading from something that followed it,
# and the head is applied twice - the world turns twice as far as the head does.
# That failure has cost this project runs before.
#
# The cancellation is one line and holds no state:
#
#     BodyYaw = lookYaw - headYaw
#
# so the view yaw lands on BodyYaw + headYaw = lookYaw. The rendered view is
# therefore always exactly where the GAME thinks the player is looking. Aim,
# culling and the picture agree by construction rather than by tuning, and
# because it is recomputed every frame from an observation it cannot drift.
#
# The read-back is the AGENT's look direction, not the camera's. In this mode we
# overwrite the engine's camera ourselves every frame, so reading the camera back
# would only report what we last wrote. The agent's look is driven by the engine
# from the same bearing and we never touch it.
#
# THE SIGN
#
# Which way a positive bearing delta turns the world is a convention nobody wrote
# down, so it is learned from the player's own mouse before anything is injected -
# invisible, and with no probe moving the camera on its own. Expect:
#
#   Engine aim calibrated after N frames: bearing sign S, elevation sign S ...
#
# within seconds of the first mouse movement. If the mouse is never touched:
#
#   Engine aim: still learning which way the game's look input turns.
#
# One subtlety that matters: the delta read in the prefix has NOT been applied
# yet, so the look change visible this frame came from the PREVIOUS frame's
# delta. The correlation is against the previous frame's value. Comparing
# same-frame values - the obvious thing to write - correlates a cause with an
# effect that has not happened yet and scores noise.
#
# Once driving, the injection is its own and better stimulus, so the check keeps
# running on frames where the head was the dominant cause. Thirty consecutive
# wrong-way frames flip the sign and say so.
#
# WHAT WOULD REFUTE IT
#
#   * "Gain/600f ... (x2.0)" sustained. The cancellation is not working; two
#     windows above 1.4 and the feature switches itself off with a line saying
#     so, rather than compensating.
#   * The view turning the wrong way when the head moves - a sign that got
#     through calibration wrong. CheckDirection should correct it within about a
#     third of a second; if it oscillates, head_drive_yaw = 0.
#
#   head_drive_yaw = 0     head stops feeding the game's look yaw
#   head_drive_pitch = 0   ... and pitch
#   engine_aim = 0         back to TEST 34 exactly
#
# ALSO RETIRED HERE
#
# engine_view_angle_scale = 1.55 is commented above, marked TEST 35. It was a
# workaround for an architecture that no longer runs: it widened the engine's
# vertical FOV by intercepting the CameraViewAngle getter, because the engine was
# rendering 97.1 x 65.0 degrees into a headset that wanted more. The engine's
# camera is now handed the headset's own frustum directly, so there is nothing
# left for a scale factor to correct - and at 1.0 the Harmony patch that reads it
# is skipped entirely rather than merely returning the same number.

engine_aim = 1

# =============================================================================
# TEST 36 - the head pose was right all along and was not the one being rendered
# =============================================================================
#
# No new keys. One managed change.
#
# THE SYMPTOM AND ITS SIGNATURE
#
# "Gain/600f: headset 71.8 view 70.9 (x0.99)" with no head tracking in the
# headset. CameraPatch's own header wrote this failure down before AFR existed:
#
#   "rate fine, pose values moving -> our camera is correct and the engine is
#    rendering from another"
#   "The gain meter reads a perfect x1.00 throughout, because our camera was
#    right the whole time and simply was not the one being rendered."
#
# The gain meter compares two of OUR OWN numbers - the head pose in, the head
# pose out - so a perfect 1.00 says the maths is right and says nothing at all
# about whether the engine drew with it.
#
# THE CAUSE
#
# AFR aimed the engine's camera from MissionScreen.OnFrameTick's postfix, which
# was believed to be the last write of the frame. It is not. The engine reaches
# UpdateCamera through CheckForUpdateCamera at a point AFTER that postfix,
# recomputes CombatCamera from bearing and elevation, and overwrites it.
#
# The FOV hold counter has been saying so for three runs and I read it as a
# read-back quirk instead of as evidence: "450 correction(s) in the last ~5 s
# (have 1.695/1.778, want 1.885/0.964)". 450 in 5 s is every single frame, and
# "have" never moved off the engine's own numbers. That is not a stale getter,
# that is the engine reasserting the whole camera - projection and pose together -
# after we wrote it. TEST 34 predicted that counter would collapse once the
# symmetric path went through SetFovVertical. It did not, and that was the
# refutation.
#
# THE FIX
#
# Write the pose from the tail of the engine's own camera update - a postfix on
# MissionScreen.UpdateCamera - which is the seam a camera-hooking VR mod normally
# uses: substitute what the engine just computed rather than trying to out-order
# it. The prefix on the same method keeps writing look INPUT, because input
# belongs before the read and the pose is an OUTPUT.
#
# It is additive, not a replacement. The pair covers both cases with neither
# needing to know which one ran:
#
#   UpdateCamera ran     -> the engine overwrote us, and the postfix rewrites.
#   UpdateCamera skipped -> nothing overwrote us, and OnFrameTick's write stands.
#
# That second line matters: CameraPatch chose OnFrameTick in the first place
# because UpdateCamera does not run every frame, and a pose written only there
# would freeze between calls. Keeping both writes is what makes that objection
# stop applying.
#
# WHAT THE NEXT LOG MUST SAY
#
#   Engine camera re-aimed from UpdateCamera's tail: N time(s) in the last ~5 s
#
# At 72 fps a working seam reads about 360. If it reads a handful, the camera is
# finalised somewhere else again and neither write is the answer - which is worth
# knowing from one run rather than three. And "Engine FOV hold" should finally
# fall away from 450, for the same reason.

# =============================================================================
# TEST 37 - I made head tracking depend on an unproven feature
# =============================================================================
#
# TEST 36's seam WORKED and the log says so twice:
#
#   Engine camera re-aimed from UpdateCamera's tail: 450 time(s) in the last ~5 s
#   Engine FOV hold: 225 correction(s) ... (have 1.885/0.964, want 1.885/0.964)
#
# 450 calls is once per frame, and "have" finally equals "want" - the projection
# we set now survives from one frame into the next, which it never did before.
# The camera write lands.
#
# WHAT WAS STILL WRONG, AND IT WAS TEST 35
#
#   Engine aim: head yaw 33.7 deg, game look yaw -30.5, body -64.2
#
# -64.2 + 33.7 = -30.5. The rendered view yaw was pinned to the GAME'S look yaw,
# exactly as TEST 35's cancellation is designed to do, which means the head could
# only turn the view to the extent that it turned the game's camera. It was not
# turning the game's camera, so the head did nothing.
#
# That is the mistake, and it is mine rather than the engine's: TEST 35 made
# working head tracking DEPEND on a feature that had never once been shown to
# work. Feeding head yaw into the game's look and keeping free head-look are
# mutually exclusive under this anchor, and I shipped the trade without saying so.
#
# It also explains a symptom worth naming: head tracking would have worked for the
# first sixteen seconds of a mission and stopped the moment this line appeared -
#
#   Engine aim calibrated after 386 frames ...
#
# - because the cancellation only switches on once the sign is known.
#
#   head_drive_yaw = 0
#
# Head tracking outranks the feature. The culling that yaw injection existed to
# fix is already correct without it: the engine's camera is aimed at the eye
# directly, so its frustum follows the head whether or not its bearing does. What
# is lost is only that the game's AIM does not follow head yaw.
#
# head_drive_pitch stays 1. Pitch has no such problem - the anchor is yaw-only by
# construction, so head pitch is never taken back out of the view and the
# injection cannot feed back into what the player sees.
#
# THE INSTRUMENT THAT SHOULD HAVE EXISTED ALL ALONG
#
#   Engine camera SURVIVAL: we wrote yaw N pitch N, a frame later it reads
#   yaw N pitch N (off by N / N).
#
# Every instrument in this mod so far compares two of OUR OWN numbers - the head
# pose in against the head pose out - so all of them read perfectly while the
# engine rendered from a camera we never touched. Gain x1.00 with a frozen image
# is that, and it has cost several runs.
#
# The UpdateCamera PREFIX is the only place this can be measured: it runs before
# the engine recomputes CombatCamera, so what the camera holds at that moment is
# exactly what our postfix wrote at the end of the previous frame. Anywhere else
# reads the engine's own value and proves nothing.
#
#   off by ~0 / ~0     -> the pose sticks. If the headset is STILL frozen, the
#                         scene view is not rendering from CombatCamera at all,
#                         and the next thing to try is afr_camera_mode = shared.
#   off by a lot       -> something after our postfix is putting the camera back,
#                         and UpdateCamera is not the final seam either.

# =============================================================================
# TEST 38 - a correct camera that nothing was rendering from
# =============================================================================
#
# No new keys. Two managed changes.
#
# THE NUMBER THAT SETTLED IT
#
#   Engine FOV hold: 225 correction(s) in the last ~5 s (have 1.885/0.964,
#   want 1.885/0.964)
#
# 225 out of 450 calls. Exactly half. HoldEngineFov runs from two places - the
# OnFrameTick postfix and the UpdateCamera postfix - so one call site always finds
# the camera wrong and the other always finds it right. That is the engine
# resetting the camera inside UpdateCamera and our postfix putting it back, once
# per frame, reliably. THE WRITE LANDS.
#
# So the pose is correct, the projection is correct, both survive the frame, and
# the picture still only moves with the mouse. The only thing left is that the
# scene is not being drawn from that camera.
#
# WHAT WAS MISSING
#
# afr_camera_mode = engine moves CombatCamera and assumed the scene view was
# already drawing from it. Nothing ever established that. OnSceneRenderingStarted
# retargeted the view's RENDER TARGET and left its CAMERA to whatever the engine
# had put there:
#
#     _engineView.SetAutoDepthTargetCreation(true);
#     _engineView.SetRenderTarget(VrStereoRenderer.ColorTarget(0));
#     // ...and never SetCamera
#
# TaleWorlds.Engine.SceneView.SetCamera exists and was never called. A camera
# nothing renders from can be perfectly correct, and every instrument we have
# would still read perfectly - which is exactly what they did.
#
# It is now bound at scene start and re-asserted from UpdateCamera's tail
# alongside the pose. This is the ENGINE'S OWN camera object, so it is not the
# CustomCamera path and none of that path's recorded costs apply: the engine keeps
# maintaining CombatCamera, its HorizontalFov stays live, and there is no
# foreign camera for it to reconfigure. SetCamera hands over a reference rather
# than rebuilding a frustum, so it is not the expensive kind of call this file
# twice records as fatal at frame rate.
#
#   AFR: scene view bind to the engine's own CombatCamera.
#
# THE PROBES NOW FIT INSIDE A REAL RUN
#
# Both new instruments fired every 450 calls, which at 72 fps needs 6.25 seconds
# of mission time. The last run reached the main menu after 5.5, so neither ever
# printed - the one line built to answer the question was never in the log.
# Both are now 150 calls, about two seconds.
#
# What to look for, in order:
#
#   AFR: scene view bind to the engine's own CombatCamera.   <- once, at start
#   Engine camera SURVIVAL: ... (off by ~0 / ~0)             <- write survives
#   Engine camera re-aimed from UpdateCamera's tail: 150 time(s)
#
# If the head now moves the view, that was the whole thing. If it still does not,
# the survival line separates the two remaining possibilities in one run, and the
# next lever is afr_camera_mode = shared - our own camera through CustomCamera,
# which is the path CameraPatch says "makes MissionScreen push our camera into the
# render path at the point in the frame where it actually sticks".

# =============================================================================
# TEST 39 - native stereo as a second strategy, chosen from the panel
# =============================================================================
#
# AFR is untouched and remains the default. This adds the other path back as a
# selectable mode rather than replacing anything.
#
#   stereo_mode = afr      one render per frame, alternating eyes (the default)
#   stereo_mode = native   two SceneViews, both eyes rendered every frame
#
# The panel writes this key when the radio button moves, so the choice survives
# a restart without anyone editing a file.
#
# WHY NATIVE IS "EXPERIMENTAL" AND NOT SIMPLY BETTER
#
# It was the original Phase 4 path and it was abandoned for a measured reason,
# recorded in VrStereoRenderer at the time: with the engine's own view plus two
# eye views competing, agents came out as floating heads and missing bodies,
# flickering frame to frame. That is the signature of an engine that draws each
# mesh once per frame - every entity is claimed by whichever view asks first and
# the others get nothing.
#
# The same note named the fix and never tested it: stop asking the engine to
# render the same scene three times. So native mode switches the engine's OWN
# scene view off, leaving two views instead of three. If the agents come back
# whole, that theory is confirmed. If they do not, we have learned something and
# AFR is one radio button away.
#
#   native_stereo_disable_engine_view = 0
#
# turns that half off, if you want three views back to see the difference. The
# cost of leaving it on is that the monitor freezes on its last frame while
# native stereo is running - the engine's view is what draws it.
#
# WHY THE SWITCH WAITS FOR THE NEXT MISSION
#
# Changing mode creates or destroys SceneViews, and this file already records
# what that costs: doing view surgery mid-frame is what crashed the stereo path.
# OnSceneRenderingStarted is the one moment the engine is known to tolerate it,
# so the request is held until then and the panel says so in amber rather than
# appearing to do nothing.
#
# WHAT PROTECTS AFR
#
# Three things, because "do not break the working mode" is the requirement here
# and a mode switch is exactly where that breaks:
#
#   * VrAfrRenderer.Enabled is now derived from the active mode rather than read
#     once from the config, so selecting native stands the entire AFR path down
#     through its existing callers without any of them learning a second mode
#     exists. afr = 0 still removes AFR entirely, as before.
#   * Switching to native stands AFR down explicitly - the NATIVE layer is still
#     holding an eye index from the last mission, and a stale one would have it
#     submitting held images for a mode no longer producing them.
#   * Switching BACK re-enables the engine's own scene view. AFR renders THROUGH
#     that view, so without the restore the toggle back to the working mode
#     would go black - which is the one failure that would make this feature
#     worse than not having it.
#
# WHAT TO LOOK FOR
#
#   Render mode Afr -> Native.
#   Engine's own SceneView DISABLED. ...
#   AFR stood down; native stereo has the scene.
#
# and coming back:
#
#   Engine's own SceneView restored for AFR.

stereo_mode = afr

# =============================================================================
# TEST 40 - native stereo: one dead config line and one missing AFR lesson
# =============================================================================
#
# AFR untouched, and confirmed working. Two reports against native stereo, and
# they turned out to be unrelated to each other.
#
# 1. "ONLY LEFT EYE" WAS NOT A RENDERING FAULT AT ALL
#
#     eyes = 1
#     # Not used in AFR mode - kept so stereo can be switched back on for comparison.
#
# That line was left over from bisecting the old stereo crash, and its own
# comment was true right up until the moment native stereo started reading it
# again. One SceneView was built. The right eye was never drawn.
#
# Now eyes = 2, and the code no longer keeps quiet about it: selecting native
# stereo with fewer than two eyes logs a warning naming the key. A mode that
# cannot do the one thing it exists for should say so rather than presenting as
# a rendering bug.
#
# 2. "CHARACTERS ONLY IN THE MIDDLE OF THE MAP" IS THE AFR LESSON, UNAPPLIED
#
# scene_occlusion is already 0, so the occlusion-inheritance explanation written
# in VrStereoRenderer is not the live cause here. The live cause is the one AFR
# spent four rounds learning:
#
#   THE ENGINE'S OWN CAMERA DECIDES WHAT EXISTS.
#
# Visible sets, LOD and streaming are computed from CombatCamera, and our eye
# views can only draw what survived that. In native mode nothing was aiming it -
# VrAfrRenderer.AimEngineCamera returns immediately when AFR is not the active
# mode - so it sat wherever the mouse left it, and the headset showed characters
# near the middle of the map and empty ground everywhere else.
#
# So native stereo now does what AFR does, at the same seam and for the same
# reason: the engine's camera is aimed from the TAIL of MissionScreen.UpdateCamera,
# because anything written earlier in the frame is overwritten when the engine
# reaches that method. The only difference is where it aims - at the HEAD rather
# than at one eye, since both eyes are drawn this frame and the midpoint is the
# pose whose frustum contains both. The frustum handed over is eye 0's, which
# under symmetric_fov is identical to eye 1's, so it covers both by construction.
#
# WHAT TO LOOK FOR
#
#   Native stereo: engine culling camera aimed at the head N time(s), frustum
#   corrected N.
#
# At 72 fps that should read about 150 per window. A much smaller number means
# UpdateCamera is not running in this mode and the seam has to move again.
#
# If characters come back everywhere but the RIGHT eye is still wrong, the next
# suspect is the one this path was abandoned for: two views competing for meshes
# the engine only draws once. engine_view is already forced off in native mode,
# so that is two views rather than three - and if it is still not enough, that
# is a real finding rather than a guess.

# =============================================================================
# TEST 43 - back to the left-eye-only build, fixed a different way
# =============================================================================
#
# TEST 41 and 42 are reverted. This is exactly the tree from "Fix native stereo:
# a dead config line, and the AFR lesson it never got" - the state where
# characters rendered across the whole map and the only fault was that they
# appeared in the left eye alone. The skeleton-pinning file is gone entirely,
# not merely switched off.
#
# WHY A DIFFERENT LEVER, NOT THE OLD ONE WITH ITS BUG REMOVED
#
# Scene.AddAlwaysRenderedSkeleton means handing the engine a list of skeleton
# POINTERS and owning the job of taking them back. That ownership is what
# crashed it: a skeleton becomes the engine to free the moment its agent dies,
# and the bookkeeping handed one back afterwards. Fixing the bookkeeping leaves
# the hazard in place for the next mistake to find.
#
#   native_stereo_agent_visibility = 1
#
# GameEntity.SetDoNotCheckVisibility is a different shape of thing: a FLAG SET
# ON AN ENTITY, not a registration in a list we own. Set once and forgotten.
# When the agent dies the flag dies with it - nothing to unregister, no pointer
# of ours that can outlive what it points at. That whole class of bug is
# structurally absent rather than patched.
#
# It is also a different MECHANISM, not the same idea reworded. The skeleton
# list says "prepare this even if invisible"; this says "stop deciding whether
# this is visible at all". If what the second view is missing is a once-per-
# frame visibility decision already consumed by the first, removing the decision
# is the more direct answer.
#
# The cost is honest: agents stop being culled, so more of them are drawn than
# strictly needed. In a mode that already renders the scene twice that is the
# cheaper half of the bargain, and it is one line to turn off.
#
#   Native stereo: agents taken out of the per-frame visibility check (N so far).
#
# IF IT DOES NOT WORK, ONE LINE SETTLES WHAT IS EVEN POSSIBLE
#
#   eye_order_swap = 1
#
# renders the RIGHT eye view first. Characters draw in the left eye, which is
# the one that renders first, and two very different causes produce that:
#
#   characters move to the RIGHT eye -> whichever view renders first consumes
#       them, and the fix has to be about preparing them per view
#   nothing changes, still the left  -> the right eye view or its camera is what
#       is wrong, and none of this was ever about characters
#
# One battle answers it. The scene-view line reports which run it was:
#
#   Eye SceneViews built: count=2, ... order=5 (swap=False), occlusion=False.
#
# ONE THING RESTORED THAT IS WORTH KNOWING ABOUT
#
# eye_pushcam is back to 1, because that is what this build had. This file
# records it as taking a crash "from 55 seconds down to under one", and the
# views are bound correctly at scene start without it. It did not crash in the
# run being restored, so it stays as it was - but if a crash appears that is not
# obviously mine, set it to 0 first.

native_stereo_agent_visibility = 0
eye_order_swap = 0

# =============================================================================
# TEST 44 - stop guessing, run the experiment
# =============================================================================
#
# SetDoNotCheckVisibility made it worse: agents disappeared COMPLETELY, not one
# eye and not the middle of the map, none at all. Off.
#
#   native_stereo_agent_visibility = 0
#
# The negative result is worth keeping. It does not mean "skip the cull and draw
# it anyway" - taking an agent out of the visibility pass removed it from the
# render list entirely. So that pass is not a gate in FRONT of drawing agents,
# it is the thing that ENQUEUES them. Which sharpens the original question
# instead of answering it: if it runs once per frame and enqueues into something
# the first view consumes, the second view was never going to have anything.
#
# THAT IS TWO WRONG GUESSES IN A ROW, SO THIS RUN GUESSES NOTHING
#
#   eye_order_swap = 1
#
# The right eye view now renders FIRST. Nothing else changes. Characters draw in
# the left eye, which is the one that currently renders first, and exactly two
# things produce that:
#
#   characters appear in the RIGHT eye instead
#       -> whichever view renders first consumes them. Confirmed, and the only
#          fixes worth building are ones that prepare agents per view. It also
#          means the right eye view, its camera and its target are all fine,
#          which rules out a large family of causes in one battle.
#
#   characters stay in the LEFT eye
#       -> the render order is irrelevant and the RIGHT EYE VIEW ITSELF is what
#          is wrong - its camera, its target, or its enable. None of this was
#          ever about characters or about skeletons, and everything tried so far
#          has been aimed at the wrong half of the problem.
#
#   characters appear in BOTH
#       -> unlikely, but it would mean the order itself was the whole problem.
#
# Confirm the run from the log before judging the headset:
#
#   Eye SceneViews built: count=2, ... order=5 (swap=True), occlusion=False.
#
# swap=True is the line that says this config actually took effect. count=2
# matters just as much - if it ever reads count=1 the right eye is not being
# drawn at all and the answer is not in this file.

# =============================================================================
# TEST 45 - the experiment answered, and it points back at the skeleton lever
# =============================================================================
#
# eye_order_swap = 1 moved the characters from the LEFT eye to the RIGHT one.
#
# That settles it. WHICHEVER VIEW RENDERS FIRST CONSUMES THEM. It also clears
# the right eye view, its camera and its render target of all suspicion, which
# was most of what was still in doubt. Swap is back to 0 - it was a question,
# not a setting, and it has been answered.
#
# Agents are prepared once per frame and handed to one consumer. Terrain, sky
# and props survive in both eyes because they are not prepared that way; skinned
# meshes are, and they are exactly what goes missing.
#
# It also explains the failure this path was abandoned for, years of sessions
# ago. With the engine own view alive too, THREE views compete and the engine
# renders first - so it takes the characters and both eyes get leftovers.
# "Floating heads and missing bodies, flickering frame to frame" is what
# half-consumed skinned geometry looks like. One mechanism, every symptom.
#
# SO IT GOES BACK TO THE LEVER I WAS ASKED TO AVOID, AND HERE IS WHY
#
# The other way was tried: SetDoNotCheckVisibility made it strictly worse -
# agents vanished entirely - and that is its own finding. The visibility pass is
# not a gate in FRONT of drawing agents, it is the thing that ENQUEUES them.
#
# Scene.AddAlwaysRenderedSkeleton is the engine own answer to precisely this,
# and after the experiment there is no competing candidate left to try.
#
#   native_stereo_always_render_skeletons = 1
#
# WHAT CRASHED BEFORE CANNOT NOW
#
# The first version removed skeletons for agents that had stopped being active.
# An agent goes inactive the moment it dies and its skeleton is the engine to
# free from that point; half a second later the pointer went back in. Two rgl
# worker threads died reading 0x80 about four seconds into a battle - roughly
# the first casualty.
#
# THERE IS NO REMOVAL PATH IN THE FILE AT ALL. Not a fixed one, not a guarded
# one - none. The set is only added to, and dropped wholesale on a scene change,
# when every skeleton in it belongs to a mission that no longer exists and is
# not ours to touch. A dead agent costs one stale dictionary entry until the
# mission ends. The bug is unreachable rather than repaired.
#
# THE OTHER SYMPTOM IS A SEPARATE PROBLEM, AND IT IS NEXT
#
# "Only in the middle of the battle map", plus terrain missing along the edges,
# is not the eye split - it is the visible set being computed for something that
# is not following the head. scene_occlusion is already 0, and CombatCamera is
# demonstrably aimed at the head every frame, so the remaining suspect is
# Scene.LastFinalRenderCamera - the camera of the last view to complete a FINAL
# render, which native stereo turns off when it disables the engine own view.
#
# That is one config line to test (native_stereo_disable_engine_view = 0) but it
# CONFLICTS with the finding above: re-enabling the engine view puts a third
# view in front of both eyes, and it would take the characters from both. So the
# eye split has to be fixed first. One problem at a time, in the order that
# lets each answer be read.

native_stereo_always_render_skeletons = 1

# =============================================================================
# TEST 46 - what REFramework/UEVR and the Cyberpunk port actually converged on
# =============================================================================
#
# Both reference projects hit our wall and neither one got through it.
#
# The CP2077 port has 80 reverse-engineering documents and a file called
# cp2077-native-simultaneous-exhausted.md. Its verdict, after 35+ sessions:
#
#   "native genuine-simultaneous stereo in REDengine 4 is ... exhausted at every
#    explored lever ... a REGISTERED distinct 2nd view-slot can only come from
#    the engine own view-insert/producer, which is architected around ONE main
#    view"
#
# That is our finding in different words. We proved ours in one battle with
# eye_order_swap - the first view to render consumes the agents - where they
# needed 35 sessions of IDA. The engine prepares the scene once per frame for
# one consumer, and neither project could talk it into doing so twice.
#
# WHAT THEY DID INSTEAD, AND UEVR SHIPS THE SAME THING
#
#   "do not make a 2nd registered view; render the SINGLE view twice with
#    sim/time FROZEN between eye-0 and eye-1, submit as a synced OpenXR pair.
#    Delivers the actual experiential goal (both eyes one consistent sim tick ->
#    NO ghosting)"
#
# UEVR calls it Skip Tick. It is not native stereo and does not pretend to be.
# It is alternate-frame rendering with the world held still between the two
# eyes, so the pair is one moment seen twice instead of two moments seen once
# each.
#
#   sync_sequential = 1
#
# THIS IS THE PART WHERE BANNERLORD IS KIND TO US
#
# The CP2077 port spent most of a session failing to find the freeze: its
# per-frame delta is dispatched through a job graph with no static call chain,
# the time-dilation apply point is arithmetic inside a 48KB function that
# crashes the decompiler, and they ended up piggybacking Sandevistan slow motion
# from Lua.
#
# Mission.OnTick(dt, realDt, ...) takes the simulation delta AS A PARAMETER.
# The entire freeze is a Harmony prefix setting dt = 0. realDt is left alone so
# input, UI and engine housekeeping keep their wall clock - zeroing both would
# freeze the frame rather than the world. And OnTick still RUNS: every side
# effect a tick is expected to have still happens, only the clock stops.
# Skipping the call outright is the version of this that breaks things.
#
# THE COST, PLAINLY
#
# The world simulates at half the frame rate - 45 Hz of world at 90 Hz of
# display. Nothing hides that; animation and physics really do advance half as
# often. Head tracking is NOT affected: each eye is still submitted with its own
# pose and the compositor reprojects both, so looking around stays as smooth as
# it is now. The trade is "the world moves in coarser steps" against "the two
# eyes agree about what moment it is". In a battle full of moving men the second
# is worth more, but it is a preference, which is why it ships OFF.
#
# THE ONE FRAGILE PART
#
# Freezing every other frame only helps if the frozen frame is the SECOND of a
# pair. Out of phase, each eye still sees a different world state - same
# artefact, no benefit, half the sim rate paid for nothing.
#
#   sync_sequential_phase = 1
#
# inverts it. The log makes the answer readable rather than a matter of
# squinting:
#
#   Sync sequential: N frame(s) advanced the world, N frozen (phase normal).
#
# Near 1:1 is a correct pairing. Anything else means the pairs are not pairs.
#
# TWO SMALLER THINGS WORTH RECORDING FROM THE SAME SOURCE
#
# 1. Their CyberpunkVR_EnginePipelineDepth is our afr_pose_lag, arrived at
#    independently and for the identical reason - "every image is systematically
#    one present behind the pose it is labelled with: the compositor over-warps,
#    the next frame pulls it back, and that is judder that survives a perfectly
#    paired pose ring". Both projects made it a knob rather than a constant
#    because neither could derive it. Ours is already 1.
#
# 2. CyberpunkVR_MonoCyclopeanPose: when both eyes are shown ONE image, collapse
#    the two submitted poses to a single orientation and the midpoint. On a
#    canted headset the runtime per-eye orientations differ, and anchoring one
#    image at both of them pushes the copies apart. We do not currently hit this
#    - we clear to a flat colour instead of showing one image twice - but it is
#    the right answer if that ever changes.

sync_sequential = 0
sync_sequential_phase = 0

# ---------------------------------------------------------------------------
# TEST 47 - AFR: correcting a held eye for the GAME camera's turn
# ---------------------------------------------------------------------------
#
# Back to stereo_mode = afr. Native stereo's two open questions are parked with
# their fixes deployed and unrun; this round is about making AFR comfortable to
# TURN in, which is where it has always been weakest.
#
# THE MECHANISM
#
# Every eye frame is built as `anchor * eyeStage`. The compositor is told about
# eyeStage - that is the head pose it located itself - and it is told nothing
# whatsoever about the anchor, which is the game's own camera rotation.
#
# Standing still that costs nothing. AFR always has one eye a frame old, but a
# frame-old picture of a world seen from the same orientation is a perfectly
# good stereo partner, and afr_pose_lag already makes sure it carries the pose
# it was really drawn from.
#
# Turning is where it falls apart. The held eye was drawn with the anchor
# pointing somewhere the fresh eye no longer agrees with, and the compositor
# has no way to know, so it reprojects for the head's motion and leaves the
# mouse-turn in. At 90 fps a 180 deg/s turn is two degrees of pure horizontal
# disparity between the eyes - roughly an order of magnitude past what fuses
# comfortably. It appears only while turning and clears the instant you stop.
#
# This is NOT the pose-lag bug wearing a different hat. That one tagged an
# image with a locate it was never drawn from, and it is fixed. Both are "the
# tagged pose is wrong", but afr_pose_lag covers HEAD motion and this covers
# the MOUSE, and neither one reaches the other's case.
#
# THE FIX
#
# The managed side publishes the anchor's yaw every frame, before the render.
# The Present hook records it alongside each capture. At submit time the held
# eye's pose is rotated by the difference, so the compositor's own reprojection
# cancels the turn out - P = B_now^-1 . B_old . H_old. No render change, no
# extra work, nothing touched on the path that draws the frame.
#
# WHAT TO LOOK FOR
#
#   1. Stand still and look around with the head only. Should be IDENTICAL to
#      before - the log should read a peak of 0.00 deg. If anything changed
#      here, the correction is firing when it should not be.
#   2. Sweep the mouse left and right at a normal fighting pace. This is the
#      whole test. Before: the world shears or doubles while the mouse moves.
#      After: it should hold together.
#   3. The log line "AFR turn correction: peak N deg this second" says what it
#      actually did. A second spent turning should read something in the range
#      of 0.5-3 deg; a second spent still should read 0.00.
#
# THE SIGN IS THE PART MOST LIKELY TO BE WRONG
#
# Bannerlord measures yaw from +Y toward +X and its basis is X = x, Y = -z,
# Z = y, so an XR rotation about +Y reads as a NEGATIVE Bannerlord yaw - which
# makes the correction a positive rotation about +Y. That is the default. If it
# is backwards the symptom is unmistakable and useful: turning gets NOTICEABLY
# WORSE rather than merely staying the same, because the error doubles instead
# of cancelling. Set afr_turn_reprojection = -1 and it is fixed. 0 disables it
# and restores exactly the previous behaviour.
afr_turn_reprojection = 1

# ---------------------------------------------------------------------------
# TEST 48 - AFR: the two eyes on screen now come from ONE world state
# ---------------------------------------------------------------------------
#
# Reported after TEST 47: turning is "somewhat smoother", but anything CLOSE
# doubles while turning continuously, and a large group of soldiers judders
# even with the overlay reading 120 fps.
#
# The first half of that is exactly the expected residual. The turn correction
# is a ROTATION, and a rotation is exact for objects at infinity and does
# nothing at all for the two effects that scale with 1/distance:
#
#   * the soldiers MOVED between the two eye captures
#   * the viewpoint translated, because turning swings the head around the
#     body's axis rather than spinning it about the eye
#
# Of those, object motion dominates by a wide margin. One frame at 120 fps is
# 8.3 ms; a soldier walking at 1.5 m/s covers 1.25 cm in that time, which at
# 2 m subtends about 0.36 degrees - a clear double image. The same soldier at
# 20 m subtends 0.04 degrees and looks fine. "Close things double, far things
# are fine" is that arithmetic, not a bug in the correction.
#
# WHAT CHANGED, AND WHY THE OBVIOUS VERSION WAS WRONG
#
# sync_sequential was already built for this, and reading it again while
# tracing the artefact turned up a real flaw in it. AFR submits BOTH eyes on
# EVERY frame from held images, so the pair on screen at Present N is (frame N,
# frame N-1) and at Present N+1 it is (frame N+1, frame N). Every adjacent pair
# of frames gets displayed as a stereo pair. Freezing alternate frames gives
# world states S0 S0 S1 S1 S2 S2, so the displayed pairs come out consistent,
# INCONSISTENT, consistent, INCONSISTENT - half of them fusing and half not,
# switching sixty times a second. That would have been worse than leaving it
# alone, and the "phase" setting could not have fixed it because both phases
# do the same thing.
#
# Freezing is necessary but not sufficient. The other half is to stop putting a
# fresh eye on screen the instant it arrives: eyes are captured into a staging
# pair, and a pair is promoted only when both halves came from the same tick.
#
#   F0  gen G0  eye0 -> stage.  partner is older  -> hold
#   F1  frozen  eye1 -> stage.  both G0           -> PROMOTE
#   F2  gen G1  eye0 -> stage.  partner still G0  -> hold, screen keeps G0
#   F3  frozen  eye1 -> stage.  both G1           -> PROMOTE
#
# The displayed pair changes every second frame and always agrees with itself,
# while the compositor keeps reprojecting it for head motion and for the turn
# at the full 120. World at half rate, stereo correct always.
#
# It also makes the freeze phase irrelevant - promotion keys off generations
# matching, so whichever frames are frozen, the adjacent pair sharing a tick is
# the one that goes up. sync_sequential_phase is now a no-op in practice.
#
# WHAT TO LOOK FOR
#
#   1. Walk into a crowd and turn continuously. This is the whole test. The
#      doubling on nearby soldiers should drop sharply. It will NOT go to zero
#      - the viewpoint-translation term is still uncorrected - but that term is
#      several times smaller than the one this removes.
#   2. "AFR pairing: N promoted, N held back, N forced". Promotions should sit
#      near half the frame rate, and FORCED SHOULD BE ZERO. Anything else means
#      the generations are not lining up, the safety valve is carrying the mode,
#      and the sim rate is being paid for nothing.
#   3. The world now animates at 60 Hz rather than 120. Watch for whether that
#      reads as the judder getting worse. If it does, this trade is the wrong
#      one for battles and sync_sequential = 0 puts it back exactly.
#
# ON THE JUDDER AT 120 FPS - a caution rather than a fix
#
# The overlay's 120 is our SUBMIT rate, and it always will be, because we submit
# every Present whether or not there is new content. Under AFR each eye receives
# a genuinely new image only every other frame, so per-eye content has been
# 60 Hz all along and is 60 Hz still. That is inherent to AFR and no amount of
# reprojection changes it.
#
# Worth ruling out separately: Bannerlord is heavily CPU-bound in large battles
# and its own animation/simulation rate can fall well below its render rate. If
# a big melee judders in the FLAT game too, that is the game's limit and not
# something this mod can reproject its way out of.
sync_sequential = 0

# ---------------------------------------------------------------------------
# TEST 49 - a stereo pair must share a CAMERA, not just a world
# ---------------------------------------------------------------------------
#
# TEST 48's logs are clean where it counts: 45 promoted, 45 held back, 0 forced,
# every second, at 90 fps. Pairing does exactly what it was built to do. The
# turn correction is live too, peaking 2-12 deg per second while riding.
#
# And yet: "when turning my horse i can see double image", and - the line that
# names the bug - "while turning my horse the 3d effect and the object scale
# stop working until i slow down or stop turning".
#
# WHAT TEST 48 MISSED
#
# It froze the simulation between the two eyes of a pair. It did not freeze the
# CAMERA. On a turning horse the camera is the fastest-moving thing in the
# scene, so a pair that was "consistent" by generation was still rendered from
# two anchors several degrees apart.
#
# That is not a small residual, it is a broken stereo pair. A stereo pair is two
# views separated by the IPD and nothing else. Let the anchor rotate between the
# two captures and the effective baseline stops being the IPD: it picks up the
# pivot swing, changes length, and points somewhere else. The brain reads
# baseline as SCALE - so the world quietly resizes while turning and snaps back
# when you stop, which is precisely what was reported. Depth breaking under
# rotation was never a reprojection problem. The pair was not a pair.
#
# THE FIX
#
# The whole camera state is now latched for the life of a pair - the anchor, the
# head pose, and both eye offsets. The second eye of a pair is rendered from
# exactly the state the first was, so the two differ by the IPD alone.
#
# It is keyed on the simulation generation, the same number the native promotion
# uses, so the two halves cannot disagree about where a pair starts.
#
# Head tracking is NOT slowed. The latched pose is what is rendered and what is
# submitted, and the compositor reprojects both eyes to the live head pose at
# display time - the same arrangement that already carries AFR's held eye.
#
# sync_sequential_camera = 0 goes back to TEST 48 (world frozen, camera free) so
# the two halves can be told apart.
sync_sequential_camera = 1

# ---------------------------------------------------------------------------
# RUN THE HEADSET AT 120, NOT 90 - this is not a preference
# ---------------------------------------------------------------------------
#
# "on 120fps is somewhat smooth, but 90fps feels juddery." That is arithmetic
# rather than taste, and the logs show it directly: the whole TEST 48 run was at
# 90.0 fps.
#
# Under AFR each eye receives a genuinely new image only every OTHER frame. So
#
#     90 fps  ->  45 Hz per eye, and with pairing a 45 Hz world
#     120 fps ->  60 Hz per eye, and a 60 Hz world
#
# 45 Hz is below where a moving image fuses cleanly for most people and 60 Hz is
# around where it starts to. Nothing in this mod can lift the per-eye rate above
# half the frame rate - that IS alternate-frame rendering. Set VirtualDesktop to
# 120 Hz and leave it there.
#
# If a big melee still judders at 120, check the FLAT game at the same moment.
# Bannerlord is heavily CPU-bound in large battles and its own animation rate
# can fall well below its render rate; that limit is the game's and no amount of
# reprojection reaches it.

# ---------------------------------------------------------------------------
# KNOWN, NOT FIXED: one eye can freeze after returning to the main menu
# ---------------------------------------------------------------------------
#
# End of the TEST 48 log, after "Main menu reached": pairing goes to 0 promoted
# / 90 held back / 10 forced, and the left eye's held image ages to 7453 ms while
# the right stays at 94 ms.
#
# The cause is benign and menu-only. With no mission, MissionScreen stops
# ticking, so AFR's eye index stops alternating and only one eye is ever
# captured. The safety valve promotes that eye; the other has nothing staged to
# promote, so it holds its last picture. Nothing stands AFR down because the
# code that would is in the tick that is no longer running.
#
# Recorded rather than fixed: it cannot happen in a mission, and the change that
# fixes it is in the AFR lifecycle rather than anywhere near the render path
# being worked on. Worth doing on a round that is not about turning.

# ---------------------------------------------------------------------------
# TEST 50 - AFW, Alternate Frame Warping
# ---------------------------------------------------------------------------
#
# Requested by name: AFW as PureDark built it for REFramework, with a toggle in
# the VR menu. It is now the third option under "Stereo rendering", and unlike
# native stereo it switches INSTANTLY - AFR and AFW share every view, camera and
# render target, so there is nothing to rebuild at a scene boundary.
#
# WHAT IT DOES
#
# One scene render per frame, exactly as AFR. The difference is what becomes of
# the eye that was NOT rendered: instead of holding it from the previous frame,
# it is SYNTHESISED from the one just drawn, by reprojecting that image through
# its own depth buffer.
#
# WHY THIS IS THE ANSWER TO THE LAST THREE ROUNDS
#
# Every artefact since TEST 46 has had one root: the two eyes on screen were
# drawn a frame apart. The soldiers had moved, the camera had turned, and the
# stereo baseline had stopped being the IPD. TEST 47 corrected the pose for the
# turn; TEST 48 paired eyes by simulation tick; TEST 49 held the camera still
# across a pair. Three rounds of making two moments agree with each other.
#
# AFW deletes the second moment. Both eyes come from ONE render of ONE frame -
# one is the render, the other is a reprojection of it. They cannot disagree
# about where anything is, because there is only one of everything.
#
# It also gives back what pairing cost. No frame waits for a partner, so the
# world runs at the full frame rate again instead of half. sync_sequential
# stands itself down automatically in this mode; it is not needed and would only
# halve the sim rate for nothing.
#
# WHAT IT COSTS INSTEAD: DISOCCLUSION
#
# The synthesised eye can only show what the rendered eye saw. The few pixels
# hidden behind the near edge of a close object are genuinely absent from the
# source, and no reprojection can invent them. With a 63 mm baseline those
# slivers are narrow. Where the search cannot find a source pixel it takes the
# one straight ahead, so it reads as a slightly soft edge rather than a hole.
#
# HOW THE WARP WORKS, AND WHY IT IS CHEAP
#
# With symmetric_fov the two eyes have identical frusta and differ by a purely
# horizontal translation - the rectified stereo case. A world point moves along
# a scanline and nowhere else, by disparity = focal_px * baseline / z. So the
# whole reprojection is a per-pixel horizontal shift, found by a short backward
# search rather than a general 3D scatter. Another thing symmetric_fov earns.
#
# WHAT TO LOOK FOR
#
#   1. Turn the horse hard. This is the test. The double image and the collapsing
#      3D/scale should both be GONE, not reduced - they were caused by the two
#      eyes being different moments, and there is only one moment now.
#   2. Look at the silhouette of a soldier standing close against a distant
#      background while you turn. That is where disocclusion lives. Expect a
#      slightly soft vertical edge; report it if it is worse than that.
#   3. The log: "AFW: N eye(s) synthesised this second, 0 failed." Failures
#      should be zero. A "fell back to AFR" warning names the frames where the
#      warp could not run.
#   4. "AFW: eye depth buffer found by its binding: ..." should appear once, and
#      it prints the format so the depth question stops being a guess.
#
# THE ONE THING MOST LIKELY TO BE WRONG: THE DEPTH CONVENTION
#
# rgl's depth may be conventional (0 near, 1 far) or reversed. Nothing visible
# from outside says which, and reading the buffer back to find out means a GPU
# sync inside the Present hook, which this repo has already recorded as its own
# hazard. So it is a config line - and getting it wrong names itself: the
# disparity inverts, so near things push AWAY from you instead of toward you and
# the scene reads inside-out. Unmistakable within a second, one flip to fix.
afw_depth_reversed = -1

# Ceiling on the horizontal shift, in pixels. Without it, geometry at the near
# plane produces a disparity of thousands of pixels and the backward search
# wanders the whole scanline hunting for it. Nothing genuinely visible in a
# battle sits close enough to need more; the things that do - your own weapon
# swinging through the near plane - are exactly where an uncapped search smears
# worst. Raise it if distant-but-close geometry looks flattened.
afw_max_disparity_px = 96

# Whether AFW may run at all. Read ONCE at startup, and not the same thing as
# selecting it: the native hold textures have to be allocated typeless and
# writable for the warp, and that happens long before anyone opens the menu.
# Setting this to 0 removes the option; the menu entry still switches, but the
# native side declines and says so.
#
# Note that AFW rides on AFR's renderer, so it also needs afr = 1.
afw = 1

# ---------------------------------------------------------------------------
# TEST 51 - AFW did not run once, and the 5 fps was my fault, not the warp's
# ---------------------------------------------------------------------------
#
# Back to stereo_mode = afr, which is playable. AFW is still in the menu but it
# cannot work yet and this round is about finding out why.
#
# THE LOG SAYS THE WARP NEVER RAN, NOT EVEN ONCE
#
#   AFW: 0 eye(s) synthesised this second, 90 failed
#
# every second, for the whole session, and "AFW: eye depth buffer found by its
# binding" never printed at all. So the depth was never located and the warp
# declined on every frame. It could not have looked like anything, because it
# never produced a pixel.
#
# WHY IT FELT LIKE 5 FPS - A BUG I INTRODUCED, AND THE LOG NAMES IT EXACTLY
#
#   Sync sequential: 300 frame(s) advanced the world, 0 frozen
#   AFR pairing: 0 pair(s) promoted, 90 capture(s) held back, 10 forced
#
# In AFW the freeze is correctly stood down - both eyes come from one render, so
# there is nothing to freeze. But the GENERATION kept being published, and with
# no frame ever frozen it now advanced on every single frame. The native side
# promotes a pair when both halves carry the same generation, so two adjacent
# frames never matched, no pair was ever promoted, and the only thing reaching
# the headset was the safety valve firing ten times a second - one eye each.
#
# That is about 5 Hz per eye while the overlay reads 90. "Feels like 5 fps even
# when VD says its 80fps" is a precise description of it. Held-image age in the
# log confirms it: 188-203 ms, where healthy AFR reads 16 ms.
#
# Two fixes, because one was not enough:
#
#   * the generation is now published only when pairing is ACTUALLY operating,
#     which is not the same as "sync_sequential = 1". If the freeze is not
#     running, the pairing it exists to complete must not be either.
#
#   * the safety valve now has an end. Twenty forced promotions in a row with no
#     pair completed means the generations are never going to line up, whatever
#     the cause, and plain AFR is better than a starved imitation of it. Pairing
#     is abandoned for the session and says so loudly. A comfort feature must
#     never be able to quietly strangle the image again - from inside a headset
#     that is indistinguishable from the mod being broken.
#
# WHY THE DEPTH WAS NEVER FOUND, AND WHAT REPLACES THE GUESS
#
# The first attempt watched for a depth-stencil bound in the same call as OUR
# eye texture. That assumes rgl draws the scene straight into the target we hand
# it. It almost certainly does not: a renderer with shadows and postfx draws into
# its own buffer and only the final resolve lands in ours - and that resolve
# needs no depth at all. So the one binding being watched for was the one
# guaranteed to have a null depth.
#
# Now it matches on SIZE rather than identity: whatever depth is bound alongside
# a render target with the eye's dimensions is the scene depth, whoever owns the
# colour buffer.
#
# And before deciding anything it SURVEYS. The next run prints up to 60 bindings
# as "bind #N: colour WxH fmt F / depth WxH fmt F", tagging eye-sized targets and
# our own textures. That settles where the depth really lives instead of costing
# another round to guess at.
#
# The survey also answers a completely different question by its absence: if it
# prints NOTHING, the detour is never being called - rgl is binding through a
# deferred context, not the immediate one we hooked - which is a different
# problem with a different fix.
#
# The watch now also gives up after 240 frames if nothing is found, because
# while armed it does real work on every OMSetRenderTargets call and a heavy
# scene makes hundreds per frame.
#
# WHAT TO DO WITH THIS BUILD
#
#   1. Play a battle normally in AFR. It should feel like TEST 49 again - the
#      5 fps was the pairing deadlock and is gone.
#   2. Flip to AFW in the menu for a few seconds, then flip back. It will still
#      look like AFR, because the warp still cannot run - but the log will now
#      carry the survey, which is the whole point of the round.
#   3. Send the native log. The "bind #N" block is what decides AFW's fate.

# ---------------------------------------------------------------------------
# TEST 52 - AFW can finally run; head aiming; the crosshair
# ---------------------------------------------------------------------------
#
# FIRST, WHAT WAS ACTUALLY BEING COMPARED LAST ROUND
#
# "AFW feels smoother than AFR but not perfect" - but AFW still never ran. The
# log is flat: "0 eye(s) synthesised this second, 120 failed", all session.
#
# So the comparison was not AFW against AFR. Selecting AFW switches PAIRING off
# (nothing to pair when both eyes come from one render), and the warp then
# declined and fell back. What was really being compared was:
#
#     "AFR"  = paired    - world at 60 Hz, eyes always agree
#     "AFW"  = unpaired  - world at 120 Hz, eyes one frame apart
#
# and unpaired won. That is a real result and it is now the default:
# sync_sequential = 0. At 120 Hz the world running at full rate matters more
# than the eyes agreeing perfectly - which is the opposite of what it would be
# at 90, and worth remembering if the refresh rate ever changes.
#
# THE SURVEY FOUND THE DEPTH, AND EXPLAINS BOTH FAILED ATTEMPTS
#
#     bind #1   colour 1536x1632 fmt 26   depth 1536x1632 fmt 19
#     bind #19  colour 3072x3264 fmt 26   depth none    <- EYE SIZE
#     bind #21  colour 3072x3264 fmt 87   depth none    <- OUR EYE TEXTURE
#
# rgl renders the scene at 1536x1632 - exactly HALF the eye in each dimension -
# and only the upscale passes touch our target, with no depth bound at all. So
# watching for a depth beside our texture was wrong, and watching for one at the
# eye SIZE was equally wrong: the pass that owns the depth is not the pass that
# writes our texture and never will be.
#
# It now matches on ASPECT RATIO. 1536/1632 and 3072/3264 are the same number to
# seven places because one is a scaled render of the other, and shadow maps -
# the other big depth consumers - are square. The warp scales its lookups for
# the half-resolution depth; without that every disparity would come out halved,
# which reads as the stereo simply being weak rather than as a bug.
#
# The depth is fmt 19 - 32-bit float with stencil - which is far better than the
# 16 bits feared, so distance precision is not a concern.
#
# WORTH KNOWING SEPARATELY: THE GAME IS RENDERING AT HALF RESOLUTION
#
# 1536x1632 for a 3072x3264 eye is a 50% resolution scale, and it is the game's
# own graphics setting, not ours - render_scale is 1.00 here. Raising Bannerlord's
# Resolution Scale toward 100% is free sharpness in the headset that no amount of
# work on this mod can substitute for. Worth trying before anything else.
#
# HEAD AIMING
#
# head_drive_yaw = 1 feeds the head into the game's own look, so where you look
# is where you aim and where you swing. The machinery for it has been in place
# for a while - VrEngineAim integrates a body heading from the MOUSE ALONE and
# the anchor reads that instead of the agent's look direction, which is what
# stops our own head yaw coming back round and doubling.
#
# What kept it from working was the safety net, not the feature. The gain meter
# compared total view rotation against head rotation, so every degree the mouse
# or the horse contributed counted as though the head had caused it:
#
#     Gain/600f: headset 33.0 view 300.9 (x9.13) | engine yaw 278.9
#
# The head moved 33 degrees, the horse turned 279, and the net read a runaway
# feedback loop that was not there - and switched head aiming off, repeatedly,
# all session. It now measures the RESIDUAL: view yaw minus body yaw, which by
# construction should track the head exactly. The log reports it as "transfer",
# and that is the number the net reads. It should sit at x1.00.
#
# THE CROSSHAIR
#
# Bannerlord's own crosshair is a Gauntlet UI element composited into the game
# WINDOW, which the headset never sees - so it is drawn rather than borrowed.
#
# It sits at the centre of each eye, offset by half the stereo disparity for the
# distance below, so it FUSES at that distance instead of floating at infinity
# where the eyes would give up and see two of it.
#
# The centre is the correct place only because head aiming is on: the view is
# anchored so that look direction and view centre agree by construction. With
# head_drive_yaw = 0 the game aims where the mouse points while the view looks
# where the head does, and a centre crosshair would be confidently wrong. The
# two settings belong together.
head_drive_yaw = 1
crosshair = 1

# Where the crosshair sits, in metres. Set it near the range you actually fight
# at: too close and distant targets sit behind it, too far and a man in front of
# you sits in front of it. 10-15 is a reasonable compromise for mounted combat.
crosshair_distance = 12

# Shape, in pixels of the 3072-wide eye. The gap is the clear space in the
# middle - a solid cross covers exactly the thing you are aiming at, which in a
# melee is the only part of the view that matters.
crosshair_size_px = 34
crosshair_thickness_px = 3
crosshair_gap_px = 9
crosshair_alpha = 1.0

# ---------------------------------------------------------------------------
# TEST 53 - the depth convention is now MEASURED; head aiming no longer
#           depends on the injection landing
# ---------------------------------------------------------------------------
#
# AFW: "EVERYTHING HAS DOUBLE IMAGE EVEN WITHOUT MOVING"
#
# That is what a globally wrong disparity looks like, and the arithmetic points
# straight at the depth convention. Read a reversed-Z buffer as though it were
# conventional and the sky - stored at 0.0 - linearises to the NEAR PLANE,
# 0.05 m, which asks for a disparity of thousands of pixels. Everything then
# clamps at afw_max_disparity_px and the whole image is displaced by a constant
# 96 px. Uniform, static, doubled - exactly the report.
#
# I have now guessed at this convention twice, so it is measured instead. Once
# per session the depth buffer is read back and a grid of samples is linearised
# under BOTH conventions; the one that puts more of the scene at a plausible
# battlefield distance wins. That test does not care what you are looking at,
# which the obvious "sky is far" heuristic does: the wrong convention piles
# nearly everything against the near plane and the right one spreads it across
# metres to kilometres, in any scene.
#
# It costs one GPU sync inside the Present hook. Once, at a known moment, is a
# very different thing from every frame, and it ends a guess that has cost two
# rounds.
#
# The log line to look for:
#
#   AFW depth probe: N samples, raw a..b. Plausible distances: X% read as
#   normal (mean N m), Y% read as REVERSED (mean N m). -> reversed-Z.
#
# -1 means "ask the probe" and is the default. 0 and 1 force it.
afw_depth_reversed = -1

# ---------------------------------------------------------------------------
# HEAD AIMING: "LOCKED IN THE DIRECTION OF THE MOUSE CAMERA"
# ---------------------------------------------------------------------------
#
# This one was mine, and this file's own header had written it down before I
# turned the setting on:
#
#   "the head can only turn the VIEW to the extent that it turns the GAME'S
#    CAMERA. If the injection is doing nothing, the head does nothing"
#
# The body heading used to be derived by subtraction, BodyYaw = lookYaw -
# headYaw, which makes the rendered view yaw come out as exactly lookYaw. That
# is algebraically perfect and operationally fatal: head tracking becomes
# entirely conditional on a write into a private engine field continuing to
# work. When it does not, the view follows the mouse and the head does nothing,
# which is precisely "locked in the direction of the mouse camera".
#
# BodyYaw is now INTEGRATED FROM THE PLAYER'S OWN MOUSE and never reads the
# game's look at all. The view is BodyYaw + head, so the head always turns it,
# injection or no injection. Head tracking stops being negotiable; aim
# following the head becomes best-effort.
#
# An integrator can drift where an observation cannot, so the drift is measured
# and reported. The engine-aim line now ends with:
#
#   aim-vs-view N deg
#
# Near zero means the injection IS landing, the game aims where you look, and
# the crosshair marks the real aim point. Growing by roughly however far you
# have turned your head means the injection is doing nothing - head LOOK will
# still work perfectly, but the crosshair is decorative and head AIMING is not
# happening. Those are two different outcomes and the number tells them apart
# without having to judge it by feel.

# ---------------------------------------------------------------------------
# TEST 54 - AFW stops being derived and starts being MEASURED
# ---------------------------------------------------------------------------
#
# "Still double image but less than last time, and reducing world scale makes it
# less visible."
#
# That second half is the useful part. World scale multiplies the baseline,
# which multiplies the applied disparity, which multiplies the ERROR. So the
# error is a FACTOR, not an offset - the warp is shifting by the right shape and
# the wrong amount.
#
# WHY DERIVING IT KEEPS NOT BEING ENOUGH
#
# disparity = focal_px * baseline / z has four ways to be wrong and one symptom.
# Three of them check out on paper: the focal length is (3072/2)/tan(54 deg),
# the baseline is measured between the two eye frames rather than assumed, and
# the sign follows from eye 1 sitting at XR +X - the camera's right - so content
# shifts left between the eyes.
#
# The fourth cannot be checked from outside: THE NEAR PLANE rgl actually renders
# with. The linearisation is roughly z ~ n/(1-d), so every distance scales with
# n. We hand its camera 0.05, but the fov hold only ever compares the fov and
# the aspect - if the engine resets the near plane each frame while leaving the
# fov alone, nothing here would ever notice, and every disparity would be out by
# that ratio. Which is exactly the shape of the symptom.
#
# WHAT IS MEASURED INSTEAD
#
# AFR renders both eyes for real, on consecutive frames. That is ground truth
# sitting right there and it has been there all along.
#
# So before the warp is allowed to run at all, AFW now captures TWO REAL EYES,
# warps eye 0 into eye 1 on the CPU under a grid of candidate signs and gains,
# and compares each result against the REAL eye 1. Whichever candidate matches
# reality best is correct by definition - and it settles the near plane, the
# focal length, the baseline and the sign TOGETHER, without any of them needing
# to be individually right.
#
# It costs one hitch of a few tens of milliseconds at the start of the first
# mission, during which you see ordinary AFR.
#
# THE LINE TO LOOK FOR
#
#   AFW calibration: best match at gain G, direction +/-1 (cost C against F for
#   no warp at all). The model was out by a factor of G.
#
# G near 1.0 means the model was right all along and something else is wrong.
# G near 0.5 or 2.0 points straight at the near plane. A negative direction
# means my sign derivation was wrong despite checking out.
#
# AND THE OUTCOME THAT MATTERS MOST
#
#   AFW calibration: NO candidate beat copying the rendered eye across
#   unchanged. The warp is switched off and both eyes get the same picture.
#
# If that appears, the depth is not describing the scene and no gain can save
# it. Both eyes then show the identical image - FLAT, with no stereo at all,
# but honest and comfortable, which is strictly better than a confident double
# image. It would also be a real finding: it would mean the depth buffer we
# found is not the one the final image was drawn from.

# ---------------------------------------------------------------------------
# TEST 55 - movement follows the head
# ---------------------------------------------------------------------------
#
# AFW is parked. This is AFR only.
#
# WHAT WAS WRONG
#
# Agent.MovementInputVector is in the agent's own frame: +y is straight ahead
# along its look direction, +x is its right. On foot the player agent faces
# wherever the game's camera bearing points - which is the MOUSE, not the head.
#
# The headset shows a view built as anchor * head, so the moment you turn your
# head the picture and the agent's facing disagree by exactly the head yaw.
# Press W and you walk off at an angle to what you are looking at. Small
# standing still, thoroughly disorienting in a fight, because it breaks the one
# assumption every player has: forward is where I am looking.
#
# THE CORRECTION
#
# Rotate the input vector by the angle between the view and the agent's look,
# in the agent's own frame. That is the whole change.
#
# It is SELF-CANCELLING when head aiming is working. If the head is successfully
# steering the game's look then lookYaw already equals viewYaw, the angle is
# zero, and this does nothing at all. It does work only in proportion to how far
# the game has been left behind - which is the right amount in both cases, by
# construction rather than by tuning. So it is not a second mechanism competing
# with head aiming; it is the same disagreement, corrected on the other side.
#
# WHERE IT IS PATCHED, AND WHY THERE
#
# The obvious target is whatever reads the keyboard - but this build has no
# MissionMainAgentController at all, and hunting for whatever replaced it by
# name is exactly the kind of patch that breaks on the next game update. The
# property SETTER is the one place every producer of movement input has to pass
# through, whatever the controller is called, and it is public.
#
# It fires for every agent in the battle, so the first thing it does is a
# reference compare against Mission.Current.MainAgent.
head_move = 1

# MOUNTED IS EXCLUDED, and this is not an oversight.
#
# On a horse the same vector means something completely different: y is the
# THROTTLE and x is the REIN. Rotating it would turn "look left" into "pull the
# horse left" - a horse that steers itself by where you glance, which is not
# head-relative movement, it is an animal that fights you. On foot the vector is
# a direction; mounted it is a pair of controls, and only the first is a thing
# that can be rotated at all.
#
# Left switchable so the finding can be reproduced rather than taken on trust.
head_move_mounted = 0

# Back to AFR, as asked. AFW is parked, not removed - it is still the third
# option in the End menu and its calibration is still in place, so whenever it
# is picked up again the first run will report what the disparity really is.
stereo_mode = afr

# ---------------------------------------------------------------------------
# TEST 56 - the character aims where you look
# ---------------------------------------------------------------------------
#
# Head-relative MOVEMENT works. This is the other half: the character's aim on
# both axes, so a swing or a shot goes where your gaze does.
#
# WHY A SECOND MECHANISM RATHER THAN MORE OF THE FIRST
#
# VrEngineAim adds the head's movement to the two private delta fields the mouse
# writes and lets the engine build the camera from them. That is the polite way
# to do it and it moves camera, culling and aim together. Its weakness is that
# it is entirely conditional on a write into a NON-PUBLIC field continuing to
# have an effect, and nothing outside can tell whether it does. That is exactly
# how "head aiming is locked in the direction of the mouse camera" happened.
#
# Agent.LookDirection is a public settable Vec3, and it is the vector the game
# aims and swings with. Writing it says the thing we actually mean - point the
# character where I am looking - in one statement, with no intermediary that can
# quietly stop working.
#
# The two are complementary, not competing. The delta injection moves the
# CAMERA; this moves the AGENT. If the injection is landing they agree and this
# write changes nothing at all.
#
# THE FEEDBACK LOOP IS THE WHOLE DANGER, AND IT IS CUT ONCE
#
# The rendered view is anchor * head. If the anchor were read from the agent's
# look direction - which is precisely what this now drives - the head would be
# applied twice and the world would turn twice as far as your head does. That is
# the failure this project has hit twice already.
#
# The cut is the one that already exists rather than a second answer to the same
# question: whenever ANYTHING is steering the look, the anchor reads
# VrEngineAim.BodyHeading(), integrated from the player's mouse alone. Head aim
# refuses to drive at all until that heading is being maintained, and says so in
# the log rather than silently doing nothing.
#
# WHAT IT DELIBERATELY DOES NOT TOUCH
#
# The body's facing and the feet. Bannerlord turns the body to follow the look
# on its own schedule - while moving, while attacking, not at all while standing
# and glancing about - and that is the animation system being sensible. Forcing
# it would fight the game. What was asked for is the aim, and the aim is the
# look direction.
#
# WHAT TO WATCH IN THE LOG
#
#   Head aim: the agent's look drifted N deg from what we wrote, on average.
#
# A degree or two is your head moving during the frame and is expected. Tens of
# degrees means something recomputes LookDirection after this seam and the write
# is not sticking - a different problem with a different fix, and the number
# says which before anyone has to judge it by feel.
head_aim = 1

# Pitch as well as yaw. Off is the one variation a person prone to motion
# sickness might genuinely want: aim horizontally with the head, keep the
# vertical on the mouse.
head_aim_pitch = 1

# ---------------------------------------------------------------------------
# TEST 57 - the movement regression, and the floor under motion combat
# ---------------------------------------------------------------------------
#
# HEAD MOVEMENT BROKE THE MOMENT HEAD AIMING STARTED WORKING
#
# The correction is viewYaw minus a reference. That reference used to be the
# agent's LookDirection, which followed the camera bearing - so the difference
# was the head yaw and movement followed the head.
#
# Then TEST 56 started WRITING LookDirection to the head direction. From that
# moment viewYaw minus lookYaw is zero BY CONSTRUCTION, the correction vanished,
# and movement went back to following the mouse. The feature disabled itself the
# instant its sibling began working - and my own note in the file predicted the
# self-cancelling behaviour without noticing it would cancel against the wrong
# thing.
#
# The reference is now the agent's own FRAME. MovementInputVector is an
# agent-local vector, so the frame it is local TO is what it must be measured
# against - and unlike the look direction, nothing in this mod writes it. That
# the two used to agree is why the old version worked; that they no longer do is
# why it stopped.
#
# Guessing which frame an engine expresses a vector in has now cost a round, so
# all three candidates are printed together once every few seconds:
#
#   Head move: view N deg | agent frame N | look N | correcting by N
#
# If movement still does not follow the head, that line says which column to
# switch to without another round of inference.
#
# ---------------------------------------------------------------------------
# MOTION CONTROLS: what was built, and what is still to come
# ---------------------------------------------------------------------------
#
# The honest position first: bvr_get_input_state has been a STUB returning zeros
# since the ABI was written. There were no controller poses at all - so the
# gestures could not have been built this round whatever else happened, because
# there was nothing to recognise them from.
#
# So this round builds the floor: a full OpenXR action set, bindings suggested
# for Touch, Index, Vive, WMR and the simple fallback profile, both hands'
# aim and grip poses located every frame against the same display time the eyes
# use, plus trigger, grip, thumbstick and buttons - and the runtime's own linear
# VELOCITY for each hand, which is what swing detection will read.
#
# Velocity is requested from the runtime rather than differentiated from two
# positions. That matters for swings specifically: a differentiated velocity
# carries every bit of tracking jitter multiplied by the frame rate, and a swing
# threshold set above that noise is a swing you have to throw far harder than a
# real one.
#
# WHAT THE LOG WILL SHOW
#
#   Input: <hand> hand bound to /interaction_profiles/oculus/touch_controller
#   Input: controllers are tracking. L (x, y, z) R (x, y, z), in stage space.
#   Input: right hand at (...), speed N m/s, trigger N, grip N, buttons 0xN.
#
# That last line prints every few seconds while tracking, and the SPEED is the
# number that matters: the swing threshold has to sit above whatever your hand
# does during ordinary play, and seeing its real range is how that gets chosen
# rather than guessed.
#
# THE GAME SIDE IS CONFIRMED REACHABLE
#
# Agent.MovementFlags has a public setter, and the enum carries exactly what is
# needed:
#
#   AttackLeft, AttackRight, AttackUp, AttackDown
#   DefendLeft, DefendRight, DefendUp, DefendDown, DefendBlock
#
# So the plan you described maps directly onto it: a swing right-to-left becomes
# AttackLeft, left-to-right becomes AttackRight, a downward swing becomes
# AttackDown, and weapon orientation - horizontal held high or low, vertical held
# left or right - becomes the matching Defend flag. No physics, just direction,
# exactly as asked.
#
# What is NOT decided yet, and needs the numbers from this run: the speed above
# which a hand movement counts as a swing at all, and how long a swing's
# direction should be held before it is released. Both are thresholds, and both
# should come from measurements of real play rather than from me picking a value
# that feels reasonable in a text editor.

# ---------------------------------------------------------------------------
# TEST 58 - the weapon follows the controller (stage 1 of 3)
# ---------------------------------------------------------------------------
#
# THE CONTROLLERS WORK. That much the last run settled:
#
#   Input: left hand bound to /interaction_profiles/oculus/touch_controller.
#   Input: right hand bound to /interaction_profiles/oculus/touch_controller.
#   Input: right hand at (0.16, 0.64, -0.20), speed 0.00 m/s, trigger 0.00...
#
# Both hands tracking, Touch bindings picked automatically, and velocity live -
# the speed column ranged from 0.00 while still up to 1.67 m/s while moving,
# which is exactly the signal a swing threshold will be set against.
#
# HOW A WEAPON GETS MOVED
#
# It is not an independent object. From the game's own Native/ModuleData/
# monsters.xml, the human monster:
#
#   main_hand_bone      = r_hand      off_hand_bone      = l_hand
#   main_hand_item_bone = r_finger0   off_hand_item_bone = l_finger0
#
# So a weapon hangs off r_finger0 and a shield off l_finger0, and both are
# CHILDREN of the hand bones. Posing a hand carries its item along, which is the
# whole reason this works. SetBoneLocalFrame takes a frame relative to the
# bone's PARENT, so the controller pose is walked down: world -> agent entity ->
# parent bone. The parent's entitial frame is read back in the same frame it was
# animated, so the hand lands on the controller whatever the animation was
# doing.
#
# The controllers go through the SAME anchor and the SAME world scale the eyes
# do. Any other route and the hands sit at an angle to the view that changes as
# you turn.
#
# WHERE THE BONES COME FROM NOW
#
# Not from a name search. Monster.MainHandBoneIndex and OffHandBoneIndex are the
# game's own answer, loaded from the monsters.xml above alongside the animations
# that pose them, and they cannot pick the wrong hand the way a substring can.
# The name search survives only as a fallback for a monster that declares none.
#
# WHAT WILL STILL LOOK WRONG
#
# THE ARM. Only the hand bones are posed, so the forearms still point wherever
# the animation left them and the hands visibly detach. The weapon is in the
# right place; the arm is not. The fix is a two-bone solve down the
# clavicle/upperarm/foretwist chain, which the bone table now spells out:
#
#   [11] spine2  ->  [14] l_clavicle -> [15][16] upperarm -> [17][18] foretwist -> [19] l_hand
#                    [21] r_clavicle -> [22][23] upperarm -> [24][25] foretwist -> [26] r_hand
#
# It is the next thing worth doing and it is deliberately not in this round: it
# is a separate piece of work with its own ways of being wrong, and folding it
# into a round that is fixing alignment would make it impossible to tell which
# change moved the hand.
weapon_follow = 1

# ===========================================================================
#  HIDING THE BODY - the weapon and shield float, and nothing else is drawn
# ===========================================================================
# Only the HAND bones are posed onto the controllers. The forearm, upper arm and
# clavicle stay wherever the animation put them, so the arm runs from a shoulder
# doing one thing to a hand doing another - and at first-person range that
# disagreement is most of what you can see.
#
# Worth being precise about what was actually wrong: the weapon was tracking
# correctly the whole time. The body drawn around it was not.
#
# Solving the arm means two-bone IK, which needs the elbow plane, a cross-body
# rule and an answer for a target out of reach - a real piece of work with its
# own ways of being wrong. Removing the body deletes the question instead, and
# what is left is a floating weapon that tracks your hand. That is a complete
# thing in its own right, and what a good many VR games ship deliberately.
#
# WHY MESHES AND NOT THE ENTITY
#
# The obvious lever is MBAgentVisuals.SetVisible(false), or the entity's own
# visibility flag. Both are wrong here and the engine says so: GameEntity
# exposes IsVisibleIncludeParents, so visibility is inherited down the
# hierarchy - and a wielded weapon is a CHILD entity of the agent, added through
# MBAgentVisuals.AddChildEntity. Hiding the parent would hide the weapon with
# it, which is the one thing this must not do.
#
# MetaMesh.SetVisibilityMask never touches the hierarchy. It clears the meshes
# hanging off the AGENT's own entity - body, armour, hair - and a child entity's
# meshes are not among them, so the weapon carries on drawing because nothing
# ever asked it not to. The mod checks this rather than assuming it: if the
# weapons turn out to share the body's entity, it refuses to hide anything and
# says so. A visible body is a disappointment; an invisible sword is the feature
# not working.
#
# Nothing is restored when this is turned off - a MetaMesh belongs to an agent
# that can die between the hide and the restore, and holding engine pointers
# across that lifetime is exactly what crashed an earlier attempt at meddling
# with agent rendering. Switching this off takes effect on the next mission.
hide_body = 1

# Print the agent's mesh table once, and which slot's weapon is on which entity.
# Same reasoning as the bone table: every later question about this is a question
# about that list, and reading it from a log beats another round of inference.
hide_body_log = 1

# Substring of a mesh name never to hide, if something on the agent's own entity
# turns out to be worth keeping. Empty by default - the weapons are child
# entities and need no help.
hide_body_keep =

# ===========================================================================
#  DRIVING THE WEAPON ITSELF, NOT THE BONE IT HANGS FROM
# ===========================================================================
# Everything above rested on one claim: weapons are parented to r_finger0, so
# posing a hand carries its item along. The log says that claim is wrong.
#
# Every step upstream of it worked:
#
#   Player skeleton has 28 bone(s)
#   Grip captured for the Main hand from 240 samples, wobble 6.7 deg
#   Hands are following the controllers
#
# and the weapon still sat where the animation left it. So the hand bone WAS
# being written every frame, and the weapon did not care.
#
# It does not care because it is not a skinned mesh. A wielded weapon is its own
# GameEntity - Agent.GetWeaponEntityFromEquipmentSlot hands one back - and the
# engine resolves that entity's transform from the bone during its own skeleton
# update, which runs BEFORE our write. Moving the bone afterwards moves the
# skinned hand, because those vertices are read later; it cannot move the
# weapon, because the weapon's transform was already decided and nothing
# recomputes it.
#
# So the weapon gets set directly. The chain is
#
#   handWorld   = controller position + captured grip rotation
#   weaponWorld = handWorld * boneToWeapon
#
# where boneToWeapon is the mesh binding - where the weapon sits relative to the
# hand bone - measured from the animation during the same window the grip
# rotation is. Unlike the arm-gap number that started all of this, BOTH halves
# of that one are meaningful: a weapon entity's origin is its mesh pivot rather
# than its grip, and the binding is what says where along the sword the hand
# goes.
weapon_entity_follow = 1

# Read the frame back next tick and say once whether the write survived.
#
# Whether the engine leaves a child entity's frame alone once it has been set is
# the question this whole approach turns on, and it is cheaper to measure than
# to reason about - the last round was lost to reasoning about it. The log will
# say CONFIRMED with the drift in metres, or say the engine is recomputing it
# from the bone. Either way it takes one session instead of three.
weapon_entity_verify = 1

# How far the read-back may differ before it counts as having been overwritten,
# in metres.
weapon_entity_tolerance = 0.02



# ---------------------------------------------------------------------------
#  WHICH CONTROLLER DRIVES WHICH HAND
# ---------------------------------------------------------------------------
# "Which bone holds the sword" and "which of the player's hands should move it"
# are not the same question. The old config could only answer them together,
# because it drove exactly one bone named here by hand - which is fine while the
# answer is always "the right one", and wrong the moment a bow is involved.
#
# What was asked for:
#
#   a shield              -> the left controller
#   a one-handed sword    -> the right controller
#   a two-handed sword    -> the right controller
#   a bow                 -> the left controller
#
# The first three are free. Bannerlord's main hand is the character's right, a
# shield is an off hand item and a sword of either size is a main hand item, so
# main-to-right and off-to-left satisfies all three without a special case.
#
# A bow is the exception, and not because of anything decided here. A bow is a
# MAIN HAND item - it hangs off r_finger0 exactly like a sword - but the hand
# that holds a bow steady is the one the player thinks of as their bow hand, and
# that was asked for on the left. The other hand draws the string; that is what
# WeaponFlags.StringHeldByHand means and what WeaponComponentData.IsBow tests.
#
# So for bows and crossbows the two controllers trade places: the bone holding
# the bow is driven by the LEFT controller and the string hand by the right.
# Nothing about the skeleton changes - only which controller is asked about each
# bone. Set to 0 to keep the bow on the right with everything else.
hand_swap_for_bows = 1

# Whether the empty hand tracks too, or only the one holding something. Both, by
# default: a hand that stops existing when you sheathe a sword is more startling
# than one with nothing in it.
hand_follow_both = 1

# Fallback only. Used when a monster declares no hand bones of its own, in which
# case the bone table is searched for a name containing this, once per side.
# Human characters never reach it - monsters.xml names their hands - and the
# first frame's log says which route was taken.
hand_bone_name = hand

# ===========================================================================
#  THE CONTROLLERS AS AN XBOX PAD
# ===========================================================================
# Bannerlord already has a complete, remappable pad scheme. It registers its
# own movement as
#
#   new GameAxisKey("MovementAxisX", InputKey.ControllerLStick, ...)
#   new GameKey(0, "Up", "Generic", InputKey.W, InputKey.ControllerLStickUp, ...)
#
# so a left stick that reports itself as ControllerLStick moves the player and
# one that also reports ControllerLStickUp works the menus - with no knowledge
# of either on our side. Pretending to be a pad the game already supports is a
# far smaller claim than inventing a control scheme.
#
# The hook is Input._inputManager, a single static field holding the object that
# every key query in the game ends up at. We wrap it rather than patching a list
# of methods, because plenty of callers hold that object and ask it directly,
# and a wrapper catches both shapes at once. It is put back on unload.
#
#   Left stick     move                     Right stick   right stick
#   Left trigger   LT (analog)              Right trigger RT (analog)
#   Left grip      LB                       Right grip    RB
#   X / Y (left)   Xbox X / Y               A / B (right) Xbox A / B
#   Left menu      Start
#
# Touch has no D-pad and no thumbstick click bound, so those keys are not
# reported. Nothing in the movement or menu paths needs them.
gamepad = 1

# Stick rest zone, applied to the MAGNITUDE rather than per axis. Per-axis
# deadzones make diagonals wrong: hold exactly north-east at 0.2 on each axis
# and both get cut, so the stick reads dead in a direction it is plainly being
# held. Raise this if your character wanders while you read a menu.
gamepad_deadzone = 0.18

# How far a stick has to go before it also counts as a digital direction. Menu
# navigation reads the digital keys, so this is "how far is a flick".
gamepad_digital = 0.6

# Trigger and grip travel that count as a press for the digital keys. The
# analog value is passed through regardless.
gamepad_trigger = 0.5
gamepad_grip = 0.5

# How long after you last touch a controller the pad keeps priority over the
# mouse, in seconds.
#
# This is not a preference, it is a requirement of how the game decides whether
# controller bindings count at all:
#
#   Input.IsGamepadActive = IsControllerConnected AND NOT IsMouseActive
#
# so claiming a controller is connected does nothing on its own - an active
# mouse cancels it. While the pad has priority we report the mouse idle. Set 0
# to hold priority permanently; raise it if the mouse steals control mid-fight.
gamepad_priority_seconds = 3.0

# ===========================================================================
#  GRIP CALIBRATION - where each hand sits relative to its controller
# ===========================================================================
# WHAT WENT WRONG LAST TIME, AND HOW THE LOG SAYS SO
#
# The previous version captured the whole rigid transform between the controller
# and the hand the animation had drawn:
#
#   grip = controllerWorld' * animatedHandWorld
#
# That is correct as arithmetic and wrong as a definition, and the last
# session's log is the proof. Fourteen presses of the align key, fourteen
# answers:
#
#   offset (-0.029, -0.061,  0.105) m
#   offset (-0.101, -0.087,  0.004) m
#   offset (-0.633,  0.040,  0.425) m
#   offset ( 0.383, -0.370, -0.082) m
#
# A calibration that lands 63 cm from the hand on one press and 3 cm on the next
# is not measuring a property of the equipment. It is measuring where the
# animation happened to have the character's arm at the instant the key went
# down, which has nothing to do with where your hand is. Then it held that gap
# forever - so the sword floated half a metre from the controller, and pressing
# align again did not converge, it just drew a new number from the same hat.
#
# POSITION AND ORIENTATION ARE NOT THE SAME QUESTION
#
# Split the transform and one half turns out not to need capturing at all.
#
# POSITION is already known. OpenXR defines the grip pose's position as the palm
# centroid of a closed fist, and the hand bone sits within a couple of
# centimetres of it. So the hand goes WHERE THE CONTROLLER IS. The offset is
# nought, give or take a wrist, and the give-or-take is the small tunable below
# rather than something measured off a running animation.
#
# ORIENTATION genuinely has to be captured, because it depends on how this
# skeleton's artist oriented the hand bone against how OpenXR orients a grip
# pose, and neither is written down anywhere readable. The animation knows it:
# the weapon mesh is bound to the hand, so whatever rotation the animation gives
# that bone is a correct sword-holding orientation by construction.
#
#   grip.rotation = controller.rotation' * animatedHand.rotation
#   grip.origin   = the offset below, nought by default
#
# The residual error is now bounded by how you hold a controller rather than by
# what the character's arm was doing, which is the difference between a
# calibration that converges under the sticks and one that does not.
#
# TWO HANDS, TWO GRIPS
#
# l_hand and r_hand are mirror images, and so are the OpenXR grip poses - the
# spec defines the palm normal as pointing away from the palm on the left and
# into it on the right. Two mirrored conventions compose into a relationship
# that differs by side, so each hand carries its own. Aligning captures both at
# once, since both bones and both controllers are in hand on any frame.

# WHERE IT LIVES NOW: THE VR PANEL
#
# Calibration used to be a hidden mode opened with a key, driven with the
# sticks, with nothing on screen. That is a bad shape for a job whose entire
# content is "look at the result and adjust": you could not see which hand was
# being edited, whether anything had been captured, or what the buttons did.
# Every one of those is a fact the panel can simply show.
#
# So it is a tab in the VR panel - End opens it, Calibration is the second tab -
# with two buttons, because there are two different questions:
#
#   AUTOMATIC finds the ORIENTATION on its own, by watching where the game's own
#   animation puts the hand for a couple of seconds and averaging it. That is
#   the part nobody can eyeball, because it depends on how the skeleton's artist
#   oriented a bone against how OpenXR orients a grip pose.
#
#   MANUAL is for the part the game has no opinion about: how YOU hold a
#   controller. It moves the hand under the sticks while you watch it.
#
# Automatic first, manual to taste.
#
# WHY AVERAGING, AND WHAT THE WOBBLE NUMBER IS FOR
#
# One frame taken mid-swing gives a mid-swing grip - which is how the first
# version could be run twice in a row and disagree with itself. Averaging over a
# window fixes that, and it also produces a figure a single snapshot could not:
# how far the animation MOVED across the window. A character standing still
# gives a degree or two; one walking gives tens. The panel prints it and colours
# it yellow past the threshold below, because a bad sample presented as an
# answer is worse than one that says it is bad.
grip_auto_seconds = 2.0
grip_auto_warn_degrees = 12.0

# Shortcut keys. The panel is where this lives; these are a second door to the
# same room, not a second mechanism.
#
#   grip_align_key      runs the automatic pass on the spot, panel or no panel
#   grip_calibrate_key  opens the panel ON the calibration tab and starts the
#                       manual mode; pressing it again saves and closes
#
# Any InputKey name works - "Home", "F9", "NumPad5".
grip_align_key = F11
grip_calibrate_key = Home

# Where the hand bone sits relative to the controller's grip pose, in metres, in
# the controller's own frame. Small by definition: the grip pose is your palm
# and the hand bone is your wrist. Nought unless you have a reason - and the
# sticks are a better way to find one than this line is.
grip_offset_x = 0.0
grip_offset_y = 0.0
grip_offset_z = 0.0

# The manual mode is SIX SLIDERS in the panel, on the Calibration tab: three
# for where the hand sits, in metres, and three for how it is turned, in degrees
# on top of whatever the automatic pass measured.
#
# THE POSITION SLIDERS ARE IN YOUR CHARACTER'S FRAME, NOT THE CONTROLLER'S
#
# X is their left/right, Y forward, Z up. That is deliberate, and it was wrong
# the first time: an offset in the controller's frame has no stable directions,
# so rolling your wrist turns "up" into "sideways" and a slider labelled Z stops
# meaning anything. The complaint these exist to answer - "my hands are too low"
# - is about a direction in the world, so the sliders work in one.
#
# The CyberpunkVR mod's arm IK lands in the same place: its per-hand offset is
# added in MODEL space, after the controller position has been rotated into the
# body frame, and its panel carries a separate vertical Height slider with an
# asymmetric -0.20..+0.50 m range - which is only a meaningful control if "up"
# reliably means up.
#
# The small controller-frame offset is still there, as grip_offset_* above. That
# one SHOULD travel with your wrist: it is the couple of centimetres between the
# OpenXR palm centroid and the hand bone, which is a fact about your hand rather
# than about the world.
#
# WHY SLIDERS AND NOT THE STICKS THIS REPLACED
#
# Nudging with a stick is a RATE, and a rate has no home. You cannot see how far
# you have gone, you cannot get back to nought, and two people holding the stick
# for different lengths of time get different answers to the same question. A
# slider is the value itself: it shows where the hand is, it can be dragged
# straight to a number, and double-clicking one lets you type it. That matters
# because "my hand is four centimetres too far forward" is a thing a player can
# measure by looking, and a stick gives them no way to say it.
#
# The sticks still work, and now move the same six numbers rather than a hidden
# transform - so the two cannot disagree, and letting go leaves a value you can
# read off the panel:
#
#   Left stick           slide the hand sideways and forwards
#   Triggers             slide it in and out
#   Left grip + sticks   turn it (right stick yaw/pitch, left stick roll)
#   Left menu button     switch between the weapon hand and the shield hand
#   A                    save both and close    B  cancel both and close
#   X                    run the automatic pass Y  reset the edited hand
#
# The controller buttons duplicate the panel's own on purpose: the panel is
# driven with the desktop mouse, and the whole reason to be in this mode is that
# both your hands are holding controllers.
#
# Movement is SUSPENDED while the mode is open, so you cannot walk off a cliff
# lining up a hilt. The same is true during the automatic pass, which asks you
# to hold still and would be undone by a stray nudge.
#
# Stick rates: metres per second and degrees per second at full deflection.
grip_move_rate = 0.20
grip_turn_rate = 60.0

# Written by the calibration itself, two lines per hand.
#
# The ROTATION is nine numbers - the 3x3 basis the automatic pass measured. Not
# meant to be read: a Mat3 round-trips exactly and Euler angles do not, and a
# calibration that drifts every time it is saved and reloaded is worse than one
# that is hard to read.
#
# The ADJUSTMENT is the six the sliders show: x, y, z in metres, then yaw,
# pitch, roll in degrees. These ARE meant to be legible - they are the ones
# worth checking, or copying to another install.
#
# Splitting them is what lets the sliders exist. Composed into one matrix, the
# only way to offer an angle slider would be to pull Euler angles back out every
# frame and put them in again, which introduces a convention, a gimbal case, and
# a value that creeps a little on every round trip.
#
# Delete a rotation line to have that hand measured again on the next mission.
# Only a SAVED calibration is carried between missions; one captured
# automatically is a guess taken at whatever instant a mission began, so it is
# re-made at the start of the next one rather than inherited.
#grip_rotation_main =
#grip_rotation_off =
#grip_adjust_main =
#grip_adjust_off =

# The two older formats, read once on the way in and then written out in the new
# shape. Their ROTATION is kept - that half was always meaningful - and their
# offset is discarded, because it was the gap between your controller and the
# character's arm at one instant of one animation, which is what put the hand in
# the wrong place to begin with.
#grip_calibration_main =
#grip_calibration_off =
#grip_calibration =

# --- depth composition layer -----------------------------------------------
# Submits the game's own depth buffer alongside each eye, so the compositor can
# reproject a held AFR eye for head MOVEMENT and not only for head rotation.
#
# THE ARTEFACT IT REMOVES
#
# Given only a pose, the compositor can rotate a stale image and nothing else,
# and a rotation moves every pixel by the same amount - correct for geometry at
# infinity, wrong for everything nearer. Head movement is never pure rotation:
# the eyes orbit the neck, so any turn translates them, and a translated
# viewpoint shifts near geometry more than far geometry. That is parallax, no
# rotation can express it, and without depth the compositor cannot apply it. It
# shows as near objects sliding against the background on ONE eye, alternating
# at half the frame rate - which is what "not smooth while moving my head" is.
#
# Requires XR_KHR_composition_layer_depth. The startup log says whether the
# runtime offers it. It also requires the game's depth buffer to be eye-sized,
# single-sampled, and in a format the runtime offers a swapchain for, because
# CopyResource cannot cross typeless families - each of those is checked and
# reported by name rather than failing quietly.
#
# 0 restores rotation-only reprojection, which is what every session before this
# ran with. Worth flipping if the depth direction is ever wrong: a correction
# applied the right way round is an improvement, and one applied backwards is
# worse than none. The per-second "Depth layer:" line reports which convention
# was detected and how many eyes went up with depth - two per frame is healthy.
depth_layer = 1

# --- the flat screen -------------------------------------------------------
# Puts the game's own image on a screen in the headset for everything that is
# NOT a mission: the main menu, the campaign map, the inventory, party and
# encounter screens, and loading.
#
# All of those are 2D images in the game's swapchain with no camera and no
# depth behind them, so there is nothing to render in stereo - and without this
# the headset showed a cleared colour while the game was perfectly playable on
# the monitor. It is a composition layer quad, the same mechanism the settings
# panel uses, so the runtime samples it at its own resolution and reprojects it
# as the head moves.
#
# The screen is PINNED where you were looking when it appeared, level, rather
# than carried with the head - a menu that follows you cannot be looked away
# from and is harder to put a cursor on. It re-pins each time you leave a
# mission.
#
# 0 leaves the headset on the stereo path everywhere, which is the behaviour
# before this existed: menus go back to being blank in the headset.
flat_screen = 1

# Screen width in metres, at flat_screen_distance. The default 2.0 m at 2.0 m
# is a little over 50 degrees across - wide enough for the campaign map's small
# text, comfortably inside the field of view so the edges need no head turn.
flat_screen_width = 2.0
flat_screen_distance = 2.0

# --- deployment is vanilla -------------------------------------------------
# Before Ready is pressed, Bannerlord gives a free-flying camera for placing the
# army. There is no player agent yet, nothing to anchor a head to and no first
# person to be in, so every VR camera write during that phase lands on top of a
# camera the player is actively steering somewhere else - which is why it
# drifted and then flew.
#
# 1 (default) makes VR let go of it completely: the deployment camera is exactly
# what the game makes it, and the headset shows it on the flat screen, the same
# as the campaign map and for the same reason - it is a 2D RTS view, not a world
# to stand in. Every camera writer in the mod is gated on this one answer.
#
# 0 gives the deployment camera back to VR, which is what it did before.
vanilla_deployment = 1

# --- head-relative movement deadzone ---------------------------------------
# Below this many degrees between where you are looking and where the character
# faces, the movement vector is left exactly as the game built it.
#
# It was 0.6 degrees, on the reasoning that a correction that small is not worth
# the arithmetic. True of the arithmetic, false of the feel: it meant the
# smallest head movements changed nothing at all, so walking direction snapped
# into agreement with the head rather than following it. Effectively zero now.
head_move_min_deg = 0.02

# --- how hard the head pulls the game's aim --------------------------------
# The fraction of the remaining aim error corrected each frame.
#
# The injection used to feed the head's per-frame DELTA into the game's look,
# which is open loop: nothing corrected an error once one existed, and errors
# always appear - head_drive_max_step clamps a fast turn, a dropped frame loses
# a delta, the engine clamps its own elevation near vertical. The offset that
# left never came back, and the log showed it parked at about sixty degrees:
#
#   aim-vs-view -60.2 ... -73.7 ... -58.3 ... -61.4 ... -61.8
#
# It now drives that error to zero instead, so the aim converges on the view and
# stays there, self-correcting after every clamp and hitch.
#
# Not 1.0, because the error read is one frame old and a full correction
# overshoots into a ring. At 0.35 and 120 fps a sixty degree error is under a
# degree within a tenth of a second. Raise it if the aim lags a fast head turn;
# lower it if the crosshair visibly hunts around the target.
head_aim_gain = 0.35

# --- the head writes the aim, the mouse does not ---------------------------
# In first person the engine REFUSES an injected look delta. From UpdateCamera:
#
#   CalculateNewBearingAndElevationForFirstPerson(... out newBearing ...)
#   if (newBearing != num15)
#       _cameraBearingDelta = ClampFloat(WrapAngle(newBearing - CameraBearing),
#                                        MinMax(-num17, num17));
#
# num17 is our own delta, so the clamp range is bounded BY WHAT WE WROTE: the
# engine can only ever shrink an injection, never grow it, and what it shrinks
# it to is the first-person look constraint - how far a head may turn relative
# to its body. Ask for more and the aim parks at that boundary, which is what
# the log measured for three builds running: aim-vs-view stuck near -60 deg.
#
# 1 (default) writes CameraBearing and CameraElevation outright instead. With
# the delta left at zero the clamp range collapses to [0,0], so the engine adds
# nothing and the written value is what it builds the camera from. The direction
# is converted with the engine's own Vec3.RotationZ / RotationX, so there is no
# convention to guess and no sign to calibrate.
#
# 0 restores the delta injection every earlier build used.
head_aim_absolute = 1

# Whether the mouse still turns the view. Off: with the head writing the bearing
# outright, two authors for one value fight each other. The mouse keeps every
# other function - menus, orders, the campaign map.
mouse_yaw = 0
mouse_pitch = 0

# --- menu navigation with the sticks ---------------------------------------
# IsKeyPressed is a true edge, so holding a stick direction moved a menu exactly
# one row and stopped. These re-arm that edge while a direction is held, which
# is what a keyboard's auto-repeat does. Stick directions only - a held trigger
# means something quite different from a held direction.
gamepad_repeat_delay = 0.40
gamepad_repeat_rate = 0.12

# --- menus in the headset --------------------------------------------------
# Bannerlord draws its interface into the game's own swapchain, not into
# anything the stereo path touches, so inside a mission none of it reached the
# headset: the world was there and the inventory, the escape menu and every
# conversation were not.
#
# It cannot be composited over the stereo world either, and the reason is what
# AFR does to get that world: VrAfrRenderer points the engine's own scene view
# at our eye texture, so during a mission the game's image holds the interface
# with NO 3D behind it. There is nothing to blend against and nothing lost by
# showing it instead.
#
# So a menu is treated exactly like the campaign map - the same flat screen, in
# the same place, readable at the panel's own resolution. Covers anything pushed
# over the mission (inventory, character, party, escape) plus the order,
# transfer and radial menus, conversation and barter.
#
# NOT the combat HUD - health, ammo, the kill feed. Those need to be visible
# WHILE fighting, which means compositing rather than replacing, and that needs
# the interface on its own texture with real transparency. Different mechanism.
#
# 0 keeps the stereo world through every menu and leaves them on the monitor.
ui_screen = 1

# --- menus over the world, not instead of it -------------------------------
# A menu you stop to READ (inventory, escape, a conversation) can replace the
# view. A menu you USE while playing cannot: the tactics wheel exists to be
# turned mid-fight and is meaningless without the field behind it.
#
# So those are keyed and composited over the stereo world. What makes keying
# honest here is a quirk of AFR: VrAfrRenderer points the engine's scene view at
# our eye texture, so the game's own image during a mission is the interface
# drawn over NOTHING. The background is flat dark rather than a busy scene, so
# separating interface from not-interface is close to exact.
#
# Alpha comes from the brightest channel, not a perceptual luminance: the
# interface is full of saturated single-channel colour (red health, blue morale)
# and a luminance weighting would fade the health bar to a ghost.
#
# Raise the threshold if the background shows as a haze over the world; lower it
# if dark parts of the interface vanish. The softness is the ramp width, which
# keeps antialiased text edges from crawling as the head moves.
ui_key_threshold = 0.06
ui_key_softness = 0.06

# Size and distance of that overlay. Bigger and closer than the flat screen,
# because this one is an overlay ON the view rather than a panel in the room.
ui_overlay_width = 2.2
ui_overlay_distance = 1.6

# --- motion-control hands and melee ----------------------------------------
# EXPERIMENTAL and off. The hand posing writes bone frames the game's own
# animation writes back over, and the swing detection is unfinished. Toggle it
# in the VR panel (End) under "Body and hands".
#
# This does NOT affect the gamepad emulation. The controllers reporting as an
# Xbox pad is how you move, aim menus and press things, and that path is
# unrelated and always on.
motion_hands = 0

# --- stick mouse in menus --------------------------------------------------
# Bannerlord's interface is only partly navigable by directional focus - the
# map, inventory grids, scrollbars and anything draggable assume a pointer. So
# in menus a stick moves the real cursor and the triggers click: right trigger
# is the left button, left trigger the right button.
#
# It drives the ENGINE'S own cursor (Input.SetMousePosition) rather than a
# private one, because hit testing, hover, drag and tooltips all read the
# engine's position through paths this mod never sees.
#
# Only in menus. During play the right stick is the camera, and moving the
# cursor under a game that has captured the mouse for look control makes the
# view drift.
#
# While the stick is actually being pushed the mod reports the mouse as active,
# which is what puts the interface in pointer mode - Input.IsGamepadActive is
# IsControllerConnected AND NOT IsMouseActive, so the two modes are exclusive.
# Let go and the pad takes back over, so menus can still be walked by direction.
stick_mouse = 1
stick_mouse_speed = 1.1
stick_mouse_deadzone = 0.20
stick_mouse_stick = right

# --- the monitor mirror ----------------------------------------------------
# Rebuilds the game window from the headset's own image.
#
# The window was broken and AFR is why: VrAfrRenderer points the engine's scene
# view at our eye texture, so the game stops drawing the world into its own
# swapchain and only the interface lands there - over whatever stale frame was
# left behind. That is what the window showed: menus and health bars painted
# across an old loading screen.
#
# So the mirror is ASSEMBLED rather than captured. The eye the headset is being
# shown is scaled to the window with its aspect preserved, and the keyed
# interface is composited on top. Letterboxed rather than stretched: an eye
# image is a roughly square VR frustum, and squeezing that into 16:9 makes every
# face on the monitor wide and wrong.
#
# The interface is keyed on every mission frame rather than only when a menu is
# open, because the health bar and the kill feed are interface too and the
# window should carry them. The headset overlay and the window share that one
# key pass.
#
# 0 leaves the window exactly as the game left it - which is the broken picture
# described above, kept only so the two can be compared.
monitor_mirror = 1

# --- the escape menu, pause menu and scoreboard ----------------------------
# These are NOT separate screens. The inventory and the character sheet are, so
# "is something on top of the mission" caught those - but the escape menu, the
# pause menu and the scoreboard are Gauntlet LAYERS added to the mission screen
# itself, so the top screen is still the mission and the test saw nothing. That
# is why they never reached the headset.
#
# They are now found by what a layer is DOING rather than by name: a layer that
# has asked for the cursor, or taken input focus, is one the player is meant to
# be reading. The scene layer is excluded, because that is the game itself and
# holds focus for the whole of normal play. Naming them individually would have
# missed the next one, and every one a mod adds.

# --- stick mouse: OFF by default now ---------------------------------------
# It claimed the mouse whenever the stick was pushed and gave it back the moment
# it was released. Input.IsGamepadActive is IsControllerConnected AND NOT
# IsMouseActive, so the pointer and the pad's own directional navigation are
# mutually exclusive - the interface was switching between the two continuously
# while a menu was being used, and every switch drops the highlight. That is
# what made navigation stutter.
#
# Off, the stick is simply a gamepad stick: focus navigation for as long as the
# menu is open, analog reported as ControllerLStick / ControllerRStick, and held
# directions repeating. 1 turns the pointer back on for the parts that genuinely
# need one - map markers, inventory drags, scrollbars.
stick_mouse = 0

# The pad also keeps its priority for as long as a menu is open, instead of
# lapsing after gamepad_priority_seconds. Stopping to read for three seconds
# used to drop focus navigation until the stick was nudged again, and there is
# no mouse being reached for inside a headset.

# --- the interface is shown for the whole mission --------------------------
# Recognising menus one at a time kept missing things. The wheels have a flag,
# the escape menu is a layer that takes focus, and the scoreboard has neither -
# no view type of its own, no cursor requested, no focus taken. Every version of
# "is THIS open" missed something and would go on missing whatever came next.
#
# But the interface is already keyed every mission frame, because the monitor
# mirror needs it. Submitting that keyed layer unconditionally shows whatever
# the game happens to be drawing - the scoreboard, the health bar, the kill
# feed, a mod's own panel - and asks no questions about what any of it is. The
# thing that was hard to detect turned out not to need detecting.
#
# 0 goes back to showing only the wheels and the order menu: quieter at the edge
# of vision, but the health bar and anything unrecognised stay invisible.
ui_overlay_always = 1

# --- the stick mouse no longer claims the mouse ----------------------------
# It used to report the mouse as active whenever the pointer was live, which put
# the interface into pointer mode - and took it out of gamepad mode at the same
# time, because Input.IsGamepadActive is IsControllerConnected AND NOT
# IsMouseActive. The controller stopped being a controller: face buttons went
# dead in menus and the prompts turned back into keyboard glyphs.
#
# The pointer now moves the engine's cursor and says nothing about the mouse, so
# the pad keeps its bindings, its prompts and its focus navigation throughout.

# --- the interface, from the VR panel --------------------------------------
# Show/hide and the two sizes are in the panel (End) under "Game interface",
# because they are judged by looking rather than by reading. How much of the
# view a panel should cover, and how far away it sits before text stops being
# comfortable, depend on the headset, the render scale and the player's eyes -
# a config key means edit, restart, look, repeat; a slider means look while
# moving it. The panel writes these keys back, so a session starts where the
# last one left off.
#
# ui_show is the master switch and deliberately does NOT affect the escape
# menu: that replaces the view on its own panel rather than going through the
# keyed layer, so hiding the interface cannot lock you out of the game's menu.
ui_show = 1

# --- the resolution slider applies live -------------------------------------
# It used to size the swapchains and eye targets at startup and nothing else,
# so moving it saved a number and changed nothing you could see until the next
# launch. Correct, and useless for a setting judged by looking at it.
#
# The engine can already shade a scene at less than its target's size and
# upscale into it - rgl does exactly that of its own accord - and
# SceneView.SetScale is the control. That resizes NOTHING: the eye target, the
# swapchain and every copy between them keep the dimensions they were allocated
# with, so none of the mid-frame surgery this repo has scars about is involved.
#
# The slider now does both halves: the scene is shaded at the new fraction
# immediately, and the value is saved so the next launch allocates the targets
# to match and reclaims the memory and copy bandwidth as well.
#
# One honest asymmetry: lowering works now, raising past the value the targets
# were built at cannot - there is no detail there to ask for - so that part
# really does wait for a relaunch, and the panel and log both say so.
#
# 0 restores next-launch-only behaviour, in case SetScale misbehaves.
render_scale_live = 1

# --- conversations happen in the world -------------------------------------
# Talking to someone used to be treated as reading: it replaced the view with
# the flat panel, so you stood in a void holding a dialogue box. That is the
# wrong call for the one screen where the thing being talked about is standing
# in front of you.
#
# 1 (default) keeps the stereo world and composites the dialogue over it, keyed,
# exactly as the tactics wheel is. The camera stays yours throughout - the
# game's own conversation framing is simply not used, which is what being in the
# room instead of watching it means. Barter goes with it.
#
# The dialogue is shown even if the interface is hidden or ui_overlay_always is
# off: every other panel can be hidden and you carry on playing, but this one is
# the only way OUT of a conversation, and a hidden dialogue is a soft lock in a
# headset.
#
# 0 puts conversation and barter back on the flat panel - easier to read, and
# not being in the room. Long trade menus are genuinely a reading task, so the
# switch is worth having.
conversation_vr = 1

# --- a D-pad on controllers that do not have one ---------------------------
# HOLD THE LEFT STICK IN, PUSH THE RIGHT STICK.
#
# Several of Bannerlord's screens bind the pad's D-pad (ControllerLUp / Down /
# Left / Right) and nothing else, and a Touch or Sense controller has no D-pad
# to give them. Everything else on the controller is already spoken for - both
# triggers, both grips, four face buttons, the menu button - so the only way to
# reach four more directions is a chord, and the stick click is the last spare
# modifier there is. It needed a new OpenXR action: the vector thumbstick
# binding cannot report a click.
#
# The RIGHT stick is the one borrowed, deliberately. The left is movement, and a
# chord that walked you somewhere while you held it would be its own problem.
# While it is held, the right stick's own axis and directions are suppressed so
# the camera does not swing at the same time, and the stick mouse stands aside.
# Everything else keeps working: triggers, grips and face buttons are untouched.
#
# Held directions repeat like any other, so a long list is not one flick per row.
#
# The click is also reported on its own as ControllerLThumb / ControllerRThumb,
# which the game binds in a few places and had no way to receive before.
#
# 0 gives the right stick back and drops the chord.
dpad_chord = 1

# --- the pointer stick no longer does three jobs at once --------------------
# The right stick moved the cursor AND was still reported as the right stick,
# so one push moved the pointer, panned the campaign map behind the menu, and
# scrolled the list being pointed at - the entry being aimed at slid out from
# under the cursor as it arrived. While the pointer has the stick, the pad now
# reports it centred and its four directions up, exactly the way the D-pad
# chord already borrows the same stick.
#
# 1 (default) leaves the BARE campaign map's camera on the right stick and
# takes it only once something is actually open over it - a settlement menu,
# the inventory, the party screen. 0 goes back to a pointer everywhere outside
# a mission, which is the old behaviour minus the double-drive.
stick_mouse_map_camera = 1

# The pointer moved to the LEFT stick. The right one is the camera everywhere
# it is not a pointer - the campaign map above all - and a stick that means
# "look" during play and "point" in a menu is one the hand has to think about.
# Set to right to put it back.
stick_mouse_stick = left

# Menu detection on the campaign map now asks the game state instead of walking
# the top screen's layers. The layer walk called the BARE map a menu, because
# the map is driven by clicking and its own furniture asks for a cursor - so the
# pointer took the stick there and the map camera went dead. MapState plus its
# menu context answers it exactly: bare map = camera, settlement menu = pointer.

# --- AFW now stands down instead of degrading to a copy ---------------------
# The Meta Link run found it: AFW calibrated, concluded the depth could not
# predict this scene, set its gain to zero and CARRIED ON. A zero gain copies
# the rendered eye across unchanged, which the code called "flat, but honest".
# It was neither. afw_capture tags each eye with its own pose, so the copy was
# submitted from a viewpoint an IPD away from the one it was drawn for - every
# object 65 mm to the side of where its eye expected it, with no parallax
# anywhere to justify the shift. That is not flat, it is two pictures that will
# not fuse, which is exactly the "confident double image" the zero gain was
# meant to avoid.
#
# AFW now declines the frame instead, and the caller falls back to ordinary AFR
# - the other eye a REAL render from its own position, one frame old. Stale and
# correct beats simultaneous and displaced.
#
# afw = 0 skips the whole experiment and goes straight to AFR.

# --- AFW: occlusion by scatter, not by search -------------------------------
# "Objects near me have a very obvious triple image at the edges, far away
# objects are fine" was the gather shader, and the shape of the report named
# the cause. It solved sx = dst + Dir*D(sx) by iterating six times per
# destination pixel - but at the edge of a near object that equation has
# SEVERAL answers (the object's edge at a large disparity, the background
# behind it at a small one), and having several answers is not a flaw in the
# scene, it is what occlusion IS. The iteration settled into whichever branch
# its start led to, the branch changed from one pixel to the next along the
# edge, and the edge came out drawn in two or three places. Far geometry has a
# disparity near zero, one branch, converges on the first step - which is
# exactly why distance looked right and everything close tripled.
#
# The warp now runs the other way: each SOURCE pixel claims where it lands and
# InterlockedMax keeps the nearest claim. Of two surfaces landing on one pixel
# the larger disparity is the nearer, so the max IS the occlusion test - exact,
# order-independent, and cheaper than the six dependent reads it replaces.
#
# Disocclusions (holes the near object uncovers) are filled from the FARTHEST
# neighbour, not the nearest. The old fallback took the pixel straight ahead,
# which is the occluder itself - that was the third of the three images.
afw_gap_fill_px = 24

# --- AFW near-field: real geometry in the holes, and no flattening plane -----
# Two separate faults, both in the near field, both visible in the arena shots.
#
# 1. THE COMB OF STRIPES down the edge of a near column was the gap fill running
#    out of window. A disocclusion behind a near edge is as wide as the
#    disparity STEP across that edge - up to the whole cap - but the search was
#    24 px. Pixels past 24 found nothing and fell back to the pixel straight
#    ahead, which is the occluder, so filled and unfilled columns alternated.
#
#    Widening it is not the real answer though: stretching one background pixel
#    across a 96 px hole is a smear whichever way it is done. The source eye
#    CANNOT contain what a disocclusion reveals - that is what the word means.
#    But the eye being synthesised rendered that geometry itself one frame ago,
#    in its own screen space, so the missing pixel is simply the one at the same
#    coordinate of its own last real render. Holes now come from there: real
#    geometry, one frame stale, which is the trade AFR already makes for whole
#    eyes. The stretch remains only as the first-frame fallback.
#
# 2. "3D FEEL GETS LESS WHEN VERY CLOSE" was the hard disparity clamp. At
#    51.7 px per unit against a 96 px clamp, EVERYTHING inside 0.54 m came out
#    at one disparity - a flat plane pasted across the nearest part of the
#    scene, which is the part being looked at. The clamp is now a soft knee:
#    exact below it, smoothly compressed above it, and monotonic all the way in,
#    so nearer is always still nearer and there is no distance at which depth
#    stops.
afw_disparity_knee_px = 58     # exact below this; compressed above it
# afw_gap_fill_px              # first-frame fallback only; defaults to cap + 16

# --- AFW calibration: a gain of 4.0 is not a correction ---------------------
# Two runs of the SAME arena scene calibrated to 0.750 and then 4.000, giving
# 51.7 px and 275.9 px of disparity per unit. The second is why "far away is
# worse": at 4.0 an object twenty metres out gets 14 px of separation where it
# should have under 3, so distance doubles instead of fusing.
#
# The gain is a CORRECTION to focal_px * baseline / z, not a free parameter.
# With a 108 deg eye over 2628 px the focal length is ~955 px and the baseline
# is 65 mm, so the model predicts ~62 px at one metre and the honest gain is
# near 1.0. The ladder used to run 0.06 .. 16.0, which let the search overrule
# a model that was already right.
#
# The cause of the bad samples: the two eyes it measures against are captured on
# CONSECUTIVE frames, because AFR alternates them. Head motion in that 11 ms is
# indistinguishable from a wider baseline, so the search absorbs it into the
# gain. Hold still -> 0.75. Move while it samples -> 4.0.
#
# So: the ladder is bounded to 0.50 .. 2.00, landing on either END counts as
# "the model does not fit" rather than as an answer, and no sample is applied
# until TWO agree within 25%. Agreement is the whole point - motion
# contamination is random, so two samples agreeing is evidence neither was
# contaminated, which no single sample can provide however good its cost looks.
# Out of attempts with sane-but-disagreeing samples, it takes the model's 1.0.
#
# afw_gain = 0.9   # pin it by hand; 0 (default) calibrates

# --- AFW near field: correct disparity, and spans that are measured ---------
# 1. "CLOSER THAN 1.5 M LOOKS BIGGER, THE CLOSER THE WORSE" was the soft knee
#    sitting in the wrong place. Disparity is ~62 px at a metre here, so a 96 px
#    ceiling bit at 0.65 m and the knee under it bit at 1.1 m - everything from
#    arm's length inward had its disparity REDUCED. Reduced disparity reads as
#    greater distance while the angular size on screen is untouched, and an
#    object subtending a hand's width but perceived a metre off has to be read
#    as a much larger object. Size-distance paradox, exactly as reported.
#
#    The ceiling belongs where stereo fusion actually fails, not at
#    conversational distance. 220 px is about 0.28 m; the knee at 0.85 of it is
#    about 0.33 m. From there to infinity the disparity is now simply correct.
# SUPERSEDED. Both are now DERIVED from the near plane unless pinned above zero,
# and -1 means derive. The ceiling is focal * baseline / zNear - the disparity of
# something sitting exactly on the near plane, which nothing real can exceed
# because nothing nearer is drawn at all.
#
# WHY A CONSTANT CEILING PUT A SECOND COPY OF EVERY CLOSE OBJECT ON SCREEN
#
# Reported as "close objects have visible tripling, very close objects break and
# give strong tripling". Tripling is what a DOUBLED synthesised eye looks like
# once the brain fuses it with a correct one, so the question was where a second
# copy inside one eye came from.
#
# At 220 px the ceiling bit at ~0.30 m and the knee at ~0.35 m. An object at
# 0.10 m has a true disparity near 660 px and was moved 220. But the band it
# uncovers behind itself is as wide as its TRUE disparity, and that band is
# filled from the destination eye's own last real render - which shows the
# object where it really is. So the eye held the warped copy at +220 px and the
# real one at +660 px. Two copies, from two sources disagreeing by exactly the
# amount the cap removed.
#
# Uncapping makes the two sources agree instead of compete.
#
# WHAT THE REFERENCE IMPLEMENTATIONS DO
#
# Neither has a disparity ceiling at all. PureDark's frame-warp interface
# (E:\BL2VR\REFramework-RE9_AFW_v1.0-beta.6\dependencies\pd-afwmod, as driven by
# REFramework and by the Witcher 3 mod's puredark_afw_bridge) takes full camera
# matrices - srcClipToView, destViewToClip and the rest - and reprojects every
# pixel through them. A matrix reprojection has nowhere to put a ceiling:
# displacement falls out of the geometry. The only thresholds either exposes are
# about MOTION (IgnoreMotionThreshold, in pixels), never about disparity.
#
# That is the right division, and this file already had both halves of it: how
# far a pixel MOVES is geometry and must not be clamped, while how far apart two
# NEIGHBOURING pixels land is a sampling question that afw_max_span_px and
# afw_span_fraction answer. The cap was the wrong tool doing their job badly.
#
# The soft knee is kept - it holds the last few centimetres before the near
# plane, where one bad depth sample would otherwise fling a pixel across the
# screen - but at 0.85 of the derived ceiling it now sits at about 0.06 m, in
# front of nothing a player looks at.
afw_max_disparity_px = -1
afw_disparity_knee_px = -1

#
# 2. THE TRIPLE IMAGE UNDER A METRE was the scatter claiming a fixed two-pixel
#    span. Disparity goes as 1/z, so up close it changes fast across a surface,
#    adjacent source pixels land three or four apart, and the destination pixels
#    between them get no writer. Those cracks are then filled as though they
#    were disocclusions - from the previous frame, displaced by whatever the
#    head did in 11 ms - so a lattice of one-pixel holes each shows a slightly
#    shifted copy. That reads as a ghost, and only up close, which is exactly
#    where it appeared.
#
#    The span is now MEASURED: where the next source pixel lands. Everything
#    between the two belongs to this surface. Wider than afw_max_span_px is
#    treated as a depth discontinuity instead - a real disocclusion, filled with
#    geometry that actually saw it - because painting across that would smear
#    the near surface over whatever stands behind it.
afw_max_span_px = 8

# --- AFW: sub-pixel source sampling ----------------------------------------
# "Blurry a bit, or a very slight doubling, not clear" was nearest-neighbour
# resampling in the gather. The scatter records which INTEGER source pixel won
# each destination, and the gather sampled exactly that pixel with Load. The
# warp's scale factor is never exactly one, so along any surface some source
# columns got sampled twice and others were skipped - and a duplicated column IS
# a doubled edge, one pixel wide, everywhere at once, while the skipped ones are
# what read as softness.
#
# The true source position is fractional and was already known to a sixteenth of
# a pixel, because the claim packs the disparity: dst = sx - Dir*D, so
# sx = dst + Dir*D. The gather now samples there through a linear clamp sampler,
# reconstructing the surface instead of quantising it, for one filtered fetch in
# place of one unfiltered one.
#
# It also fixes the span claim for free: a magnified surface stamps one key
# across several destination pixels, and each now resolves to a slightly
# different source position, so the stretch interpolates instead of repeating
# the same pixel in a block.

# --- AFW: the half-resolution depth staircase -------------------------------
# rgl shades the scene at half the eye target in each axis, so two colour pixels
# share one depth texel and the disparity field is a STAIRCASE with two-pixel
# treads. A tread is 2 * dD/dx high, and D goes as 1/z, so the tread grows
# QUADRATICALLY as something approaches: invisible at distance, and up close it
# tears a surface into two-pixel strips each displaced differently. Doubling
# that gets stronger the nearer you get and vanishes with distance.
#
# The depth is now interpolated along the surface, which removes the tread - but
# edge-aware, because interpolating ACROSS a silhouette invents a half-depth
# belonging to neither surface and flings those pixels between the two, smearing
# what should be a clean disocclusion for the previous render to fill. So: lerp
# when the two texels agree about which surface they are on, snap to the nearer
# when they do not. Two depth fetches instead of one.
#
# afw_depth_edge_px defaults to afw_max_span_px, because they are the same
# judgement made twice: below it the neighbour is the same surface and may be
# interpolated, above it it is something else and must not be.
# afw_depth_edge_px = 8

# --- AFW: thresholds that scale with the disparity --------------------------
# The tripling at ~10 cm was two fixed thresholds being wrong at that range.
# Both ask the same question - "is this big jump a stretched surface, or a
# different object?" - and both answered with a fixed 8 px:
#
#   the scatter's span check   decided "different object", claimed ONE pixel
#                              instead of the span, and left the near surface
#                              full of cracks
#   the depth filter's edge    decided "silhouette", snapped instead of
#                              interpolating, and put the staircase back
#
# Every crack is then filled from the previous frame's render, which at ten
# centimetres is displaced enormously by the smallest head movement. Hence
# tripling, and only when very close - that is the only place 8 px is wrong.
#
# At 10 cm the disparity is pinned at the 220 px ceiling and a mildly tilted
# surface changes by a dozen pixels per pixel, so 8 px cannot tell magnification
# from occlusion. A genuine silhouette there jumps by nearly the WHOLE disparity
# (220 down to ~5 for the background), while magnification of one surface gives
# a fraction of it - so the threshold now scales, and the two cases separate
# again at every distance. Larger of the fixed value and this fraction wins, so
# the fixed one still governs the mid field where the disparity is small.
afw_span_fraction = 0.25

# --- the span fraction is measured from a floor, not from zero --------------
# Scaling the silhouette threshold by a flat quarter of the disparity fixed ten
# centimetres and quietly broke the middle distance. At a metre the disparity is
# ~65 px, so a quarter is 16 - and a real silhouette between two surfaces a
# little way apart jumps by less than that. The test then called genuine edges
# "the same surface" and interpolated across them, inventing a half-depth that
# belongs to neither and flinging those pixels between the two: a smear where
# there should be a clean disocclusion, across most of the scene.
#
# The fixed threshold was never wrong in the mid field, only very close. So the
# fraction now applies to the disparity ABOVE afw_span_free_px and the fixed
# value stands alone below it.
afw_span_free_px = 96

# --- the sub-pixel refinement must stay a refinement ------------------------
# The gather reconstructs the source position as sxf = dst + Dir*D, which
# assumes the local mapping is ONE-TO-ONE: advance the destination by a pixel
# and the source advances by a pixel. True wherever the surface is not being
# magnified - which is everywhere except close up.
#
# Up close it is badly wrong. A magnified surface stretches ONE source pixel
# across a span of destinations - eight of them at ten centimetres - and all of
# them carry the same claim, so all of them should resolve back to within a
# pixel of the same source. Instead sxf swept across eight source pixels and
# dragged in whatever geometry sat beside the one actually visible. That is the
# breaking when getting very close, and it appeared nowhere else because
# magnification is one everywhere else.
#
# The claim names the correct source pixel; the refinement may now adjust WITHIN
# it and may not wander to a different one. Sub-pixel gain kept, runaway gone.

# --- the depth search prefers the LARGEST candidate, not the first ----------
# It used to take the first eye-shaped depth of a frame and stop looking, which
# assumes that one is the scene's. A modern renderer binds several: particles,
# screen-space reflections and volumetric fog are all commonly drawn at half
# resolution against a downsampled depth, and each matches the aspect test as
# well as the real thing. Bind one early and the search ends there, on a buffer
# with half the silhouette precision of the one it wanted.
#
# Every run so far latched onto something exactly 50% of the eye in both axes -
# 1224x1338, 1314x1322, 1460x1470 - which is either the scene genuinely
# rendering at half, or exactly this mistake. Preferring the largest settles it
# either way, and the log now says when a larger one replaces a smaller.
#
# The watch has to end itself now that it no longer stops at the first match:
# once a choice has stood 180 frames, a larger one is not coming and the detour
# switches off.

# --- AFR + AFW: the real eye while still, the warped one while moving -------
# The two modes fail in OPPOSITE directions, which is what makes a hybrid worth
# building rather than a compromise:
#
#   AFR  every eye is a REAL render, so the geometry is exact - but the held one
#        is a frame old, so it is wrong in TIME.
#   AFW  both eyes come from one instant, so the time is right - but the second
#        is APPROXIMATE: disocclusions invented, silhouettes no finer than the
#        depth buffer, magnified surfaces reconstructed.
#
# The asymmetry that matters: when nothing has moved, the held real render is
# not merely good, it is EXACT - pixel for pixel what a fresh render of that eye
# would give. No warp can beat it, so every warp artifact there is pure loss.
# And standing still looking at something is exactly when those artifacts get
# examined - which is why "I look at my horse and it is not sharp".
#
# So the warp is no longer the default. It is what we reach for once the held
# eye has gone stale.
#
# TRANSLATION is the test, not rotation. The compositor already reprojects a
# held eye for rotation, correctly, from the pose submitted with it. It cannot
# fix translation without a depth layer, and the depth layer is declined here
# because the game's depth does not match the eye swapchain's size. Translation
# is therefore the only error AFR actually leaves on screen.
# REMOVED. The AFW/AFR hybrid is now a mode of its own in the VR panel
# (stereo_mode = hybrid) rather than something AFW switched on behind the
# player. It defaulted to 1, so "AFW" in the menu had never actually been AFW,
# and every judgement made about it was a judgement about the hybrid.
# afw_still_afr = 1

afw_still_threshold_m = 0.0015   # ~1 px of displacement at a metre

# --- the still threshold was calling moving heads still ---------------------
# 1.5 mm with a doubled release is 3 mm per frame, which at 90 fps is 27 cm/s -
# ordinary head movement, all of it. So the hybrid sat in AFR through exactly
# the motion AFR is worst at, and AFR's characteristic fault is that each eye
# alternates between fresh and a frame stale. "Movement is not smooth like AFW"
# was AFR's judder, reintroduced by a threshold that called moving heads still.
#
# The arithmetic that sets it: a held eye is displaced by focal * d / z, so one
# pixel at a metre with a 955 px focal length is about 1.05 mm. Half a
# millimetre is comfortably sub-pixel out to arm's length, and that is the only
# regime where "exact" is a true claim. 0.5 mm/frame is 4.5 cm/s - slower than
# head sway while standing and looking at something, and slower than anything a
# player would call movement.
afw_still_threshold_m = 0.0005
#
# The decision is also made on a SMOOTHED speed now. One inter-frame delta at
# 90 fps is mostly tracking noise - a few tenths of a millimetre even from a
# head held perfectly still, the same order as the threshold - so deciding on
# the raw value flipped the mode several times a second. Each flip changes what
# the second eye IS, warped or real, which is a stutter of its own on top of
# whichever mode is running.

# --- halos: an ambiguous pixel moves nowhere --------------------------------
# The colour is full resolution and the depth is HALF, so along every silhouette
# there is a band of colour pixels whose depth texel straddles the edge. Which
# surface those pixels belong to is not knowable from that buffer - and
# whichever way the texel resolves, some of them are BACKGROUND pixels carrying
# the FOREGROUND's disparity. They fly with the object, land detached from where
# they belong, and trace its outline in the wrong colour. That is the halo.
#
# Both available answers are wrong for half the band, so guessing harder cannot
# help. What can: refuse to move a pixel whose depth is ambiguous. It then has
# no claim, the gather treats that destination as a disocclusion, and the fill
# comes from the previous REAL render of the eye being synthesised - which saw
# those pixels properly, from the right place, and needs no depth to be right.
#
# The halo is replaced by a band that is one frame old. Standing still - when
# halos get noticed - the hybrid is already showing real eyes, so the band is
# exact. Moving, it is a frame stale at a silhouette, which is the quietest
# artifact available here.
#
# Only where it matters: below this disparity the whole band shifts by under a
# pixel, so opening a hole would cost more than the halo it prevents. Set very
# high to disable edge holes and take the halo back.
afw_edge_hole_min_px = 4

# ---------------------------------------------------------------------------
# Depth composition layer
# ---------------------------------------------------------------------------

# Resample the depth when the game renders it SMALLER than the eye.
#
# A depth smaller than its colour means an upscaler - DLSS or FSR - sits between
# them: the scene is drawn at the upscaler's internal resolution and only the
# COLOUR is enlarged on the way out. At DLSS Performance that is half the eye in
# each axis.
#
# OpenXR gives the depth its own subimage, so on a careful reading a smaller
# depth rect ought to be sampled across the same normalised rectangle as the
# colour. Submitting it that way made the ground shake. A runtime that instead
# pairs the two rects pixel-for-pixel reads depth from the top-left quarter of
# the view and applies it to all of it, which is a large reprojection error that
# comes and goes with head movement - and that is what a slowly shaking world
# looks like.
#
# 1 removes the question: the depth is resampled to the eye's exact size and
# submitted with a rect identical to the colour's, so there is nothing left to
# interpret. Point sampling, so no depth is invented between a silhouette and
# its background. See depth_upscale.h.
#
# What it does NOT fix: DLSS jitters each frame by a sub-pixel offset and
# de-jitters the colour but not the depth, so the depth stays offset by up to
# about one output pixel. That is small next to the correction being made -
# right in the interior of every surface, soft by a pixel or two at edges.
#
# 0 declines the depth layer instead, leaving rotation-only reprojection, which
# is what AFR did before the depth layer existed.
depth_layer_upscale = 1

# ---------------------------------------------------------------------------
# AFW disparity gain
# ---------------------------------------------------------------------------

# A scale on the whole disparity. 1.0 is the physically correct value and is now
# the default; 0 runs the auto-calibration search instead.
#
# For rectified stereo the disparity is exactly focal * baseline / z. There is no
# free scale factor in that, so a correct implementation has no gain knob at all:
# PureDark's frame-warp interface exposes scales for MOTION vectors and nothing
# whatever for disparity, because it reprojects through camera matrices where the
# displacement simply falls out of the geometry.
#
# The search existed because the model was NOT exact while a constant ceiling was
# clamping the near field. With everything close having its disparity truncated,
# no single gain could satisfy both halves of the image, and the search settled on
# a compromise that was wrong everywhere rather than wrong only up close. It went
# unstable twice and was pinned at 0.9 to stop it moving.
#
# That 0.9 then WAS the remaining artifact. Measured against the session's own
# numbers: symmetric focal 1116 px, baseline 0.0653 m, so the true disparity is
# 72.9 px at one metre - and the log reported 65.6, exactly 0.9 of it. A fixed
# fractional undershoot lands the second eye:
#
#     0.5 m   14.6 px out    clear doubling
#     1.0 m    7.3 px out    visible doubling
#     2.0 m    3.6 px out    subtle
#     5.0 m    1.5 px out    invisible
#
# which is exactly "objects near me have visible doubling, far away is fine".
#
# With afw_max_disparity_px derived from the near plane the model is exact again,
# so the right scale is 1.0 and the search is a diagnostic rather than a need.
afw_gain = 1.0

# ---------------------------------------------------------------------------
# AFW: pin the rendered eye
# ---------------------------------------------------------------------------

# 1 (default) stops the engine camera swapping eyes between frames while PURE
# AFW is running. AFR and the hybrid always swap; they have to.
#
# WHY AFW DOES NOT NEED TO SWAP
#
# AFR alternates because it has no other way to obtain the second eye. AFW does -
# it builds the second eye from the first - so alternating buys it exactly one
# thing, the previous real render used to fill disocclusions, and charges a large
# price for it.
#
# The price is that the engine camera TELEPORTS 65 mm sideways every single frame,
# and Bannerlord's antialiasing is temporal: antialiasing_technique = 5 is
# DLSS/DLAA, which accumulates a history whether or not it is upscaling. That
# history is reprojected with motion vectors describing motion within ONE eye;
# nothing in them says the previous frame was taken 65 mm to the side. The
# accumulator therefore blends two viewpoints, worst exactly where the mismatch is
# largest - near, thin, high-contrast geometry against a distant background. Reins
# and a weapon held in front of the face are the textbook case.
#
# It also explains an asymmetry that made no sense otherwise: the alternation has a
# period of two frames, so each eye's history was always built on the OTHER eye's
# frame. That is a systematic left/right difference rather than a wash, and it is
# why one eye showed picture doubling while the other showed only a halo.
#
# THE REFERENCE IMPLEMENTATION AGREES ABOUT THE CAUSE
#
# REFramework carries a setting whose internal name is m_fix_upscalers_wobbling.
# It works by feeding the upscaler the SAME eye's previous view matrix instead of
# the other eye's:
#
#     oldViewMatrix[eye] = is_fix_dlss() ? d.old_view_matrix[eye]
#                                        : d.old_view_matrix[other_eye];
#
# plus a CorrectMotionVectors pass with SwapCameraMotion. Same diagnosis -
# alternating eyes poison a temporal upscaler - solved by correcting what the
# upscaler is told. We cannot tell rgl anything of the kind; its motion vectors and
# its previous-view matrix are its own. Removing the cause is the option we have.
#
# WHAT IT COSTS
#
# The synthesised eye never gets a real render of its own, so disocclusions fall
# back to stretched background instead of that eye's previous frame. Those slivers
# are narrow at a 65 mm baseline. The hybrid is excluded outright: its whole
# mechanism is substituting a real held render while the head is still, and with a
# pinned eye there would never be one to substitute.
# SET TO 0 - the trade turned out to be a bad one, and the reasoning is worth
# keeping because the problem it attacked is still real.
#
# Pinning does remove the 65 mm per-frame camera teleport that the game's
# temporal antialiasing was accumulating across. What it ALSO removes is the
# previous REAL render of the synthesised eye - because that eye is never
# rendered any more - and that is what disocclusions were being filled from.
#
# The fallback it falls back TO was written for the first frame or two of a
# mission and tuned for exactly that: afw_gap_fill_px searches 96 pixels,
# deliberately reduced from the old ceiling on the grounds that "this path only
# ever runs on the first frame or two". Pinning made it the permanent path, and
# the holes it then had to fill are as wide as the full disparity - 146 px at
# half a metre, 243 px at a third of one, against a ceiling that is no longer
# 220 but 1457. Past 96 px the search finds nothing, gives up, and samples the
# source at the same column, which is the near object itself. Every object got a
# band of itself smeared down its right-hand side, in the synthesised eye only.
#
# Right is where they belong, incidentally: the right eye sees an object further
# LEFT than the left eye does, so warping left to right shifts it left and
# uncovers background on its right.
#
# The upscaler ghosting this was meant to fix is real and still there. The
# reference implementation solves it by correcting what the upscaler is TOLD -
# motion vectors and the previous view matrix - not by refusing to alternate.
# That is the honest fix and it needs motion vectors rgl does not expose.
# Trading a subtle artifact on some objects for a blatant one on all of them is
# not a step towards it.
# 1 - and this time on evidence rather than on a hypothesis.
#
# The tripling that survived every other fix was each eye ALTERNATING between a
# real render and a warped one at 45 Hz. The warp's residual error showed up as
# the difference between the two, and it read as a doubled or tripled image in
# whichever eye was being attended to - which is why it was reported as moving
# between eyes.
#
# Pinned, the left eye is a pure engine render every frame and was confirmed
# perfect. Neither eye alternates, so the flicker is gone from both.
#
# THIS ONLY WORKS BECAUSE OF THREE EARLIER FIXES, and turning any of them back
# breaks it again:
#
#   - calibrating() checks a pinned afw_gain BEFORE collecting two real eyes.
#     Without that, a pinned source eye means the second one never arrives, the
#     warp never runs at all, and the synthesised eye goes up as flat red.
#   - the depth search rejects candidates with no near geometry. The buffer it
#     used to pick held nothing nearer than 8 m.
#   - afw_gap_fill_px is 400, not 96. The disparity ceiling is no longer 220 but
#     ~1456, so disocclusions are far wider than the old search window. This is
#     what made the pin look terrible the first time it was tried.
#
# The cost is unchanged and real: the synthesised eye never gets a real render
# of its own, so disocclusions are filled by stretching background rather than
# from that eye's previous frame. The hybrid still excludes itself - substituting
# a real held eye is its whole mechanism.
afw_pin_source_eye = 1


# Fill a disocclusion from the previous SYNTHESISED frame of that eye when there
# is no real render of it to use. With afw_pin_source_eye = 1 the engine draws
# one eye and never the other, so the real-render fill is starved for the whole
# mission and the hole fell through to stretching the background sideways - the
# smear down the right-hand side of every near object, as wide as the disparity
# step across its edge. The previous synthesised frame is a warp rather than a
# render, but it is a warp of a real one, so it is right everywhere except in
# its own holes, and head movement slides those off the holes being filled now.
# Set to 0 if it shows as trails: this is temporal feedback, and with a still
# head the hole does not move, so it keeps whatever it already had.
afw_prev_from_synth = 1

# =============================================================================
# TEST 48 - native stereo: closed, and closed harder than TEST 45 had it
# =============================================================================
#
# Five runs, five crashes, all with the SAME signature:
#
#   ACCESS VIOLATION at TaleWorlds.Native.dll+0x323C14, read 0x50
#   frames #04-#08 identical every time
#
# always at the moment agents populate the scene - pressing Ready - and never
# during deployment, which ran at 80+ fps.
#
# WHAT WAS ELIMINATED, ONE PER RUN
#
#   eye_shadows / eye_postfx        REAL, and the first thing to fix. Both were
#                                   left at 1 from AFR tuning, where they cost
#                                   nothing because AFR never uses the eye
#                                   SceneViews. Turning them off moved the crash
#                                   from ~1 s after the views went live to
#                                   surviving the whole deployment phase. A
#                                   different fault address, so a different bug.
#   native_stereo_disable_engine_view = 0   cleared. Identical crash without it.
#   native_stereo_always_render_skeletons   cleared. Identical crash without it.
#   eyes = 1                        cleared. ONE extra view crashes exactly the
#                                   same as two.
#
# That last one is the finding. TEST 45 read the wall as "the engine prepares
# the scene once per frame for one consumer", which predicts that a second view
# gets leftovers - a VISUAL failure, floating heads and missing bodies. That is
# what was seen back then. It does not predict a hard access violation, and it
# does not predict one view crashing as readily as two.
#
# So there are two separate walls, and only the first was known:
#
#   1. agents are prepared for one consumer   -> the eye split (visual)
#   2. ANY additional registered SceneView    -> rgl faults in its agent path
#                                                once a battle populates (fatal)
#
# The second makes the first unreachable: the split cannot be fixed by a lever
# that only matters in a configuration that cannot stay alive to use it.
# AddAlwaysRenderedSkeleton was never given a chance to be wrong - it was
# disabled for the final runs and the crash was identical either way.
#
# WHY THE OLD NOTE POINTED AT CONTOUR, AND WHY THAT STILL FITS
#
# TEST 45 recorded contour as "per-agent per-view state - exactly the shape of
# thing an engine sizes for its own view count", and noted rgl access-violating
# at a fixed offset once a battle starts. eye_contour has been 0 throughout
# these five runs, so contour itself is not the carrier - but the MECHANISM
# described there is exactly what the signature says: per-agent per-view state,
# sized for the engine's own view count, indexed by a view that has no slot.
#
# WHAT IS NOT SETTLED
#
# native_stereo_disable_engine_view = 0 was reasoned to be safe once skeletons
# are always-rendered - the two fixes TEST 45 believed were mutually exclusive.
# That reasoning was never tested, because the configuration it needs cannot
# survive a battle. It is not wrong; it is unreachable, which is a different
# thing and worth keeping distinct.
#
# Also worth keeping: the engine API was enumerated by reflection this round
# rather than guessed. There is no per-view agent control (Utilities
# .SetRenderAgents is GLOBAL), ViewRenderOptions is only ClearColor/ClearDepth,
# and Scene.LastFinalRenderCamera has getters and NO SETTER - so the terrain
# suspect from TEST 45 cannot be steered from managed code at all. SetSaveFinal
# looked like a way in and is actually SetSaveFinalResultToDisk, a screenshot
# facility.
#
# BACK TO AFW. Native stereo is not a rung this engine has.

# --- The disocclusion fill's mirror -----------------------------------------
# Only the fill used when this eye has no previous frame to borrow from - see
# afw_prev_from_synth. Behind a near object the warp opens a hole as wide as the
# disparity step across its edge, and nothing in the source eye can fill it, so
# the background beside it is reflected inwards.
#
# RESULT (fold, afw_fill_mirror_px = 32): reported as the fill splitting in two,
#        one half inverted and the other not. Correct: folding every 32 px
#        reverses the texture's handedness on alternate runs, so a hole wider
#        than the fold shows both, with a visible crease where they meet.
#
# So the fold is off and the reflection now runs the hole's whole width in one
# direction, compressed rather than folded so a wide hole cannot read as a
# flipped copy of the ground.
#
#   afw_fill_mirror_px       above 0 puts the fold back, at that period.
#   afw_fill_mirror_reach_px how far into the background the reflection may
#                            reach. Exact 1:1 below it, compressing smoothly
#                            toward it above. 0 = 1:1 however wide the hole.
afw_fill_mirror_px = 0
afw_fill_mirror_reach_px = 64

# Which way the fill runs through the hole.
#
#   0  reflect. Continuous at the seam, cannot reach anything but background,
#      and reads as a mirror against anything with structure in it.
#   1  forward, out of the background band beside the hole - one copy the
#      width of the hole, so it never repeats. Right way round, every sample
#      still background; the price is one step at the background seam, where
#      it is a change of phase in the same texture, not a cut.
#   2  forward, straight on past the neighbour - the literal inversion of the
#      reflection. Continuous and never repeats, but the source columns past
#      the neighbour are the OCCLUDER, so expect a stretched copy of the
#      object's own edge across the gap. Kept for the direct comparison.
afw_fill_invert = 1
afw_fill_invert_run_px = 0

# A hole this wide or narrower, with real geometry on BOTH sides, is closed by
# interpolating between the two rather than by inventing from one. Distant
# silhouettes open holes of exactly this size - disparity goes as 1/z - and a
# stamped, phase-shifted copy of one side laid in a ribbon along them is what
# read as far edges being pixelated and aliased. Interpolating is what the
# rasteriser would have done across a gap that small.
#
# 4 px is everything past about fifteen metres at the current disparity. Higher
# starts interpolating real disocclusions and blends the occluder in as a halo.
# 0 turns it off and sends every hole down the invented path.
afw_fill_blend_px = 4

# Which surface a silhouette pixel belongs to, when the depth buffer is too
# small to say. Only ever a question under an upscaler: DLSS at Quality renders
# depth at 0.67 of the eye, so one texel spans a pixel and a half and every
# silhouette falls inside one. This is why the far-edge aliasing appears with
# DLSS on and not with it off - at 1:1 every pixel has its own exact depth.
#
# 1 = ask the colour, which IS full resolution under an upscaler: compare the
#     pixel against the colour at each candidate texel's centre and take the one
#     it looks like. Three reads at silhouette pixels, nothing anywhere else.
# 0 = the old positional guess, whichever texel centre is nearer, wrong about
#     half the time at exactly the pixels where it shows.
afw_depth_colour_pick = 1

# Take the upscaler's sub-pixel jitter back out of the depth lookup.
#
# DLSS renders each frame through a projection offset by a fraction of a pixel
# and removes that offset from the COLOUR on the way out - that is how it
# accumulates detail. Nothing removes it from the DEPTH, so the two buffers
# disagree about where everything is by up to about a pixel, differently every
# frame. In the middle of a surface that is nothing. At a silhouette it assigns
# the boundary pixels the wrong surface's disparity, differently every frame,
# which is read as edges that crawl and shimmer.
#
# depth_upscale.h says the offset "cannot be recovered from the outside". It
# can: the jitter IS the projection, and vp_patch intercepts the projection.
# It shows up as the frustum centre moving off its own long-run average, which
# is measured and logged once a second - watch for a fraction of a texel that
# changes every frame.
#
#   1   apply it
#  -1   apply the opposite shift. The conversion from NDC to texels is derived,
#       not measured, and two sign conventions meet in it. If 1 makes the edges
#       worse, this is the other half of the experiment and one of them is right.
#   0   off
# RESULT: measured 0.00 +/- 0.02 depth texels over 51 samples, where real jitter
#         is +/-0.5. The projection rgl uploads is NOT the jittered one - the
#         jitter lives somewhere we do not see. Theory dead, measurement kept.
afw_depth_dejitter = 0

# How wide a disparity gap the colour may WEIGH across instead of voting on.
#
# afw_depth_colour_pick made an edge pixel choose one surface or the other. A
# choice is a step function, and the thing making it moves: DLSS resolves a
# little more detail into every edge pixel each frame, so an undecided pixel
# changes its mind on its own, its disparity jumps by the whole gap between the
# two surfaces, and that is a shimmer with nothing in the scene moving.
#
# Below this gap the pixel instead gets a disparity in PROPORTION to how much it
# looks like each surface - which is where an antialiased edge belongs, and a
# decision that cannot flicker. Above it the vote still decides, because half of
# a wide gap is a pixel flung into mid-air between two surfaces.
#
# 8 px is about two metres of separation at the current disparity: the far field
# this is for, nowhere near the band beside something close. 0 = vote only.
afw_depth_colour_soft_px = 8

# How many frames of GPU work the engine may queue ahead. D3D11 defaults to 3.
#
# On a monitor a deep queue is free performance: the CPU runs ahead, the GPU
# always has work waiting, and nobody can feel that what they see is a few
# frames behind what the CPU thought.
#
# In a headset it is the difference between injected VR and a native title.
# Every queued frame sits between the pose the scene was DRAWN from and the
# photons, and no reprojection can take it back out - the compositor corrects
# where an image is POINTED, using the pose submitted with it, but the image's
# contents were fixed when the engine drew them. Three frames at 72 Hz is 42 ms
# of the world being where it was, arriving with the shape of now, which is felt
# as the view resisting the head and then catching up.
#
# 1 is what a native VR renderer asks for, precisely so this cannot happen. The
# cost is throughput: the CPU can no longer run ahead, so a GPU-bound scene may
# drop a frame rather than queue one - and a dropped frame the compositor
# reprojects over is much cheaper than every frame arriving late.
#
# Watch the log line at startup for what the engine was actually using.
#   0  leave the engine's own setting alone
#   1  native VR behaviour
frame_latency = 1

# How far ahead the pose handed to the ENGINE is predicted, in frames.
#
# This is the SECOND of the two frame-shaped latencies, and it is a different
# thing from frame_latency above. That one is how long the engine's drawing sits
# in a queue after it is issued. This one is the pose it was issued WITH being
# sampled for the wrong moment. Fixing either alone leaves the other.
#
# The views located in each Present serve two consumers. SUBMISSION wants the
# pose for THIS frame's display time, because that is when the images being
# handed over are shown - it gets it. The ENGINE wants the pose for the frame it
# is ABOUT TO RENDER, which is the next one, and it was given this one. So
# everything the engine drew was aimed a frame behind: the 13.9 ms the pose-age
# line reports at 72 Hz, every second, dead steady.
#
# The compositor carries the difference by warping the image, which is why it
# reads as floaty rather than as judder - right shape, wrong place, moved there
# by a reprojection instead of being drawn there.
#
# EVIDENCE: watch the pose-age line. It should fall from ~1 frame to near zero.
# If it does and the view now OVERSHOOTS when you stop moving, the prediction is
# running too far ahead - try 0.5.
#
#   0    the old behaviour, exactly
#   1    one frame ahead: the depth of the pipeline this pose goes through
#   >1   only if the engine is more than a frame behind; over-prediction
#        overshoots, and an overshoot is worse than the lag it removes
pose_lead_frames = 1

# --- Two things that tie the world to the head, both off ---------------------
#
# world_scale multiplies the head POSITION before the eye cameras are built, but
# the pose handed to the compositor by bvr_set_used_views is the raw one. So at
# 1.10 the image is rendered from 1.1x the head's real movement while the
# compositor is told it was rendered from 1.0x, and it reprojects the 10%
# difference. That difference is proportional to head movement and settles when
# the head stops, which is exactly "the world moves with me and then corrects
# itself". It applies to a head TILT too - a tilt swings the eyes several
# centimetres around the neck - and to anything else that moves the skull.
#
# A native VR game is 1.00 by definition: what the head does, the viewpoint does,
# and nothing downstream has to be told a different story. Anything else needs
# the submitted pose scaled to match, which is a code change, not a number.
world_scale = 1.00

# The depth layer lets the compositor reproject for head TRANSLATION rather than
# rotation alone. It needs a depth map that matches the image - and under DLSS
# Performance the game's depth is half the eye in each axis and offset from the
# colour by a jitter we established we cannot see. The compositor's positional
# correction is focal * translation / z, so a z that is wrong moves the world by
# the wrong amount on EVERY head translation. Wrong parallax reads as the world
# being attached to the head, and it grows with how fast you move.
#
# Cheap to give up here: it corrects a HELD eye, and under AFW both eyes are
# rendered from one instant, so there is little for it to hold.
depth_layer = 0

# How far from identity a constant-buffer block may stray and still be sifted as
# a possible REPROJECTION MATRIX - the matrix the sky, sun, cloud, hair,
# particles and screen-space shadows carry their history forward with, and the
# one DLSS leans on hardest.
#
# While it is unidentified, every one of those reprojects with the ENGINE's
# camera instead of the eye actually being rendered. The history is then carried
# to the wrong place and re-resolved, every frame, by an amount proportional to
# how far the camera moved - so a small head movement makes the world visibly
# re-render rather than simply pan. That is what "a slight shake with my head
# results in view render" is, and it is worst under DLSS, which is history all
# the way down.
#
# It was a hard 0.25, and that is why identification never completed: the
# DECISIVE test needs a large drift to tell four candidate forms apart, so only
# fast head movement can identify the matrix - and a tight band throws exactly
# those frames away. Last run's one suspect peaked at 0.23633 against a cap of
# 0.25. The two thresholds were meeting, and 0/8 agreements was the result.
#
# A wider band admits more candidates, which is safe: the discrimination is done
# by matching against four known forms, and that test only gets stronger as the
# drift grows. Watch for "VP reprojection matrix IDENTIFIED" in the log - and
# SHAKE YOUR HEAD for a few seconds after a battle starts, because that is the
# motion the identification feeds on.
vp_reproj_band = 0.75

# --- vp_patch ON, to reach pass three ---------------------------------------
# The reprojection matrix - the one the sky, sun, cloud, hair, particles and
# screen-space shadows carry their history with, and the one DLSS leans on - is
# identified and substituted in pass three of the constant-buffer scan. That
# pass is behind `writeAllowed = cfg().enabled`, so with vp_patch = 0 it has
# never run: the census still names the suspect (cb 1760, offset 752) because
# the census is part of the measure path, but nothing is ever tested against it
# and nothing is ever written.
#
# The main-view substitution this also switches on should be close to a no-op
# here: build_replacement forms D = inverse(our eye) * (engine camera recovered
# from the intercepted matrix), and the managed side has already put the engine
# camera AT our eye - so D comes out near identity and VP' ~= VP. The fov
# reshape stays off (vp_fov_expand = 0), so the frustum is untouched too.
#
# WATCH FOR, in order:
#   "VP patch: N view + M inverse matrices replaced"  - the write path is live
#   "VP reprojection probe: ... DECISIVE / not decisive" - pass three running
#   "VP reprojection matrix IDENTIFIED"               - substitution engaged
#
# Shake your head for a few seconds once a battle starts: identification needs
# large drift to tell the four candidate forms apart.
#
# vp_patch = 0 reverts, and it is one line.
vp_patch = 1

# --- The previous frame's matrix, for motion vectors -------------------------
# The engine uploads TWO main-view matrices per buffer: this frame's and last
# frame's. Everything that tracks history - sun, sky, cloud, dust, hair, blood,
# screen-space shadows - takes the difference between them to work out where a
# pixel WAS, and reprojects its history by that.
#
# With this off, both slots were patched with the CURRENT eye's matrix. The
# engine was then told the camera did not move between frames, so those effects
# reprojected their history by nothing at all - which leaves them pinned to the
# screen while the world moves under them. Pinned to the screen IS moving with
# the head. Static terrain was unaffected because it needs no history, which is
# exactly the split reported: terrain, objects and characters stable, sky, sun,
# cloud, hair, blood and shadows following the head.
#
# On, the second main-view matrix in the buffer is matched against our PREVIOUS
# frame's eye camera instead, by whichever of the two it aligns with better. The
# motion vectors then describe the movement that actually happened between our
# two eye positions.
#
# Watch the count in "VP patch: N view (M of them the PREVIOUS frame's, for
# motion vectors)". M has been 0 on every run so far; it should now be a real
# fraction of N.
vp_match_prev = 1

# --- THE GAIN. This is the one that made it feel wrong -----------------------
# Measured, in BannerlordVR.log, 22 reports out of 23:
#
#   Head-to-world gain 0.650 - 1.000 is 1:1; 0.650 means 40 deg of head reads
#   as 26.0 deg of world.
#
# The view was moving at 65% of head speed. That is felt as resistance and as
# the camera being the wrong speed, and no amount of latency work can touch it,
# because it is a SCALE error and not a timing one.
#
# The number is exactly the tangent ratio of two frustums, which is what makes
# the cause certain rather than likely:
#
#   engine renders with  vfov 2.260 rad = 129.5 deg   tan(half) = 2.117
#   we submit as         vfov 1.885 rad = 108.0 deg   tan(half) = 1.376
#                                        1.376 / 2.117 = 0.650
#
# The scene is drawn through a 129.5 deg frustum and presented as covering 108.
# Everything is minified by that ratio, so a head rotation moves the world by
# 65% of what it should. "Engine FOV hold: 225 correction(s) in the last ~5 s"
# is the mod writing the right projection onto the Camera object 45 times a
# second and the engine overwriting it right back. It was losing.
#
# vp_fov_expand stops fighting over the Camera object and reshapes the frustum
# in the MATRIX instead - the S term in build_replacement, clip x and y only -
# microseconds before the GPU sees it, where the engine cannot overwrite it.
# vp_expanding_fov() then makes xrEndFrame submit the RUNTIME's fov, because
# that is what the image now actually covers.
#
# Expect "Head-to-world gain 1.000" and the FOV-hold corrections to stop
# mattering. If the world instead comes out the wrong SIZE or the frustum looks
# cropped, this is the wrong lever and vp_fov_expand = 0 reverts it.
# RESULT: BROKE STEREO. Reported as the eyes having different viewpoints and
#         reading as cross-eyed. The reshape maps the engine frustum onto the
#         REQUESTED one, and the requested one is the runtime per-eye frustum -
#         eye0 L-54/R+40, eye1 L-40/R+54. Those are mirror images, so the two
#         eyes stop sharing a frustum. AFW synthesises the second eye by warping
#         the first along a horizontal disparity, and that is only valid while
#         both eyes share one frustum; with mirrored frustums the disparity maps
#         to the wrong place and the synthesised eye lands at its own viewpoint.
#
#         The warning was already in this file, one knob over: "Pinning
#         symmetric_fov to 0 while AFW or the hybrid is running is what breaks
#         the warp - the two eyes stop sharing a frustum." vp_fov_expand gets
#         there by a different route. To use it, AFW has to go first.
#
#         What it did buy, for whenever AFW is not in the way: the render and the
#         submission both used the headset true frustum, 94x99 instead of a
#         symmetric 108x110, putting each eye optical centre where it belongs
#         (it was ~7 deg off toward the nose) and spending no pixels outside
#         what the headset can show.
vp_fov_expand = 0

# Present the game window with no vsync while an OpenXR session is running.
#
# xrWaitFrame is the pacer in VR: it blocks until the compositor wants the next
# frame. The engine's own Present then blocks AGAIN on the monitor's refresh if
# the game is running with vsync, and two pacers at different rates do not
# average out - frames land on the beat between them, so the pose-to-photon time
# changes from frame to frame. A latency that VARIES is felt as looseness in a
# way a constant one is not.
#
# Both reference VR injections on this machine do this (Witcher 3 VR's
# disable_desktop_vsync). The headset is the display now; the window is a
# courtesy, and a tear in it costs nothing.
#
#   0  suppress the interval while a session runs (default)
#   1  hand the engine's own interval back
desktop_vsync = 0

# Begin the OpenXR frame BEFORE the engine renders it, instead of in the Present
# hook afterwards.
#
# This is what every working VR injection does, and the reason ours felt a frame
# behind. xrWaitFrame, xrBeginFrame and xrLocateViews now run at the top of the
# camera build (CameraPatch), so the pose the engine renders with is located for
# the display time of the frame it is ABOUT to draw. In the Present hook the
# locate happened after the drawing, and the engine used that pose for the NEXT
# frame - one display period behind, for its whole life. That is the 13.9 ms the
# pose-age line used to report at 72 Hz.
#
# It also paces the game properly: xrWaitFrame blocks until the compositor wants
# the frame, on the game's own thread, instead of the game racing ahead and
# being throttled later by a Present it cannot see.
#
# pose_lead_frames still applies on the FALLBACK path - when no frame was
# prepared, Present does Wait/Begin/Locate itself exactly as before - so it is
# left alone rather than turned off.
#
# Watch for "Frame begun BEFORE the render" once, and pose age near zero after.
# If the game hangs on entering a mission, this is the first thing to turn off:
# xrWaitFrame blocking on the game thread is new, and a runtime that dislikes
# xrBeginFrame and xrEndFrame arriving from different threads would show up here.
# RESULT: 18 fps. Not a hang - a throttle, and the reason is a thread split the
#         reference mod does not have. Bannerlord builds its camera on the GAME
#         thread (OnFrameTick) and presents on the RENDER thread, so this put
#         xrWaitFrame and xrBeginFrame on one thread and xrEndFrame on another.
#         xrWaitFrame then blocks until the PREVIOUS frame has been ended, so
#         every game frame waited a full round trip on a thread it is not
#         synchronised with.
#
#         Witcher 3 VR calls its prepare from inside the PRESENT hook - "at the
#         application frame boundary" - and its camera construction runs on the
#         same thread that consumes it. There is no split to pay for.
#
#         So for this engine the equivalent is what we already have: locate in
#         Present and publish one period ahead (pose_lead_frames), which
#         measured 0.6 ms of pose age - the same outcome, without the round
#         trip. Turning this on again needs the camera build and the frame
#         boundary to be on ONE thread first.
pre_render_frame = 0

# =============================================================================
# TEST 52 - AFR/AFW under head movement: the warp was fed a pose the render
#           never used
# =============================================================================
#
# content_views() infers which locate an image came from by counting frames
# back - afr_pose_lag - because for a long time inference was all there was.
# It is not any more: bvr_set_used_views reports the pose managed actually built
# the eye cameras from, every frame, and the submitted pose has been using it
# for a while.
#
# So inference and fact disagreed, and the gap WIDENED when pose_lead_frames
# began publishing a pose a period ahead: the counted-back locate is a frame
# behind, the render pose is a frame in front, and at 72 Hz that is 28 ms of
# head motion between what the warp believes and what the pixels are.
#
# That pose is not decoration. It is the still/moving decision (how far the head
# has moved since that eye was drawn), the rotation handed to
# afw_set_prev_reproject for reading the previous eye inside the holes, and the
# pose a held eye is submitted with. Feed those a pose the render never used and
# every one of them is wrong BY THE HEAD'S OWN MOTION - which is exactly why the
# artefacts scaled with how fast you moved and vanished when you stopped.
#
# Fixed in code: the engine's reported render pose wins whenever it exists;
# afr_pose_lag still governs the fallback for the frames before managed has
# reported anything. Watch for "AFR/AFW pose source: the engine's OWN reported
# render pose" once at startup.

# And the other half of the same complaint. This has been 0 for the whole of
# this investigation, and the log says what it costs:
#
#   AFW live: ... disocclusions filled from stretched background (no previous
#   render of this eye yet)
#
# ...on every frame of every run. The line that fires when the real fill takes
# over has never once appeared. So every hole behind every near object has been
# INVENTED - the mirror, the forward run, the crack interpolation, all of it -
# when there is a previous frame of real geometry sitting right there.
#
# On, a hole is filled from the last frame this eye was synthesised into: a warp
# of a real render, right everywhere except in its own holes, and head movement
# slides those off the ones being filled now. Invention becomes the first-frames
# fallback it was designed as.
#
# The stated risk is TRAILS - it is temporal feedback, and with a still head the
# hole does not move, so it can settle on whatever it already had. That is the
# thing to look for; it is a different artefact from a smear and easy to name.
afw_prev_from_synth = 1

# =============================================================================
# TEST 53 - dynamic shadows, measured across both stereo modes
# =============================================================================
#
#                    DLSS off                  DLSS on
#   AFR        shadows move with head    STABLE (some shimmer + blur)
#   AFW        shadows move with head    shadows move with head
#
# TWO FACTS, AND TOGETHER THEY DECIDE THE MODE.
#
# 1. DLSS is what stabilises the cascades. Cascaded shadow maps re-fit and
#    re-snap to the camera every frame; temporal accumulation is what hides it.
#    A flat game shows the same crawl while moving - a head never stops, so in
#    VR it never stops either. Not ours, and not tunable from here.
#
# 2. AFW CANNOT INHERIT THAT STABILISATION. The second eye is not rendered, it
#    is a geometric warp of the first, and DLSS's stability lives in temporal
#    accumulation across frames of a real render. A warp reconstructs each frame
#    from one source image and a depth buffer, with no history at all. Thin
#    high-contrast temporally-filtered content - shadow edges first - is exactly
#    what it cannot reproduce. So the source eye is stabilised, the synthesised
#    eye crawls, the two eyes disagree about where a shadow edge is, and that is
#    read as swimming.
#
# Every fill and silhouette fix in TEST 48-52 raised AFW's floor. None of them
# can give a warp a temporal history, and no future one will.
#
# So: AFR with DLSS, which is the best measured configuration.
stereo_mode = afr
afw = 0

# --- TEST 54: giving the warped eye the history it never had -----------------
# TEST 53 measured that dynamic shadows are stable in AFR WITH DLSS and crawl in
# every other combination. The difference is temporal accumulation: DLSS holds a
# shadow edge steady across frames in the real eye, and the synthesised eye is
# not a render, so DLSS never sees it. It is rebuilt from scratch every frame,
# including whatever the half-resolution depth decided about silhouettes THIS
# frame - and on a shadow edge that decision moves. One eye steady, one not, and
# the disagreement reads as swimming.
#
# afw_taa is the warp's own accumulation. Not a copy of DLSS - no motion
# vectors, no jitter sequence - just the property that matters: a pixel that
# should not have changed is held instead of recomputed. The previous frame is
# read through the same rotation correction the hole fill uses, so a turned head
# does not smear it.
#
# THE CLAMP IS WHAT KEEPS IT FROM GHOSTING. The previous value is confined to
# the range the SOURCE holds around this pixel's own source position - four
# taps. Where the pixel genuinely changed, that range has moved and the history
# is discarded; where it did not, the history survives and the crawl with it.
#
# Applied only to pixels the warp actually resolved. The disocclusion fill is
# invented, and holding an invention steady preserves an invention.
#
#   0.5  hold half of a value the clamp already agreed with
#   0    off
#   higher holds harder, at the risk of trails where the clamp misses
afw_taa = 0.5

# Back to AFW to test it. stereo_mode = afr and afw = 0 return to the best
# measured configuration from TEST 53 in one line.
stereo_mode = afw
afw = 1

# --- TEST 55: is it the PINNED camera that the shadows follow? ---------------
# Closing one eye at a time answered the question three builds should have
# started with: the shadows crawl in BOTH eyes. So it is not the warp - the
# synthesised eye is carrying an instability that is already in the engine's own
# render, and afw_taa, the fills and the silhouette work could never have
# reached it.
#
# From the ENGINE's point of view there is exactly one difference between our
# AFR and our AFW:
#
#   AFR         alternating eye cameras, L R L R, consecutive frames 64 mm apart
#   AFW pinned  the SAME eye camera every frame, drifting only with the head
#
# Shadow cascades snap to a grid derived from the camera. Alternating lands on a
# small repeating set of snap positions; a camera drifting with the head crosses
# grid boundaries at irregular intervals, and that is shadows sliding as you
# move. It also explains why AFR needed DLSS to look stable - a two-state
# flicker averages, a slow drift does not.
#
# 0 makes AFW alternate eyes exactly as AFR does, and still synthesise the
# second. If the shadows settle, the pinned camera was the cause.
#
# Cost of 0: the engine draws each eye only every other frame, so the warp's
# source alternates and prevReal becomes available - which also lets the
# still/moving hybrid engage for the first time.
afw_pin_source_eye = 0

# RESULT (TEST 55): still follows the head. The camera sequence is not it
# either. Five theories have now been tested against this one symptom and all
# five are dead:
#
#   the reprojection matrix, unidentified      - identified, substituted, no change
#   the previous-frame matrix (motion vectors) - patched, 0 -> 3574/5s, no change
#   a second reprojection site                 - reached and substituted, no change
#   the warp's missing temporal history        - afw_taa, ran, no change
#   the pinned camera the cascades follow      - unpinned, no change
#
# And the one measurement that was worth more than all of them: closing one eye
# shows the crawl in BOTH, so it was never the warp. Everything above except the
# pose-source fix was aimed at an image that was already carrying the problem.
#
# What is NOT yet known, and what the next attempt needs: which constant buffer
# or draw the shadow pass actually consumes. That is a frame capture, not
# another inference from these logs - RenderDoc, of the kind the Witcher mod
# ships a hook for. Until then this is undiagnosed rather than unfixable.
#
# Back to the best MEASURED configuration - TEST 53, AFR with DLSS.
afw_pin_source_eye = 1
stereo_mode = afr
afw = 0

# --- TEST 56: the last main-menu frame frozen in the middle of the view ------
# Reported in AFR. The UI overlay is keyed from the game WINDOW, and under AFR
# the engine draws the world into the eye target instead of the swapchain, so
# the window holds whatever was last drawn into it - the main menu. Keying works
# by brightness, and a main menu is fully opaque, so there is nothing for the
# key to remove: the whole frame survives and is composited over the world.
#
# arm_backbuffer_clear exists for exactly this and is armed every frame while
# the monitor mirror runs - but only from inside mirror_to_monitor, and only
# once a mission is active. The menu frame that was already there when the
# mission started is what gets through.
#
# 0 shows only the wheels rather than compositing the whole interface, which
# removes the keyed layer the stale frame is riding on. ui_screen = 0 shows
# neither, if the wheels are not wanted either.
# RESULT: FIXED. The frozen main-menu frame is gone from the middle of the
#         view. Confirms the mechanism: the overlay was keyed from the game
#         WINDOW, which under AFR holds the last thing the engine drew into the
#         swapchain - the menu - and brightness keying cannot remove an opaque
#         frame. Showing only the wheels removes the keyed layer it rode on.
ui_overlay_always = 0

# =============================================================================
# TEST 62 - the shadow cascades, measured at last
# =============================================================================
#
# recover() has always opened by demanding a unit w column, and its own comment
# says what that excludes: "An orthographic projection - every shadow cascade -
# has a zero w column... Requiring unit length is what keeps shadow, UI and post
# passes out." So the cascades were never in the search space, and five rounds
# of theorising about shadows following the head were arguing about matrices
# this scan structurally could not see.
#
# The census now finds orthographic blocks by their own signature and WATCHES
# them - nothing is patched. One battle in AFW, head moving:
#
#   main view moved 0.124 m   vs   eye moved 0.126 m      <- the reference
#
#   cb 6656  offsets 0..2080, 416-byte stride    max moved 0.0000
#   cb 1760  offsets 176..784 (main-view buffer) max moved <= 0.0176
#   cb  528  offset 0, translation (400,800,0)   max moved 1280   (screen-space)
#
# The six cb 6656 blocks - the array shaped like a cascade set, and the same
# buffer that holds the second reprojection site at offset 480 - are PERFECTLY
# STATIC while the head moved 12 cm. The cascades are not fitted to the camera.
# "Shadows follow the head because the cascades follow the head" is measured
# false, not merely unproven.
#
# WHERE THIS APPROACH ENDS, AND WHY
#
# Those six report translation (0,0,0): they are rotation and scale only. A real
# cascade needs a per-cascade offset, and it is not in the matrix - it is packed
# as separate float4 constants beside it inside the 416-byte entry. A scan that
# looks for 4x4 matrices cannot see those, whatever signature it is given. That
# is now demonstrated rather than assumed, and it is the boundary of what
# constant-buffer scanning can answer here.
#
# The next attempt needs a frame capture naming the constants the shadow pass
# binds - RenderDoc, as the Witcher mod does it - not a seventh inference.

# =============================================================================
# FULL AFR - both eyes really rendered, at the full refresh rate
# =============================================================================
#
#   stereo_mode = fullafr
#
# WHAT IT IS
#
# Every mode before this one renders ONE eye per DISPLAY frame. That is the
# root of everything the last several tests have been working around: each eye
# is refreshed at half the headset's rate, and afr / afw / hybrid differ only in
# how they cover for the eye that was not drawn - hold it and accept a frame of
# staleness, warp it and accept invented pixels, or switch between the two and
# accept the changeover.
#
# Full AFR renders one eye per GAME frame and runs TWO game frames inside one
# display frame:
#
#   game frame 1   eye 0 rendered.  The XR frame is NOT ended.
#   game frame 2   world frozen (dt = 0), eye 1 rendered from the SAME located
#                  head pose.  Both eyes submitted together.
#
# So there is no eye that was not drawn. Both are true engine renders, of one
# simulation tick, from one head pose. Nothing is held, nothing is synthesised,
# and none of the artefacts the three modes above trade between is produced.
#
# WHY IT IS NOT NATIVE STEREO WEARING A HAT
#
# Native stereo failed here for a measured reason: rgl prepares each mesh once
# per frame and the first view to ask claims it, so two live views gave floating
# heads and missing bodies. Full AFR never has two views live. It alternates
# ACROSS frames exactly as AFR does - one view, one claimant, whole characters -
# and gets simultaneous stereo anyway, by moving the alternation inside the
# display period instead of across it.
#
# WHAT IT COSTS
#
# The engine has to produce twice the frame rate: 144 fps for a 72 Hz headset,
# 180 for 90.
#
# The GPU cost is NOT doubled against real stereo - 144 one-eye renders is the
# same pixel count as 72 two-eye ones - and this mode also gets each eye its
# true asymmetric frustum back, because the two eyes no longer have to share a
# frustum the way afw and hybrid require. What doubles is CPU: culling and draw
# submission happen twice per display frame. The second frame of a pair is the
# cheaper one, since the world is frozen and no AI, pathfinding or animation
# advances, but it is not free - and Bannerlord's main thread in a large field
# battle is already the bottleneck.
#
# So expect this to be excellent wherever there is CPU headroom and to fall
# short of the display rate in a five-hundred agent battle. It degrades the way
# any VR title does: xrWaitFrame stops blocking, pairs land on later display
# periods, and the compositor reprojects.
#
# WHAT TO READ IN THE LOG
#
#   "Full AFR: N pair(s) submitted this second, M Present(s) deferred."
#
# N is the per-eye refresh rate, because both halves of a pair are real. Compare
# it against the headset's rate; that single number is the whole question about
# this mode. M should equal N - each pair costs exactly one deferred Present.
#
# SYNC SEQUENTIAL IS SWITCHED ON BY THE MODE, NOT BY THE KEY
#
# The freeze is what makes a pair one moment rather than two, so full AFR turns
# it on for itself and ignores sync_sequential = 0. It is also FREE here, which
# is the part worth noticing: the documented cost of sync_sequential is "the
# world advances at half the frame rate", and that is only true when a pair
# spans two display frames. Full AFR fits the pair inside one, so the world
# advances once per display frame - full sim rate, and the freeze is pure gain.
#
# Requires afr = 1, like every mode on the AFR pipeline.

# =============================================================================
# TABLEAU PROBE - the half of the split this repo has never tried
# =============================================================================
#
#   tableau_stereo = 1        run the probe at the start of the next mission
#   tableau_stereo_type = 0   which registered scene slot to use
#   tableau_stereo_frames = 90  how long to let it run before saving the image
#
# NOT A STEREO MODE. It renders nothing to the headset, changes no display path,
# and cannot make the picture better or worse. It asks rgl ONE question and
# writes the answer to a PNG.
#
# THE QUESTION
#
# Can the mission scene be rendered, from a camera of our choosing, into a
# texture of our choosing, WITHOUT a second SceneView?
#
# WHY IT IS WORTH ASKING AGAIN
#
# TEST 46 closed native stereo on the grounds that the Cyberpunk port had proved
# it impossible, quoting cp2077-native-simultaneous-exhausted.md: "exhausted at
# every explored lever". That document is dated 2026-06-09.
#
# The same project's path-A-M-A1-SUCCESS.md is dated 2026-06-24 and records the
# wall being cleared. Its shipped README now leads with "Real stereo, not
# reprojection". The verdict TEST 46 was built on was superseded two weeks after
# it was written.
#
# They did not fix the second view - they abandoned it for good and used a
# DIFFERENT SUBSYSTEM: an entity carrying a render-to-texture camera component,
# which the engine drives through its own full frame graph because it is an
# ordinary game object rather than a second claimant on the frame's one view.
#
# Bannerlord has the same split and this repo has only ever tried one side of
# it. SceneView is the registered-view path, and it is the one that fails. The
# tableau system is the other side, and it has a native primitive that takes a
# registered Scene and a CAMERA and puts the result in a texture:
#
#   BannerlordTableauManager.RequestCharacterTableauRender(
#       id, path, poseEntity, camera, tableauType)
#
# WHAT COULD KILL IT, WHICH IS WHY THIS IS A PROBE AND NOT A MODE
#
#   1. It may refuse a live mission scene, or only ever draw the poseEntity it
#      is handed rather than the world around it. It is a portrait renderer.
#   2. It may be one-shot per request rather than per-frame.
#   3. It may not scale to eye resolution.
#
# HOW TO READ THE RESULT
#
# The probe writes bvr_tableau_probe.png next to the logs, and a VERDICT line
# with four counts. The image settles it:
#
#   THE BATTLEFIELD, from slightly right of your head
#       The route is real. rgl will render the mission scene outside SceneView,
#       the enqueue wall that stopped native stereo four times is not in this
#       path, and simultaneous stereo can be built on it.
#
#   ONE SOLDIER, or an empty studio background
#       It only ever draws the pose entity it is given. It is a portrait
#       renderer and cannot be talked into being a camera. Dead end, cheaply.
#
#   BLACK, with paint callbacks above zero
#       The tableau system IS driving our texture per frame - which is most of
#       what the mode needs - but the scene registration was ignored. Next lever
#       is tableau_stereo_type.
#
#   BLACK, with zero paint callbacks
#       Nothing was driven at all. The request is one-shot at best.
#
# IT CAN CRASH THE GAME. RequestCharacterTableauRender is being handed arguments
# it was not written for - a null pose entity and a battle scene - and native
# code given unexpected arguments is entitled to crash rather than return an
# error. Do not run it on an unsaved battle you care about.

# =============================================================================
# NATIVE STEREO - the agent renderer's own visibility switch
# =============================================================================
#
#   native_stereo_enforced_visibility = 1      (default, native stereo only)
#   native_stereo_forced_skeleton_updates = 0
#
# THE FAULT THIS GOES AFTER
#
# Native stereo has never failed by drawing nothing. Terrain, sky and props come
# out in BOTH eyes; only characters are missing, and only from the view that
# renders SECOND. TEST 17 retired the "competing views" theory - the fault
# survived three views, two, one and AFR - and VrAgentVisibility then found the
# reason: the visibility pass does not GATE the drawing of agents, it ENQUEUES
# them, once per frame, and the first view to ask consumes the result.
#
# WHY THIS LEVER IS DIFFERENT FROM THE TWO THAT FAILED
#
#   Scene.AddAlwaysRenderedSkeleton  - handing the engine skeleton POINTERS and
#     owning the job of taking them back. The ownership crashed it: a skeleton
#     becomes the engine's to free the moment its agent dies.
#
#   GameEntity.SetDoNotCheckVisibility - taking agents OUT of the visibility
#     pass. Agents vanished completely, because that pass is the enqueue.
#
#   MBAgentRendererSceneController.SetEnforcedVisibilityForAllAgents(scene)
#     - the agent renderer's OWN switch, on its own controller, taking the scene
#     that controller belongs to. We hand it no pointers to keep, so nothing of
#     ours can outlive what it points at; and we are asking for every agent to
#     be enqueued rather than removing them from the enqueue, which is the
#     opposite of what emptied the scene last time.
#
# GETTING THE CONTROLLER
#
# The switch is an instance method and nothing in managed code holds a
# controller - the only field of that type in any game assembly belongs to
# MBEditor, so for a battle it lives natively. It is captured instead by a
# Harmony postfix on CreateNewAgentRendererSceneController, which sees every one
# the game makes along with the scene it was made for. Nothing is constructed,
# destroyed or kept alive by us. See AgentRendererControllerPatch.
#
# It is asked for EVERY FRAME rather than once. The enqueue it corrects is
# per-frame, and reinforcements arriving mid-battle would otherwise be exactly
# the agents missing from the second eye.
#
# HOW TO TRY IT
#
# Pick "Native stereo (experimental)" in the VR panel. The change is latched to
# the next mission - creating and destroying SceneViews mid-frame is what
# crashed the stereo path before - so leave the battle and start another.
#
# WHAT TO LOOK FOR, IN ORDER
#
#   1. Characters in BOTH eyes. That is the wall coming down, and it means real
#      simultaneous stereo at one game tick instead of two.
#   2. If they are in both eyes but posed wrongly or torn, try
#      native_stereo_forced_skeleton_updates = 1 - enforced visibility decides
#      whether an agent is ENQUEUED, that decides whether its skeleton is
#      brought up to date once it is.
#   3. If characters are fixed but terrain is missing toward the edges, or the
#      world only draws in the middle of the map, that is the OTHER known bug
#      and its lever is native_stereo_disable_engine_view = 0. The old objection
#      to that setting was that a third view would take the characters from both
#      eyes - which was the theory TEST 17 disproved, so it is worth trying now
#      in a way it was not before.
#
# The log reports whether the controller was captured at all. If it says it was
# not, the patch is not landing and nothing else here can work.

# =============================================================================
# SINGLE-FRAME STEREO BY DRAW DUPLICATION - 2026-09-05
# =============================================================================
#
# The engine renders ONE frame. Every scene draw is issued a second time with
# the other eye's matrices, into render targets of our own. Both eyes are real
# renders of one instant, from one engine frame.
#
#   vp_second_draw = 1          the whole mechanism
#   vp_second_draw_slot = 0     which G-buffer target the second eye displays
#   vp_second_draw_nodepth = 0  diagnostic; 1 forces the depth test to ALWAYS
#   stereo_mode = afr           plain AFR is the base. NOT fullafr - that
#                               renders the engine twice, which this replaces.
#
# WHY THIS PATH AND NOT THE FOUR BEFORE IT
#
# Every previous attempt asked rgl for a second VIEW of the scene, and it has
# exactly one. A second SceneView gets agents enqueued once and consumed by
# whoever asks first, then dies with an access violation reading 0x50. The
# tableau route is a portrait renderer. Full AFR sidesteps the wall by rendering
# two whole engine frames, which is what it costs.
#
# Real stereo does not need a second view. It needs the geometry DRAWN TWICE
# with two view matrices, and those are not the same requirement. The second is
# reachable and the first is not.
#
# WHAT IS PROVEN, WITH NUMBERS
#
#   ~500 scene draws a frame re-issued, 99.6% of them, no crash
#   0.0651 m eye separation, measured, matching the IPD
#   depth correct: our own buffer, cleared to the engine's own measured value
#     (0.000 - this engine is reversed-Z), with the depth prepass duplicated
#   full geometry coverage: ground, sky, soldiers, terrain
#   the engine's own eye untouched
#
# THE SEVEN MISTAKES THIS COST, BECAUSE EACH ONE IS A REAL PROPERTY OF rgl
#
#   1. Draws are not on the vtable. All four entry points hooked cleanly and
#      counted ZERO while Map/Unmap on the same vtable counted 61,605 uploads.
#      The runtime owns those slots and reclaims them - 23 times a session.
#      Inline-hooking the IMPLEMENTATIONS works; there are up to four per entry,
#      not the two an older note recorded, and one MH_CreateHook per address
#      ever is what stops MinHook's pool draining (693 re-hooks once emptied it
#      and broke every hook in the process).
#
#   2. rgl uses the INSTANCED draw entries and OMSetRenderTargetsAndUnorderedAcc
#      essViews (slot 34), never DrawIndexed or plain OMSetRenderTargets. Three
#      separate rounds were lost to hooking the obvious variant.
#
#   3. Transient resources churn. Any table keyed on a resource POINTER fills
#      with dead entries during the menu; 128 slots were full before a battle
#      started and 560k draws went unattributed. Key on shape.
#
#   4. The scene is a SIZE, not a size and a format. A second target of the same
#      dimensions in another format carries the sky and the ground.
#
#   5. ...but WHICH duplicate to display still needs the format, and even that
#      is ambiguous: three slots here are 2048x2176 fmt 28. Nothing derivable
#      says which is the colour, hence vp_second_draw_slot.
#
#   6. One render target view cannot be bound to two output slots at once. A
#      shape-keyed duplicate pool did exactly that; D3D11 refuses the binding,
#      the ENGINE's targets stay bound, and the duplicated draws land in them -
#      every object in the left eye with a second copy inside it.
#
#   7. Depth: neither sharing nor read-only sharing. Writing corrupts the
#      engine's frame; read-only rejects everything, because the redirect fires
#      after the original draw and the engine's depth already holds that
#      geometry. It needs its own buffer, cleared WHERE THE ENGINE CLEARS ITS
#      OWN - clearing at Present is a frame too late and the prepass then
#      refuses to overwrite last frame's nearer values.
#
# WHAT REMAINS
#
# The second eye is a mid-pipeline G-buffer target and looks it: flat, unlit,
# untonemapped. A G-buffer never contains a lit image. Lighting is a fullscreen
# pass that reads all six targets and writes the HDR one, and it reads the
# ENGINE'S G-buffer, not ours.
#
# So the next milestone is duplicating the composite chain: intercept the
# lighting pass, rebind its shader resources from the engine's G-buffer to our
# duplicates, write to our own HDR target, then the same for tonemap and
# upscale. That is binding SRVs on fullscreen passes rather than redirecting
# geometry draws - a different kind of work from everything above.
#
# vp_second_draw = 0 returns to ordinary AFR immediately.

# --- CORRECTION to the note above: the ground is still missing ----------------
# The last state tested was NOT "sky and terrain correct". In the right eye:
#
#   present   lit soldiers with correct textures and heraldry, sky with cloud,
#             distant mountains, correct occlusion, correct stereo separation
#   MISSING   the ground / terrain surface, which reads as a flat pale field
#
# That pale field was misread as water in the photographs. It is the absence of
# the ground, and it is the outstanding fault.
#
# Two leads, neither tested:
#
#   1. Terrain may be drawn in a pass whose target set never matches the scene
#      shape, so the redirect skips it entirely. The draw census can answer
#      this: compare the per-frame count of redirected draws against the total
#      at the scene shape and see whether terrain-sized batches are absent.
#
#   2. Bannerlord's terrain is a tessellated heightmap. If its view-projection
#      is consumed in the DOMAIN shader, the second eye's matrices never reach
#      it - only VSSetConstantBuffers is swapped, never DSSetConstantBuffers.
#      That would draw the terrain at the FIRST eye's position in the second
#      eye's target, where the depth prepass (also first-eye) would then reject
#      it. Absent rather than merely misplaced, which fits what is seen.
#
# Lead 2 is the more likely of the two and the cheaper to test: swap the domain
# and hull shader constant buffers alongside the vertex ones and see whether
# the ground appears.

# =============================================================================
# TEST 63 - the cascade census was half-blind, and the offset is reachable
#           without a frame capture
# =============================================================================
#
# TEST 62 ended by sending the next attempt to RenderDoc. Two things found by
# reading the scan rather than running it say that was premature.
#
# THE BLIND SPOT, WHICH PUTS AN ASTERISK ON "MEASURED FALSE"
#
# The orthographic census runs INSIDE scan_and_patch, downstream of the buffer
# retirement gate. That gate keeps a buffer resident on one condition: `hits`,
# which counts a MAIN-VIEW matrix found and patched. Nothing else scores. So a
# buffer carrying only shadow constants takes kMissLimit = 600 misses and is
# thereafter scanned once every 256 uploads.
#
# Which means the census could only ever have reported the buffers it did
# report. cb 1760 is the main-view buffer. cb 6656 holds the second reprojection
# site. Both stay resident because of what ELSE is in them. A dedicated cascade
# buffer - the most likely home for a cascade set - would have gone quiet 600
# uploads into the run and looked exactly like a buffer with no cascades in it.
#
# So TEST 62's "the cascades are not fitted to the camera, measured false rather
# than unproven" is narrower than it reads. What was measured is that the ortho
# blocks in the two buffers the scan can still see do not move. That is worth
# having and it is not the same claim.
#
# Fixed: BufferNote::orthoHits keeps a buffer resident for carrying cascades, on
# its own terms. Deliberately NOT folded into `hits`, because that counter also
# gates build_other_eye_buffer and a shadow buffer is not something to build a
# second eye's copy of.
#
# THE OFFSET, WHICH IS NOT A RENDERDOC PROBLEM
#
# TEST 62's own reasoning: the ortho blocks carry rotation and scale with
# translation (0,0,0), so the per-cascade origin is packed beside the matrix as a
# separate float3, and a scan looking for 4x4 matrices cannot see it. Both true.
# The conclusion drawn - that this is the boundary of constant-buffer scanning -
# does not follow. It is the boundary of looking for MATRICES.
#
# A float3 that tracks the camera is exactly as measurable as a matrix that
# does: difference it between uploads, compare its step against the head's step
# over the same interval. That is the identical measurement the site census
# already makes for view matrices, pointed at a lane instead of a block.
#
# Done over the WHOLE buffer rather than a table of rows, and that matters: 6656
# bytes is 416 lanes, and a 24-row table fills with the first 24 offsets in the
# buffer - precisely the ones nothing has any reason to suspect. Every lane is
# differenced; only the movers are reported.
#
# WHAT TO READ, and it needs a battle with the head moving:
#
#   "VP cascade lanes: cb N, head travelled X m ..."
#       offset  travel  ratio  align  step  n
#
#   ratio   lane travel / head travel. Near 1 is a lane riding the head.
#           Near 0 is anchored to the world.
#   align   |cos| between the lane's step and the head's own step. Near 1 means
#           it moves in the direction the head moved, which is what separates a
#           cascade origin from a lane that merely changes a lot.
#   step    the largest single step. A texel-snapped origin does not move
#           smoothly, it JUMPS, and this is the size of the jump - the world
#           size of a shadow texel, and the distance a shadow edge travels when
#           it travels. That number is the diagnosis on its own.
#
# A set of six lanes at a 416-byte stride, all with ratio near 1 and align near
# 1, is the cascade origin array and the question is answered.
#
# THE CAVEAT, STATED BEFORE THE RUN RATHER THAN AFTER
#
# Lanes are differenced across UPLOADS of one byte width. If rgl reuses that
# width for an unrelated pass, the two uploads are differenced against each
# other and the lane reads as moving when nothing moved. High travel with LOW
# align is the signature of that, which is why align is printed beside ratio
# rather than being folded into a single score.

# =============================================================================
# THE FIX, AND WHY IT IS THE FIX FOR AFR WITHOUT DLSS TOO
# =============================================================================
#
# A cascade is a shadow map of fixed resolution covering a slice of the camera
# frustum. Move the camera, the slice moves, the world lands on different texels
# and every shadow edge redraws one texel over. The standard cure is to quantise
# the cascade origin to whole texels: the slice then moves in texel steps, the
# world keeps landing on the same texels, and the edge holds still.
#
# Two things make this far worse here than in the flat game, and both are ours:
#
#   1. THE FRUSTUM. The engine renders at vfov 129.5 deg - measured, in the gain
#      note above. A cascade is fitted to the frustum, so the same texel count is
#      stretched across roughly three times the width. Every texel is three times
#      bigger in world terms, and so is every step an edge takes.
#
#   2. THE CAMERA NEVER STOPS. A flat game's camera is still whenever the player
#      is. A head is never still. So the cascade re-fits continuously and the
#      crawl is on display permanently instead of during mouse movement.
#
# THIS ACCOUNTS FOR THE MEASUREMENTS THAT KILLED THE OTHER SIX THEORIES.
# TEST 53's table has shadows moving with the head in AFR WITHOUT DLSS as well
# as in both AFW columns - so the fault is in the engine's own render, in every
# mode, and DLSS's temporal accumulation was only ever smearing it out of sight.
# TEST 55 found the crawl in BOTH eyes, which says the same thing from the other
# end: it was never the warp. Nothing aimed at the warp, the reprojection matrix
# or the motion vectors could have touched it, and none of them did.
#
# It also predicts why AFW cannot be rescued by the mode work: AFW is not causing
# this and never was. It is the mode that SHOWS it, because it is the one with no
# temporal accumulation to hide behind.
#
# HOW TO ARM IT - and it is DISARMED until the census has named the lane, because
# a wrong offset writes a rounded float3 over something that is not an origin.
#
#   1. Run a battle with vp_patch = 1 and move your head. Read the cascade lane
#      report.
#   2. Set vp_cascade_snap_offset to the offset of the FIRST lane in the moving
#      set, and vp_cascade_snap_stride / _count to the spacing and size of the
#      set. 416 and 6 are TEST 62's numbers and are the defaults.
#   3. Set vp_cascade_snap_texels to the shadow map resolution the game is
#      actually running. THIS ONE MATTERS: snapping to a coarser grid than the
#      real texel makes the crawl worse, not better, because it quantises to
#      steps larger than the ones being complained about.
#   4. Test in AFW, not in AFR with DLSS. DLSS is what has been hiding this, and
#      a test run behind it cannot tell you whether the snap worked.
#
# Watch for "VP cascade snap: N origin(s) quantised". Skips mean the stride or
# the count is wrong - the snap looks for the cascade's own matrix inside its own
# entry and declines to write when it cannot find one.
#
# -1 disarms, and it is one line.
vp_cascade_snap_offset = -1
vp_cascade_snap_stride = 416
vp_cascade_snap_count = 6
vp_cascade_snap_texels = 2048

# The census and the retirement fix are measurement and cost nothing to leave
# on. The mode stays where TEST 53 measured it best until the snap has something
# to say; step 4 above is a deliberate change for one run, not a new default.

# --- RESULT (TEST 63): a clean negative, and the search space is now closed ----
#
# The retirement fix works and revealed NOTHING NEW. Same 13 orthographic blocks
# as before, in the same three buffers. No shadow-only buffer was being hidden by
# the gate, because there is no shadow-only buffer to hide.
#
# The lane census ran on cb 6656 for the whole mission and printed the header
# eight times with NOT ONE ROW UNDER IT. Every one of its 416 lanes measured
# static while the head travelled up to 14.5 m between reports. cb 6656 is not a
# cascade set whose origin is packed beside the matrix. It is a static table.
#
# And the reason this is a CLOSED question rather than another near miss:
#
#   largest constant buffer seen 1760 bytes, cap 65536
#   UpdateSubresource 0 (constant 0)
#   distinct widths ever scanned: 128, 224, 528, 1760, 6656
#
# Five constant buffers in the whole renderer, none near the size cap, and not
# one constant arriving by UpdateSubresource. The scan is not sampling a corner
# of rgl's constant traffic - it is seeing all of it. So:
#
#   THERE IS NO HEAD-TRACKED CASCADE TRANSFORM IN ANY CONSTANT BUFFER.
#
# That retires the theory this whole test was built on, and it retires the fix
# with it: vp_cascade_snap has nothing to snap. The keys stay, disarmed, because
# the machinery is right if the premise ever turns out to be reachable another
# way, but nothing here should be armed on the current evidence.
#
# WHAT IT LEAVES, AND THE ONE FREE MEASUREMENT THAT SPLITS IT
#
# Reported from the headset, and it is the best lead on the table: with dynamic
# shadows OFF the moving effect is MUCH LESS but not gone; with them ON it is
# much worse and plainly visible. So the dominant term is the dynamic shadow path
# and there is a smaller residual from something else.
#
# Two families remain and they make opposite predictions about one free knob:
#
#   TEXEL CRAWL       the shadow map's world-space texel is large (our 129.5 deg
#                     frustum) and unsnapped, so edges step as the head drifts.
#                     Amplitude is PROPORTIONAL TO TEXEL SIZE.
#
#   TEMPORAL RESOLVE  a screen-space or filtered shadow pass carries history and
#                     reprojects it wrongly. Amplitude does not care about texel
#                     size at all.
#
# So: raise the game's own shadow quality / resolution setting a notch or two and
# look again, with dynamic shadows on and DLSS off. Halving the texel should
# roughly halve a texel crawl and do nothing whatever to a temporal one. No code,
# one run, and it decides which of the two the next build is aimed at.
#
# The pose-age spikes in this log (600-2400 ms) are the loading screen and the
# mission teardown. Through the mission itself it is 0.0 ms mean. Not a lead.

# --- CORRECTION to the RESULT above: the search space was NOT closed -----------
#
# "There is no head-tracked cascade transform in any constant buffer" was wrong,
# and it was wrong for two reasons that are worth keeping because both are easy
# to repeat.
#
# 1. THE NUMBER WAS READ OFF THE WRONG PHASE. "largest constant buffer seen 1760
#    bytes" comes from the VP-patch-idle census, which only prints while nothing
#    is published - that is, during the MENU. The next run, with a mission
#    actually running, says:
#
#        largest constant buffer seen 40960 bytes, cap 65536
#
#    and names cb 15360 thirty times over. The mission's buffers are an order of
#    magnitude larger than the menu's and none of them were in the number the
#    conclusion was drawn from.
#
# 2. THE CENSUS LATCHED TO ONE BUFFER AND IT WAS THE WRONG ONE. g_laneBytes took
#    the FIRST orthographic carrier it saw and watched only that for the life of
#    the run. That was cb 6656, which is bit-static. So the census correctly
#    reported that cb 6656 does not move, printed a header with nothing under it
#    eight times, and the empty list was read as a statement about the renderer
#    when it was a statement about one static table.
#
#    The 16384-byte cap then excluded cb 40960 outright, and the latch excluded
#    cb 15360. The two buffers most worth differencing were the two that could
#    not be reached.
#
# FIXED, and the instrument now says what it did rather than only what it found:
#
#   * Six slots instead of one latch. A buffer earns a slot by carrying an
#     orthographic block OR by being >= 4096 bytes - big enough to be a per-view
#     or per-pass table rather than one of the thousands-per-frame per-object
#     ones that would otherwise take every slot in the first millisecond.
#   * The cap is 65536, the same as the scan's own vp_max_cb_bytes.
#   * Every watched buffer prints a line whether or not anything moved, with the
#     count of lanes that moved, and the word STATIC when none did. An empty list
#     under a confident header is what caused this in the first place.
#
# WHAT TO READ NEXT RUN
#
#   "VP cascade lanes: watching N of 6 buffer slot(s)"
#     cb  15360 [ortho]: head travelled X m, K of 960 lane(s) moved.
#         offset  ...  ratio 1.0xx  align 0.9xx  step ...
#
# cb 15360 and cb 40960 are the two that have never been looked at. If a lane in
# either rides the head, ratio and align both land near 1 and the offset is the
# cascade origin. If every watched buffer comes back STATIC - with the head
# having actually travelled, which the line now states - then the constant-buffer
# route really is exhausted, and it will be exhausted on evidence instead of on a
# menu-phase number.

# --- The six-slot census, first reading, and two more instrument bugs ---------
#
# The slots filled with cb 40960, 32768, 15360, 6656, 1760 and 528 - so the
# renderer's real constant traffic is an order of magnitude bigger than the
# menu-phase number that produced the wrong conclusion above. Worth the run for
# that alone.
#
# WHAT IT SETTLED
#
#   cb  6656 [ortho]   STATIC on every report, head moving 0.5-1.0 m. Confirmed
#                      by the whole-buffer difference now, not by a latch: this
#                      is a constant table and it is not a cascade set.
#   cb 40960           STATIC on every report after the first.
#
# WHAT IT COULD NOT SETTLE, AND WHY THE READING WAS UNUSABLE
#
#   cb 32768: 972 of 2048 lanes moved, top lane travel 20,347 m while the head
#             moved 0.5 m. ratio 38,695.
#
# That is not a lane that moved 20 km. It is a PER-OBJECT buffer, uploaded
# hundreds of times a frame with a different object's data each time, and
# differencing consecutive uploads measures the distance between two unrelated
# objects. Every list was topped by whichever lane churned hardest.
#
# TWO FIXES, and the first is the one that matters:
#
#   1. ONE SAMPLE PER PRESENT. Each slot now takes a single difference per frame,
#      which turns every lane into a proper time series - same slot, one frame
#      apart - instead of a walk through unrelated objects. A cascade origin is
#      written once a frame and is unaffected.
#
#   2. RANKED BY WHETHER IT RIDES THE HEAD, NOT BY HOW FAR IT WENT.
#
#          score = align * min(ratio, 1/ratio)
#
#      1 only when the lane tracks the head one-for-one, falling away for a lane
#      that moves too far, too little, or in an unrelated direction. Ranking by
#      travel was selecting for exactly the noise above; the churn scores under
#      0.1 however large its travel. Lanes need 4 samples to be ranked at all.
#
# READ THE score COLUMN NEXT RUN. Above ~0.8 in a buffer that is not per-object
# is the cascade origin. If nothing anywhere clears ~0.5 once the churn is gone,
# then no constant in this renderer follows the head, and the next build is the
# shadow-pass binding census - which names the buffer the shadow pass actually
# binds, rather than searching every buffer for something shaped like a cascade.

# =============================================================================
# TEST 64 - the census works, and it says the view path is not the problem
# =============================================================================
#
# With one sample per present and the ranking changed to score = align *
# min(ratio, 1/ratio), the census produced its first clean reading:
#
#   cb   1760 [ortho]  offset 0, 16, 976   score 0.969  ratio 0.994  align 0.975
#   cb   6656 [ortho]  STATIC          cb 40960  STATIC
#   cb  32768          per-object churn, every lane scoring under 0.15
#
# Offsets 0/16/976 are the CAMERA POSITION, riding the head one-for-one because
# managed puts the engine camera at the eye. That is the mod working, not a bug.
# Nothing anywhere carries a quantised cascade origin. Seven theories about the
# cascades are now dead and the eighth was that they existed at all.
#
# AND A RED HERRING RETIRED, which had been steering decisions for weeks:
#
#   Head-to-world gain 0.650  (have 2.260/1.778, want 1.885/0.964)
#
# is computed from the Camera object's Fov FIELD, and rgl does not build its
# projection from it. The matrices actually rendered say so:
#
#   offset 240  108.0 x 110.0 deg | PATCH | moved 0.190 m vs eye 0.183 m
#   offset 304  108.0 x 110.0 deg | PATCH | moved 0.190 m vs eye 0.183 m
#
# 108 deg IS the 1.885 rad the "want" column asks for, and the view tracks the
# eye 1:1. Render and submission agree. There is no 65% scale error, the FOV
# hold is fighting over a field nothing reads, and vp_fov_expand has nothing to
# fix - which also means the note above claiming AFW has to go before expand can
# be used is moot rather than a constraint.
#
# WHERE THAT LEAVES THE SHADOWS
#
# The view path is correct: right frustum, right camera, 1:1 motion, no cascade
# fitted to the head. So the crawl is not a matrix error and no further matrix
# hunting will find one. What TEST 53 measured stands as the explanation - the
# synthesised eye has no temporal history and cannot hold a shadow edge still -
# and its own conclusion was that no warp ever will.
#
# So stop fixing the warp. SINGLE-FRAME STEREO has no warp: both eyes are real
# renders of one instant and both get DLSS. Its one outstanding fault was the
# missing ground, and the fix for that landed in fb67e47 (hull and domain shader
# constant buffers swapped alongside the vertex ones - a tessellated heightmap
# whose view-projection is consumed in the DOMAIN shader was being drawn at the
# first eye's position and then rejected by the first-eye depth prepass). It has
# not been looked at in a headset since.
#
#   stereo_mode = drawstereo
#   afw = 0
#   vp_second_draw = 1
#
# Three questions, in order: is the ground there, do shadow edges hold still,
# and does the frame rate survive ~500 duplicated draws.

# =============================================================================
# TEST 65 - it is a REGRESSION, and the writer contradicts its own pass three
# =============================================================================
#
# Reported from the headset, and it is the single most useful thing anyone has
# said about this bug: THE SKY AND SHADOWS DID NOT DO THIS UNTIL THE HEAD-MOVEMENT
# LATENCY AND FLOATING WERE FIXED. It was never a problem before that.
#
# That makes it a regression with a known commit, and it retires every theory in
# TESTs 53-64 at once - none of them were regressions, all of them were about
# properties the renderer had all along. Seven rounds were spent looking for a
# standing defect when the thing to look for was a change.
#
# The commit is 135b928, "The camera stops fighting the head". It set:
#
#   frame_latency = 1     pose_lead_frames = 1    desktop_vsync = 0
#   vp_patch = 1          vp_reproj_band 0.25 -> 0.75    vp_match_prev = 1
#
# The first three are pacing and latency and cannot coupleeffects spatially to
# the head. The last three are all NEW WRITES, and two of them land on exactly
# the passes named in the complaint.
#
# THE CONTRADICTION, WHICH IS IN THIS FILE'S OWN CODE
#
#   vp_patch.cpp:2040   const bool usePrev = cfg().matchPrev && prevOk && mainViewSeen > 0;
#                       "any later one is the previous frame's"
#
#   vp_patch.cpp:2124   "The second one is NOT taken as the previous frame any
#                        more. The probe measured offsets 240 and 304 as
#                        BIT-IDENTICAL on every line it ever logged."
#
# Pass three learned that 304 is not a one-frame-old view and stopped using it as
# one. The WRITER never got the same correction. So the engine writes the same
# current matrix into both slots, and we overwrite the second with a matrix one
# frame old.
#
# Everything that derives camera motion from the difference between those two
# slots - and this file has been listing them for weeks: sky, sun, cloud, hair,
# particles, screen-space shadows - is now told the camera moved between two
# slots the engine meant to be identical. It reprojects its history by one frame
# of head motion that never happened. Proportional to head speed. Settles when
# the head stops. Terrain, objects and characters are untouched because they
# carry no history.
#
# That is the reported symptom, the reported list, and the reported timing.
#
# THE TEST: vp_match_prev = 0, which is the value it had before 135b928. One
# variable, and it keeps everything else that commit fixed - frame_latency,
# pose_lead_frames, and the main-view substitution that stabilised terrain,
# objects and characters.
#
# IF IT IS NOT THIS, the next single line is vp_reproj_band = 0.25. That was
# raised by the same commit and is what let the reprojection matrix be identified
# and substituted at all - the other new write on the same effects, and the log
# shows it mismatching 832 times in 5 s. Change one, not both.
#
# IF IT IS THIS, the code fix is to delete the usePrev branch rather than leave a
# config key guarding a writer that contradicts its own measurement.

# --- TEST 65 RESULT: vp_match_prev was NOT it --------------------------------
# The log confirms the setting took - "VP patch: 27652 view (0 of them the
# PREVIOUS frame's)" - and the shadows were unchanged. A clean negative, and the
# first one in this investigation that tested a REGRESSION suspect rather than a
# standing property.
#
# Left at 0 regardless. A writer that fills slot 304 with a one-frame-old matrix
# while pass three has measured that slot as bit-identical to 303's neighbour is
# a defect whether or not it is this defect, and 0 is the value it had before
# 135b928 anyway.
#
# --- TEST 66: the other new write from the same commit -----------------------
# vp_reproj_patch = 0. A DIRECT switch, added for this: pass three runs in full -
# identification, decisive test, census, per-frame agreement check - and only the
# memcpy is suppressed. The instrument keeps reporting while the write stops.
#
# Not vp_reproj_band = 0.25, which was the old way to reach the same place and is
# not equivalent: it works by starving identification, so it blinds the
# instrument at the same time, and a run that identified anyway would substitute
# anyway.
#
# This is the last of the three new WRITES that 135b928 introduced. If the sky
# and shadows settle, that is the cause and the fix is to correct the
# substitution rather than to keep it off.
#
# IF IT IS NOT THIS EITHER, the writes are exhausted and what remains from that
# commit is timing, in this order:
#
#   pose_lead_frames = 0   the engine renders from a pose published one period
#                          ahead. If what is rendered and what is submitted
#                          disagree, the compositor reprojects the difference -
#                          which is proportional to head speed and settles when
#                          the head stops. That is the shape of the complaint,
#                          and it is the only remaining change that has it.
#   frame_latency = 3      back to the queued depth it had before.
#   desktop_vsync = 1      last, and least likely to be spatial.

# --- TEST 66 RESULT: the reprojection write was not it either ----------------
# Confirmed in the log, not assumed: "VP reprojection HELD: vp_reproj_patch = 0,
# so 3373 substitution(s) that would have been written were not", and "written 0"
# on every report afterwards. Pass three ran in full and wrote nothing. No change
# in the headset.
#
# --- TEST 67: stop bisecting writes one at a time ----------------------------
# Two named writes are now eliminated with the instrument confirming each. There
# is a THIRD nobody has counted - vp_sky, which patches the skybox matrix at
# cb 1760 offset 688 and does nothing unless vp_patch = 1, so it is just as much
# a new write from 135b928 as the other two - plus the main-view substitution
# itself. Naming them one per run is three more runs.
#
# vp_patch = 0 with vp_measure = 1 turns off EVERY write while keeping every
# instrument. One run, and the space halves for good:
#
#   SETTLES     it is one of our writes. Back to vp_patch = 1 and bisect vp_sky,
