#   DOUBLING GOES     the depth layer and the pose lie interact: the compositor
#                     reconstructs world points from a pose we falsified and the
#                     error it makes is depth-dependent. Then the choice is depth
#                     OR overdrive, and TEST 132 says depth is worth more.
#
#   DOUBLING STAYS    the overdrive is incompatible with AFR's split-moment pair
#                     regardless of depth, and head_overdrive = 0 is the end of
#                     this line. What remains is TEST 132's state, which was
#                     reported STABLE, plus the honest statement that onset
#                     resistance needs prediction and not bias.
#
# Either answer closes something, which is why it is worth one battle.
#
# RESULT: pending.
depth_layer = 0
head_overdrive = 1.0
# =============================================================================
# TEST 138 - the reference eye was chosen by a clock too coarse to see a frame
# =============================================================================
#
# Reported: the doubling POPS UP while the head moves and turns, rather than
# being there continuously.
#
# "Intermittent" was the word that found it. A bias that is simply wrong is
# wrong every frame; one that pops is one that FLIPS.
#
#   g_xr.afrLastCaptureMs[eye] = GetTickCount64();          (afr_promote_eye)
#   fresh = (afrLastCaptureMs[1] >= afrLastCaptureMs[0])    (the overdrive)
#
# GetTickCount64 advances in 10-16 ms steps. A frame at 90 Hz is 11.1 ms. So the
# two eyes' stamps land on the SAME tick most of the time, and >= between equal
# stamps returns eye 1 whichever eye had really just been captured. On the
# frames where eye 0 was the fresh one, the delta was measured against a pose a
# whole frame older - a bias spike on those frames and a correct bias on the
# others.
#
# That is a pop, it can only appear while the head is moving (with the head
# still the delta is near zero either way, which the log shows at 0.05 deg
# against 0.34 deg moving), and it is exactly the report.
#
# THE FIX IS THE SIGNAL THAT WAS ALREADY THERE. afr_promote_eye knows which eye
# it just promoted; it now records it, and the overdrive reads that instead of
# comparing clocks. No resolution to run out of. The old comparison stays as the
# fallback for the frames before any promotion.
#
# AND A BOUND, so this class cannot produce a pop again:
#
#   head_overdrive_max_deg = 3.0
#
# One pipeline's worth of head rotation belongs in fractions of a degree - the
# measured mean is 0.05-0.34 - so anything much larger is a hitch, a dropped
# frame or a badly chosen reference. Clamped rather than skipped, because
# skipping is a discontinuity of its own.
#
# DEPTH BACK ON. depth_layer = 0 was TEST 137's discriminator and its premise -
# "the doubling might be the depth" - is superseded by finding an actual bug in
# the reference choice. TEST 132 reported the depth layer as STABLE and it is
# the only thing that has fixed a reported fault outright, so it goes back.
#
# WHAT TO WATCH: "Head overdrive: N frame(s) biased ... max Y deg". The MAX is
# the number that matters now. It read 3.85 deg while the mean was 0.34 - a
# ten-to-one spread that was the flip. Expect the max to fall towards the mean.
# If it still spikes, the reference is not the cause and the clamp is doing the
# work instead of the fix.
#
# RESULT: pending.
depth_layer = 1
head_overdrive = 1.0
head_overdrive_max_deg = 3.0
