#
# THAT KILLS A THEORY AND EXPOSES THE REAL QUESTION. D reduces to
#
#     D_translation = eyeCamera - refPos
#
# which is our latched eye pose minus the engine camera at publish time. Under
# afr_camera_mode = engine those are supposed to be THE SAME CAMERA, written by
# AimAtEye and read back a few lines later in VrVpPatch.Publish. They are not
# within 4 mm of each other at any point in a five second window. Something is
# holding them apart, and it is not head movement, because it does not go away
# when the head stops.
#
# This is the same gap TEST 84 left open and that TEST 82 mis-explained twice.
# It is now the only thing standing between here and a working build, because
# every remaining symptom is downstream of it:
#
#   characters shake      the frame-to-frame change in D, which dynamic
#                         entities' engine-composed motion vectors know nothing
#                         about
#   effects/sky/shadows   D itself, against content fitted before the latch
#   the DLSS dependency   only needed to smear the second one out of sight
#
# --- D IS NO LONGER BEHIND vp_census ----------------------------------------
#
# It was gated for CPU in TEST 78 and that gate has cost more than it ever
# saved: D is the quantity every symptom here turns on, it was argued about
# across forty tests, and it was printable the whole time. The accumulators now
# run on every substitution - a few atomics on 65 matrices a frame, which is
# nothing beside the matrix work already on that path - and the line prints
