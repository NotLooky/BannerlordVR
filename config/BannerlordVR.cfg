vp_latch = 1.0

# =============================================================================
# TEST 125 - AFW, with the DOCUMENTED cause of the doubling addressed
# =============================================================================
#
# Asked for AFW fixed, with stable performance and the inverted mirror edges.
#
# THE DOUBLING IS NOT NEW AND NOT MYSTERIOUS. It is written down beside
# afw_depth_max_near_m, and it describes TEST 87's report exactly:
#
#   "at 3.0 the FIRST battle of a session doubles and a reload clears it ... a
#    legitimate 3400x3468 target was blacklisted because nothing in it is nearer
#    than 9.4 m. A deployment-phase camera looking down a field has nothing
#    within 3 m, so the probe threw away a good buffer and froze on the other
#    eye's - a full-baseline parallax error, which is a STATIC DOUBLING needing
#    no head movement."
#
# TEST 87 was a first battle. The probe blacklisted the real depth, the warp ran
# from the wrong buffer, and the whole image doubled. That is the report.
#
#   afw_depth_max_near_m = 12.0
#
# 12.0 accepts a deployment view whose nearest content is 9.4 m. It was reverted
# once for a good reason - at 12.0 the search accepted the FIRST eye-sized
# candidate with no rejection at all, and the residual went from ~0-1.5 px to
# 11.83 px - so this is not a free change and it is NOT being taken on trust.
#
# IT IS MEASURED, in the log, every run:
#
#   "AFW calibration: best match at gain G, direction D (cost C against F)"
#   mean absolute residual  ~0-1.5 px  the right depth won; 12.0 is safe here
#                           ~12 px     a non-scene buffer won; drop to 6.0 and
#                                      accept that the first battle may double
#                                      until a reload
#
# So the threshold is set where it stops the doubling and the run tells us
# whether it cost the discriminator. That is the opposite of how it was raised
# and reverted before, which was on feel.
#
# THE FILL IS ALREADY WHAT WAS ASKED FOR and is unchanged:
#   afw_fill_invert = 1        forward out of the background band - "right way
#                              round", one copy the width of the hole, never
#                              repeats. This is the inverted edge fill.
#   afw_fill_mirror_px = 0     the fold is OFF, so a wide hole cannot read as a
#                              flipped copy of the ground with a crease in it.
#   afw_fill_mirror_reach_px = 64
#
# PERFORMANCE IS NOT BEING GUESSED AT EITHER. TEST 51 already caught one "AFW is
# 5 fps" that was a pairing bug rather than the warp - the generation advanced on
