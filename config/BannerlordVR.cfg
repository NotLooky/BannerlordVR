# =============================================================================
# TEST 140 RESULT / TEST 141 - the shake test brackets it from both sides
# =============================================================================
#
# TEST 140 RESULT: at k = 3.2 a head SHAKE is very sensitive and the world shakes
# WITH the head. With vp_patch = 1 (the old build) a shake felt insensitive and
# the world stayed put.
#
# THE SHAKE IS A BETTER INSTRUMENT THAN ANY SLOW TURN, and it was not one of
# ours. High-frequency motion separates the three cases cleanly, because the
# compositor shows
#
#     content pose + (photon - submitted pose)
#
#   submit FRESHER than the content   world LAGS the head       resistance
#   submit EXACTLY the content pose   world-locked              correct
#   submit STALER than the content    world LEADS the head      "shakes with me"
#
# head_overdrive deliberately submits a staler pose, so "the world shakes with my
# head" is the signature of TOO MUCH of it - not of the mechanism being wrong.
#
# --- THE BRACKET, WHICH IS THE REAL RESULT ---------------------------------
#
# Measured by pairing the overdrive against "Pose lag by axis" second by second,
# keeping only seconds with real head motion:
#
#     0.64x   k = 2.0 under the old 3.0 deg bound   RESISTANCE, too little
#     1.61x   k = 3.2 under a 5.0 deg bound         TOO SENSITIVE, too much
#
# Both ends are now reported from the headset, so the answer is between them and
# no longer needs guessing at from one side.
#
# AND MY EXTRAPOLATION WAS WRONG, which is why 3.2 was tried at all: 0.26 at
