# destination here is R16G16_FLOAT written through RWTexture2D<float2>, which is
# a per-device capability - and an unsupported typed store is UNDEFINED, not
# failed. That would corrupt every mode differently and produce exactly what has
# been seen. The device is now asked directly, once:
#
#   "NGX MV fix: R16G16_FLOAT typed UAV store is SUPPORTED / NOT supported"
#
# NOT supported would mean modes 1 and 3 never tested anything, and the fix is to
# write the bits through an R32_UINT view instead of correcting the maths.
#
# A typeless destination was written and then backed out before shipping: NGX is
# handed the RESOURCE and builds its own shader view from it, so a typeless
# resource gives it nothing to build from. That would have traded a hypothesis
# for a real breakage.
#
# READ TOGETHER, the two lines partition the problem completely:
