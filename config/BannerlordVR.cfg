# =============================================================================
# TEST 97 - the LIVE view is exactly twice the PREV slot, and that is a lag
# =============================================================================
#
# TEST 96 RESULT: the split landed, and it says the opposite of the prediction.
#
#   HELD STILL   LIVE 316 / 227 / 249 / 243 mm    PREV 180 / 141 / 153 / 151 mm
#   MOVING       LIVE 6400 -> 54046 mm            PREV 3216 -> 27025 mm
#
# The LIVE view - the one whose D is supposed to be a fault - is LARGER than the
# deliberately frame-old slot. And the ratio is not vague:
#
#   1.76, 1.61, 1.63, 1.61, 1.99, 2.00, 2.00, 2.00
#
# LIVE = 2 x PREV, holding across three orders of magnitude from 227 mm to 54 m.
# A constant ratio that survives that range is not noise and not two unrelated
# faults. It is a STRUCTURE.
#
# WHAT PRODUCES EXACTLY 2:1
#
# Let R be the engine camera we difference against, E(t) the eye now, E(t-1) the
# eye one frame ago. LIVE differences E(t) against R; PREV differences E(t-1)
# against R. For |E(t) - R| to be twice |E(t-1) - R| at every speed, R has to sit
# one further step back along the same line:
#
#     R = E(t-2)        ->   PREV = one step,  LIVE = two steps,  ratio 2.00
#
# So the engine camera we are differencing against is TWO FRAMES BEHIND the eye,
# and D is not a displacement at all - it is a LAG, and what it measures is
# whatever the player moved in two frames. On a walking or mounted player that is
# a couple of hundred millimetres at 90 fps, which is the "held still" number:
# the HEAD was still, the player was not.
#
# THAT ALSO RETIRES THE WHOLE "THE CAMERA IS IN THE WRONG PLACE" READING. The
# camera is in the right place, two frames ago. Every attempt since TEST 84 to
# find something displacing it was looking for a spatial fault where there is a
# temporal one.
#
# BUT IT CANNOT BE THAT SIMPLE, AND THE CONTRADICTION IS THE POINT
#
#   AimAtEye read-back        0.0 mm, twelve windows, every write
#   between AimAtEye and Publish   nothing - the switch breaks straight to it
#   Publish                   native derives 227 mm from the two values written
#                             on adjacent lines
#
# All three cannot hold. Either the camera really does change in a gap with no
# code in it, or one instrument is not measuring what its name says. The class
# note at the top of VrVpPatch already claims the engine overwrites CombatCamera
# "on every single frame, pose included" - which would explain a lag - but the
# anatomy reports d(ref) 0.00, meaning the matrix the engine RENDERED with
# matches refPos exactly, which says it did not.
#
# So the next instrument goes at the only line not yet watched: inside
# VrVpPatch.Publish, differencing EyeFrame(eye).origin against
# combat.Frame.origin at the exact statement that writes refPos.
#
#   "Publish D check: eye vs engine camera at the refPos line is X mm mean,
#    Y mm worst, over N publish(es) in ~5 s."
#
# DECIDED IN ADVANCE:
#
#   near 0 here, but native still reports 227 mm
#       the camera and the eye agree when they are written, and the 227 mm is
#       manufactured downstream - in read_published pairing a frame with the
#       wrong partner, or in build_replacement's arithmetic. The fault is then
#       native's and the camera work of TESTs 93-95 was all beside the point.
#
#   ~227 mm here
#       the two values genuinely differ at the moment they are captured, on
#       adjacent lines, with nothing in between - which means AimAtEye's 0.0 mm
#       read-back is lying, and the thing to distrust is Camera.Frame itself:
#       a property that reports what was written rather than what the camera IS.
#       That would fit the class note exactly.
#
# Both outcomes are useful and they point at opposite halves of the codebase,
# which is what an instrument is for.
#
# RESULT: pending.

# =============================================================================
# TEST 98 - D's "metres" were never metres. The instrument was the bug.
# =============================================================================
#
# TEST 97 RESULT, and it is the end of a long wrong road:
#
#   Publish D check: eye vs engine camera at the refPos line is
#                    0.0 mm mean, 0.0 mm worst, over 450 publish(es) in ~5 s
#
#   VP D split (same run):  LIVE VIEW mean 227 mm ... 18306 mm
#
# Managed differences the two values at the exact statement that writes them and
# gets ZERO, every publish, 450 of 450. Native differences the same two values
# and gets hundreds of millimetres. Both are right, and the arithmetic says why.
#
# D = inverse(eye) * eng. Its translation row, in row-vector form, is
#
#     d.t = -t_eye * R_eye^T * R_eng + t_eng
#
# With t_eye == t_eng == t, which managed has now MEASURED, that does not vanish:
#
#     d.t = t * (I - R_eye^T * R_eng)
#
# It is the WORLD POSITION times the rotation mismatch. Bannerlord's battle
# origin sits ~1090 m out, so
#
#     0.012 deg of angular error  ->  227 mm printed as "displacement"
#     0.95  deg                   ->  18 m
#
# NOTHING WAS EVER DISPLACED. The camera is exactly on the eye - 0.0 mm, measured
# twice now, at AimAtEye and again at Publish. What is left is a rotation
# mismatch of about a hundredth of a degree, and the instrument multiplied it by
# a kilometre and reported it in metres.
#
# It explains the 2:1 too, which no displacement theory could: both slots are the
# same |t| times their own rotation error, and the previous slot's is one frame
# of head rotation where the live slot's is two.
#
# WHAT THIS RETIRES
#
#   TESTs 84-97 in their entirety. Every one was chasing a spatial fault that
#   the instrument invented. TEST 91's deadzone, TEST 93's "the camera drive is
#   the bug", TEST 95's reorder, TEST 96's split - all aimed at a number that
#   was an angle wearing a length's units.
#
#   And it puts an asterisk on the ORIGINAL shadow finding, which used this same
#   line to conclude the scene was displaced 26 m mean / 292 m worst. That was
#   very likely 0.02-1.5 degrees of rotation mismatch at battle-map distance, not
#   a translation at all. It should be re-measured before it is trusted again.
#
# THE INSTRUMENT IS FIXED RATHER THAN DELETED
#
#   position   now the TRUE pose delta, |eyeCamera - refPos|, differenced
#              directly. Expected: 0.0 mm.
#   angle      from D's 3x3 trace, which was always correct and always the
#              number that mattered. Now reported per bucket beside the
#              position instead of hidden behind a translation.
#
#   vp_dead_m defaults to 0 - OFF. TEST 91 armed it at 4 mm against a
#   translation that has turned out not to be one; with the position delta
#   correctly reading 0.0 mm it would swallow EVERY substitution and silently
#   turn the patch off. A deadzone on the ANGLE may still be worth having, but
#   not on a withdrawn premise.
#
# WHERE THIS LEAVES THE ACTUAL COMPLAINT
#
# The scene is not displaced, so the character shake is NOT scene displacement,
# and no amount of camera work will touch it. That returns the question to where
# VrAfrRenderer put it before any of this started: under AFR the engine's camera
# alternates 65 mm every frame, dynamic entities' motion vectors are composed by
# the engine from that alternating camera, this mod cannot reach them, and only
# a temporal upscaler consumes them. Static geometry is immune because its
# vectors come from the two matrices we patch.
#
# The next run should read LIVE VIEW ~0.0 mm and a small angle. If it does, D is
# closed as a suspect and the shake is an unreachable-motion-vector problem
# whose only exits are the ones already measured: no temporal AA (shadows get
# worse), AFW (doubling and performance), or per-eye upscaler history (needs an
# NGX hook that does not exist yet).
#
# RESULT: pending.
vp_dead_m = 0

# =============================================================================
# TEST 99 - "only with vp_patch on" is the constraint that solves it
# =============================================================================
#
# Two questions asked, and they have one answer between them.
#
# --- Q1: WHY ONLY WITH vp_patch ON? ----------------------------------------
#
# This rules out the eye alternation by itself, and it should have been asked
# forty tests ago. The engine's camera alternates 65 mm every frame at
# vp_patch = 0 just as much as at vp_patch = 1 - afr_camera_mode = engine drives
# it to whichever eye is being drawn either way - and characters are STABLE at
# vp_patch = 0. So the alternation is not sufficient. vp_patch is necessary.
#
# TEST 98 already ruled out the other obvious answer: nothing is displaced. The
# position delta is 0.0 mm, and with the camera already on the eye the main-view
# substitution is a near-no-op BY DESIGN - this file says so at the vp_patch = 1
# block: "D comes out near identity and VP' ~= VP".
#
# So vp_patch is not moving the scene. What it is doing is OVERWRITING THE
# TEMPORAL SLOTS, and that is all it is doing:
#
#     offset 304   the previous-frame matrix        (vp_match_prev)
#     offset 752   the reprojection matrix          (pass three)
#
# Both are motion-vector machinery. Neither places geometry.
#
# AND THAT CREATES AN ASYMMETRY THE MOD CANNOT SEE. A motion vector has a camera
# term and an object term. vp_patch replaces the camera term with ours. The
# engine's per-object cached previous transforms are untouched - they are not in
# any buffer we scan. So after the write:
#
#     static geometry    both ends come from the two matrices we just wrote.
#                        Self-consistent. Fine.
#     dynamic entity     camera term ours, object term the engine's, describing
#                        two different moments. Wrong by the difference.
#
# That is the reported set (characters and everything they interact with), the
# reported condition (only with DLSS or DLAA, the only consumers of motion
# vectors), and the reported switch (only with vp_patch on). Three constraints,
# one mechanism, no remainder.
#
# --- Q2: WHY DOES DLSS FIX MOVING DYNAMIC SHADOWS? -------------------------
#
# It does not fix them. It AVERAGES them, and the averaging is indistinguishable
# from a fix at normal head speeds.
#
# Cascaded shadow maps are re-fitted to the camera every frame and their origins
# are snapped to a texel grid. Under AFR that camera moves 65 mm every frame, so
# the cascade lands on one side of a texel boundary and then the other,
# alternating at frame rate. Shadow edges therefore step back and forth by one
# shadow texel, every frame, forever - which reads as shadows crawling with the
# head.
#
# A temporal upscaler resolves each output pixel from several frames. Two
# alternating states averaged together are one steady state, slightly softer.
# That is the whole of it, and it is why the effect is total rather than partial:
# the alternation has a period of exactly two frames, which is the easiest
# possible thing for an accumulator to erase.
#
# TEST 53 measured this without naming the mechanism - "dynamic shadows are
# stable in AFR WITH DLSS and crawl in every other combination" - and TEST 71
# stated it outright: "DLSS's temporal accumulation was only ever smearing it out
# of sight."
#
# SO DLSS SITS ON BOTH SIDES OF THIS PROBLEM. It erases the shadow alternation,
# which is why it cannot be turned off; and it is the only thing that reads the
# motion vectors vp_patch corrupts, which is why the characters break. One
# switch, two opposite effects, and that is why every attempt to trade one
# against the other has failed.
#
# --- THE CHANGE ------------------------------------------------------------
#
#     vp_write_prev_slot = 0
#
# Stop writing offset 304 at all. The engine keeps its own previous-frame matrix,
# which is already consistent with its own per-object caches, so the camera term
# and the object term describe the same moment again.
#
# THIS IS NOT vp_match_prev = 0, and the difference matters: that one writes the
# CURRENT matrix into the slot and tells the engine nothing moved between frames,
# which is the failure recorded at the top of this file - sun, sky, cloud and
# dust losing their motion vectors while static terrain stayed correct. Leaving
# the slot ALONE is the opposite of overwriting it with the wrong thing.
#
# PREDICTIONS:
#   characters      the shake goes, standing still included.
#   head movement   unchanged - offset 240 and pass three still written.
#   shadows/sky     unchanged - they were never fixed by this write, they are
#                   fixed by DLSS, which is untouched.
#
# Watch for "VP prev slot: N write(s) SKIPPED". N should be ~3600 per 5 s, the
# same count that used to appear as "of them the PREVIOUS frame's". If it reads
# 0, the key did not take.
#
# IF THE SHAKE SURVIVES, the same argument points one slot further on: pass
# three's reprojection matrix at 752 is the other temporal write, and
# vp_reproj_patch = 0 suppresses it while leaving the rest of pass three running.
# That is the next single line, not a new theory.
#
# RESULT: pending.
vp_write_prev_slot = 0

# =============================================================================
# TEST 100 - remove the last motion-vector write, and name the endpoint
# =============================================================================
#
# TEST 99 RESULT: the skip took - "VP prev slot: 3600 write(s) SKIPPED" - and the
# shake is unchanged. So offset 304 was not it either.
#
# THE CORRECTED INSTRUMENT ALSO REPORTED, FOR THE FIRST TIME, WHAT D REALLY IS:
#
#     LIVE VIEW mean 0.0 mm / 0.9425 deg
#     LIVE VIEW mean 0.0 mm / 0.7127 deg
#     LIVE VIEW mean 0.0 mm / 0.2273 deg
#     LIVE VIEW mean 0.0 mm / 0.4863 deg
#
# Position EXACTLY zero, confirming TEST 98 - the camera is on the eye and
# nothing is displaced. What is left is a ROTATION of a quarter to one degree,
# and it changes every window. That is not an error. That is the late latch
# doing its job: it is the head rotation between the camera being set and the
# matrix being written, which is precisely what vp_patch = 1 exists to apply and
# precisely why the head feels crisp with it on.
#
# BUT IT IS ALSO, NECESSARILY, A MOTION VECTOR ERROR.
#
# The scene is rendered rotated by that half-degree. The engine's per-object
# motion vectors were computed for the UNROTATED camera. Half a degree across a
# 123 degree frustum at 3400 px is about 14 pixels, oscillating frame to frame
# as the latch correction varies - and 14 px of oscillation on a character is
# exactly the reported shake.
#
# So the late latch and correct motion vectors for dynamic entities are the SAME
# QUANTITY with opposite signs. Applying the head rotation late is what makes the
# view crisp; not telling the engine about it is what makes the characters
# shake. There is no setting that keeps one and drops the other, because they
# are one thing.
#
# --- THE CHANGE: THE LAST TEMPORAL WRITE GOES TOO ---------------------------
#
#     vp_reproj_patch = 0
#
# Pass three still runs and still identifies, it simply stops writing offset 752.
# Together with vp_write_prev_slot = 0 that is EVERY motion-vector-bearing write
# this mod makes. Only the live view matrix at offset 240 is still substituted.
#
# IF THE SHAKE SURVIVES THIS - and by the argument above it will - then it is the
# live-view substitution itself, which is the late latch, which is the feature.
# At that point the honest statement is: under AFR with a temporal upscaler,
# vp_patch = 1 CANNOT have stable dynamic entities, and no further key will
# change that.
#
# --- WHICH NAMES THE REAL FIX, AND IT IS NOT A MATRIX AT ALL ---------------
#
# The late latch exists to apply fresh head ROTATION to a frame the engine
# already drew. The OpenXR compositor does exactly that for free, every frame,
# from the pose we submit alongside the image - that is what rotational
# reprojection IS. The mod is doing by matrix substitution something the runtime
# would do downstream of every motion vector in the frame.
#
# So the configuration with nothing broken is:
#
#     vp_patch = 0        no matrix written, no motion vector corrupted,
#                         dynamic entities correct, shadows and sky correct
#                         (TEST 70 measured both stable)
#     the compositor      applies the fresh head rotation to the finished frame
#
# And that configuration was ALREADY TRIED and rejected only because it floats -
# but TEST 89 measured why, and it was never the pose or the latch:
#
#     Engine FOV hold: have 2.260/1.778, want 2.147/1.386
#     Head-to-world gain 0.869
#
# The engine renders 129.5 deg at a 16:9 aspect while we submit 123.0 - so the
# world turns 13% less than the head. THAT is the float, it is a projection
# error, and it is a different bug from everything in TESTs 90-100.
#
# THE ORDER OF WORK IS THEREFORE:
#   1. this run - confirm the last write changes nothing, and close the
#      motion-vector line for good rather than leaving it open;
#   2. fix the gain so vp_patch = 0 does not float. Aspect 1.778 is the desktop
#      backbuffer's, which says something derives the projection from the window
#      rather than from the eye target;
#   3. run vp_patch = 0 with gain 1.000 - the only configuration in which no
#      symptom in this file has a mechanism left.
#
# RESULT: pending.
vp_reproj_patch = 0

# =============================================================================
# TEST 101 - characters FIXED. The smear is the same quantity, spread evenly.
# =============================================================================
#
# TEST 100 RESULT: CONFIRMED, and the prediction attached to it was WRONG.
# vp_reproj_patch = 0 on top of vp_write_prev_slot = 0 made the characters
# stable. TEST 100 said it would not. It should not have said that.
#
# Now: "everything has smearing when moving my head, like motion blur."
#
# THE TWO RESULTS TOGETHER FINALLY SEPARATE THE TWO MOTION-VECTOR PATHS
#
# Renderers compute velocity two different ways, and this engine is no exception:
#
#   STATIC / OPAQUE   a full-screen pass, from depth and the buffer's VP_cur and
#                     VP_prev. Both ends are matrices WE can write.
#   DYNAMIC / SKINNED written per draw from per-object current and previous
#                     matrices the engine composes against ITS camera. Nothing
#                     we can write appears in them at all.
#
# Put the measured latch rotation - 0.2 to 0.9 degrees, TEST 100 - through that:
#
#   BOTH SLOTS WRITTEN (before)   static: cur ours, prev ours -> cancels, SHARP
#                                 dynamic: engine's, unaware of the rotation the
#                                 image carries -> WRONG -> the character shake
#
#   NEITHER WRITTEN (now)         static: cur ours, prev the engine's -> carries
#                                 the rotation -> SMEARS
#                                 dynamic: unchanged, also carries it -> smears
#                                 equally -> nothing moves RELATIVE to anything,
#                                 so the characters read as stable
#
# Both reports are the same half-degree. Written into both slots it lands on one
# object class and shows up as differential jitter; written into neither it lands
# on the whole frame and shows up as blur. Nothing was fixed by removing the
# writes - the error was spread out until it stopped being a shape.
#
# AND THAT IS WHY NO SLOT SETTING CAN WIN. The rotation exists because the latch
# applies a head turn the engine never knew about. Any slot we write cancels it
# for static geometry only, because dynamic velocities are out of reach by
# construction.
#
# --- SO CONTROL THE STRENGTH, NOT THE SLOTS --------------------------------
#
#     vp_latch = 1.0    full late latch. Crispest head, most smear. (now)
#     vp_latch = 0.5    half the rotation applied: half the crispness, half the
#                       smear.
#     vp_latch = 0.0    no substitution. No smear at all, and the float.
#
# D's rotation is scaled toward identity by this factor before it is applied -
# axis-angle, Rodrigues, exact at these angles. The endpoints are the two states
# already seen in a headset, so this is not a new mode, it is the dial between
# them. Both symptoms scale together because they are one quantity; the question
# is only which mixture is least objectionable, and that is a judgement no log
# can make.
#
# SUGGESTED: start at 0.5, then 0.35 and 0.7, and keep whichever is least bad.
# Expect crispness and smear to move together in both directions - if they do
# not, this analysis is wrong and that is worth knowing immediately.
#
# --- THE REAL EXIT IS STILL vp_patch = 0, AND IT IS NOW ONE BUG AWAY --------
#
# At vp_latch = 0 nothing is substituted, every motion vector is the engine's
# own, and both symptoms are gone by construction - which is exactly the
# vp_patch = 0 state TEST 70 measured as shadows and sky STABLE and TEST 82
# measured as characters STABLE. Its only defect is the float, and TEST 89
# measured that as a PROJECTION error rather than a timing one:
#
#     have 2.260 rad / aspect 1.778 (16:9, the DESKTOP backbuffer)
#     want 2.147 rad / aspect 1.386
#     head-to-world gain 0.869
#
# Fix that and vp_latch = 0 becomes the configuration with nothing wrong in it.
# The aspect being exactly 16:9 says the projection is being derived from the
# window rather than from the eye target, and that is a small, specific,
# findable bug - the first one left in this file that is not a trade.
#
# RESULT: pending.
vp_latch = 0.5

# TEST 101 RESULT: BROKEN - see TEST 102. The scaling maths was wrong twice over
#         and it broke the sky and pushed the camera off the character.
vp_latch = 1.0

# =============================================================================
# TEST 102 - TEST 101's maths was wrong twice; and the gain lead is withdrawn
# =============================================================================
#
# TEST 101 RESULT: BROKEN. "This build broke the sky, and it feels like the
# camera is moving off my character." Both are the scaling code, not the idea.
#
# TWO BUGS, AND THE SECOND ONE IS THE INTERESTING ONE
#
# 1. THE AXIS WAS NEGATED. For a row-vector rotation stored as m[r*4+c], the
#    skew-symmetric axis is (m9-m6, m2-m8, m4-m1). All three were written the
#    other way round, so scaling to 0.5 applied HALF THE ROTATION BACKWARDS -
#    a net error of one and a half times the correction, in the wrong direction.
#
# 2. THE TRANSLATION WAS SCALED. That is not a valid operation on a rigid
#    transform, and TEST 98 had already explained why: D's translation is not a
#    free parameter, it is c*(I-R) with c the camera position - it is what makes
#    the rotation happen about the CAMERA instead of about the world origin.
#    Multiplying it by 0.5 leaves the scene pivoting about a point hundreds of
#    metres away. That is the sky tearing loose and the camera sliding off the
#    character, exactly as reported, and it is the same "translation of a rigid
#    transform is not a displacement" mistake that TEST 98 spent a whole test
#    unlearning. Made again three tests later.
#
# Fixed: the axis signs, and the translation is REBUILT from the scaled rotation
# as c*(I-R_scaled), so the pivot stays on the camera at every value of vp_latch.
# vp_latch = 1.0 for now, which skips the whole path and is byte-for-byte the
# build that had stable characters.
#
# --- AND THE PROJECTION LEAD IS WITHDRAWN BEFORE IT COSTS A RUN -------------
#
# TEST 89 read this and called it the float:
#
#     Engine FOV hold: have 2.260/1.778, want 2.147/1.386, gain 0.869
#
# It is not. `have` is a camera PROPERTY, and the property does not describe what
# is rendered. The frustum recovered from the engine's OWN matrices - the ones
# that actually reach the GPU, measured by vp_measure on every run in this file,
# including every vp_patch = 0 run - is:
#
#     Engine frustum 123.0 x 106.1 deg
#
# and `want` is 2.147 rad, which is 123.0 deg. THE RENDER ALREADY MATCHES. The
# log even contains "have 2.147/1.386, want 2.147/1.386" on some frames, which is
# the property agreeing with itself. So gain 0.869 is a property-read artefact,
# there is no render-versus-submit mismatch, and there is no projection bug to
# fix. TEST 89's conclusion is withdrawn.
#
# WHICH LEAVES ONE HONEST ACCOUNT OF THE FLOAT AT vp_patch = 0
#
# Not the pose (age measured 0.0 ms), not the frame rate (90, steady), not the
# lead (1 and 2 both floaty), not the frustum (measured correct), not the depth
# layer (TEST 70 tried it). What is left is the latch itself: the 0.2-0.9 degrees
# of head turn that vp_patch applies and vp_patch = 0 does not. That is worth
# about one frame of freshness, and one frame is exactly what a VR view feels
# when it floats.
#
# So the float and the smear are ALSO the same quantity. Every symptom in the
# last twenty tests is that one rotation, seen through a different consumer:
#
#     applied, both slots written     characters shake
#     applied, neither slot written   everything smears
#     not applied                     the view floats
#
# There is no fourth option, and that is why nothing has removed it. Which makes
# vp_latch - now that it is correct - the only instrument that addresses the
# actual trade rather than moving it between symptoms.
#
# TO TRY, in this order, one run each: 0.7, then 0.5, then 0.35. Keep whichever
# is least objectionable. Expect crispness and smear to move TOGETHER; if they
# ever move apart, this whole account is wrong and that is worth knowing.
#
# RESULT: pending.

# =============================================================================
# TEST 103 - halve the latch, with the maths fixed
# =============================================================================
#
# Reported: all textures smearing and ghosting at vp_latch = 1.0.
#
# Expected, and it is the state TEST 101 described before its own maths broke the
# run: with neither temporal slot written, the current view carries the full
# latch rotation and the previous view does not, so EVERY pixel gets a motion
# vector describing a head turn of 0.2-0.9 degrees that the previous frame never
# made. The upscaler drags history along it. That is the smear, and at
# vp_latch = 1.0 it is at full strength across the whole frame.
#
# vp_latch = 0.5 halves the rotation that is applied, so it halves both the
