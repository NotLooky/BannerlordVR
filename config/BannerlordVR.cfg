# =============================================================================
# TEST 94 - the camera drive is the bug; a read-back on the POSE
# =============================================================================
#
# TEST 93 RESULT: branch two. The main view's D is large as well.
#
#   HEAD HELD STILL       MAIN VIEW mean 325 / 277 / 263 / 286 / 245 mm
#                         OTHER     mean 602 / 502 / 475 / 524 / 434 mm
#   HEAD MOVING           MAIN VIEW mean 13608 -> 42072 mm, max ~105 m
#                         OTHER     mean 26086 -> 84556 mm, max ~157 m
#
# So it is NOT a matrix-selection problem. Restricting which matrices are
# written would not have helped: the two matrices that ARE the main view are
# themselves ~28 cm from the eye with the head deliberately still, and tens of
# METRES once it moves. The other buffers are worse, but only about twice worse -
# they are the same fault seen through passes with a wider tolerance, not a
# different fault.
#
# THE CAMERA DRIVE IS NOT PUTTING THE ENGINE CAMERA ON THE EYE. That is the bug,
# it is upstream of every symptom still open, and it has been sitting under all
# of them:
#
#   characters shake        the frame-to-frame change in D
#   effects/sky/shadows     D itself, against content fitted pre-latch
#   the DLSS dependency     only there to smear the second one out of sight
#   the vp_patch = 0 float  a gain error, TEST 89, separate but also a camera
#                           property the engine keeps taking back
#
# 28 cm while still is the number to explain. It is not head motion - the head
# was not moving. It is not tremor. It is a systematic offset between where we
# tell the camera to be and where it is when the frame is published.
#
# WHICH OF TWO THINGS IT IS, AND THEY NEED OPPOSITE FIXES
#
#   LookAt does not land it         the write itself is not doing what it says
#   something moves it afterwards   the write lands and is then overwritten,
#                                   between AimAtEye and VrVpPatch.Publish
#
# Native cannot tell these apart, because it only ever sees the END of that
# chain - refPos, read at publish time. The projection has had a read-back since
# HoldEngineFov was written and it paid off in one run ("225 read back correct"
# separated refused from overwritten immediately). The POSE never had one.
#
# So AimAtEye now reads the camera straight back after LookAt and reports:
#
#   "Camera pose read-back: LookAt asked for the eye and the camera came back
#    X mm away on average, Y mm worst, over N write(s) in ~5 s."
#
# DECIDED BEFORE THE RUN:
#
#   near zero          LookAt lands it. Then D is entirely something moving the
#                      camera AFTER this call, and the next step is to find what
#                      runs between AimAtEye and Publish - or to move our write
#                      later, which is the same argument that put AimAtEye in the
#                      OnFrameTick postfix in the first place.
#
#   hundreds of mm     LookAt itself is not putting the camera where it is told,
#                      and D is that, not head motion. Then the fix is in how the
#                      pose is handed over - the frame convention, or the target
#                      and up vectors it is built from - and every mode that
#                      drives the camera has been quietly wrong since it was
#                      written.
#
# Either way this is the first measurement that separates them, and it is two
# lines of managed code on a path that already runs every frame.
#
# RESULT: pending.

# =============================================================================
# TEST 95 - the projection write was moving the camera
# =============================================================================
#
# TEST 94 RESULT, and it is the cleanest number this investigation has produced:
#
#   Camera pose read-back: LookAt asked for the eye and the camera came back
#   0.0 mm away on average, 0.0 mm worst, over 450 write(s) in ~5 s.
#
# Twelve windows, every one 0.0 / 0.0. LookAt puts the camera EXACTLY on the eye,
# every single write. So the camera drive was never wrong, and TEST 93's "the
# drive is not putting the engine camera on the eye" is withdrawn - it was right
# that D is large and wrong about which end produced it.
#
# WHICH LEAVES ONE PLACE FOR 280 mm TO COME FROM
#
#   AimAtEye        camera is on the eye, measured 0.0 mm
#   HoldEngineFov   <- the only thing in between
#   Publish         camera is ~280 mm from the eye, measured by native as D
#
# Those three run back to back in ONE synchronous method. No engine code runs
# between two adjacent statements, so nothing else can be responsible.
#
# HoldEngineFov calls ApplyEyeProjectionTo, which calls SetFovVertical or
# SetViewVolume. Those were assumed to be projection-only - the assumption is in
# this file, unexamined - and they evidently rebuild the camera's FRAME as well.
# Setting a Bannerlord camera's field of view moves it.
#
# It also explains the cadence exactly. HoldEngineFov corrects on ~225 of 450
# ticks, and it is called from TWO sites, so that is EVERY frame - which is why
# D is nonzero on essentially every substitution and why a 4 mm deadzone found
# almost nothing to refuse (TEST 91). Had the projection been left alone on half
# the frames, half the substitutions would have had D near zero and the deadzone
# would have fired thousands of times. It did not, and that was the clue.
#
# THE FIX IS THE ORDER OF TWO LINES, at both call sites:
#
#     HoldEngineFov(combat, _eye);          // projection first
#     VrCameraDriver.AimAtEye(combat, _eye); // pose LAST
#
# Same two calls, same frame, opposite order, so the pose is the final word
# before VrVpPatch.Publish reads the camera back.
#
# WHAT SHOULD FOLLOW IF THIS IS RIGHT, stated before the run:
#
#   VP D by buffer   MAIN VIEW mean falls from ~280 mm to single-digit mm -
#                    one frame of real head motion, which is the floor.
#   characters       the shake is D's frame-to-frame change; if D collapses so
#                    should the shake, standing still included.
#   effects/sky/     these are D itself against pre-latch content; they should
#   dynamic shadows  stop following the head by the same stroke.
#   DLSS             stops being load-bearing, because what it was hiding is
#                    gone rather than smeared.
#
# If D does NOT fall, then something else moves the camera too and the next step
# is a read-back inside Publish rather than inside AimAtEye - same instrument,
# moved one call later.
#
# A NOTE ON HOW LONG THIS TOOK. The projection has had a read-back since
# HoldEngineFov was written; the POSE did not get one until TEST 94, and it
# answered in a single run. Sixteen tests were spent theorising about a quantity
# that a two-line read-back measured immediately - the same lesson this file
# recorded after the shadow hunt and did not apply.
#
# RESULT: pending.

