# =============================================================================
# TEST 156 - PASS FOUR LEARNS TO ASK. The predicate it never had.
# =============================================================================
#
# TEST 155: "dynamic shadows still moves the same speed as other effects." No
# violence, so stepping over lane 720 fixed the damage. No improvement either,
# so rotating the ray basis achieved nothing visible. Both halves are answers.
#
# LANE 720, NAMED AT LAST, by the raw dump added for exactly this:
#
#   offset 720  NO DIRECTION  raw (10255.86,8916.65,295.00, w 19.999920)
#               |xyz| 13593.24 - NOT a direction - do not rotate this
#
# Thirteen thousand units long with a constant w of 19.99992. Not a direction
# under any reading, and it had been rotated nine times a frame since TEST 150.
# That is the violence explained and closed.
#
# BUT THE REAL FAULT WAS IN THE SAME REPORT ALL ALONG, in two tables this file
# has printed for months:
#
#   cb 1760 offset 688  transposed  best dot 1.0000  nearest camera 679.34 m
#   cb 1760 offset 688              translation (0.5,0.5,400.0)
#
# The first is the REJECTED view table, the second the ORTHOGRAPHIC table, and
# the census calls the same offset right * tanX in the same five seconds. All
# three are true. cb 1760 is uploaded about nine times a frame and THE CONTENT
# AT A GIVEN OFFSET IS NOT THE SAME EVERY TIME: sometimes the camera ray basis,
# sometimes a transposed view with its camera 679 m away, sometimes an
# orthographic block with a translation - which is a shadow cascade.
#
# Pass four wrote that offset on every upload without ever looking at what was
# in it. So on the uploads carrying a cascade, it rotated the cascade. A rotated
# cascade is dynamic shadows swinging with the head, and that is TESTs 150-153
# in one sentence. Lane 720 was a passenger.
#
# THE ASYMMETRY, WHICH IS THE ACTUAL LESSON
#
# Pass one has never had this problem because pass one is PREDICATE-driven: it
# writes a block because the block LOOKS LIKE the main view, and it walks every
# offset testing that. Pass four was OFFSET-driven - it wrote where the config
# pointed - and an offset is not an identity in a buffer whose contents rotate
# through nine different passes a frame.
#
# So pass four now asks the same kind of question before every write: is this
# lane still one of the engine camera axes, |dot| > 0.999 against the recovered
# basis? A cascade row, a skybox row and a 679 m view all fail by a mile; the
# true basis passes whatever its scale, because the test is on direction alone.
# The threshold does not have to be delicate - the things being excluded are
# nowhere near the thing being kept.
#
# Lane 720 is back in the write and needs no special case: it fails the
# predicate on its own merits, being 13,000 units long and pointing nowhere near
# a camera axis. A rule beats an exception.
#
# WHAT THE LOG WILL SAY, and this is the measurement that matters more than the
# feel: the report now counts lanes REFUSED for not holding a camera axis. If
# that count is several times the rotated count, then most uploads at these
# offsets were never the camera basis, every earlier test was writing into
# cascades, and no sign or D could have been judged through that.
#
# vp_ray_patch = 0 returns to the TEST 151 feel at any time.
#
# RESULT:
vp_ray_patch = 1
vp_ray_offset = 688
vp_ray_count = 4
vp_ray_offset_b = 928
