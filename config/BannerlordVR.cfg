# From the TEST 119 resting state, with the NGX work reverted and inert. This is
# the only lever left that moves anything, and it moves both halves together:
# less of the latch rotation means less ground smear in motion and a less crisp
# head. 0.5 was judged "better and stable, but the ground smears"; 0.35 keeps a
# third of the latch instead of half.
#
# Watch for the two together, because they trade against each other and only one
# of them is being complained about:
#   the ground while moving  - should smear less than at 0.5
#   the head while turning   - should feel slightly softer, and must NOT feel
#                              like resistance. Resistance would mean something
#                              other than the dial is wrong.
#
# 0.2 is the next step down if 0.35 helps and the head still feels fine; 0.5 is
# one line away if it does not.
#
# RESULT: pending.
vp_latch = 0.35

# TEST 120 RESULT: abandoned. Back to the last state actually reported as good
#         (TEST 104: "better and stable"). No further dial-turning.
vp_latch = 0.5

# =============================================================================
# TEST 121 - RESTORE the pre-TEST-100 state: everything stable, characters shake
# =============================================================================
#
# Asked for the version where everything is stable and only the characters shake.
# That is the configuration this file had before TEST 100 - both temporal slots
# written and the full latch applied. Restored exactly, one key at a time:
#
#   vp_write_prev_slot = 1   TEST 99 set this to 0. With it back ON the engine
#                            gets our previous-frame matrix again, so static
#                            geometry's motion vectors have both ends in the same
#                            frame and cancel - the world and the ground are
#                            sharp. Dynamic entities cannot cancel it, which is
#                            the character shake, and that is the trade being
#                            asked for.
#
#   vp_reproj_patch = 1      TEST 100 set this to 0. Pass three substitutes the
#                            reprojection matrix again, so sky, sun, cloud, hair,
#                            particles and screen-space shadows reproject with our
#                            camera rather than the engine's.
#
#   vp_latch = 1.0           the full late latch. The dial did not exist before
#                            TEST 101, so the state being restored is 1.0 by
#                            definition - and it is the crispest head.
#
#   vp_prev_same_eye = 1     TEST 79's value, which is what was in force then.
#                            TEST 90 set it to 0 and measured no difference, so
#                            this is fidelity to the requested state rather than
#                            a claim that it matters.
#
# Unchanged and already correct for this state: vp_patch = 1, vp_reproj_same_eye
# = 0, vp_prev_apply_d = 0, vp_dead_m = 0, vp_patch_only_bytes = 0,
# pose_lead_frames = 1, stereo_mode = afr, afw = 0, and every ngx_* key off.
#
# EXPECTED, so a mismatch is recognisable rather than a surprise: crisp head, the
# ground and the world sharp in motion, no ghosting on scenery - and characters
# and the things they interact with shaking, worst when you hold still. If any of
# those is different from how it was, the restore is not faithful and it is worth
# saying so.
#
# RESULT: restoring a known state, not testing a hypothesis.
vp_write_prev_slot = 1
vp_reproj_patch = 1
vp_prev_same_eye = 1
vp_latch = 1.0

# =============================================================================
# TEST 121 RESULT - the restore is faithful, and it has a MINIMUM ground smear
# =============================================================================
#
# Reported: this build also smears the ground slightly when the head moves - less
# than the others, but present.
#
# That is the most useful sentence in the last forty tests, because it says the
# ground smear was NEVER introduced by anything done here. It is a property of
# the baseline. Every configuration since has either left it alone or amplified
# it:
#
#   this build (both slots written, full latch)   MINIMUM - the floor
#   slots unwritten (TESTs 100-104)               amplified: the error stops
#                                                 cancelling for static geometry
#                                                 and spreads over the frame
#   vp_latch < 1                                  the floor scaled down, and the
#                                                 head softened with it
#   every NGX intervention                        amplified or neutral, never less
#
# So the sequence was never chasing a bug that appeared. It was moving a floor
# around, and the floor is what AFR plus a temporal upscaler costs: DLAA resolves
# each frame against an image taken 65 mm away, and the ground is where that shows
# first because it has the steepest depth gradient per pixel and the finest
# detail. Minimal is what "irreducible" looks like from inside the headset.
#
# THIS BUILD IS THEREFORE THE BEST OF EVERYTHING TRIED, and now for a stated
# reason rather than by elimination: it is the only configuration where the error
# CANCELS for static geometry instead of being spread across it. What is left is
# the residue that cannot cancel - the cross-eye history on high-frequency
# ground, and the dynamic entities whose vectors the engine composes itself.
#
# NOT PROPOSING ANOTHER MECHANISM. The two that remain are both known and both
# cost more than they give: AFW removes the alternation and brings doubling and
# poor performance (TEST 87), and dropping temporal AA removes the history and
# brings the dynamic shadows and effects back onto the head (TEST 53). Both were
# measured, both were rejected in a headset, and neither has changed.
#
# RESULT: restore confirmed faithful. The residual ground smear is the floor, not
#         a regression, and it predates every test in the 79-121 range.

# =============================================================================
# TEST 123 - RESTORE the "no motion vectors written" state
# =============================================================================
#
# Asked to return to the version with no motion vectors. That is TESTs 100-104:
# the mod stops writing BOTH temporal slots and the engine keeps its own.
#
#   vp_write_prev_slot = 0   the previous-frame matrix at offset 304 is left
#                            alone. Static geometry can no longer cancel the
#                            latch, so it carries the same error the dynamic
#                            entities do - which is why nothing moves RELATIVE to
#                            anything and the characters read as stable.
#   vp_reproj_patch = 0      pass three stops substituting the reprojection
#                            matrix at offset 752.
#   vp_prev_same_eye = 0     the value in force through that range.
#
#   vp_latch = 0.5           TWO VARIANTS OF THIS STATE EXIST and this is the one
#                            judged better in a headset:
#
#                              1.0 (TEST 100) "characters are stable, the only
#                                   problem everything has smearing when moving
#                                   my head like motion blur"
#                              0.5 (TEST 104) "better and stable, but ground
#                                   texture like sand is smearing"
#
#                            0.5 halves the latch, which halves both the smear and
#                            the head crispness. If the fuller, crisper head is
#                            wanted with the heavier smear, vp_latch = 1.0 is one
#                            line at the bottom of this file.
#
# THE TRADE THIS STATE MAKES, plainly: characters stable, smear spread across the
# whole frame instead of concentrated on them, head slightly softer than full
# latch. The opposite of TEST 121, which cancels the error for static geometry
# and concentrates it on the characters.
#
# Neither is a fix. They are two places to put the same error, and this is the
# one where the moving things are quiet.
#
# RESULT: restoring a known state, not testing a hypothesis.
vp_write_prev_slot = 0
vp_reproj_patch = 0
vp_prev_same_eye = 0
vp_latch = 0.5

